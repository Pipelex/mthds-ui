bilities document is an individual entry-level retail resume (John Doe, graphic design graduate). It mentions basic collaboration in retail settings \u2014 &quot;Collaborated with the store merchandiser creating displays&quot; at American Eagle and &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret. However, there is no evidence of leadership-level cross-functional collaboration across Product, Marketing, Customer Success, and Channel teams. The roles listed are sales associate, spa consultant, and brand ambassador positions, not organizational leadership across functions.</td></tr><tr><th>gap_description</th><td>The requirement calls for a leadership competency in coordinating across Product, Marketing, Customer Success, and Channel organizations. The document reflects only entry-level retail experience with minimal, store-level collaboration and no demonstrated leadership across the specified business functions. There is no evidence of managing or orchestrating multiple cross-functional teams at an organizational level.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Diversity, Equity, and Inclusion Advocacy</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level graphic design/retail candidate (John Doe). It lists education (BS in Graphic Design, University of Minnesota) and retail sales/customer service roles at American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, and a brand ambassador role at Target. There is no mention of diversity, equity, and inclusion advocacy, related leadership initiatives, DEI programs, or associated certifications.</td></tr><tr><th>gap_description</th><td>The document contains no evidence of any diversity, equity, and inclusion (DEI) advocacy, leadership competency, or related programs. It reflects retail sales and design experience only, with limited leadership exposure (assisting in training coworkers). There is no demonstrated capability to meet a DEI advocacy leadership competency requirement.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Lead and Scale a 60+ Person Sales Team</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual resume for an entry-level candidate (John Doe) with a Bachelor of Science in Graphic Design. Relevant experience consists solely of individual retail sales associate roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) with limited leadership exposure \u2014 the only leadership reference is &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret. There is no evidence of managing, building, or scaling a sales team, let alone a 60+ person enterprise sales organization across multiple regions.</td></tr><tr><th>gap_description</th><td>The requirement calls for building and developing a high-performing team of 60+ enterprise sales professionals across multiple regions. The company/candidate has no demonstrated experience in enterprise sales, team leadership at scale, multi-region management, or building/scaling a sales organization. Experience is limited to individual-contributor retail associate roles with minimal informal training responsibilities. Closing this gap would require a fundamentally different profile with proven large-scale sales leadership.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Own and Deliver $180M+ ARR Quota</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level retail candidate (John Doe) with a Bachelor of Science in Graphic Design. Work experience consists of retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) and a one-time brand ambassador engagement. The only sales-related achievements are meeting store-level company sales goals and being named employee of the month. There is no evidence of P&amp;L accountability, ARR ownership, strategic planning, or enterprise-scale revenue responsibility.</td></tr><tr><th>gap_description</th><td>The requirement demands ownership and delivery of $180M+ in annual recurring revenue with full P&amp;L accountability and strategic planning responsibility. The company/candidate profile shows only individual retail sales roles with no demonstrated experience managing large-scale revenue, no P&amp;L authority, and no strategic planning at any comparable scale. This is a fundamental mismatch between an entry-level retail/design background and a senior revenue leadership mandate.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Develop and Implement Sales Strategies</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual retail resume for &quot;John Doe,&quot; a recent graphic design graduate. It lists entry-level retail sales associate roles (American Eagle, Heartbreaker, Victoria&#x27;s Secret) and a spa consultant role at Planet Beach where the individual &quot;sold retail and memberships to meet company sales goals.&quot; These reflect individual, front-line retail selling experience \u2014 following existing sales targets, assisting customers, and stocking/merchandising \u2014 rather than any experience developing or implementing organization-level sales strategies to accelerate pipeline growth or increase win rates.</td></tr><tr><th>gap_description</th><td>There is no evidence of strategic sales capability. The requirement calls for developing and implementing sales strategies that accelerate pipeline growth and increase win rates \u2014 a B2B/organizational sales strategy function. The document shows only individual retail sales-floor experience with no pipeline management, sales strategy design, win-rate improvement, or team/enterprise-level sales leadership. Closing this mandatory gap would require an entirely different skill set and demonstrated track record.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Build Executive C-Level Customer Relationships</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level individual resume for a graphic design/retail sales candidate (John Doe), listing roles such as Sales Associate at American Eagle, Spa Consultant at Planet Beach, Fashion Representative at Victoria&#x27;s Secret, and Brand Ambassador at Target. Customer-facing experience is limited to retail floor assistance, membership sales, and event promotion. There is no evidence of engaging, building, or maintaining relationships with C-level executives, nor any experience managing large enterprise accounts.</td></tr><tr><th>gap_description</th><td>The document describes no executive-level relationship management, no enterprise or large-account experience, and no strategic stakeholder engagement at the C-suite level. All cited experience is entry-level retail customer service. Meeting a mandatory requirement to build and maintain C-level relationships at the largest accounts would require entirely different senior sales/account management personnel and a demonstrated track record that is absent here.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Drive Sales Operational Excellence</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual&#x27;s resume for a graphic design/apparel print role. It shows entry-level retail sales associate experience (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) including meeting company sales goals, running operating procedures single-handedly, inventory control, and handling cash/deposits. There is no organizational-level capability, no evidence of sales forecasting, process optimization, or data-driven decision making at any operational scale.</td></tr><tr><th>gap_description</th><td>The requirement calls for organizational-level sales operational excellence \u2014 accurate forecasting, process optimization, and data-driven decision making \u2014 typically demonstrated by a company with analytics tools, sales operations teams, and process frameworks. The document is a single individual&#x27;s retail resume with only basic sales-associate duties and no forecasting, analytics, or process-optimization capability. There is effectively no evidence of the required organizational capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Coach and Develop Sales Leaders</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level individual&#x27;s resume (John Doe, Bachelor of Science in Graphic Design). Sales-related experience is limited to individual contributor retail roles (Sales Associate at American Eagle, Spa Consultant at Planet Beach, Sales Associate at Heartbreaker, Fashion Representative at Victoria&#x27;s Secret). The only leadership-adjacent activity is &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret, which is task-level assistance rather than coaching, mentoring, or developing sales leaders.</td></tr><tr><th>gap_description</th><td>The requirement calls for the ability to coach, mentor, and develop the next generation of sales leaders \u2014 a senior leadership/management competency. The document shows no experience managing teams, no formal sales leadership roles, and no evidence of developing other leaders. There is only a brief mention of assisting in training coworkers, which falls well short of leadership development capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Cross-Functional Partnership for Integrated Solutions</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual&#x27;s resume for an entry-level graphic design/retail apparel role (John Doe, Bachelor of Science in Graphic Design). It lists retail sales roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) and a brand ambassador role. The only marginally relevant experience is collaborating with a store merchandiser on displays and representing a marketing firm at a college event \u2014 none of which constitutes enterprise cross-functional partnership across Product, Marketing, Customer Success, and Channel teams to deliver integrated solutions.</td></tr><tr><th>gap_description</th><td>The document shows no evidence of an organization capable of partnering across Product, Marketing, Customer Success, and Channel functions. There is no Product team, no Customer Success function, and no channel/partner ecosystem described. This is an individual retail/graphic design resume rather than an organizational capabilities statement, so the required integrated, multi-team delivery capability is entirely absent.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Champion Sales Innovation</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual retail sales resume for &quot;John Doe,&quot; a graphic design graduate with entry-level retail sales associate experience (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, Target). Activities cited include assisting customers, stocking/merchandising, meeting personal sales goals, handling cash, and brand ambassador work. There is no evidence of championing new sales methodologies, tools, or approaches, nor any leadership role driving team productivity improvements or sales innovation initiatives.</td></tr><tr><th>gap_description</th><td>The requirement calls for championing new sales methodologies, tools, and approaches to improve team productivity \u2014 a leadership/innovation function. The document only shows individual, front-line retail sales experience with no demonstrated experience introducing new sales tools, defining methodologies, or driving team-level productivity change. There is no track record of sales innovation leadership.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li><li><table><tr><th>requirement_title</th><td>Hybrid Work Location in San Francisco</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level graphic design/retail sales candidate (John Doe) with work experience at retail companies (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, Target). All listed locations are generic &quot;City, State&quot; placeholders, and the education is based at the University of Minnesota (Twin Cities). There is no indication of an executive-level role, no reference to San Francisco, CA, and no mention of a hybrid work arrangement.</td></tr><tr><th>gap_description</th><td>The requirement is for a full-time executive-level role based in San Francisco, CA with a hybrid arrangement. The candidate profile shows only entry-level retail/sales and design experience with a Minnesota-based background, no executive experience, and no San Francisco location. There is no evidence supporting an executive role, a San Francisco base, or a hybrid work capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table></li></ul>", "s_de7f6db70a": "<table><tr><th>requirement_title</th><td>12+ Years B2B Sales Experience</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for a recent Bachelor of Science in Graphic Design graduate (University of Minnesota, May 2011). The listed experience consists of retail/consumer-facing sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret), all of which are B2C rather than B2B. The total work experience spans roughly 2006\u20132011 (about 5 years), and no VP-level or equivalent leadership roles are present\u2014leadership references are limited to assisting in coworker training.</td></tr><tr><th>gap_description</th><td>The requirement calls for 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles. The candidate has approximately 5 years of B2C retail sales experience, zero demonstrated B2B sales experience, and no VP-level or equivalent leadership roles. Both the type of sales (B2B vs. B2C), the tenure (12+ years vs. ~5), and the leadership level (VP vs. sales associate) are unmet.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_917e7616b1": "<table><tr><th>title</th><td>12+ Years B2B Sales Experience</td></tr><tr><th>description</th><td>12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_aecd2ca7c5": "<table><tr><th>requirement_title</th><td>Track Record Scaling Enterprise Sales Teams</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual entry-level resume for John Doe, a recent graphic design graduate. The only sales-related experience consists of retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) with limited leadership tasks such as &quot;assisting in the training of coworkers.&quot; There is no evidence of building, managing, or scaling enterprise sales teams of any size, let alone 50+ people.</td></tr><tr><th>gap_description</th><td>The requirement demands a proven track record of building and scaling enterprise sales teams of 50+ people. The document shows only individual retail/consumer sales roles with no team-building, no enterprise (B2B) sales, and no evidence of managing or scaling teams. Closing this gap would require demonstrable experience leading large enterprise sales organizations, which is entirely absent.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_16813a6787": "<table><tr><th>title</th><td>Track Record Scaling Enterprise Sales Teams</td></tr><tr><th>description</th><td>Proven track record of building and scaling enterprise sales teams of 50+ people.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_826f5f5cdb": "<table><tr><th>requirement_title</th><td>Managing $100M+ ARR Quotas</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level retail resume for a Graphic Design graduate. The only sales-related experience consists of retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) focused on individual store-level sales, meeting basic company sales goals, and customer service. There is no evidence of enterprise sales, ARR/recurring revenue management, or quota responsibility at any scale \u2014 let alone $100M+.</td></tr><tr><th>gap_description</th><td>No demonstrated experience managing large-scale ARR quotas. The profile lacks any enterprise B2B/SaaS sales leadership, revenue targets in the millions, or a track record of consistently exceeding quotas. Closing this gap would require fundamentally different, senior-level sales leadership experience that is entirely absent.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_099eef6b5d": "<table><tr><th>title</th><td>Managing $100M+ ARR Quotas</td></tr><tr><th>description</th><td>Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_48699cf988": "<table><tr><th>requirement_title</th><td>Complex Consultative Sales Expertise</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an individual (John Doe) seeking an apparel print design role. The sales experience listed is entirely retail/transactional: Sales Associate at American Eagle, Spa Consultant at Planet Beach (selling retail and memberships to meet sales goals), Sales Associate at Heartbreaker, and Fashion Representative at Victoria&#x27;s Secret. These are short-cycle, walk-in retail sales interactions with no indication of complex, enterprise-level consultative selling or multi-month sales cycles.</td></tr><tr><th>gap_description</th><td>The requirement calls for deep expertise in complex, consultative sales with 6-12 month sales cycles (typically B2B or enterprise selling). The document shows only entry-level retail sales experience with immediate, transactional purchase decisions. There is no evidence of managing extended sales cycles, multi-stakeholder deals, solution selling, pipeline management, or complex account strategy. Closing this gap would require substantially different and more senior sales experience.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_9267568f18": "<table><tr><th>title</th><td>Complex Consultative Sales Expertise</td></tr><tr><th>description</th><td>Deep expertise in complex, consultative sales with 6-12 month sales cycles.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_73c8ac5f7b": "<table><tr><th>requirement_title</th><td>SaaS Sales to Fortune 500</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual retail/apparel resume for &quot;John Doe,&quot; a Graphic Design graduate. Their sales experience is limited to entry-level retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) selling consumer retail products and memberships. There is no mention of SaaS, software, enterprise solutions, or any B2B sales to Fortune 500 companies.</td></tr><tr><th>gap_description</th><td>The company/candidate has no SaaS or software sales experience and no experience selling to Fortune 500 enterprise clients. All demonstrated experience is in consumer-facing retail sales, which is fundamentally different from enterprise B2B SaaS sales. Closing this gap would require building an entirely new enterprise SaaS sales capability, including product, sales team, and enterprise client relationships.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_09cf597bbf": "<table><tr><th>title</th><td>SaaS Sales to Fortune 500</td></tr><tr><th>description</th><td>Experience selling SaaS solutions to Fortune 500 enterprises.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_41832e8a15": "<table><tr><th>requirement_title</th><td>Executive Presence with C-Suite Buyers</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level graphic design/retail candidate (John Doe). Experience consists of retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) and a brand ambassador position. Customer engagement is limited to individual retail shoppers and event attendees; there is no evidence of engaging or selling to C-suite executives, enterprise buyers, or senior decision-makers.</td></tr><tr><th>gap_description</th><td>The requirement demands strong executive presence and the ability to engage C-suite buyers. The candidate&#x27;s background shows only entry-level retail sales and consumer-facing roles with no exposure to executive-level relationships, strategic enterprise selling, or senior stakeholder engagement. There is no evidence of the maturity, seniority, or high-level business acumen required to credibly interact with C-suite buyers.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_0be5ab21d5": "<table><tr><th>title</th><td>Executive Presence with C-Suite Buyers</td></tr><tr><th>description</th><td>Strong executive presence with the ability to engage C-suite buyers.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_3fe9335c1a": "<table><tr><th>requirement_title</th><td>Bachelor&#x27;s Degree</td></tr><tr><th>match_level</th><td>full_match</td></tr><tr><th>evidence</th><td>The candidate holds a Bachelor of Science in Graphic Design from the University of Minnesota, College of Design (May 2011), with a cumulative GPA of 3.93, Dean&#x27;s List recognition, and a Twin Cities Iron Range Scholarship. This satisfies the mandatory bachelor&#x27;s degree requirement.</td></tr><tr><th>gap_description</th><td>The requirement notes an MBA as preferred (not mandatory); no MBA is listed in the capabilities. The mandatory bachelor&#x27;s degree requirement is fully met.</td></tr><tr><th>effort_to_close</th><td>none</td></tr></table>", "s_4193afdaf1": "<table><tr><th>title</th><td>Bachelor&#x27;s Degree</td></tr><tr><th>description</th><td>Bachelor&#x27;s degree required; MBA preferred.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_e59b531ee8": "<table><tr><th>requirement_title</th><td>MBA Degree</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The candidate holds a Bachelor of Science in Graphic Design from the University of Minnesota, College of Design (May 2011), with a cumulative GPA of 3.93, Dean&#x27;s List recognition, and a Twin Cities Iron Range Scholarship. No graduate-level or MBA education is listed.</td></tr><tr><th>gap_description</th><td>The requirement desires an MBA as an advanced educational qualification beyond the bachelor&#x27;s degree. The candidate has only a bachelor&#x27;s degree (in Graphic Design) and no MBA or any graduate degree. Since this is a desirable (not required) qualification, it is not disqualifying, but the gap exists. Closing it would require completing a full MBA program.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_b322ba9672": "<table><tr><th>title</th><td>MBA Degree</td></tr><tr><th>description</th><td>MBA preferred as an advanced educational qualification beyond the required bachelor&#x27;s degree.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_f07b6a503e": "<table><tr><th>requirement_title</th><td>CRM/Cloud/Enterprise Software Market Experience</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The provided capabilities document is a personal resume for an individual (John Doe) seeking an apparel print design role. It details a graphic design education and retail/sales work experience at American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, and Target as a brand ambassador. There is no mention of CRM, cloud infrastructure, or enterprise software experience of any kind.</td></tr><tr><th>gap_description</th><td>The document contains no experience whatsoever in CRM, cloud infrastructure, or enterprise software markets. The background is entirely in retail sales, graphic/apparel design, and marketing at an individual level, with no relevant technology or enterprise software capability to build on.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_d9f7c1fe4c": "<table><tr><th>title</th><td>CRM/Cloud/Enterprise Software Market Experience</td></tr><tr><th>description</th><td>Experience in CRM, cloud infrastructure, or enterprise software markets.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_02b753e362": "<table><tr><th>requirement_title</th><td>Building Sales Teams from Early Stage to Scale</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual entry-level retail resume for &quot;John Doe,&quot; a recent Graphic Design graduate. The only sales-related experience consists of individual retail associate roles (American Eagle Sales Associate, Planet Beach Spa Consultant, Heartbreaker Sales Associate, Victoria&#x27;s Secret Fashion Representative) focused on customer service, merchandising, and personal sales goals. The most relevant mention is assisting in the training of coworkers at Victoria&#x27;s Secret, but this reflects only informal peer support, not team-building or leadership at scale.</td></tr><tr><th>gap_description</th><td>There is no evidence of any track record building sales teams from early stage through scale. The document reflects individual contributor retail roles with no demonstrated experience in hiring, structuring, managing, or scaling a sales organization. No leadership of sales teams, no revenue growth ownership, and no organizational scaling experience are present.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_f93c78ca0e": "<table><tr><th>title</th><td>Building Sales Teams from Early Stage to Scale</td></tr><tr><th>description</th><td>Track record of building sales teams from early stage through scale.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_9fe1a26d17": "<table><tr><th>requirement_title</th><td>Account-Based Selling Expertise</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The provided capabilities document is an individual&#x27;s resume for a graphic design/apparel print objective. Its sales-related experience is limited to entry-level retail roles (American Eagle Sales Associate, Planet Beach Spa Consultant, Heartbreaker Sales Associate, Victoria&#x27;s Secret Fashion Representative), focused on in-store customer assistance, merchandising, and meeting basic sales goals \u2014 not strategic account management or account-based selling (ABS).</td></tr><tr><th>gap_description</th><td>There is no evidence of account-based selling or strategic account management expertise. The document describes retail transactional sales and customer service, with no reference to managing named/strategic accounts, B2B account planning, multi-stakeholder engagement, or ABS methodologies. Closing this gap would require acquiring genuinely relevant strategic account experience or personnel.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_d2e8d4a5bd": "<table><tr><th>title</th><td>Account-Based Selling Expertise</td></tr><tr><th>description</th><td>Expertise in account-based selling and strategic account management.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_05b4f6cdaa": "<table><tr><th>requirement_title</th><td>Analytical Skills with Sales Analytics Tools</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The candidate&#x27;s background is in retail sales and graphic design. Relevant experience includes scanning merchandise for inventory control at American Eagle, meeting company sales goals and running operating procedures at Planet Beach, marking down unsuccessful merchandise at Heartbreaker, and taking seasonal inventory at Victoria&#x27;s Secret. However, there is no mention of ACME or any sales analytics tools, nor any explicit demonstration of analytical/data analysis skills.</td></tr><tr><th>gap_description</th><td>No proficiency in ACME or any sales analytics tools is documented. The candidate has practical retail sales exposure (inventory, sales goals, markdowns) but no demonstrated data/analytics competency or experience with the specific tools required.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_8b9d15a4ca": "<table><tr><th>title</th><td>Analytical Skills with Sales Analytics Tools</td></tr><tr><th>description</th><td>Strong analytical skills with proficiency in ACME and sales analytics tools.</td></tr><tr><th>category</th><td>technical</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_405b3bf661": "<table><tr><th>requirement_title</th><td>History of Developing Talent</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level retail resume for an individual (John Doe), not an organizational profile. The only tangentially related item is under Victoria&#x27;s Secret experience: &quot;Applied my leadership skills by assisting in the training of coworkers.&quot; There is no evidence of managing direct reports, promoting people into leadership roles, or any structured talent development history.</td></tr><tr><th>gap_description</th><td>The requirement asks for a demonstrated history of developing talent, including multiple direct reports promoted to leadership roles. The document shows only individual-contributor and sales-associate roles with a single mention of assisting in training coworkers. There are no direct reports, no promotions of others to leadership, and no organizational talent-development track record. Closing this gap would require actual experience managing and elevating team members, which cannot be quickly fabricated.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_8dd6fb5c5d": "<table><tr><th>title</th><td>History of Developing Talent</td></tr><tr><th>description</th><td>History of developing talent, with multiple direct reports promoted to leadership roles.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_debbd44b47": "<table><tr><th>requirement_title</th><td>Channel/Partner Sales Model Experience</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The provided capabilities document is an individual&#x27;s resume (John Doe) focused on retail sales associate and graphic design roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, and a Target brand ambassador event). It describes direct-to-consumer retail selling, merchandising, and customer service, but contains no reference to channel or partner sales models, reseller/distributor programs, or B2B partner ecosystem management.</td></tr><tr><th>gap_description</th><td>There is no evidence of experience with channel or partner sales models. The document reflects individual retail sales and customer-facing roles rather than any organizational capability in managing channel partners, resellers, distributors, or partner-driven go-to-market strategies. Closing this gap would require building relevant channel sales experience or capabilities from scratch.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_61e8c4f12f": "<table><tr><th>title</th><td>Channel/Partner Sales Model Experience</td></tr><tr><th>description</th><td>Experience with channel/partner sales models.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_b779cdd4f4": "<table><tr><th>requirement_title</th><td>Passion for Coaching and Developing Teams</td></tr><tr><th>match_level</th><td>partial_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual resume for a graphic design/retail candidate rather than a company profile. The only relevant experience is at Victoria&#x27;s Secret (Fashion Representative, Jan. 2006 - Feb. 2009), where the candidate &quot;Applied my leadership skills by assisting in the training of coworkers.&quot; This indicates some exposure to training/developing others, though at a junior, individual-contributor level.</td></tr><tr><th>gap_description</th><td>There is no evidence of a demonstrated passion for coaching or building high-performing teams. The single reference is limited to assisting with coworker training in a retail sales role, with no formal coaching, team leadership, mentorship programs, or evidence of developing high-performing teams. No management or people-development track record is shown.</td></tr><tr><th>effort_to_close</th><td>medium</td></tr></table>", "s_fa164e2b00": "<table><tr><th>title</th><td>Passion for Coaching and Developing Teams</td></tr><tr><th>description</th><td>Passion for coaching and developing high-performing teams.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>desirable</td></tr></table>", "s_9bff067da3": "<table><tr><th>requirement_title</th><td>Strategic Thinking and Business Acumen</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual entry-level retail resume for &quot;John Doe&quot; (Bachelor of Science in Graphic Design, seeking an apparel print design role). Work experience consists of retail sales associate and spa consultant positions involving customer service, inventory, visual merchandising displays, and meeting company sales goals. It references some junior-level leadership (assisting in coworker training at Victoria&#x27;s Secret) and marketing event participation, but there is no evidence of organizational-level leadership competency, strategic planning, or business acumen.</td></tr><tr><th>gap_description</th><td>The document reflects an individual&#x27;s entry-level retail experience rather than organizational leadership capability. There is no demonstrated strategic thinking (e.g., market strategy, business planning, P&amp;L ownership) or business acumen at any meaningful organizational scale. Closing this gap would require demonstrated senior leadership experience and strategic decision-making that is entirely absent here.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_49e131dbd2": "<table><tr><th>title</th><td>Strategic Thinking and Business Acumen</td></tr><tr><th>description</th><td>Leadership competency: strategic thinking and business acumen.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_1d0040b69f": "<table><tr><th>requirement_title</th><td>Exceptional Communication and Executive Presence</td></tr><tr><th>match_level</th><td>partial_match</td></tr><tr><th>evidence</th><td>The candidate&#x27;s resume shows some communication and customer-facing skills relevant to interpersonal ability: at Planet Beach they &quot;Communicate with clients to fulfill their wants and needs&quot; and &quot;Attend promotional events to market our services&quot;; at Victoria&#x27;s Secret they &quot;Applied my leadership skills by assisting in the training of coworkers&quot; and &quot;Provided superior customer service&quot;; and as a Target Brand Ambassador they &quot;Engaged University of Minnesota freshman in the Target brand experience.&quot; These indicate baseline communication and some entry-level leadership exposure.</td></tr><tr><th>gap_description</th><td>The capabilities describe an entry-level retail/sales background (Sales Associate, Spa Consultant, Brand Ambassador) with a recent graphic design graduate profile. There is no evidence of executive presence, senior leadership roles, managing teams/organizations, board-level or C-suite communication, or the exceptional communication competency expected at a leadership level. The demonstrated experience is customer service and peer training, not executive-level communication.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_3774131202": "<table><tr><th>title</th><td>Exceptional Communication and Executive Presence</td></tr><tr><th>description</th><td>Leadership competency: exceptional communication and executive presence.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_603a0019f5": "<table><tr><th>requirement_title</th><td>Data-Driven Decision Making</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a graphic design/retail sales resume for an individual (John Doe). It lists retail experience such as inventory control, merchandising, customer service, and sales at American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, and Target. There is no mention of data analysis, analytics tools, metrics-driven decision making, or leadership competency in data-driven decision making.</td></tr><tr><th>gap_description</th><td>The document contains no evidence of data-driven decision making as a leadership competency. There are no references to data analytics, quantitative reasoning, KPIs, reporting, or using data to inform strategic decisions. The experience is centered on retail sales, merchandising, and graphic design rather than analytical or data-focused leadership. Closing this gap would require demonstrating analytical training, tools, and documented use of data in decision processes.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_68db807abb": "<table><tr><th>title</th><td>Data-Driven Decision Making</td></tr><tr><th>description</th><td>Leadership competency: data-driven decision making.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_68d452c70f": "<table><tr><th>requirement_title</th><td>Change Management and Organizational Development</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual resume for a graphic design/retail sales professional (John Doe). It lists entry-level retail roles (Sales Associate at American Eagle and Heartbreaker, Spa Consultant at Planet Beach, Fashion Representative at Victoria&#x27;s Secret, Brand Ambassador at Target). The only leadership-adjacent mention is &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret, which does not demonstrate change management or organizational development competency.</td></tr><tr><th>gap_description</th><td>The document shows no evidence of change management or organizational development capabilities. There are no relevant leadership roles, methodologies, certifications, or past projects involving organizational transformation, change initiatives, or workforce development. The profile is oriented toward retail sales and graphic design, not organizational leadership.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_40ccb2de2e": "<table><tr><th>title</th><td>Change Management and Organizational Development</td></tr><tr><th>description</th><td>Leadership competency: change management and organizational development.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_25ddcb9434": "<table><tr><th>requirement_title</th><td>Cross-Functional Collaboration</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual entry-level retail resume (John Doe, graphic design graduate). It mentions basic collaboration in retail settings \u2014 &quot;Collaborated with the store merchandiser creating displays&quot; at American Eagle and &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret. However, there is no evidence of leadership-level cross-functional collaboration across Product, Marketing, Customer Success, and Channel teams. The roles listed are sales associate, spa consultant, and brand ambassador positions, not organizational leadership across functions.</td></tr><tr><th>gap_description</th><td>The requirement calls for a leadership competency in coordinating across Product, Marketing, Customer Success, and Channel organizations. The document reflects only entry-level retail experience with minimal, store-level collaboration and no demonstrated leadership across the specified business functions. There is no evidence of managing or orchestrating multiple cross-functional teams at an organizational level.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_d16b949ca0": "<table><tr><th>title</th><td>Cross-Functional Collaboration</td></tr><tr><th>description</th><td>Leadership competency: cross-functional collaboration across Product, Marketing, Customer Success, and Channel teams.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_90bd375a13": "<table><tr><th>requirement_title</th><td>Diversity, Equity, and Inclusion Advocacy</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level graphic design/retail candidate (John Doe). It lists education (BS in Graphic Design, University of Minnesota) and retail sales/customer service roles at American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, and a brand ambassador role at Target. There is no mention of diversity, equity, and inclusion advocacy, related leadership initiatives, DEI programs, or associated certifications.</td></tr><tr><th>gap_description</th><td>The document contains no evidence of any diversity, equity, and inclusion (DEI) advocacy, leadership competency, or related programs. It reflects retail sales and design experience only, with limited leadership exposure (assisting in training coworkers). There is no demonstrated capability to meet a DEI advocacy leadership competency requirement.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_9a2e98d8a1": "<table><tr><th>title</th><td>Diversity, Equity, and Inclusion Advocacy</td></tr><tr><th>description</th><td>Leadership competency: diversity, equity, and inclusion advocacy.</td></tr><tr><th>category</th><td>compliance</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_d0f59389b1": "<table><tr><th>requirement_title</th><td>Lead and Scale a 60+ Person Sales Team</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual resume for an entry-level candidate (John Doe) with a Bachelor of Science in Graphic Design. Relevant experience consists solely of individual retail sales associate roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) with limited leadership exposure \u2014 the only leadership reference is &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret. There is no evidence of managing, building, or scaling a sales team, let alone a 60+ person enterprise sales organization across multiple regions.</td></tr><tr><th>gap_description</th><td>The requirement calls for building and developing a high-performing team of 60+ enterprise sales professionals across multiple regions. The company/candidate has no demonstrated experience in enterprise sales, team leadership at scale, multi-region management, or building/scaling a sales organization. Experience is limited to individual-contributor retail associate roles with minimal informal training responsibilities. Closing this gap would require a fundamentally different profile with proven large-scale sales leadership.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_1e9d3366bd": "<table><tr><th>title</th><td>Lead and Scale a 60+ Person Sales Team</td></tr><tr><th>description</th><td>Build and develop a high-performing team of 60+ enterprise sales professionals across multiple regions.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_ed96f417d0": "<table><tr><th>requirement_title</th><td>Own and Deliver $180M+ ARR Quota</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level retail candidate (John Doe) with a Bachelor of Science in Graphic Design. Work experience consists of retail sales associate and spa consultant roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) and a one-time brand ambassador engagement. The only sales-related achievements are meeting store-level company sales goals and being named employee of the month. There is no evidence of P&amp;L accountability, ARR ownership, strategic planning, or enterprise-scale revenue responsibility.</td></tr><tr><th>gap_description</th><td>The requirement demands ownership and delivery of $180M+ in annual recurring revenue with full P&amp;L accountability and strategic planning responsibility. The company/candidate profile shows only individual retail sales roles with no demonstrated experience managing large-scale revenue, no P&amp;L authority, and no strategic planning at any comparable scale. This is a fundamental mismatch between an entry-level retail/design background and a senior revenue leadership mandate.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_848ec364b0": "<table><tr><th>title</th><td>Own and Deliver $180M+ ARR Quota</td></tr><tr><th>description</th><td>Own and deliver $180M+ ARR with full P&amp;L accountability and strategic planning responsibility.</td></tr><tr><th>category</th><td>financial</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_5eed01d2b4": "<table><tr><th>requirement_title</th><td>Develop and Implement Sales Strategies</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual retail resume for &quot;John Doe,&quot; a recent graphic design graduate. It lists entry-level retail sales associate roles (American Eagle, Heartbreaker, Victoria&#x27;s Secret) and a spa consultant role at Planet Beach where the individual &quot;sold retail and memberships to meet company sales goals.&quot; These reflect individual, front-line retail selling experience \u2014 following existing sales targets, assisting customers, and stocking/merchandising \u2014 rather than any experience developing or implementing organization-level sales strategies to accelerate pipeline growth or increase win rates.</td></tr><tr><th>gap_description</th><td>There is no evidence of strategic sales capability. The requirement calls for developing and implementing sales strategies that accelerate pipeline growth and increase win rates \u2014 a B2B/organizational sales strategy function. The document shows only individual retail sales-floor experience with no pipeline management, sales strategy design, win-rate improvement, or team/enterprise-level sales leadership. Closing this mandatory gap would require an entirely different skill set and demonstrated track record.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_854bd6a46f": "<table><tr><th>title</th><td>Develop and Implement Sales Strategies</td></tr><tr><th>description</th><td>Develop and implement sales strategies that accelerate pipeline growth and increase win rates.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_4659debfcc": "<table><tr><th>requirement_title</th><td>Build Executive C-Level Customer Relationships</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level individual resume for a graphic design/retail sales candidate (John Doe), listing roles such as Sales Associate at American Eagle, Spa Consultant at Planet Beach, Fashion Representative at Victoria&#x27;s Secret, and Brand Ambassador at Target. Customer-facing experience is limited to retail floor assistance, membership sales, and event promotion. There is no evidence of engaging, building, or maintaining relationships with C-level executives, nor any experience managing large enterprise accounts.</td></tr><tr><th>gap_description</th><td>The document describes no executive-level relationship management, no enterprise or large-account experience, and no strategic stakeholder engagement at the C-suite level. All cited experience is entry-level retail customer service. Meeting a mandatory requirement to build and maintain C-level relationships at the largest accounts would require entirely different senior sales/account management personnel and a demonstrated track record that is absent here.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_ba908d5e51": "<table><tr><th>title</th><td>Build Executive C-Level Customer Relationships</td></tr><tr><th>description</th><td>Build and maintain executive relationships with C-level stakeholders at the largest accounts.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_27b06ba12a": "<table><tr><th>requirement_title</th><td>Drive Sales Operational Excellence</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual&#x27;s resume for a graphic design/apparel print role. It shows entry-level retail sales associate experience (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) including meeting company sales goals, running operating procedures single-handedly, inventory control, and handling cash/deposits. There is no organizational-level capability, no evidence of sales forecasting, process optimization, or data-driven decision making at any operational scale.</td></tr><tr><th>gap_description</th><td>The requirement calls for organizational-level sales operational excellence \u2014 accurate forecasting, process optimization, and data-driven decision making \u2014 typically demonstrated by a company with analytics tools, sales operations teams, and process frameworks. The document is a single individual&#x27;s retail resume with only basic sales-associate duties and no forecasting, analytics, or process-optimization capability. There is effectively no evidence of the required organizational capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_d2fde1d889": "<table><tr><th>title</th><td>Drive Sales Operational Excellence</td></tr><tr><th>description</th><td>Drive operational rigor through accurate forecasting, process optimization, and data-driven decision making.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_85eeb6f408": "<table><tr><th>requirement_title</th><td>Coach and Develop Sales Leaders</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an entry-level individual&#x27;s resume (John Doe, Bachelor of Science in Graphic Design). Sales-related experience is limited to individual contributor retail roles (Sales Associate at American Eagle, Spa Consultant at Planet Beach, Sales Associate at Heartbreaker, Fashion Representative at Victoria&#x27;s Secret). The only leadership-adjacent activity is &quot;assisting in the training of coworkers&quot; at Victoria&#x27;s Secret, which is task-level assistance rather than coaching, mentoring, or developing sales leaders.</td></tr><tr><th>gap_description</th><td>The requirement calls for the ability to coach, mentor, and develop the next generation of sales leaders \u2014 a senior leadership/management competency. The document shows no experience managing teams, no formal sales leadership roles, and no evidence of developing other leaders. There is only a brief mention of assisting in training coworkers, which falls well short of leadership development capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_00532d334f": "<table><tr><th>title</th><td>Coach and Develop Sales Leaders</td></tr><tr><th>description</th><td>Coach, mentor, and develop the next generation of sales leaders.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_05f3282984": "<table><tr><th>requirement_title</th><td>Cross-Functional Partnership for Integrated Solutions</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual&#x27;s resume for an entry-level graphic design/retail apparel role (John Doe, Bachelor of Science in Graphic Design). It lists retail sales roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret) and a brand ambassador role. The only marginally relevant experience is collaborating with a store merchandiser on displays and representing a marketing firm at a college event \u2014 none of which constitutes enterprise cross-functional partnership across Product, Marketing, Customer Success, and Channel teams to deliver integrated solutions.</td></tr><tr><th>gap_description</th><td>The document shows no evidence of an organization capable of partnering across Product, Marketing, Customer Success, and Channel functions. There is no Product team, no Customer Success function, and no channel/partner ecosystem described. This is an individual retail/graphic design resume rather than an organizational capabilities statement, so the required integrated, multi-team delivery capability is entirely absent.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_eae033212f": "<table><tr><th>title</th><td>Cross-Functional Partnership for Integrated Solutions</td></tr><tr><th>description</th><td>Partner with Product, Marketing, Customer Success, and Channel teams to deliver integrated solutions.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_84f95ffe2e": "<table><tr><th>requirement_title</th><td>Champion Sales Innovation</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is an individual retail sales resume for &quot;John Doe,&quot; a graphic design graduate with entry-level retail sales associate experience (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, Target). Activities cited include assisting customers, stocking/merchandising, meeting personal sales goals, handling cash, and brand ambassador work. There is no evidence of championing new sales methodologies, tools, or approaches, nor any leadership role driving team productivity improvements or sales innovation initiatives.</td></tr><tr><th>gap_description</th><td>The requirement calls for championing new sales methodologies, tools, and approaches to improve team productivity \u2014 a leadership/innovation function. The document only shows individual, front-line retail sales experience with no demonstrated experience introducing new sales tools, defining methodologies, or driving team-level productivity change. There is no track record of sales innovation leadership.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_17a7c20959": "<table><tr><th>title</th><td>Champion Sales Innovation</td></tr><tr><th>description</th><td>Champion new sales methodologies, tools, and approaches that improve team productivity.</td></tr><tr><th>category</th><td>functional</td></tr><tr><th>priority</th><td>important</td></tr></table>", "s_a7543c04e4": "<table><tr><th>requirement_title</th><td>Hybrid Work Location in San Francisco</td></tr><tr><th>match_level</th><td>no_match</td></tr><tr><th>evidence</th><td>The capabilities document is a resume for an entry-level graphic design/retail sales candidate (John Doe) with work experience at retail companies (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret, Target). All listed locations are generic &quot;City, State&quot; placeholders, and the education is based at the University of Minnesota (Twin Cities). There is no indication of an executive-level role, no reference to San Francisco, CA, and no mention of a hybrid work arrangement.</td></tr><tr><th>gap_description</th><td>The requirement is for a full-time executive-level role based in San Francisco, CA with a hybrid arrangement. The candidate profile shows only entry-level retail/sales and design experience with a Minnesota-based background, no executive experience, and no San Francisco location. There is no evidence supporting an executive role, a San Francisco base, or a hybrid work capability.</td></tr><tr><th>effort_to_close</th><td>high</td></tr></table>", "s_3603c8f774": "<table><tr><th>title</th><td>Hybrid Work Location in San Francisco</td></tr><tr><th>description</th><td>Full-time executive-level role based in San Francisco, CA with a hybrid work arrangement.</td></tr><tr><th>category</th><td>organizational</td></tr><tr><th>priority</th><td>mandatory</td></tr></table>", "s_3c06e52c3d": "<table><tr><th>go_recommendation</th><td>False</td></tr><tr><th>confidence</th><td>high</td></tr><tr><th>total_requirements</th><td>30</td></tr><tr><th>fully_matched</th><td>1</td></tr><tr><th>partially_matched</th><td>2</td></tr><tr><th>not_matched</th><td>28</td></tr><tr><th>critical_gaps</th><td>Every mandatory requirement except the bachelor&#x27;s degree is unmet. Critical mandatory gaps include: 12+ years progressive B2B sales experience with 5+ years at VP level (candidate has ~5 years of B2C retail experience, zero B2B, no VP roles); proven track record building/scaling enterprise sales teams of 50+ people (none); managing $100M+ ARR quotas (none); complex consultative sales with 6-12 month cycles (only transactional retail); SaaS sales to Fortune 500 (none); executive presence with C-suite buyers (none); leading/scaling a 60+ person team; owning $180M+ ARR with P&amp;L accountability; developing/implementing sales strategies; building C-level relationships; sales operational excellence; and coaching sales leaders. All require high effort to close and reflect a fundamental profile mismatch \u2014 an entry-level graphic design/retail resume against a senior enterprise sales leadership role.</td></tr><tr><th>key_strengths</th><td>The only match is the mandatory bachelor&#x27;s degree requirement (B.S. in Graphic Design, University of Minnesota, GPA 3.93). Two soft competencies \u2014 passion for coaching and communication/executive presence \u2014 received partial credit based on informal coworker training and customer-facing retail experience, but these are junior, individual-contributor level and not competitive differentiators. There are effectively no competitive advantages for this bid.</td></tr><tr><th>win_probability</th><td>very_low</td></tr><tr><th>strategic_considerations</th><td>There are no strategic factors that could override the recommendation. This is not a matter of a few closeable gaps \u2014 the candidate profile is a fundamentally different category (entry-level B2C retail/graphic design) than what the role requires (senior enterprise B2B SaaS sales leadership). No relationship, market positioning, or learning opportunity can bridge a 12+ year experience gap, absent VP tenure, and complete lack of enterprise sales, team leadership, and revenue ownership. Pursuing this bid would waste resources with no realistic path to success.</td></tr></table>"};

// XSS-safe HTML escaping
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Make all links in a container open in new windows
function makeLinksOpenInNewWindow(container) {
    if (!container) return;
    const links = container.querySelectorAll('a');
    links.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
    });
}

// Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}

// Get appropriate tab label based on content type
function getHtmlTabLabel(contentType) {
    if (contentType === 'application/pdf') return 'PDF';
    if (contentType?.startsWith('image/')) return 'Image';
    return 'HTML';
}

    const palette = themePalettes[theme]?.page || themePalettes.default.page;

    document.documentElement.style.setProperty('--text-color', palette.text);
    document.documentElement.style.setProperty('--label-color', palette.label);
    document.documentElement.style.setProperty('--border-color', palette.border);

    document.documentElement.style.setProperty('--select-bg', palette.selectBg);
    document.documentElement.style.setProperty('--container-bg', palette.containerBg);
}

    );
    result = result.replace(
        /classDef\s+controller\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef controller fill:${palette.controller.fill},stroke:${palette.controller.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe fill:${palette.pipe.fill},stroke:${palette.pipe.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe_failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe_failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+stuff\s+fill:[^,]+,stroke:[^,]+/g,
        `classDef stuff fill:${palette.stuff.fill},stroke:${palette.stuff.stroke}`
    );

    // Replace subgraph fill colors (style sg_xxx fill:#xxx)
    const subgraphColors = palette.subgraph;
    let colorIndex = 0;
    result = result.replace(
        /style\s+(sg_[^\s]+)\s+fill:#[a-fA-F0-9]+/g,
        (match, subgraphId) => {
            const color = subgraphColors[colorIndex % subgraphColors.length];
            colorIndex++;
            return `style ${subgraphId} fill:${color}`;
        }
    );

    return result;
}

function initMermaid(theme) {
    mermaid.initialize({
        startOnLoad: false,
        theme: theme,
        flowchart: {
            useMaxWidth: true,
            htmlLabels: true,
            curve: 'basis'
        }
    });
}

function attachClickHandlers() {
    // Wait for mermaid to render, then attach click handlers
    setTimeout(() => {
        const svgContainer = document.querySelector('.mermaid svg');
        if (!svgContainer) return;

        // Find nodes by their flowchart IDs - use any available data source
        const allStuffIds = new Set([
            ...Object.keys(stuffDataJson || {}),
            ...Object.keys(stuffDataText || {}),
            ...Object.keys(stuffDataHtml || {})
        ]);

        for (const stuffId of allStuffIds) {
            // Mermaid generates IDs like 'flowchart-s_xxx-123'
            const nodes = svgContainer.querySelectorAll(`[id^="flowchart-${stuffId}"]`);
            nodes.forEach(node => {
                node.classList.add('clickable-stuff');
                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal(stuffId);
                });
            });
        }
    }, 500);
}

async function renderDiagram(theme) {
    const container = document.getElementById('mermaid-diagram');
    const themedCode = applyThemeColors(mermaidCode, theme);
    container.innerHTML = themedCode;
    container.removeAttribute('data-processed');
    applyPageTheme(theme);
    initMermaid(theme);
    await mermaid.run({ nodes: [container] });
    attachClickHandlers();
}

// Set initial theme in dropdown
document.getElementById('theme-select').value = currentTheme;

// Handle theme change
document.getElementById('theme-select').addEventListener('change', async (e) => {
    currentTheme = e.target.value;
    await renderDiagram(currentTheme);
});

// Initial render on page load
renderDiagram(currentTheme);

// Set up format tab handlers
document.querySelectorAll('.format-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        if (tab.disabled) return;
        const format = tab.dataset.format;
        setFormat(format);
    });
});

function setFormat(format) {
    currentFormat = format;
    // Update tab styling
    document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${format}`).classList.add('active');
    // Re-render content if modal is open
    if (currentStuffId) {
        renderContent(currentStuffId, format);
    }
}

function renderContent(stuffId, format) {
    const content = document.getElementById('modal-content');
    content.classList.remove('html-content', 'text-content', 'pdf-content', 'image-content');

    // Handle PDF content type with embedded viewer
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];

    if (format === 'html' && contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            content.classList.add('pdf-content');
            content.innerHTML = '';
            const embed = document.createElement('embed');
            embed.src = pdfUrl;
            embed.type = 'application/pdf';
            embed.style.cssText = 'width:100%; height:100%; border:none; min-height:500px;';
            content.appendChild(embed);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    // Handle image content type
    if (format === 'html' && contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            content.classList.add('image-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = 'max-width:100%; max-height:100%; object-fit:contain;';
            img.alt = 'Image content';
            content.appendChild(img);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    if (format === 'json') {
        const data = stuffDataJson?.[stuffId];
        content.innerHTML = '';
        content.textContent = data ? JSON.stringify(data, null, 2) : 'No JSON data available';
    } else if (format === 'text') {
        const data = stuffDataText?.[stuffId];
        content.classList.add('text-content');
        content.innerHTML = '';
        content.textContent = data || 'No text data available';
    } else if (format === 'html') {
        const data = stuffDataHtml?.[stuffId];
        if (data) {
            content.classList.add('html-content');
            content.innerHTML = DOMPurify.sanitize(data);
            makeLinksOpenInNewWindow(content);
        } else {
            content.innerHTML = '';
            content.textContent = 'No HTML data available';
        }
    }

    updateOpenExternalButton(stuffId, contentType, jsonData);
}

// Update visibility of the "open in new window" button (PDF only)
function updateOpenExternalButton(stuffId, contentType, jsonData) {
    const openExternalBtn = document.getElementById('open-external-btn');
    if (!openExternalBtn) return;

    const url = extractUrl(jsonData);
    // Only show for PDFs (images are handled by the download button)
    const shouldShow = contentType === 'application/pdf' && !!url;
    openExternalBtn.style.display = shouldShow ? '' : 'none';
}

function updateTabAvailability(stuffId) {
    const jsonTab = document.getElementById('tab-json');
    const textTab = document.getElementById('tab-text');
    const htmlTab = document.getElementById('tab-html');

    jsonTab.disabled = !stuffDataJson?.[stuffId];
    textTab.disabled = !stuffDataText?.[stuffId];

    // For PDF and image content types, the tab can render from JSON data via extractUrl()
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];
    const canRenderFromJson = (contentType === 'application/pdf' || contentType?.startsWith('image/')) && extractUrl(jsonData);
    htmlTab.disabled = !stuffDataHtml?.[stuffId] && !canRenderFromJson;

    // Update HTML tab label based on content type
    if (contentType === 'application/pdf') {
        htmlTab.textContent = 'PDF';
    } else if (contentType?.startsWith('image/')) {
        htmlTab.textContent = 'Image';
    } else {
        htmlTab.textContent = 'HTML';
    }

    // Find first available format (HTML -> JSON -> Pretty)
    if (!htmlTab.disabled) return 'html';
    if (!jsonTab.disabled) return 'json';
    if (!textTab.disabled) return 'text';
    return 'html';
}

function showModal(stuffId) {
    currentStuffId = stuffId;
    const modal = document.getElementById('data-modal');
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    // Build title from metadata (name + concept as primary, ID as secondary)
    const meta = stuffMetadata?.[stuffId];
    if (meta && (meta.name || meta.concept)) {
        const primaryParts = [];
        if (meta.name) primaryParts.push(escapeHtml(meta.name));
        if (meta.concept) primaryParts.push(`(${escapeHtml(meta.concept)})`);
        const primary = `<span class="data-modal-title-primary">${primaryParts.join(' ')}</span>`;
        const secondary = `<span class="data-modal-title-secondary">${escapeHtml(stuffId)}</span>`;
        title.innerHTML = primary + secondary;
    } else {
        title.innerHTML = `<span class="data-modal-title-primary">${escapeHtml(stuffId)}</span>`;
    }

    // Update tab availability and select best format
    const availableFormat = updateTabAvailability(stuffId);

    // If current format is not available, switch to available one
    const currentTab = document.getElementById(`tab-${currentFormat}`);
    if (currentTab.disabled) {
        setFormat(availableFormat);
    } else {
        renderContent(stuffId, currentFormat);
    }

    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function hideModal() {
    document.getElementById('data-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    currentStuffId = null;
}

// Get current content based on format
function getCurrentContent() {
    if (!currentStuffId) return null;

    if (currentFormat === 'json') {
        const data = stuffDataJson?.[currentStuffId];
        if (!data) return null;
        return { content: JSON.stringify(data, null, 2), ext: 'json', mime: 'application/json' };
    } else if (currentFormat === 'text') {
        const data = stuffDataText?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'txt', mime: 'text/plain' };
    } else if (currentFormat === 'html') {
        const data = stuffDataHtml?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'html', mime: 'text/html' };
    }
    return null;
}

// Copy content to clipboard
function copyContent() {
    const data = getCurrentContent();
    if (!data) return;

    navigator.clipboard.writeText(data.content).then(() => {
        const btn = document.getElementById('copy-btn');
        const checkIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z' +
            'm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z' +
            'm0 16H8V7h11v14z"/></svg>';
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = copyIcon;
            btn.classList.remove('copied');
        }, 1500);
    });
}

// Download content as file
function downloadContent() {
    if (!currentStuffId) return;

    // Get name from metadata or use ID
    const meta = stuffMetadata?.[currentStuffId];
    const baseName = meta?.name || currentStuffId || 'data';
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    // For images, download the actual image file directly
    if (contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            const ext = contentType.split('/')[1] || 'png';
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${ext}`;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    // For PDFs, download the actual PDF file directly
    if (contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    const data = getCurrentContent();
    if (!data) return;

    const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${data.ext}`;
    const blob = new Blob([data.content], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Close modal when clicking overlay
document.getElementById('modal-overlay').addEventListener('click', hideModal);

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideModal();
});

// Open external URL for PDF content
function openExternal() {
    if (!currentStuffId) return;
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    if (contentType === 'application/pdf') {
        const url = extractUrl(jsonData);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }
}
