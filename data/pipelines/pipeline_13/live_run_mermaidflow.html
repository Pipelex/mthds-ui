 near a record low, Antarctic sea ice extent was the third lowest on record, and glacier melt continued unabated, according to the report.\nWMO\u2019s State of the Global Climate report 2025 confirms that 2015-2025 are the hottest 11-years on record, and that 2025 was the second or third hottest year on record, at about 1.43 \u00b0C above the 1850-1900 average. Extreme events around the world, including intense heat, heavy rainfall and tropical cyclones, caused disruption and devastation and highlighted the vulnerability of our inter-connected economies and societies.The ocean continues to warm and absorb carbon dioxide.\nThe ocean continues to warm and absorb carbon dioxide. It has been absorbing the equivalent of about eighteen times the annual human energy use each year for the past two decades. Annual sea ice extent in the Arctic was at or near a record low, Antarctic sea ice extent was the third lowest on record, and glacier melt continued unabated, according to the report."}, {"url": "https://www.ametsoc.org/ams/about-ams/news/news-releases/international-state-of-the-climate-report-confirms-record-high-greenhouse-gases-global-sea-level-and-ocean-heat-in-2025/", "public_url": "https://www.ametsoc.org/ams/about-ams/news/news-releases/international-state-of-the-climate-report-confirms-record-high-greenhouse-gases-global-sea-level-and-ocean-heat-in-2025/", "mime_type": "text/html", "filename": null, "title": "International \"State of the Climate\" report confirms record-high greenhouse gases, global sea level, and ocean heat in 2025 - American Meteorological Society", "snippet": "Fossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\nCarbon dioxide (CO2), methane, and nitrous oxide?\u2014Earth\u2019s major atmospheric greenhouse gases?\u2014once again reached record-high concentrations in 2025. The globally averaged CO2 level reached 425.6\u00b10.1 parts per million, a 53% increase from the preindustrial level of ~278 parts per million. Fossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\nIn response to the precipitation and temperature increases, tundra plants have been increasing; 2025 marked the third-highest value in the record with respect to greenness, a measure of the increase in plants and productivity. In Arctic waters, maximum sea ice extent in 2025 was the lowest in the 47-year record, while minimum extent was the 11th lowest.\nThe global ocean heat content, measured from the ocean\u2019s surface to a depth of 2000 meters, continued to increase, and reached new record highs in 2025. Global mean sea level was a record high for the 14th consecutive year, reaching about 111.2 millimeters above the average for 1993, when satellite altimetry measurements began. Warming oceans have contributed an average of 1.6\u00b10.3 millimeters per year to rising sea levels since 2005, while melt from ice sheets and glaciers has contributed an average of 2.0\u00b10.4 millimeters during that same period. The Arctic saw near-record warmth.\nSurrounding the continent, sea ice remained below average in 2025, following a nearly decade-long trend. Annual daily maxima and minima of sea ice extent were the third and fourth lowest on record, respectively."}, {"url": "https://climate.copernicus.eu/copernicus-2025-was-third-hottest-year-record", "public_url": "https://climate.copernicus.eu/copernicus-2025-was-third-hottest-year-record", "mime_type": "text/html", "filename": null, "title": "Copernicus: 2025 was the third hottest year on record | Copernicus", "snippet": "Copernicus data show that 2025 was the third warmest year on record, only marginally (0.01\u00b0C) cooler than 2023, and 0.13\u00b0C cooler than 2024 \u2013 the warmest year on record. The past 11 years have been the 11 warmest on record. Global temperatures from the past three years (2023-2025) averaged ...\nCopernicus data show that 2025 was the third warmest year on record, only marginally (0.01\u00b0C) cooler than 2023, and 0.13\u00b0C cooler than 2024 \u2013 the warmest year on record. The past 11 years have been the 11 warmest on record. Global temperatures from the past three years (2023-2025) averaged more than 1.5\u00b0C above the pre-industrial level (1850\u20131900).\nThe first is the build-up of greenhouse gases in the atmosphere, from continued emissions and reduced uptake of carbon dioxide by natural sinks. Secondly, sea-surface temperatures reached exceptionally high levels across the ocean, associated with an El Ni\u00f1o event and other ocean variability factors, amplified by climate change.\nAir temperature over global land areas was second warmest, whilst the Antarctic saw its warmest annual temperature on record and the Arctic its 2nd warmest. The findings are released today by the European Centre for Medium-Range Weather Forecasts (ECMWF), which operates the Copernicus Climate Change Service (C3S) and Copernicus Atmosphere Monitoring Service (CAMS) on behalf of the European Commission.\nCarlo Buontempo, Director of the Copernicus Climate Change Service \u00b7 Rising concentrations of greenhouse gases in the atmosphere5 \u2013 mainly a direct consequence of human activities \u2013 are the primary driver of the observed long-term increase in the global mean temperature. Monitoring of greenhouse gas emissions and concentrations by the Copernicus Atmosphere Monitoring Service (CAMS) provides information to support the implementation of climate mitigation policies."}, {"url": "https://www.carbonbrief.org/state-of-the-climate-2025-in-top-three-hottest-years-on-record-as-ocean-heat-surges/", "public_url": "https://www.carbonbrief.org/state-of-the-climate-2025-in-top-three-hottest-years-on-record-as-ocean-heat-surges/", "mime_type": "text/html", "filename": null, "title": "State of the climate: 2025 in top-three hottest years on record as ocean heat surges - Carbon Brief", "snippet": "Cumulative ice loss from Greenland in billion metric tonnes (gigatonnes) between 1970 and 2025 from Mankoff et al 2021. Chart by Carbon Brief. Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, ...\nHeating of the atmosphere: It was the second warmest year in the lower troposphere \u2013 the lowest part of the atmosphere. Sea level rise: Sea levels reached record highs, continuing a notable acceleration over the past three decades. Shrinking glaciers and ice sheets: Cumulative ice loss from the world\u2019s glaciers and from the Greenland ice sheet reached a new record high in 2025, contributing to sea level rise. Greenhouse gases: Concentrations reached record levels for carbon dioxide (CO2), methane and nitrous oxide. Sea ice extent: Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, while Antarctic sea ice saw its third-lowest minimum extent.\nGreenhouse gas concentrations reached a new high in 2025, driven by human-caused emissions from fossil fuels, land use and agriculture. Three greenhouse gases \u2013 CO2, methane (CH4) and nitrous oxide (N2O) \u2013 are responsible for the bulk of additional heat trapped by human activities. CO2 is by far the largest factor, accounting for roughly 42% of the increase in global surface temperatures since the pre-industrial era (1850-1900).\nMethane accounts for 28%, while nitrous oxide accounts for around 5%. The remaining 25% comes from other factors including carbon monoxide, black carbon and halocarbons, such as chlorofluorocarbons (CFCs). Human emissions of greenhouse gases have increased atmospheric concentrations of CO2, methane and nitrous oxide to their highest levels in at least a few million years \u2013 if not longer. The figure below shows concentrations of these greenhouse gases \u2013 in parts per million (ppm) for CO2 and parts per billion (ppb) for methane and nitrous oxide \u2013 from the early 1980s through to October 2025 for CO2 and September 2025 for CH4 and N2O (the most recent data currently available).\nCumulative ice loss from Greenland in billion metric tonnes (gigatonnes) between 1970 and 2025 from Mankoff et al 2021. Chart by Carbon Brief. Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, while Antarctic sea ice saw its third-lowest minimum extent."}, {"url": "https://climateadaptationplatform.com/extremes-define-state-of-climate-2025-as-records-fall-worldwide/", "public_url": "https://climateadaptationplatform.com/extremes-define-state-of-climate-2025-as-records-fall-worldwide/", "mime_type": "text/html", "filename": null, "title": "Extremes Define State of Climate 2025 as Records Fall Worldwide - Climate Adaptation Platform", "snippet": "Emissions of the planet\u2019s major greenhouse gases\u2014carbon dioxide, methane, and nitrous oxide\u2014 continue to rise to record levels. CO2 atmospheric concentration reached 425.6\u00b10.1 ppm in 2025, up 2.9 ppm from 2024, contributing to a cumulative ...\nAtmospheric carbon dioxide reached 425.6 parts per million in 2025, 53% above pre-industrial levels, while ocean heat and global sea level also set new records. The ocean has now broken its previous heat record for several years in a row. Emissions of the planet\u2019s major greenhouse gases\u2014carbon dioxide, methane, and nitrous oxide\u2014 continue to rise to record levels. CO2 atmospheric concentration reached 425.6\u00b10.1 ppm in 2025, up 2.9 ppm from 2024, contributing to a cumulative 53% increase from the pre-industrial level of ~278 ppm.\nThe Arctic is also experiencing increased greenness; 2025 is the third-highest year for plant growth, while the Greenland Ice Sheet lost an estimated 129\u00b150 Gigatons of ice overall for the year. Sea ice extent and thickness in the Arctic are also declining, while older ice is disappearing.\nThe sequence of the State of the Climate in 2025 is similar to previous years: Chapter 1\u2014Introduction (i.e., this chapter); Chapter 2\u2014Global Climate; Chapter 3\u2014Global Oceans; Chapter 4\u2014The Tropics; Chapter 5\u2014The Arctic; Chapter 6\u2014Antarctica and the Southern Ocean; and Chapter 7\u2014Regional Climates, which covers the seven regions of North America, Central America and the Caribbean, South America, Africa, Europe and the Middle East, Asia, and Oceania.\nAbout 41% of the loss glaciers have experienced since 1976 has occurred in the last decade. Lakes in the Northern Hemisphere have also shown later ice formation and earlier ice breakup, with ice durations 15.0 days shorter on average than the 1991\u20132020 mean."}, {"url": "https://www.eco-business.com/news/analysis-fossil-fuel-co2-emissions-to-set-new-record-in-2025-as-land-sink-recovers/", "public_url": "https://www.eco-business.com/news/analysis-fossil-fuel-co2-emissions-to-set-new-record-in-2025-as-land-sink-recovers/", "mime_type": "text/html", "filename": null, "title": "Analysis: Fossil-fuel CO2 emissions to set new record in 2025, as land sink \u2018recovers\u2019 | News | Eco-Business | Asia Pacific", "snippet": "- Global CO2 emissions from land-use change are expected to decrease by nearly 10 per cent in 2025, driven by[reductions in deforestation](https://www.carbonbrief.org/un-report-five-charts-showing-how-global-deforestation-is-declining/)and forest degradation in South America.\n- Total CO2 emissions \u2013 fossil and land use \u2013 have grown more slowly over the past decade (0.3 per cent per year on average) compared to the previous decade (1.9 per cent per year).\n- The remaining carbon budget to limit global warming to 1.5\u00b0C is virtually exhausted and is equivalent to only four years of current emissions. Carbon budgets to limit warming to 1.7**\u00b0**C and 2\u00b0C would similarly be used up in 12 and 25 years, respectively.\n- The concentration of CO2 in the atmosphere is set to reach 425.7 parts per million (ppm) in 2025, 2.3ppm above 2023 and 52 per cent above pre-industrial levels.\n#### Global emissions remain flat  \nThe[Global Carbon Budget](https://www.globalcarbonproject.org/carbonbudget/)(GCB) finds that total global CO2 emissions in 2025 \u2013including those from fossil fuels and land use \u2013are projected to remain approximately flat at 42.2GtCO2, falling by a negligible -0.04 per cent compared to last year.  \nThis means 2025 is effectively tied with 2024 as the highest global CO2 emissions on record.  \nFlat total CO2 emissions in 2025 reflect a combination of continued rising emissions from fossil fuel and industry and declining emissions from land-use change. Fossil CO2 emissions rose 1.1 per cent to 38.1GtCO2, while land-use emissions declined by -9.8 per cent to 4.1GtCO2 (albeit with large uncertainties).  \nThe figure below shows the 2025 global CO2 emissions update (red solid line) alongside 2024 (dark blue dotted), 2023 (mid blue dotted)[2022](https://www.carbonbrief.org/guest-post-what-the-tiny-remaining-1-5c-carbon-budget-means-for-climate-policy/)(light blue dotted), 2021 (light grey dotted) and 2020 (dark grey dotted). The shaded area indicates the uncertainty around the new 2025 budget.  \n(Each year, the GCB is updated to include the latest data as well as improvements to modelling sources and sinks, resulting in some year-to-year revisions to the historical record.)\n(The carbon budget is the total amount of CO2 that scientists estimate can be emitted if warming is to be kept below a particular temperature threshold. Earlier this year, the Indicators of Global Climate Change report estimated the remaining carbon budget had[declined by three-quarters](https://www.carbonbrief.org/guest-post-why-2024s-global-temperatures-were-unprecedented-but-not-surprising/)between the start of 2020 and the start of 2025.)  \nWith human-caused global warming sitting at around[1.36**\u00b0**C above pre-industrial levels](https://www.carbonbrief.org/guest-post-why-2024s-global-temperatures-were-unprecedented-but-not-surprising/)in 2024, the remaining budget for 1.5\u00b0C is 170GtCO2, equivalent to four years of current emissions.  \nThe GCB report finds that the remaining carbon budgets to limit warming to 1.7**\u00b0**C and 2\u00b0C have been reduced to 525GtCO2 (12 years at current emissions levels) and 1,055GtCO2 (25 years), respectively.  \nGlobal fossil CO2 emissions also grew more slowly in the past decade (0.8 per cent per year) compared to the previous decade (2.1 per cent). This was driven by the continued decarbonisation of energy systems \u2013 including a shift from burning coal to gas and replacing fossil fuels with renewables \u2013 as well as slightly weaker global economic growth during the past decade."}]}, "gamma_result": {"text": "# Climate Risk Assessment: 2025 Data Analysis\n\n## Summary of Key Indicators\n\n| Metric | Value | Benchmark | Status |\n|--------|-------|-----------|--------|\n| Temperature Rise | +1.3\u00b0C | 1.5\u00b0C Paris limit | \u26a0\ufe0f Warning |\n| Arctic Ice Extent | Record Low | Historical baseline | \ud83d\udd34 Critical |\n| Renewable Energy Share | 35% | 100% needed by ~2050 | \u26a0\ufe0f Progressing |\n| CO2 Emissions Change | -2% YoY | -7-10%/year needed | \ud83d\udd34 Insufficient |\n| Atmospheric CO2 | 425 ppm | 350 ppm safe threshold | \ud83d\udd34 Critical |\n\n---\n\n## Risk Categories\n\n### \ud83d\udd34 HIGH RISK\n\n**Atmospheric CO2 (425 ppm)**\n- Exceeds the widely cited 350 ppm safe boundary by 21%\n- Represents a **committed warming trajectory** regardless of near-term action\n- Risk: Continued warming even if emissions stopped today\n\n**Arctic Ice Loss**\n- Record lows accelerate albedo feedback loops\n- Risk: Self-reinforcing warming cycle becomes harder to interrupt\n- Secondary risks: Sea level rise, disrupted weather patterns, ecosystem collapse\n\n**Emissions Reduction Rate**\n- 2% annual reduction vs. 7-10% needed per IPCC pathways\n- Risk: Paris Agreement targets become mathematically unreachable\n- Current pace suggests **significant overshoot** of 1.5\u00b0C and possibly 2\u00b0C\n\n---\n\n### \u26a0\ufe0f MODERATE RISK / CAUTIONARY\n\n**Temperature at 1.3\u00b0C**\n- Only **0.2\u00b0C margin** remaining before the 1.5\u00b0C threshold\n- At current trajectory, 1.5\u00b0C likely crossed **within 5-10 years**\n- Risk: Tipping points may activate before targets are met\n\n**Renewable Energy Growth**\n- Positive trajectory (+6 percentage points in 2 years)\n- However, absolute speed remains insufficient\n- Risk: Growth may not offset rising global energy demand\n\n---\n\n## Key Risk Interactions\n\n```\nRecord Arctic Melt \u2192 Albedo Loss \u2192 Accelerated Warming\n        \u2193\nCO2 at 425ppm \u2192 Committed warming \u2192 Harder emissions targets\n        \u2193\n2% reduction rate \u2192 Gap widens \u2192 1.5\u00b0C threshold approached rapidly\n```\n\nThe risks are **compounding and non-linear**, meaning individual metrics understate the combined trajectory.\n\n---\n\n## Critical Uncertainties\n\n- **Tipping points** (permafrost methane release, ice sheet collapse) could dramatically accelerate timelines\n- Renewable growth rate may **accelerate non-linearly** as costs fall\n- The 2% emissions reduction may reflect **structural change or temporary factors** \u2014 trend confirmation needed\n- Demand-side growth could **negate supply-side gains** in renewables\n\n---\n\n## Overall Risk Rating\n\n> ### \ud83d\udd34 HIGH \u2014 Trajectory Concerning Despite Partial Progress\n\n**Rationale:** Positive signals (renewable growth, modest emissions reduction) exist but are materially insufficient relative to the scale and speed of change already embedded in the climate system. The margin for error before irreversible thresholds are crossed is narrow and shrinking.\n\n---\n\n*Note: This assessment is based solely on the provided data points. A complete assessment would incorporate regional breakdowns, socioeconomic vulnerability, and ecosystem-specific analysis.*"}, "delta_result": {"url": "pipelex-storage://5ebbc30c-37c6-4779-8155-792733ec78e7/generated/98866fcb0bf8144c.png", "public_url": "file:///Users/lchoquel/repos/Pipelex/_mthds-ui--fixtures-unread-inputs/.pipelex/storage/5ebbc30c-37c6-4779-8155-792733ec78e7/generated/98866fcb0bf8144c.png", "source_prompt": "Data visualization diagram for: Climate change report 2025: Global temperatures rose 1.3\u00b0C above pre-industrial levels. Arctic ice reached record low extent in September. Renewable energy now provides 35% of global electricity, up from 29% in 2023. Carbon emissions from fossil fuels decreased 2% year-over-year, but total atmospheric CO2 reached 425ppm.", "source_negative_prompt": null, "caption": null, "mime_type": "image/png", "width": null, "height": null, "filename": null}}};

// Track current state
let currentStuffId = null;
let currentFormat = 'preview';
let currentTheme = "dark";

// Include shared utility functions
// ============================================================
// Shared Stuff Display Utilities
// Used by both mermaidflow and reactflow implementations
// ============================================================

// XSS-safe HTML escaping
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Make all links in a container open in new windows
function makeLinksOpenInNewWindow(container) {
    if (!container) return;
    const links = container.querySelectorAll('a');
    links.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
    });
}

// Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}

// Get appropriate tab label based on content type
function getHtmlTabLabel(contentType) {
    if (contentType === 'application/pdf') return 'PDF';
    if (contentType?.startsWith('image/')) return 'Image';
    return 'HTML';
}

function applyPageTheme(theme) {
    const palette = themePalettes[theme]?.page || themePalettes.default.page;
    document.documentElement.style.setProperty('--bg-color', palette.bg);
    document.documentElement.style.setProperty('--text-color', palette.text);
    document.documentElement.style.setProperty('--label-color', palette.label);
    document.documentElement.style.setProperty('--border-color', palette.border);
    document.documentElement.style.setProperty('--border-hover', palette.borderHover);
    document.documentElement.style.setProperty('--select-bg', palette.selectBg);
    document.documentElement.style.setProperty('--container-bg', palette.containerBg);
}

function applyThemeColors(code, theme) {
    const palette = themePalettes[theme] || themePalettes.default;
    let result = code;

    // Replace classDef colors
    result = result.replace(
        /classDef\s+failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+controller\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef controller fill:${palette.controller.fill},stroke:${palette.controller.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe fill:${palette.pipe.fill},stroke:${palette.pipe.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe_failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe_failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+stuff\s+fill:[^,]+,stroke:[^,]+/g,
        `classDef stuff fill:${palette.stuff.fill},stroke:${palette.stuff.stroke}`
    );

    // Replace subgraph fill colors (style sg_xxx fill:#xxx)
    const subgraphColors = palette.subgraph;
    let colorIndex = 0;
    result = result.replace(
        /style\s+(sg_[^\s]+)\s+fill:#[a-fA-F0-9]+/g,
        (match, subgraphId) => {
            const color = subgraphColors[colorIndex % subgraphColors.length];
            colorIndex++;
            return `style ${subgraphId} fill:${color}`;
        }
    );

    return result;
}

function initMermaid(theme) {
    mermaid.initialize({
        startOnLoad: false,
        theme: theme,
        flowchart: {
            useMaxWidth: true,
            htmlLabels: true,
            curve: 'basis'
        }
    });
}

function attachClickHandlers() {
    // Wait for mermaid to render, then attach click handlers
    setTimeout(() => {
        const svgContainer = document.querySelector('.mermaid svg');
        if (!svgContainer) return;

        // Find nodes by their flowchart IDs
        for (const stuffId of Object.keys(stuffDataJson || {})) {
            // Mermaid generates IDs like 'flowchart-s_xxx-123'
            const nodes = svgContainer.querySelectorAll(`[id^="flowchart-${stuffId}"]`);
            nodes.forEach(node => {
                node.classList.add('clickable-stuff');
                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal(stuffId);
                });
            });
        }
    }, 500);
}

async function renderDiagram(theme) {
    const container = document.getElementById('mermaid-diagram');
    const themedCode = applyThemeColors(mermaidCode, theme);
    container.innerHTML = themedCode;
    container.removeAttribute('data-processed');
    applyPageTheme(theme);
    initMermaid(theme);
    await mermaid.run({ nodes: [container] });
    attachClickHandlers();
}

// Set initial theme in dropdown
document.getElementById('theme-select').value = currentTheme;

// Handle theme change
document.getElementById('theme-select').addEventListener('change', async (e) => {
    currentTheme = e.target.value;
    await renderDiagram(currentTheme);
});

// Initial render on page load
renderDiagram(currentTheme);

// Set up format tab handlers
document.querySelectorAll('.format-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        if (tab.disabled) return;
        const format = tab.dataset.format;
        setFormat(format);
    });
});

function setFormat(format) {
    currentFormat = format;
    // Update tab styling
    document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${format}`).classList.add('active');
    // Re-render content if modal is open
    if (currentStuffId) {
        renderContent(currentStuffId, format);
    }
}

function renderContent(stuffId, format) {
    const content = document.getElementById('modal-content');
    content.classList.remove('pdf-content', 'image-content');

    // Handle PDF content type with embedded viewer
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];

    if (format === 'preview' && contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            content.classList.add('pdf-content');
            content.innerHTML = '';
            const embed = document.createElement('embed');
            embed.src = pdfUrl;
            embed.type = 'application/pdf';
            embed.style.cssText = 'width:100%; height:100%; border:none; min-height:500px;';
            content.appendChild(embed);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    // Handle image content type
    if (format === 'preview' && contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            content.classList.add('image-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = 'max-width:100%; max-height:100%; object-fit:contain;';
            img.alt = 'Image content';
            content.appendChild(img);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    content.innerHTML = '';
    if (format === 'json') {
        const data = stuffDataJson?.[stuffId];
        content.textContent = data ? JSON.stringify(data, null, 2) : 'No JSON data available';
    } else {
        content.textContent = 'No preview available';
    }

    updateOpenExternalButton(stuffId, contentType, jsonData);
}

// Update visibility of the "open in new window" button (PDF only)
function updateOpenExternalButton(stuffId, contentType, jsonData) {
    const openExternalBtn = document.getElementById('open-external-btn');
    if (!openExternalBtn) return;

    const url = extractUrl(jsonData);
    // Only show for PDFs (images are handled by the download button)
    const shouldShow = contentType === 'application/pdf' && !!url;
    openExternalBtn.style.display = shouldShow ? '' : 'none';
}

function updateTabAvailability(stuffId) {
    const jsonTab = document.getElementById('tab-json');
    const previewTab = document.getElementById('tab-preview');

    jsonTab.disabled = !stuffDataJson?.[stuffId];

    // PDF and image content preview from the URL their JSON data carries
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];
    const canPreview = (contentType === 'application/pdf' || contentType?.startsWith('image/')) && !!extractUrl(jsonData);
    previewTab.disabled = !canPreview;

    // Label the preview tab after the content type it shows
    if (contentType === 'application/pdf') {
        previewTab.textContent = 'PDF';
    } else if (contentType?.startsWith('image/')) {
        previewTab.textContent = 'Image';
    } else {
        previewTab.textContent = 'Preview';
    }

    // Find first available format (preview -> JSON)
    if (!previewTab.disabled) return 'preview';
    return 'json';
}

function showModal(stuffId) {
    currentStuffId = stuffId;
    const modal = document.getElementById('data-modal');
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    // Build title from metadata (name + concept as primary, ID as secondary)
    const meta = stuffMetadata?.[stuffId];
    if (meta && (meta.name || meta.concept)) {
        const primaryParts = [];
        if (meta.name) primaryParts.push(escapeHtml(meta.name));
        if (meta.concept) primaryParts.push(`(${escapeHtml(meta.concept)})`);
        const primary = `<span class="data-modal-title-primary">${primaryParts.join(' ')}</span>`;
        const secondary = `<span class="data-modal-title-secondary">${escapeHtml(stuffId)}</span>`;
        title.innerHTML = primary + secondary;
    } else {
        title.innerHTML = `<span class="data-modal-title-primary">${escapeHtml(stuffId)}</span>`;
    }

    // Update tab availability and select best format
    const availableFormat = updateTabAvailability(stuffId);

    // If current format is not available, switch to available one
    const currentTab = document.getElementById(`tab-${currentFormat}`);
    if (currentTab.disabled) {
        setFormat(availableFormat);
    } else {
        renderContent(stuffId, currentFormat);
    }

    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function hideModal() {
    document.getElementById('data-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    currentStuffId = null;
}

// Get current content based on format
function getCurrentContent() {
    if (!currentStuffId) return null;

    const data = stuffDataJson?.[currentStuffId];
    if (currentFormat === 'json') {
        if (!data) return null;
        return { content: JSON.stringify(data, null, 2), ext: 'json', mime: 'application/json' };
    }
    // A preview's copyable content is the URL it shows
    const url = extractUrl(data);
    if (!url) return null;
    return { content: url, ext: 'txt', mime: 'text/plain' };
}

// Copy content to clipboard
function copyContent() {
    const data = getCurrentContent();
    if (!data) return;

    navigator.clipboard.writeText(data.content).then(() => {
        const btn = document.getElementById('copy-btn');
        const checkIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z' +
            'm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z' +
            'm0 16H8V7h11v14z"/></svg>';
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = copyIcon;
            btn.classList.remove('copied');
        }, 1500);
    });
}

// Download content as file
function downloadContent() {
    if (!currentStuffId) return;

    // Get name from metadata or use ID
    const meta = stuffMetadata?.[currentStuffId];
    const baseName = meta?.name || currentStuffId || 'data';
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    // For images, download the actual image file directly
    if (contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            const ext = contentType.split('/')[1] || 'png';
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${ext}`;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    // For PDFs, download the actual PDF file directly
    if (contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    const data = getCurrentContent();
    if (!data) return;

    const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${data.ext}`;
    const blob = new Blob([data.content], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Close modal when clicking overlay
document.getElementById('modal-overlay').addEventListener('click', hideModal);

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideModal();
});

// Open external URL for PDF content
function openExternal() {
    if (!currentStuffId) return;
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    if (contentType === 'application/pdf') {
        const url = extractUrl(jsonData);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }
}
