const stuffDataJson = {"s_da11d5d770": {"text": "# Merged Analysis\n\n## Technical Analysis\n\u003calpha_result>\n# Technical Analysis: Climate Change Report 2025\n\n---\n\n## Data Inventory & Classification\n\n| Metric | Value | Type | Confidence |\n|--------|-------|------|------------|\n| Temperature anomaly | +1.3\u00b0C above pre-industrial | Cumulative baseline comparison | Requires methodology scrutiny |\n| Arctic ice extent | Record low (September) | Relative ranking | Incomplete without absolute value |\n| Renewable energy share | 35% of electricity | Sectoral percentage | Well-defined scope |\n| YoY emissions change | -2% fossil fuels | Rate of change | Narrow scope |\n| Atmospheric CO2 | 425 ppm | Direct measurement | Most objectively verifiable |\n\n---\n\n## Critical Observations\n\n### Strengths in the Data\n- **CO2 at 425ppm** is a direct, physically measurable quantity with established monitoring infrastructure (Keeling Curve methodology)\n- **Renewable energy growth** (29%\u219235%) represents a **+6 percentage point increase**, which is notably large and warrants source verification\n- Temperature anomaly aligns with IPCC trajectory projections, lending plausibility\n\n### Identified Tensions & Contradictions\n**The central analytical problem:**\n> Fossil fuel emissions fell 2%, yet atmospheric CO2 *still reached a new high* (425ppm)\n\nThis is **internally consistent but requires explanation:**\n- CO2 accumulates; reduced *rate of emission* doesn't reduce concentration\n- Natural carbon sinks (oceans, forests) may be losing absorption capacity\n- A 2% reduction in emissions of ~37Gt CO2/year = ~740Mt reduction \u2014 insufficient to offset cumulative buildup\n- **This is arguably the most important signal in the dataset**\n\n---\n\n## Data Quality Concerns\n\n### What's Missing\n- **Arctic ice**: No absolute km\u00b2 figure given \u2014 \"record low\" is meaningless without the baseline record and measurement uncertainty\n- **Pre-industrial baseline definition**: \"Pre-industrial\" conventionally spans 1850\u20131900, but some models use 1750; this affects the 1.3\u00b0C figure meaningfully\n- **Renewable energy scope**: Does 35% include large hydro? Nuclear? Definitions vary significantly across reporting bodies\n- **Emissions -2%**: Fossil fuels only \u2014 does this exclude land use change, which contributes ~10-15% of total emissions?\n\n### Statistical Limitations\n- Single-year snapshot prevents trend confidence\n- No uncertainty intervals provided for any metric\n- September Arctic ice is a single-month measurement; annual average would be more robust\n\n---\n\n## Trend Synthesis\n\n```\nProgress indicators:          Warning indicators:\n\u2713 Renewables scaling          \u2717 CO2 still rising (425ppm)\n\u2713 Emissions declining         \u2717 1.3\u00b0C = 87% of Paris 1.5\u00b0C limit\n\u2713 Rate of change improving    \u2717 Arctic ice at record low\n                              \u2717 Emissions pace too slow\n```\n\n**Net assessment:** Directional improvement in human-controlled variables (energy systems, emissions rates) is **not yet sufficient** to halt deterioration in physical system outcomes (CO2 concentration, temperature, ice extent).\n\n---\n\n## Key Analytical Conclusions\n\n1. **The 2% emissions reduction is insufficient** \u2014 decarbonization models suggest ~7-10% annual reductions are needed to meet 1.5\u00b0C targets\n2. **Renewable growth is the strongest positive signal**, but electricity is only ~20% of total energy demand; the broader energy transition remains incomplete\n3. **Physical system indicators lag human-system improvements** by years to decades, meaning current measurements reflect past emissions trajectories\n4. **1.3\u00b0C leaves a 0.2\u00b0C margin to the Paris Agreement's primary threshold** \u2014 this is a critically narrow buffer given system inertia\n\n---\n\n## Recommended Follow-Up Questions\n- What is the absolute Arctic ice extent in km\u00b2?\n- Are land-use emissions included in the -2% figure?\n- What methodology defines \"pre-industrial\" for the temperature baseline?\n- Does renewable percentage use generation-weighted or capacity-weighted calculation?\n\u003c/alpha_result>\n\n## Related Context\n\u003cbeta_result>\nThe provided information confirms that global temperatures in 2025 were 1.3\u00b0C above pre-industrial levels[7], Arctic sea ice reached record-low extent in September[1][10], renewable energy provided 35% of global electricity[7], and carbon emissions from fossil fuels decreased 2% year-over-year while total atmospheric CO2 reached 425ppm[2][4].\n\nSources:\n- International \u201cState of the Climate\u201d report confirms several climate records in 2025 - NILU: https://nilu.com/2026/08/international-state-of-the-climate-report-confirms-several-climate-records-in-2025/\n  ## Record-high greenhouse gas concentrations  \nCarbon dioxide (CO2), methane, and nitrous oxide \u2014 Earth\u2019s major atmospheric greenhouse gases \u2014 once again reached record-high concentrations in 2025.  \nThe globally averaged CO2 level reached 425.6\u00b10.1 parts per million, a 53% increase from the preindustrial level of \\~278 ppm.  \nFossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\n## Rapidly changing atmosphere over the Arctic  \nThe Arctic atmosphere is changing rapidly as greenhouse gas concentrations rise and sea ice declines. Since 1958, the Arctic troposphere has warmed by around 0.3\u00b0C per decade, while the stratosphere has cooled at a similar rate \u2014 a fingerprint of human-caused CO\u2082 increases.  \nAnnual temperatures in the lower Arctic atmosphere were the second highest on record. The year was marked by strong seasonal contrasts, including record warmth in February and exceptional warmth across much of the atmosphere in October.  \n\u201cIn 2025 we also saw unusually low Arctic ozone levels and increased ultraviolet radiation in the spring, closely related to a strong polar vortex and atmospheric circulation,\u201d says senior scientist and UV expert Tove Svendby at NILU.  \nOverall, 2025 illustrates how long-term Arctic warming is interacting with large natural variations in atmospheric circulation, with consequences for temperatures, ozone and weather across the region.\n## Near-record warmth in the Arctic  \nThe Arctic had its second-warmest year in the 126-year record.  \nSurface air temperatures in the Arctic are increasing at roughly three times the global average rate. Precipitation is also increasing across the region. In response to the precipitation and temperature increases, tundra plants have been increasing; 2025 marked the third highest value in the record with respect to greenness, a measure of the increase in plants and productivity.  \nIn Arctic waters, maximum sea ice extent in 2025 was the lowest in the 47-year record, while minimum extent was the 11th lowest. The thickness of the sea ice, which is related to its age, has also been decreasing over time. Ice older than four years old is nearly absent, with only 95,000 square kilometers of older ice in September 2025 as compared to 1.5 million square kilometers in the 1980s.\n- State of the Global Climate 2025\u2014Trends and Key Impacts - Climate Adaptation Platform: https://climateadaptationplatform.com/state-of-the-global-climate-2025-trends-and-key-impacts/\n  The State of the Global Climate 2025 report, a flagship publication from the World Meteorological Organisation (WMO) published annually since 1993, warns of rapid climate change based on the latest data.  \nIt shows that key climate indicators such as greenhouse gas concentrations, global average temperatures, global mean sea level, ocean heat content, ocean pH, glacier mass balance, sea ice loss, and extreme weather have reached unprecedented or near-record levels.  \nThe report confirms that 2015-2025 were the hottest 11-year period on record, and that 2025 was the second- or third-hottest year on record, at about 1.43\u00b0C above the 1850-1900 average. Extreme events around the world, including intense heat, heavy rainfall and tropical cyclones, caused disruption and devastation, highlighting the vulnerability of our interconnected economies and societies.  \nThe big three greenhouse gases: carbon dioxide (CO2), Methane (CH4), and nitrous oxide (N2O) have reached record levels. Carbon dioxide reached 423.9 \u00b1 0.2 ppm, equivalent to 152% of pre-industrial levels; methane reached 1942 \u00b1 2 ppb, equivalent to 266% of pre-industrial levels; and nitrous oxide reached 338.0 \u00b1 0.1 ppb, equivalent to 25% of pre-industrial levels.  \nAs these GHGs trap more heat in the atmosphere, Earth\u2019s energy Imbalance (EEI) is changing. The EEI is the new climate indicator in this year\u2019s report. It notes that since the 1960s the earth\u2019s EEI has been growing, reaching a record high in 2025.\nAs trapped energy accumulates, it raises temperatures on land and in the ocean, leading to the melting of glaciers and ice sheets. However, temperatures are not rising evenly across the globe, nor are precipitation patterns. Greenland, northern Canada, western Europe, Fennoscandia, the Mediterranean and many parts of Asia experienced significant warm anomalies.  \nBetween 2024 and 2025, glacial mass loss was among the five worst on record since tracking began in 1950. Iceland and North America\u2019s experienced extreme glacier mass loss in 2025.  \nAs the Ocean absorbs the vast majority, or 90%, of the heat trapped in the planet, it raises its temperature, reaching record high levels in 2025, impacting the marine ecosystem, including coral reef bleaching.  \nRising ocean temperatures also contribute to sea level rise (SLR) worldwide. As ocean water warms, it expands, and warmer water contributes to the melting of sea ice, dumping more freshwater into the ocean. Both accelerate sea level rise. Satellite records show an increase in SLR from 2.65 mm per year between 1993-2011 to 4.75 mm per year between 2012-2025.\nAccess the full report: [State of the Global Climate 2025](https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025)  \nView the State of the Global Climate 2025 [Story Maps](https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d).  \n**Sources**  \nState of the Global Climate 2025. (23 March 2026). World Meteorological Organisation. Retrieved from [https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025](https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025)  \nState of the Climate 2025. (2026). World Meteorological Organisation. Retrieved from [https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d](https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d)\n- Climate crossroads: a decade after the Paris Agreement | MarketScreener Australia: https://au.marketscreener.com/news/climate-challenge-a-decade-after-paris-agreement-ce7e5dd8d98ef021\n  (Corrects wording in paragraphs 7-10 to clarify the Global Carbon Budget report contains projections for 2025, not for 2027)  \nFeb 16 (Reuters) - Ten years after the Paris Agreement took effect, newly released climate datasets show the world warming at an accelerating pace, with 2025 ranking among the three hottest years ever recorded, and sea-ice, ocean heat and sea levels crossing new thresholds.  \nEfforts to limit climate-damaging fossil fuels have not been enough and the world is on course to miss its climate goals. Data from some of the world's leading scientific agencies show global warming has sped up markedly since the mid-2010s.  \n**EMISSIONS: A WIDENING GAP**  \nThe World Meteorological Organization's Global Atmosphere Watch network shows concentrations of carbon dioxide, methane and nitrous oxide climbing to record highs, driving the temperature spike observed from 2023 to 2025, scientists say.  \nGlobal fossil fuel carbon dioxide emissions were projected to climb to a record 38.1 billion tonnes in 2025, driven by rising coal, oil and gas use despite rapid growth in renewable energy, according to the latest Global Carbon Budget report.  \nThe report - produced by an international team of more than 130 scientists - estimated global fossil fuel CO2 emissions would rise 1.1% in 2025, pushing atmospheric CO2 concentrations to roughly 52% above pre-industrial levels.\nResearchers warn there is only room for about 170 billion more tonnes of CO2 - equivalent to roughly four years of emissions at current rates - if the world wants to cap global warming at 1.5\u00b0 Celsius above the pre-industrial average.  \nRegional trends are mixed: emissions were projected to increase in 2025 in China, India, the United States and the European Union, while falling in Japan.  \n**TEMPERATURES: A DECADE OF ACCELERATION**  \nNASA's Goddard Institute for Space Studies said the Earth's surface in 2025 was 1.19\u00b0C above the 1951-1980 average, effectively tying with 2023 as one of the warmest years ever measured.  \nThe WMO's consolidated dataset places 2025 at 1.44\u00b0C above pre-industrial levels, ranking it among the top-three warmest years over the 176 years of recorded temperatures. \\[nasa.gov] \\[wmo.int] \\[berkeleyearth.org]  \n**ARCTIC: RAPID COLLAPSE OF SEA ICE**  \nThe U.S. National Oceanic and Atmospheric Administration's 2025 Arctic Report Card confirmed that October 2024-September 2025 was the warmest period since 1900, and the region continues to warm more than twice as fast as the global average.  \nSea-ice extent reached the lowest winter maximum ever recorded in March 2025, at about 14.47 million square kilometers, according to the U.S. National Ice Center.  \n**OCEANS: HEAT AND RISING SEAS**  \nThe oceans absorbed record amounts of heat in 2025, setting a new global high for upper-ocean heat content, according to NOAA and Berkeley Earth.\nSea levels, measured by tide gauges and satellites, continue to rise. The Intergovernmental Panel on Climate Change projects a 0.20-0.29 meter rise by 2050 relative to 1995-2014.  \n(Reporting by Canan Sevgili, Vera Dvorakova, Lucie Barbier and Alessandro Parodi; Editing by Simon Jessop and David Holmes)  \nBy Canan Sevgili\n- The Climate Numbers in 2026 Are Worse Than You Think | Kinja: https://kinja.com/science/climate-change-data-2026\n  Both poles experienced extreme conditions in 2025. Antarctica recorded its warmest annual temperature on record. The Arctic recorded its second warmest. December 2025 saw the lowest Arctic sea ice extent ever recorded for that month. Ocean heat content set a new record, with the increase from 2024 to 2025 alone (approximately 23 zettajoules) equaling roughly 39 times the total energy produced by all human activities on Earth in 2023. The oceans absorb over 90% of the excess heat trapped by greenhouse gases, which is why ocean heat content is, in many ways, a more telling indicator of the planet's energy imbalance than surface air temperature alone. The WMO's State of the Global Climate 2025 report, released in March 2026, found that the planet's energy imbalance (the gap between incoming solar energy and outgoing heat radiation) has never been larger.\n## The emissions picture: record highs despite record renewables  \nCarbon dioxide emissions from fossil fuels and cement production rose 1.1% in 2025, reaching a record 38.1 billion tons, according to the Global Carbon Project. CO2 concentrations in the atmosphere reached approximately 426 parts per million, about 53% above pre-industrial levels. The last time atmospheric CO2 was this high was during the mid-Pliocene epoch, 3 to 5 million years ago, when sea levels were 15 to 25 meters higher than today.  \nIn the United States, greenhouse gas emissions increased 2.4% in 2025, according to the Rhodium Group, reversing two prior years of decreases and breaking the decoupling of emissions from economic growth that had characterized 2023 and 2024.\nThe raw numbers seem contradictory: how can emissions keep rising when renewable energy is growing at record pace? The answer is that global electricity demand is growing faster than renewables can replace fossil fuels in many regions. Data centers (driven by the AI computing boom), electric vehicles (which reduce tailpipe emissions but increase grid demand), air conditioning in developing nations where temperatures are becoming dangerous, and industrial electrification are all driving demand higher. Global electricity demand is expected to grow by roughly 4% per year through 2030, according to the IEA, fueled in large part by the explosive growth of AI computing infrastructure. A single large data center can consume as much electricity as a small city. In the first half of 2025, global electricity demand grew 2.6%. Solar and wind met all of that new demand globally (solar alone covered 83% of the increase), but in the United States, clean sources didn't keep pace, so fossil generation actually increased. The U.S. is simultaneously building clean energy faster than ever and consuming more fossil energy than it was five years ago.  \nThis is the central tension: renewables are growing extraordinarily fast and still not fast enough. Clean energy investment reached over $2 trillion in 2025, double the 2020 level, but below the $5.6 trillion that's needed annually through 2030 to stay on track for climate targets.\n- 2025 was the third-warmest year on record, Copernicus data show | ECMWF: https://www.ecmwf.int/en/about/media-centre/news/2025/2025-third-warmest-year\n  The Global Climate Highlights report shows that 2025 was only marginally cooler than 2023, and that the past three years (2023\u20132025) have averaged more than 1.5\u00b0C above the pre-industrial level.\nFirstly, rising concentrations of greenhouse gases \u2013 mainly from human activities \u2013 in the atmosphere and secondly, exceptionally high sea-surface temperatures, associated with an El Ni\u00f1o event and other ocean variability factors. Additional factors include changes in the amounts of aerosols and low cloud and variations in atmospheric circulation. Monitoring by CAMS continues to support climate mitigation policies by tracking emissions and atmospheric concentrations.\nAtmospheric greenhouse gases have steadily increased over the last ten years. We will continue to track greenhouse gases, aerosols, and other atmospheric indicators to help decision makers understand the risks of continuing emissions and respond effectively, reinforcing synergies between air quality and climate policies.\nIn the Arctic, the monthly sea ice extent was the lowest on record for the time of year in January, February, March, and December, and the second lowest in June and October.\nECMWF Director-General Florian Pappenberger said: \u201cThis report confirms that Europe and the world are in the warmest decade on record and that the European Commission\u2019s investment in Copernicus continues to be critical. As an international organisation serving 35 nations, ECMWF provides the world-leading science for informed decisions to be made, and ultimately action taken, to adapt to climate change, because every year and every degree counts.\n- International \u201cState of the Climate\u201d report confirms record-high greenhouse gases, global sea level, and ocean heat in 2025: The report, published yearly in the\u00a0Bulletin of the American Meteorological Society, is a comprehensive \u201cannual physical\u201d of global climate #ClimateChange #aridification &#8211; Coyote Gulch: https://coyotegulch.blog/2026/08/12/\n  > **GLOBAL CLIMATE**\n>\n> The three main greenhouse gases that warm our atmosphere by trapping some of Earth\u2019s outgoing energy\u2014carbon dioxide, methane, and nitrous oxide\u2014all reached record-high levels in 2025. The average rate of carbon dioxide accumulation in the atmosphere increased from 0.6\u00b10.1 parts per million (ppm) per year in the early 1960s to 2.4 ppm per year during the decade of 2011\u201320. At the same time, fossil fuel emissions increased from 3.0\u00b10.2 petagrams of carbon per year in the 1960s to 9.8\u00b10.5 petagrams of carbon per year in the most recent 10-year period of 2015\u201324. Fossil fuel emissions in 2025 are estimated to be a record high of 10.3\u00b10.5 petagrams of carbon. One petagram is equal to more than 2.2 trillion pounds. The annual average global surface temperature for 2025 was among the three highest on record (since at least 1850). Only 2023 and 2024 were warmer, and both of those years were influenced by warm El Ni\u00f1o conditions in the eastern and central Pacific Ocean. In contrast, cool La Ni\u00f1a\u2013like conditions occurred at the beginning and end of 2025. A clear warming trend continued, with the last 11 years being the warmest 11 years on record. Also in 2025, high humidity heat extremes occurred with near-record frequency and intensity. These extremes can lead to dangerous heat-related illnesses. Above Earth\u2019s surface, temperatures in the lower troposphere were also elevated, with 2025 being the second-warmest year on record.\n>\n>\n> Increasing temperatures also impact the frozen landscape. Land-based glaciers around the world continued to lose ice for the 38th consecutive year, with each losing on average more than one-meter water equivalent\u2014the height of water that would result if the ice melted down to its liquid state\u2014for the fourth straight year. About 41% of the ice lost by glaciers since 1976 has occurred in just the last decade. Permafrost temperatures and active layer thickness\u2014the portion of ground that thaws and refreezes each year\u2014continued to increase in most locations, and many new records were set. During the winter of 2024/25, lakes in the Northern Hemisphere froze later, thawed earlier, and had shorter durations of ice cover than normal, with ice durations 15 days shorter on average compared to the 1991\u20132020 average.\n>\n>\n> The Iberian Peninsula had unprecedented fire activity, which drove a record for overall fire emissions in Europe. Nevertheless, at the global scale, 2025 had the lowest overall fire activity in the 23-year record, driven by low activity in South America and Africa. On average, the land surface continued to darken during 2025, driven by wildfires, heatwaves, and low snow cover, all of which are associated with the continued above-average temperatures.\n>\n> The darker the surface, the more sunlight is absorbed, which creates localized heating. The persistent warmer-than-average conditions also affected plant growth, with early start-of-season dates\u2014the time of year when trees and plants begin to bud\u2014including the earliest on record for the United Kingdom.\n- 2025 in Review: Global Temperatures | Climate Central: https://www.climatecentral.org/climate-matters/2025-in-review-global-temperatures\n  Global average temperatures in 2025 were 1.3\u00b0C (2.4\u00b0F) above pre-industrial (1850-1900) levels. Recent records are part of a larger trend of rapid warming due to heat-trapping pollution from burning fossil fuels (coal, oil, and gas) for ...\nEach of these years is part of a larger trend of rapid warming since the Industrial Revolution kicked off a surge in heat-trapping pollution from burning fossil fuels (coal, oil, and gas) for electricity, heating and cooling, transportation, industry, and more. As a result of burning fossil fuels, levels of heat-trapping CO2 in the atmosphere have surged to levels not seen in at least the last 800,000 years of Earth\u2019s history.\nThe latest global data underscores the urgent need to accelerate the transition away from planet-warming fossil fuels. Most of the world is progressing rapidly in this direction. Globally, 70% of the increase in electricity demand in 2024 was met with renewable energy like wind and solar.\nThis Climate Matters analysis is based on open-access data from the National Oceanic and Atmospheric Administration (NOAA). See Methodology for details. Click the downloadable graphic: Global Temperatures 1850-2025 \u00b7 Heat-trapping pollution from fossil fuels continued to drive global warming to near-record levels in 2025. According to the latest NOAA data, 2025 was Earth\u2019s third-warmest year since records began in 1850. Global average temperatures in 2025 were 1.3\u00b0C (2.4\u00b0F) above pre-industrial (1850-1900) levels.\nGlobal average temperatures in 2025 were 1.3\u00b0C (2.4\u00b0F) above pre-industrial (1850-1900) levels. Recent records are part of a larger trend of rapid warming due to heat-trapping pollution from burning fossil fuels (coal, oil, and gas) for electricity, heating and cooling, transportation, and more.\n- 2025 set to be second or third warmest year on record, continuing exceptionally high warming trend: https://wmo.int/news/media-centre/2025-set-be-second-or-third-warmest-year-record-continuing-exceptionally-high-warming-trend\n  Arctic sea ice extent after the winter freeze was the lowest on record, and Antarctic sea ice extent tracked well below average throughout the year. The long-term sea level rise trend continued despite a small and temporary blip due to naturally ...\nThis is equivalent to 1.2 mm of global mean sea-level rise and nominally the largest loss of ice on record back to 1950. Concentrations of the three key greenhouse gases in the atmosphere \u2013 carbon dioxide, methane and nitrous oxide \u2013 reached record-high observed levels in 2024, the most recent year for which there are global consolidated figures. Measurements to date from individual locations suggest that they will be even higher in 2025. The atmospheric concentration of CO2 has increased from around 278 parts per million (ppm) in 1750 to 423.9 ppm in 2024, an increase of 53%. The increase in concentration from 2023 to 2024 was 3.5 ppm, a record increase in the recent observational history.\nArctic sea ice extent after the winter freeze was the lowest on record, and Antarctic sea ice extent tracked well below average throughout the year. The long-term sea level rise trend continued despite a small and temporary blip due to naturally occurring factors, said the report. Weather and climate-related extreme events to August 2025 \u2013 ranging from devastating rainfall and flooding to brutal heat and wildfires - had cascading impacts on lives, livelihoods and food systems.\nNearly two thirds of NMHSs now provide some form of climate services \u2013 varying from essential to advanced level \u2013 compared to approximately 35% just five years ago. As climate-related drivers shape renewable energy supply and demand, it is essential to anticipate these influences to build reliable and flexible clean energy systems.\nArctic sea-ice extent reached its annual maximum of 13.8 million km2 in March, the lowest maximum extent in the satellite record.\n- Progress of Global Climate Change, Dashboard, Data, Insights | Climate Change Tracker: https://climatechangetracker.org/climate-change-progress\n  # Progress of Global Climate Change 2025  \n**Read key messages**\n## Key Messages  \n- **Temperatures:**For 2025, the human-caused warming was 1.38\u00b0C, and the observed global average temperature was 1.39\u00b0C, dropping from 1.5\u00b0C in 2024, which was driven by El Ni\u00f1o and warmer-than-average North Atlantic waters. Human-caused warming has increased at a rate of around 0.27\u00b0C per decade (2016-2025) and remains at its all-time high.\n- **Paris Agreement:**Reaching 1.5\u00b0C global warming on a long-term basis is inevitable in around four years if we don't take the immediate, transformative action needed to reduce emissions from fossil fuels and deforestation to net zero.\n- **Greenhouse Gas Emissions:**In 2025, CO2 emissions from fossil fuels continue a rising trend to an all-time high of 38.1 gigatonnes. Emissions from land-use drop slightly to 4.1 gigatonnes. Data for other greenhouse gases will be available later this year.\n- **Carbon Budget:**The remaining carbon budget for a 50% likelihood to stay under 1.5 \u00b0C of global warming is only around 130 gigatonnes, around 3 years' worth of current emissions.\n- **Sea Level Rise:**Since the start of the 20th century, global sea levels have risen by approximately 23 cm. Between 2015 and 2025, the level rose by about 3.5 cm \u2014 an average rate of \\~3.5 mm per year.\n- **Immediate Transformative Action Required:**To achieve net zero and to stabilize temperatures, the pace and scale of climate action globally must match the rate and scale of the climate challenge.\n- **To stop warming around 1.5 \u00b0C**we must yearly reduce CO2emissions by 6 Gigatonnes (or 8 Gigatonnes of CO2equivalent) and reach net zero in around 6 years \u2014 by 2032.\n- **To stop warming around 1.7 \u00b0C**we will have to reduce emissions yearly by 1.6 Gigatonnes of CO2(or 2.1 Gigatonnes of CO2equivalent) and reach net zero in 24 years \u2014 by 2050.\n- Last full year of assessment 2025.\n- [Close Key Messages](#key-messages)\n- Report confirms record-high greenhouse gases, global sea level and ocean heat in 2025: https://phys.org/news/2026-08-high-greenhouse-gases-global-sea.html\n  In 2025, atmospheric CO2 reached 425.6 ppm, while ocean heat content and global mean sea level set records. Global temperature ranked among the three highest despite no El Ni\u00f1o, and Arctic and Antarctic warmth, glacier loss, and low sea ice ...\nCarbon dioxide (CO2), methane and nitrous oxide\u2014Earth's major atmospheric greenhouse gases\u2014once again reached record-high concentrations in 2025. The globally averaged CO2 level reached 425.6\u00b10.1 parts per million, a 53% increase from the preindustrial level of ~278 parts per million. Fossil fuel emissions were also at a record high in 2025, estimated at 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\nIn 2025, atmospheric CO2 reached 425.6 ppm, while ocean heat content and global mean sea level set records. Global temperature ranked among the three highest despite no El Ni\u00f1o, and Arctic and Antarctic warmth, glacier loss, and low sea ice persisted.\nIn response to the precipitation and temperature increases, tundra plants have been increasing; 2025 marked the third-highest value in the record with respect to greenness, a measure of the increase in plants and productivity. In Arctic waters, maximum sea ice extent in 2025 was the lowest in the 47-year record, while minimum extent was the 11th-lowest.\nGlobal mean concentrations of atmospheric carbon dioxide, methane, and nitrous oxide all hit record highs in 2025. Credit: Climate.us, using data from the State of the Climate in 2025\n- State of the Global Climate 2025 - World | ReliefWeb: https://reliefweb.int/report/world/state-global-climate-2025\n  The ocean continues to warm and absorb carbon dioxide. It has been absorbing the equivalent of about eighteen times the annual human energy use each year for the past two decades. Annual sea ice extent in the Arctic was at or near a record low, Antarctic sea ice extent was the third lowest on record, and glacier melt continued unabated, according to the report.  \n\u201cThe State of the Global Climate is in a state of emergency. Planet Earth is being pushed beyond its limits. Every key climate indicator is flashing red,\u201d said UN Secretary-General Ant\u00f3nio Guterres.  \n\u201cHumanity has just endured the eleven hottest years on record. When history repeats itself eleven times, it is no longer a coincidence. It is a call to act,\u201d said Mr Guterres.  \nAnnual global mean temperature anomalies relative to a pre-industrial (1850\u20131900) baseline. Data are from the datasets indicated in the legend.  \nWMO\u2019s flagship State of the Global Climate report was released on [World Meteorological Day](https://wmo.int/site/world-meteorological-day-2026-23-march) on 23 March, which has the theme Observing Today, Protecting Tomorrow.  \nFor the first time, the report includes the Earth\u2019s energy imbalance as one of the key climate indicators.  \nThe Earth\u2019s energy balance measures the rate at which energy enters and leaves the Earth system. Under a stable climate, incoming energy from the sun is about the same as the amount of outgoing energy.\nAnother 3% of the excess energy warms and melts ice. The ice sheets on Antarctica and Greenland have both lost significant mass and the annual average Arctic sea-ice extent for 2025 was the lowest or second lowest on record in the satellite era. Exceptional glacier mass loss occurred in Iceland and along the Pacific coast of North America in 2025.  \nThe warming ocean and melting ice are driving the long-term rise in global mean sea level, which has accelerated since satellite measurements began in 1993.  \nOcean warming and sea level rise will continue for centuries, according to projections by the Intergovernmental Panel on Climate Change (IPCC). Changes in ocean warming, and deep ocean pH are irreversible on centennial to millennial time scales.  \nThe report is accompanied by an interactive story map. It has a dedicated supplement on extreme events, highlighting their cascading impacts, including on food insecurity and displacement.  \nIt includes a chapter on climate and health, showing how rising temperatures, shifting rainfall patterns and changes in extremes are affecting where and when health risks emerge, how severe they become and who is most exposed.  \nIt highlights the examples of the mosquito-borne dengue disease and of heat stress \u2013 and illustrates how climate data, early warning systems and integrated climate services for health can protect people in a warming world.\n## Key Indicators  \n### Greenhouse Gases  \nData from individual monitoring stations show that levels of three main greenhouse gases \u2013 carbon dioxide, methane and nitrous oxide \u2013 continued to increase in 2025.  \nIn 2024 \u2013 the last year for which we have consolidated global observations - the atmospheric concentration of carbon dioxide reached its highest level in the last 2 million years, and methane and nitrous oxide in at least last 800 000 years.  \nThe increase in the annual carbon dioxide concentration (CO2) in 2024 was the largest annual increase since modern measurements began in 1957. This was driven by continued fossil CO2 emissions, and reduced effectiveness of land and ocean carbon sinks.\n- 2025 was Earth's 3rd-warmest year on record \u00bb Yale Climate Connections: https://yaleclimateconnections.org/2026/01/2025-was-earths-3rd-warmest-year-on-record/\n  The 1.1% annual increase is roughly ... 2024. Some highlights from the report: The concentration of CO2 in the atmosphere in 2025 was near 426 ppm \u2014 about 53% above pre-industrial levels....\nCarbon dioxide emissions from fossil fuels and cement production rose by around 1.1% in 2025, reaching a record 38.1 billion tons of carbon dioxide, according to the 2025 Global Carbon Budget report by the Global Carbon Project, released November 13. The 1.1% annual increase is roughly on par with the 0.9% average annual increase during the 2010s and higher than the 0.8% growth in 2024. Some highlights from the report: The concentration of CO2 in the atmosphere in 2025 was near 426 ppm \u2014 about 53% above pre-industrial levels.\nThe projected rise in fossil CO2 emissions in 2025 was driven by all fuel types: coal +0.8%, oil +1%, natural gas +1.3%. The projected emissions for 2025 increased by 6.8% for international aviation (exceeding pre-COVID levels) but remained flat for international shipping. Atmospheric CO2 concentrations increased by about 2.3 ppm in 2025, down from the record-high increase of 3.7 ppm observed in 2024.\nArctic sea ice extent during December 2025 was the lowest in the 47-year satellite record, according to the National Snow and Ice Data Center.\nFor the year, the average sea ice extent and sea ice volume in the Arctic hit a record low, according to Zack Labe (see Bluesky post below).\n- State of the Climate Update for COP30: https://wmo.int/resources/publication-series/state-of-climate-update-cop/state-of-climate-update-cop30\n  Concentrations of heat-trapping greenhouse gases and ocean heat content, which both reached record levels in 2024, continued to rise in 2025. Arctic sea ice extent after the winter freeze was the lowest on record, and Antarctic sea ice extent tracked well below average throughout the year.\nThe alarming streak of exceptional temperatures continued in 2025, which is set to be either the second or third warmest year on record, according to the State of the Global Climate Update from the World Meteorological Organization (WMO). The World Meteorological Organization's State of the Climate Update for COP30 reveals that the past 11 years (2015-2025) are set to be the warmest on record, with each year surpassing previous temperature highs.\nConcentrations of heat-trapping greenhouse gases and ocean heat content, which both reached record levels in 2024, continued to rise in 2025. Arctic sea ice extent after the winter freeze was the lowest on record, and Antarctic sea ice extent tracked well below average throughout the year.\nThe global mean temperature for January-August 2025 was 1.42 \u00b0C \u2021 0.12 \u00b0C above pre-industrial levels, underscoring the accelerating pace of climate change.\n- World Climate Report 2025: Urgent Action Needed to Combat Rising Temperatures: https://www.downtoearth.org.in/climate-change/the-latest-world-climate-report-is-grim-but-its-not-the-end-of-the-story\n  sea ice extent, a measure of how much ocean is covered by at least some sea ice, is at or close to record low levels in the Arctic. Meanwhile, the amount of ice gy use each year for the past two decades. Annual sea ice extent in the Arctic was at or near a record low, Antarctic sea ice extent was the third lowest on record, and glacier melt continued unabated, according to the report.\nWMO\u2019s State of the Global Climate report 2025 confirms that 2015-2025 are the hottest 11-years on record, and that 2025 was the second or third hottest year on record, at about 1.43 \u00b0C above the 1850-1900 average. Extreme events around the world, including intense heat, heavy rainfall and tropical cyclones, caused disruption and devastation and highlighted the vulnerability of our inter-connected economies and societies.The ocean continues to warm and absorb carbon dioxide.\nThe ocean continues to warm and absorb carbon dioxide. It has been absorbing the equivalent of about eighteen times the annual human energy use each year for the past two decades. Annual sea ice extent in the Arctic was at or near a record low, Antarctic sea ice extent was the third lowest on record, and glacier melt continued unabated, according to the report.\n- International \"State of the Climate\" report confirms record-high greenhouse gases, global sea level, and ocean heat in 2025 - American Meteorological Society: https://www.ametsoc.org/ams/about-ams/news/news-releases/international-state-of-the-climate-report-confirms-record-high-greenhouse-gases-global-sea-level-and-ocean-heat-in-2025/\n  Fossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\nCarbon dioxide (CO2), methane, and nitrous oxide?\u2014Earth\u2019s major atmospheric greenhouse gases?\u2014once again reached record-high concentrations in 2025. The globally averaged CO2 level reached 425.6\u00b10.1 parts per million, a 53% increase from the preindustrial level of ~278 parts per million. Fossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\nIn response to the precipitation and temperature increases, tundra plants have been increasing; 2025 marked the third-highest value in the record with respect to greenness, a measure of the increase in plants and productivity. In Arctic waters, maximum sea ice extent in 2025 was the lowest in the 47-year record, while minimum extent was the 11th lowest.\nThe global ocean heat content, measured from the ocean\u2019s surface to a depth of 2000 meters, continued to increase, and reached new record highs in 2025. Global mean sea level was a record high for the 14th consecutive year, reaching about 111.2 millimeters above the average for 1993, when satellite altimetry measurements began. Warming oceans have contributed an average of 1.6\u00b10.3 millimeters per year to rising sea levels since 2005, while melt from ice sheets and glaciers has contributed an average of 2.0\u00b10.4 millimeters during that same period. The Arctic saw near-record warmth.\nSurrounding the continent, sea ice remained below average in 2025, following a nearly decade-long trend. Annual daily maxima and minima of sea ice extent were the third and fourth lowest on record, respectively.\n- Copernicus: 2025 was the third hottest year on record | Copernicus: https://climate.copernicus.eu/copernicus-2025-was-third-hottest-year-record\n  Copernicus data show that 2025 was the third warmest year on record, only marginally (0.01\u00b0C) cooler than 2023, and 0.13\u00b0C cooler than 2024 \u2013 the warmest year on record. The past 11 years have been the 11 warmest on record. Global temperatures from the past three years (2023-2025) averaged ...\nCopernicus data show that 2025 was the third warmest year on record, only marginally (0.01\u00b0C) cooler than 2023, and 0.13\u00b0C cooler than 2024 \u2013 the warmest year on record. The past 11 years have been the 11 warmest on record. Global temperatures from the past three years (2023-2025) averaged more than 1.5\u00b0C above the pre-industrial level (1850\u20131900).\nThe first is the build-up of greenhouse gases in the atmosphere, from continued emissions and reduced uptake of carbon dioxide by natural sinks. Secondly, sea-surface temperatures reached exceptionally high levels across the ocean, associated with an El Ni\u00f1o event and other ocean variability factors, amplified by climate change.\nAir temperature over global land areas was second warmest, whilst the Antarctic saw its warmest annual temperature on record and the Arctic its 2nd warmest. The findings are released today by the European Centre for Medium-Range Weather Forecasts (ECMWF), which operates the Copernicus Climate Change Service (C3S) and Copernicus Atmosphere Monitoring Service (CAMS) on behalf of the European Commission.\nCarlo Buontempo, Director of the Copernicus Climate Change Service \u00b7 Rising concentrations of greenhouse gases in the atmosphere5 \u2013 mainly a direct consequence of human activities \u2013 are the primary driver of the observed long-term increase in the global mean temperature. Monitoring of greenhouse gas emissions and concentrations by the Copernicus Atmosphere Monitoring Service (CAMS) provides information to support the implementation of climate mitigation policies.\n- State of the climate: 2025 in top-three hottest years on record as ocean heat surges - Carbon Brief: https://www.carbonbrief.org/state-of-the-climate-2025-in-top-three-hottest-years-on-record-as-ocean-heat-surges/\n  Cumulative ice loss from Greenland in billion metric tonnes (gigatonnes) between 1970 and 2025 from Mankoff et al 2021. Chart by Carbon Brief. Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, ...\nHeating of the atmosphere: It was the second warmest year in the lower troposphere \u2013 the lowest part of the atmosphere. Sea level rise: Sea levels reached record highs, continuing a notable acceleration over the past three decades. Shrinking glaciers and ice sheets: Cumulative ice loss from the world\u2019s glaciers and from the Greenland ice sheet reached a new record high in 2025, contributing to sea level rise. Greenhouse gases: Concentrations reached record levels for carbon dioxide (CO2), methane and nitrous oxide. Sea ice extent: Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, while Antarctic sea ice saw its third-lowest minimum extent.\nGreenhouse gas concentrations reached a new high in 2025, driven by human-caused emissions from fossil fuels, land use and agriculture. Three greenhouse gases \u2013 CO2, methane (CH4) and nitrous oxide (N2O) \u2013 are responsible for the bulk of additional heat trapped by human activities. CO2 is by far the largest factor, accounting for roughly 42% of the increase in global surface temperatures since the pre-industrial era (1850-1900).\nMethane accounts for 28%, while nitrous oxide accounts for around 5%. The remaining 25% comes from other factors including carbon monoxide, black carbon and halocarbons, such as chlorofluorocarbons (CFCs). Human emissions of greenhouse gases have increased atmospheric concentrations of CO2, methane and nitrous oxide to their highest levels in at least a few million years \u2013 if not longer. The figure below shows concentrations of these greenhouse gases \u2013 in parts per million (ppm) for CO2 and parts per billion (ppb) for methane and nitrous oxide \u2013 from the early 1980s through to October 2025 for CO2 and September 2025 for CH4 and N2O (the most recent data currently available).\nCumulative ice loss from Greenland in billion metric tonnes (gigatonnes) between 1970 and 2025 from Mankoff et al 2021. Chart by Carbon Brief. Arctic sea ice saw its lowest winter peak on record as well as its 10th-lowest summer minimum extent, while Antarctic sea ice saw its third-lowest minimum extent.\n- Extremes Define State of Climate 2025 as Records Fall Worldwide - Climate Adaptation Platform: https://climateadaptationplatform.com/extremes-define-state-of-climate-2025-as-records-fall-worldwide/\n  Emissions of the planet\u2019s major greenhouse gases\u2014carbon dioxide, methane, and nitrous oxide\u2014 continue to rise to record levels. CO2 atmospheric concentration reached 425.6\u00b10.1 ppm in 2025, up 2.9 ppm from 2024, contributing to a cumulative ...\nAtmospheric carbon dioxide reached 425.6 parts per million in 2025, 53% above pre-industrial levels, while ocean heat and global sea level also set new records. The ocean has now broken its previous heat record for several years in a row. Emissions of the planet\u2019s major greenhouse gases\u2014carbon dioxide, methane, and nitrous oxide\u2014 continue to rise to record levels. CO2 atmospheric concentration reached 425.6\u00b10.1 ppm in 2025, up 2.9 ppm from 2024, contributing to a cumulative 53% increase from the pre-industrial level of ~278 ppm.\nThe Arctic is also experiencing increased greenness; 2025 is the third-highest year for plant growth, while the Greenland Ice Sheet lost an estimated 129\u00b150 Gigatons of ice overall for the year. Sea ice extent and thickness in the Arctic are also declining, while older ice is disappearing.\nThe sequence of the State of the Climate in 2025 is similar to previous years: Chapter 1\u2014Introduction (i.e., this chapter); Chapter 2\u2014Global Climate; Chapter 3\u2014Global Oceans; Chapter 4\u2014The Tropics; Chapter 5\u2014The Arctic; Chapter 6\u2014Antarctica and the Southern Ocean; and Chapter 7\u2014Regional Climates, which covers the seven regions of North America, Central America and the Caribbean, South America, Africa, Europe and the Middle East, Asia, and Oceania.\nAbout 41% of the loss glaciers have experienced since 1976 has occurred in the last decade. Lakes in the Northern Hemisphere have also shown later ice formation and earlier ice breakup, with ice durations 15.0 days shorter on average than the 1991\u20132020 mean.\n- Analysis: Fossil-fuel CO2 emissions to set new record in 2025, as land sink \u2018recovers\u2019 | News | Eco-Business | Asia Pacific: https://www.eco-business.com/news/analysis-fossil-fuel-co2-emissions-to-set-new-record-in-2025-as-land-sink-recovers/\n  - Global CO2 emissions from land-use change are expected to decrease by nearly 10 per cent in 2025, driven by[reductions in deforestation](https://www.carbonbrief.org/un-report-five-charts-showing-how-global-deforestation-is-declining/)and forest degradation in South America.\n- Total CO2 emissions \u2013 fossil and land use \u2013 have grown more slowly over the past decade (0.3 per cent per year on average) compared to the previous decade (1.9 per cent per year).\n- The remaining carbon budget to limit global warming to 1.5\u00b0C is virtually exhausted and is equivalent to only four years of current emissions. Carbon budgets to limit warming to 1.7**\u00b0**C and 2\u00b0C would similarly be used up in 12 and 25 years, respectively.\n- The concentration of CO2 in the atmosphere is set to reach 425.7 parts per million (ppm) in 2025, 2.3ppm above 2023 and 52 per cent above pre-industrial levels.\n#### Global emissions remain flat  \nThe[Global Carbon Budget](https://www.globalcarbonproject.org/carbonbudget/)(GCB) finds that total global CO2 emissions in 2025 \u2013including those from fossil fuels and land use \u2013are projected to remain approximately flat at 42.2GtCO2, falling by a negligible -0.04 per cent compared to last year.  \nThis means 2025 is effectively tied with 2024 as the highest global CO2 emissions on record.  \nFlat total CO2 emissions in 2025 reflect a combination of continued rising emissions from fossil fuel and industry and declining emissions from land-use change. Fossil CO2 emissions rose 1.1 per cent to 38.1GtCO2, while land-use emissions declined by -9.8 per cent to 4.1GtCO2 (albeit with large uncertainties).  \nThe figure below shows the 2025 global CO2 emissions update (red solid line) alongside 2024 (dark blue dotted), 2023 (mid blue dotted)[2022](https://www.carbonbrief.org/guest-post-what-the-tiny-remaining-1-5c-carbon-budget-means-for-climate-policy/)(light blue dotted), 2021 (light grey dotted) and 2020 (dark grey dotted). The shaded area indicates the uncertainty around the new 2025 budget.  \n(Each year, the GCB is updated to include the latest data as well as improvements to modelling sources and sinks, resulting in some year-to-year revisions to the historical record.)\n(The carbon budget is the total amount of CO2 that scientists estimate can be emitted if warming is to be kept below a particular temperature threshold. Earlier this year, the Indicators of Global Climate Change report estimated the remaining carbon budget had[declined by three-quarters](https://www.carbonbrief.org/guest-post-why-2024s-global-temperatures-were-unprecedented-but-not-surprising/)between the start of 2020 and the start of 2025.)  \nWith human-caused global warming sitting at around[1.36**\u00b0**C above pre-industrial levels](https://www.carbonbrief.org/guest-post-why-2024s-global-temperatures-were-unprecedented-but-not-surprising/)in 2024, the remaining budget for 1.5\u00b0C is 170GtCO2, equivalent to four years of current emissions.  \nThe GCB report finds that the remaining carbon budgets to limit warming to 1.7**\u00b0**C and 2\u00b0C have been reduced to 525GtCO2 (12 years at current emissions levels) and 1,055GtCO2 (25 years), respectively.  \nGlobal fossil CO2 emissions also grew more slowly in the past decade (0.8 per cent per year) compared to the previous decade (2.1 per cent). This was driven by the continued decarbonisation of energy systems \u2013 including a shift from burning coal to gas and replacing fossil fuels with renewables \u2013 as well as slightly weaker global economic growth during the past decade.\n\u003c/beta_result>\n\n## Risk Assessment\n\u003cgamma_result>\n# Climate Risk Assessment: 2025 Data Analysis\n\n## Summary of Key Indicators\n\n| Metric | Value | Benchmark | Status |\n|--------|-------|-----------|--------|\n| Temperature Rise | +1.3\u00b0C | 1.5\u00b0C Paris limit | \u26a0\ufe0f Warning |\n| Arctic Ice Extent | Record Low | Historical baseline | \ud83d\udd34 Critical |\n| Renewable Energy Share | 35% | 100% needed by ~2050 | \u26a0\ufe0f Progressing |\n| CO2 Emissions Change | -2% YoY | -7-10%/year needed | \ud83d\udd34 Insufficient |\n| Atmospheric CO2 | 425 ppm | 350 ppm safe threshold | \ud83d\udd34 Critical |\n\n---\n\n## Risk Categories\n\n### \ud83d\udd34 HIGH RISK\n\n**Atmospheric CO2 (425 ppm)**\n- Exceeds the widely cited 350 ppm safe boundary by 21%\n- Represents a **committed warming trajectory** regardless of near-term action\n- Risk: Continued warming even if emissions stopped today\n\n**Arctic Ice Loss**\n- Record lows accelerate albedo feedback loops\n- Risk: Self-reinforcing warming cycle becomes harder to interrupt\n- Secondary risks: Sea level rise, disrupted weather patterns, ecosystem collapse\n\n**Emissions Reduction Rate**\n- 2% annual reduction vs. 7-10% needed per IPCC pathways\n- Risk: Paris Agreement targets become mathematically unreachable\n- Current pace suggests **significant overshoot** of 1.5\u00b0C and possibly 2\u00b0C\n\n---\n\n### \u26a0\ufe0f MODERATE RISK / CAUTIONARY\n\n**Temperature at 1.3\u00b0C**\n- Only **0.2\u00b0C margin** remaining before the 1.5\u00b0C threshold\n- At current trajectory, 1.5\u00b0C likely crossed **within 5-10 years**\n- Risk: Tipping points may activate before targets are met\n\n**Renewable Energy Growth**\n- Positive trajectory (+6 percentage points in 2 years)\n- However, absolute speed remains insufficient\n- Risk: Growth may not offset rising global energy demand\n\n---\n\n## Key Risk Interactions\n\n```\nRecord Arctic Melt \u2192 Albedo Loss \u2192 Accelerated Warming\n        \u2193\nCO2 at 425ppm \u2192 Committed warming \u2192 Harder emissions targets\n        \u2193\n2% reduction rate \u2192 Gap widens \u2192 1.5\u00b0C threshold approached rapidly\n```\n\nThe risks are **compounding and non-linear**, meaning individual metrics understate the combined trajectory.\n\n---\n\n## Critical Uncertainties\n\n- **Tipping points** (permafrost methane release, ice sheet collapse) could dramatically accelerate timelines\n- Renewable growth rate may **accelerate non-linearly** as costs fall\n- The 2% emissions reduction may reflect **structural change or temporary factors** \u2014 trend confirmation needed\n- Demand-side growth could **negate supply-side gains** in renewables\n\n---\n\n## Overall Risk Rating\n\n> ### \ud83d\udd34 HIGH \u2014 Trajectory Concerning Despite Partial Progress\n\n**Rationale:** Positive signals (renewable growth, modest emissions reduction) exist but are materially insufficient relative to the scale and speed of change already embedded in the climate system. The margin for error before irreversible thresholds are crossed is narrow and shrinking.\n\n---\n\n*Note: This assessment is based solely on the provided data points. A complete assessment would incorporate regional breakdowns, socioeconomic vulnerability, and ecosystem-specific analysis.*\n\u003c/gamma_result>\n\n## Visualization\n![Data visualization](pipelex-storage://5ebbc30c-37c6-4779-8155-792733ec78e7/generated/98866fcb0bf8144c.png)"}, "s_3bd5a62c83": {"text": "Climate change report 2025: Global temperatures rose 1.3\u00b0C above pre-industrial levels. Arctic ice reached record low extent in September. Renewable energy now provides 35% of global electricity, up from 29% in 2023. Carbon emissions from fossil fuels decreased 2% year-over-year, but total atmospheric CO2 reached 425ppm."}, "s_7f5e4eb486": {"text": "# Technical Analysis: Climate Change Report 2025\n\n---\n\n## Data Inventory & Classification\n\n| Metric | Value | Type | Confidence |\n|--------|-------|------|------------|\n| Temperature anomaly | +1.3\u00b0C above pre-industrial | Cumulative baseline comparison | Requires methodology scrutiny |\n| Arctic ice extent | Record low (September) | Relative ranking | Incomplete without absolute value |\n| Renewable energy share | 35% of electricity | Sectoral percentage | Well-defined scope |\n| YoY emissions change | -2% fossil fuels | Rate of change | Narrow scope |\n| Atmospheric CO2 | 425 ppm | Direct measurement | Most objectively verifiable |\n\n---\n\n## Critical Observations\n\n### Strengths in the Data\n- **CO2 at 425ppm** is a direct, physically measurable quantity with established monitoring infrastructure (Keeling Curve methodology)\n- **Renewable energy growth** (29%\u219235%) represents a **+6 percentage point increase**, which is notably large and warrants source verification\n- Temperature anomaly aligns with IPCC trajectory projections, lending plausibility\n\n### Identified Tensions & Contradictions\n**The central analytical problem:**\n> Fossil fuel emissions fell 2%, yet atmospheric CO2 *still reached a new high* (425ppm)\n\nThis is **internally consistent but requires explanation:**\n- CO2 accumulates; reduced *rate of emission* doesn't reduce concentration\n- Natural carbon sinks (oceans, forests) may be losing absorption capacity\n- A 2% reduction in emissions of ~37Gt CO2/year = ~740Mt reduction \u2014 insufficient to offset cumulative buildup\n- **This is arguably the most important signal in the dataset**\n\n---\n\n## Data Quality Concerns\n\n### What's Missing\n- **Arctic ice**: No absolute km\u00b2 figure given \u2014 \"record low\" is meaningless without the baseline record and measurement uncertainty\n- **Pre-industrial baseline definition**: \"Pre-industrial\" conventionally spans 1850\u20131900, but some models use 1750; this affects the 1.3\u00b0C figure meaningfully\n- **Renewable energy scope**: Does 35% include large hydro? Nuclear? Definitions vary significantly across reporting bodies\n- **Emissions -2%**: Fossil fuels only \u2014 does this exclude land use change, which contributes ~10-15% of total emissions?\n\n### Statistical Limitations\n- Single-year snapshot prevents trend confidence\n- No uncertainty intervals provided for any metric\n- September Arctic ice is a single-month measurement; annual average would be more robust\n\n---\n\n## Trend Synthesis\n\n```\nProgress indicators:          Warning indicators:\n\u2713 Renewables scaling          \u2717 CO2 still rising (425ppm)\n\u2713 Emissions declining         \u2717 1.3\u00b0C = 87% of Paris 1.5\u00b0C limit\n\u2713 Rate of change improving    \u2717 Arctic ice at record low\n                              \u2717 Emissions pace too slow\n```\n\n**Net assessment:** Directional improvement in human-controlled variables (energy systems, emissions rates) is **not yet sufficient** to halt deterioration in physical system outcomes (CO2 concentration, temperature, ice extent).\n\n---\n\n## Key Analytical Conclusions\n\n1. **The 2% emissions reduction is insufficient** \u2014 decarbonization models suggest ~7-10% annual reductions are needed to meet 1.5\u00b0C targets\n2. **Renewable growth is the strongest positive signal**, but electricity is only ~20% of total energy demand; the broader energy transition remains incomplete\n3. **Physical system indicators lag human-system improvements** by years to decades, meaning current measurements reflect past emissions trajectories\n4. **1.3\u00b0C leaves a 0.2\u00b0C margin to the Paris Agreement's primary threshold** \u2014 this is a critically narrow buffer given system inertia\n\n---\n\n## Recommended Follow-Up Questions\n- What is the absolute Arctic ice extent in km\u00b2?\n- Are land-use emissions included in the -2% figure?\n- What methodology defines \"pre-industrial\" for the temperature baseline?\n- Does renewable percentage use generation-weighted or capacity-weighted calculation?"}, "s_08c8f3736c": {"answer": "The provided information confirms that global temperatures in 2025 were 1.3\u00b0C above pre-industrial levels[7], Arctic sea ice reached record-low extent in September[1][10], renewable energy provided 35% of global electricity[7], and carbon emissions from fossil fuels decreased 2% year-over-year while total atmospheric CO2 reached 425ppm[2][4].", "sources": [{"url": "https://nilu.com/2026/08/international-state-of-the-climate-report-confirms-several-climate-records-in-2025/", "public_url": "https://nilu.com/2026/08/international-state-of-the-climate-report-confirms-several-climate-records-in-2025/", "mime_type": "text/html", "filename": null, "title": "International \u201cState of the Climate\u201d report confirms several climate records in 2025 - NILU", "snippet": "## Record-high greenhouse gas concentrations  \nCarbon dioxide (CO2), methane, and nitrous oxide \u2014 Earth\u2019s major atmospheric greenhouse gases \u2014 once again reached record-high concentrations in 2025.  \nThe globally averaged CO2 level reached 425.6\u00b10.1 parts per million, a 53% increase from the preindustrial level of \\~278 ppm.  \nFossil fuel emissions in 2025 were also a record high in 2025, estimated to be 10.3\u00b10.5 petagrams of carbon per year, more than three times the 3.0\u00b10.2 petagrams of carbon per year in the 1960s.\n## Rapidly changing atmosphere over the Arctic  \nThe Arctic atmosphere is changing rapidly as greenhouse gas concentrations rise and sea ice declines. Since 1958, the Arctic troposphere has warmed by around 0.3\u00b0C per decade, while the stratosphere has cooled at a similar rate \u2014 a fingerprint of human-caused CO\u2082 increases.  \nAnnual temperatures in the lower Arctic atmosphere were the second highest on record. The year was marked by strong seasonal contrasts, including record warmth in February and exceptional warmth across much of the atmosphere in October.  \n\u201cIn 2025 we also saw unusually low Arctic ozone levels and increased ultraviolet radiation in the spring, closely related to a strong polar vortex and atmospheric circulation,\u201d says senior scientist and UV expert Tove Svendby at NILU.  \nOverall, 2025 illustrates how long-term Arctic warming is interacting with large natural variations in atmospheric circulation, with consequences for temperatures, ozone and weather across the region.\n## Near-record warmth in the Arctic  \nThe Arctic had its second-warmest year in the 126-year record.  \nSurface air temperatures in the Arctic are increasing at roughly three times the global average rate. Precipitation is also increasing across the region. In response to the precipitation and temperature increases, tundra plants have been increasing; 2025 marked the third highest value in the record with respect to greenness, a measure of the increase in plants and productivity.  \nIn Arctic waters, maximum sea ice extent in 2025 was the lowest in the 47-year record, while minimum extent was the 11th lowest. The thickness of the sea ice, which is related to its age, has also been decreasing over time. Ice older than four years old is nearly absent, with only 95,000 square kilometers of older ice in September 2025 as compared to 1.5 million square kilometers in the 1980s."}, {"url": "https://climateadaptationplatform.com/state-of-the-global-climate-2025-trends-and-key-impacts/", "public_url": "https://climateadaptationplatform.com/state-of-the-global-climate-2025-trends-and-key-impacts/", "mime_type": "text/html", "filename": null, "title": "State of the Global Climate 2025\u2014Trends and Key Impacts - Climate Adaptation Platform", "snippet": "The State of the Global Climate 2025 report, a flagship publication from the World Meteorological Organisation (WMO) published annually since 1993, warns of rapid climate change based on the latest data.  \nIt shows that key climate indicators such as greenhouse gas concentrations, global average temperatures, global mean sea level, ocean heat content, ocean pH, glacier mass balance, sea ice loss, and extreme weather have reached unprecedented or near-record levels.  \nThe report confirms that 2015-2025 were the hottest 11-year period on record, and that 2025 was the second- or third-hottest year on record, at about 1.43\u00b0C above the 1850-1900 average. Extreme events around the world, including intense heat, heavy rainfall and tropical cyclones, caused disruption and devastation, highlighting the vulnerability of our interconnected economies and societies.  \nThe big three greenhouse gases: carbon dioxide (CO2), Methane (CH4), and nitrous oxide (N2O) have reached record levels. Carbon dioxide reached 423.9 \u00b1 0.2 ppm, equivalent to 152% of pre-industrial levels; methane reached 1942 \u00b1 2 ppb, equivalent to 266% of pre-industrial levels; and nitrous oxide reached 338.0 \u00b1 0.1 ppb, equivalent to 25% of pre-industrial levels.  \nAs these GHGs trap more heat in the atmosphere, Earth\u2019s energy Imbalance (EEI) is changing. The EEI is the new climate indicator in this year\u2019s report. It notes that since the 1960s the earth\u2019s EEI has been growing, reaching a record high in 2025.\nAs trapped energy accumulates, it raises temperatures on land and in the ocean, leading to the melting of glaciers and ice sheets. However, temperatures are not rising evenly across the globe, nor are precipitation patterns. Greenland, northern Canada, western Europe, Fennoscandia, the Mediterranean and many parts of Asia experienced significant warm anomalies.  \nBetween 2024 and 2025, glacial mass loss was among the five worst on record since tracking began in 1950. Iceland and North America\u2019s experienced extreme glacier mass loss in 2025.  \nAs the Ocean absorbs the vast majority, or 90%, of the heat trapped in the planet, it raises its temperature, reaching record high levels in 2025, impacting the marine ecosystem, including coral reef bleaching.  \nRising ocean temperatures also contribute to sea level rise (SLR) worldwide. As ocean water warms, it expands, and warmer water contributes to the melting of sea ice, dumping more freshwater into the ocean. Both accelerate sea level rise. Satellite records show an increase in SLR from 2.65 mm per year between 1993-2011 to 4.75 mm per year between 2012-2025.\nAccess the full report: [State of the Global Climate 2025](https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025)  \nView the State of the Global Climate 2025 [Story Maps](https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d).  \n**Sources**  \nState of the Global Climate 2025. (23 March 2026). World Meteorological Organisation. Retrieved from [https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025](https://wmo.int/publication-series/state-of-global-climate/state-of-global-climate-2025)  \nState of the Climate 2025. (2026). World Meteorological Organisation. Retrieved from [https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d](https://storymaps.arcgis.com/stories/4d50eeb069354888b0ccba346b141c6d)"}, {"url": "https://au.marketscreener.com/news/climate-challenge-a-decade-after-paris-agreement-ce7e5dd8d98ef021", "public_url": "https://au.marketscreener.com/news/climate-challenge-a-decade-after-paris-agreement-ce7e5dd8d98ef021", "mime_type": "text/html", "filename": null, "title": "Climate crossroads: a decade after the Paris Agreement | MarketScreener Australia", "snippet": "(Corrects wording in paragraphs 7-10 to clarify the Global Carbon Budget report contains projections for 2025, not for 2027)  \nFeb 16 (Reuters) - Ten years after the Paris Agreement took effect, newly released climate datasets show the world warming at an accelerating pace, with 2025 ranking among the three hottest years ever recorded, and sea-ice, ocean heat and sea levels crossing new thresholds.  \nEfforts to limit climate-damaging fossil fuels have not been enough and the world is on course to miss its climate goals. Data from some of the world's leading scientific agencies show global warming has sped up markedly since the mid-2010s.  \n**EMISSIONS: A WIDENING GAP**  \nThe World Meteorological Organization's Global Atmosphere Watch network shows concentrations of carbon dioxide, methane and nitrous oxide climbing to record highs, driving the temperature spike observed from 2023 to 2025, scientists say.  \nGlobal fossil fuel carbon dioxide emissions were projected to climb to a record 38.1 billion tonnes in 2025, driven by rising coal, oil and gas use despite rapid growth in renewable energy, according to the latest Global Carbon Budget report.  \nThe report - produced by an international team of more than 130 scientists - estimated global fossil fuel CO2 emissions would rise 1.1% in 2025, pushing atmospheric CO2 concentrations to roughly 52% above pre-industrial levels.\nResearchers warn there is only room for about 170 billion more tonnes of CO2 - equivalent to roughly four years of emissions at current rates - if the world wants to cap global warming at 1.5\u00b0 Celsius above the pre-industrial average.  \nRegional trends are mixed: emissions were projected to increase in 2025 in China, India, the United States and the European Union, while falling in Japan.  \n**TEMPERATURES: A DECADE OF ACCELERATION**  \nNASA's Goddard Institute for Space Studies said the Earth's surface in 2025 was 1.19\u00b0C above the 1951-1980 average, effectively tying with 2023 as one of the warmest years ever measured.  \nThe WMO's consolidated dataset places 2025 at 1.44\u00b0C above pre-industrial levels, ranking it among the top-three warmest years over the 176 years of recorded temperatures. \\[nasa.gov] \\[wmo.int] \\[berkeleyearth.org]  \n**ARCTIC: RAPID COLLAPSE OF SEA ICE**  \nThe U.S. National Oceanic and Atmospheric Administration's 2025 Arctic Report Card confirmed that October 2024-September 2025 was the warmest period since 1900, and the region continues to warm more than twice as fast as the global average.  \nSea-ice extent reached the lowest winter maximum ever recorded in March 2025, at about 14.47 million square kilometers, according to the U.S. National Ice Center.  \n**OCEANS: HEAT AND RISING SEAS**  \nThe oceans absorbed record amounts of heat in 2025, setting a new global high for upper-ocean heat content, according to NOAA and Berkeley Earth.\nSea levels, measured by tide gauges and satellites, continue to rise. The Intergovernmental Panel on Climate Change projects a 0.20-0.29 meter rise by 2050 relative to 1995-2014.  \n(Reporting by Canan Sevgili, Vera Dvorakova, Lucie Barbier and Alessandro Parodi; Editing by Simon Jessop and David Holmes)  \nBy Canan Sevgili"}, {"url": "https://kinja.com/science/climate-change-data-2026", "public_url": "https://kinja.com/science/climate-change-data-2026", "mime_type": "text/html", "filename": null, "title": "The Climate Numbers in 2026 Are Worse Than You Think | Kinja", "snippet": "Both poles experienced extreme conditions in 2025. Antarctica recorded its warmest annual temperature on record. The Arctic recorded its second warmest. December 2025 saw the lowest Arctic sea ice extent ever recorded for that month. Ocean heat content set a new record, with the increase from 2024 to 2025 alone (approximately 23 zettajoules) equaling roughly 39 times the total energy produced by all human activities on Earth in 2023. The oceans absorb over 90% of the excess heat trapped by greenhouse gases, which is why ocean heat content is, in many ways, a more telling indicator of the planet's energy imbalance than surface air temperature alone. The WMO's State of the Global Climate 2025 report, released in March 2026, found that the planet's energy imbalance (the gap between incoming solar energy and outgoing heat radiation) has never been larger.\n## The emissions picture: record highs despite record renewables  \nCarbon dioxide emissions from fossil fuels and cement production rose 1.1% in 2025, reaching a record 38.1 billion tons, according to the Global Carbon Project. CO2 concentrations in the atmosphere reached approximately 426 parts per million, about 53% above pre-industrial levels. The last time atmospheric CO2 was this high was during the mid-Pliocene epoch, 3 to 5 million years ago, when sea levels were 15 to 25 meters higher than today.  \nIn the United States, greenhouse gas emissions increased 2.4% in 2025, according to the Rhodium Group, reversing two prior years of decreases and breaking the decoupling of emissions from economic growth that had characterized 2023 and 2024.\nThe raw numbers seem contradictory: how can emissions keep rising when renewable energy is growing at record pace? The answer is that global electricity demand is growing faster than renewables can replace fossil fuels in many regions. Data centers (driven by the AI computing boom), electric vehicles (which reduce tailpipe emissions but increase grid demand), air conditioning in developing nations where temperatures are becoming dangerous, and industrial electrification are all driving demand higher. Global electricity demand is expected to grow by roughly 4% per year through 2030, according to the IEA, fueled in large part by the explosive growth of AI computing infrastructure. A single large data center can consume as much electricity as a small city. In the first half of 2025, global electricity demand grew 2.6%. Solar and wind met all of that new demand globally (solar alone covered 83% of the increase), but in the United States, clean sources didn't keep pace, so fossil generation actually increased. The U.S. is simultaneously building clean energy faster than ever and consuming more fossil energy than it was five years ago.  \nThis is the central tension: renewables are growing extraordinarily fast and still not fast enough. Clean energy investment reached over $2 trillion in 2025, double the 2020 level, but below the $5.6 trillion that's needed annually through 2030 to stay on track for climate targets."}, {"url": "https://www.ecmwf.int/en/about/media-centre/news/2025/2025-third-warmest-year", "public_url": "https://www.ecmwf.int/en/about/media-centre/news/2025/2025-third-warmest-year", "mime_type": "text/html", "filename": null, "title": "2025 was the third-warmest year on record, Copernicus data show | ECMWF", "snippet": "The Global Climate Highlights report shows that 2025 was only marginally cooler than 2023, and that the past three years (2023\u20132025) have averaged more than 1.5\u00b0C above the pre-industrial level.\nFirstly, rising concentrations of greenhouse gases \u2013 mainly from human activities \u2013 in the atmosphere and secondly, exceptionally high sea-surface temperatures, associated with an El Ni\u00f1o event and other ocean variability factors. Additional factors include changes in the amounts of aerosols and low cloud and variations in atmospheric circulation. Monitoring by CAMS continues to support climate mitigation policies by tracking emissions and atmospheric concentrations.\nAtmospheric greenhouse gases have steadily increased over the last ten years. We will continue to track greenhouse gases, aerosols, and other atmospheric indicators to help decision makers understand the risks of continuing emissions and respond effectively, reinforcing synergies between air quality and climate policies.\nIn the Arctic, the monthly sea ice extent was the lowest on record for the time of year in January, February, March, and December, and the second lowest in June and October.\nECMWF Director-General Florian Pappenberger said: \u201cThis report confirms that Europe and the world are in the warmest decade on record and that the European Commission\u2019s investment in Copernicus continues to be critical. As an international organisation serving 35 nations, ECMWF provides the world-leading science for informed decisions to be made, and ultimately action taken, to adapt to climate change, because every year and every degree counts."}, {"url": "https://coyotegulch.blog/2026/08/12/", "public_url": "https://coyotegulch.blog/2026/08/12/", "mime_type": "text/html", "filename": null, "title": "International \u201cState of the Climate\u201d report confirms record-high greenhouse gases, global sea level, and ocean heat in 2025: The report, published yearly in the\u00a0Bulletin of the American Meteorological Society, is a comprehensive \u201cannual physical\u201d of global climate #ClimateChange #aridification &#8211; Coyote Gulch", "snippet": "> **GLOBAL CLIMATE**\n>\n> The three main greenhouse gases that warm our atmosphere by trapping some of Earth\u2019s outgoing energy\u2014carbon dioxide, methane, and nitrous oxide\u2014all reached record-high levels in 2025. The average rate of carbon dioxide accumulation in the atmosphere increased from 0.6\u00b10.1 parts per million (ppm) per year in the early 1960s to 2.4 ppm per year during the decade of 2011\u201320. At the same time, fossil fuel emissions increased from 3.0\u00b10.2 petagrams of carbon per year in the 1960s to 9.8\u00b10.5 petagrams of carbon per year in the most recent 10-year period of 2015\u201324. Fossil fuel emissions in 2025 are estimated to be a record high of 10.3\u00b10.5 petagrams of carbon. One petagram is equal to more than 2.2 trillion pounds. The annual average global surface temperature for 2025 was among the three highest on record (since at least 1850). Only 2023 and 2024 were warmer, and both of those years were influenced by warm El Ni\u00f1o conditions in the eastern and central Pacific Ocean. In contrast, cool La Ni\u00f1a\u2013like conditions occurred at the beginning and end of 2025. A clear warming trend continued, with the last 11 years being the warmest 11 years on record. Also in 2025, high humidity heat extremes occurred with near-record frequency and intensity. These extremes can lead to dangerous heat-related illnesses. Above Earth\u2019s surface, temperatures in the lower troposphere were also elevated, with 2025 being the second-warmest year on record.\n>\n>\n> Increasing temperatures also impact the frozen landscape. Land-based glaciers around the world continued to lose ice for the 38th consecutive year, with each losing on average more than one-meter water equivalent\u2014the height of water that would result if the ice melted down to its liquid state\u2014for the fourth straight year. About 41% of the ice lost by glaciers since 1976 has occurred in just the last decade. Permafrost temperatures and active layer thickness\u2014the portion of ground that thaws and refreezes each year\u2014continued to increase in most locations, and many new records were set. During the winter of 2024/25, lakes in the Northern Hemisphere froze later, thawed earlier, and had shorter durations of ice cover than normal, with ice durations 15 days shorter on average compared to the 1991\u20132020 average.\n>\n>\n> The Iberian Peninsula had unprecedented fire activity, which drove a record for overall fire emissions in Europe. Nevertheless, at the global scale, 2025 had the lowest overall fire activity in the 23-year record, driven by low activity in South America and Africa. On average, the land surface continued to darken during 2025, driven by wildfires, heatwaves, and low snow cover, all of which are associated with the continued above-average temperatures.\n>\n> The darker the surface, the more sunlight is absorbed, which creates localized heating. The persistent warmer-than-average conditions also affected plant growth, with early start-of-season dates\u2014the time of year when trees and plants begin to bud\u2014including the earliest on record for the United Kingdom."}, {"url": "https://www.climatecentral.org/climate-matters/2025-in-review-global-temperatures", "public_url": "https://www.climatecentral.org/climate-matters/2025-in-review-global-temperatures", "mime_type": "text/html", "filename": null, "title": "2025 in Review: Global Temperatures | Climate Central", "snippet": "Global average temperatures in 2025 were 1.3\u00b0C (2.4
