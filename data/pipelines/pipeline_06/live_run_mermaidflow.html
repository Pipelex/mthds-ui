body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--bg-color, #f5f5f5);
    transition: background-color 0.3s;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
h1 {
    color: var(--text-color, #333);
    margin: 0;
    transition: color 0.3s;
}
.theme-selector {
    display: flex;
    align-items: center;
    gap: 8px;
}
.theme-selector label {
    font-size: 14px;
    color: var(--label-color, #666);
    transition: color 0.3s;

.theme-selector select {
    padding: 6px 12px;

}
.mermaid {
    display: flex;
    justify-content: center;
}
.hint {
    color: var(--label-color, #666);
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
    transition: color 0.3s;
}

/* Define CSS variables for the modal context (used by shared styles) */
.data-modal {
    --color-surface-hover: #333;
    --color-text-muted: #888;
    --color-text: #d4d4d4;
    --color-accent: #3b82f6;
    --color-border: #444;
    --color-bg: #1e1e1e;
    --color-success-bg: rgba(16, 185, 129, 0.2);
    --color-success: #10b981;
    --radius-sm: 4px;
    --radius-md: 4px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;

    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 20px;
    border-radius: 12px;
    width: 80vw;
    max-width: 1200px;
    max-height: 80vh;
    overflow: auto;
    z-index: 1000;
    display: none;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    min-width: 600px;
}
.data-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #444;
}
.data-modal-title {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.data-modal-title-primary {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
}
.data-modal-title-secondary {
    font-size: 11px;
    font-weight: 400;
    color: #666;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
}
.data-modal-close {
    cursor: pointer;
    color: #888;
    font-size: 24px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.2s;
}
.data-modal-close:hover {
    background: #333;
    color: #fff;
}

/* Include shared format toolbar and tabs styling */
/* ============================================================
   Shared Format Toolbar & Tabs Styling
   Uses CSS variables with fallbacks for both implementations
   ============================================================ */

.format-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;

.format-tabs {
    display: flex;
    gap: 4px;

.format-tab {
    padding: 6px 12px;
    border-radius: var(--radius-sm, 4px);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    background: var(--color-surface-hover, #333);

    background: var(--color-border, #444);
    color: var(--color-text, #ccc);
}

.format-tab.active {
    background: var(--color-accent, #3b82f6);
    color: #fff;
}

.format-tab:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.format-actions {
    display: flex;
    gap: 4px;
}

.action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm, 4px);
    cursor: pointer;
    font-size: 14px;
    background: var(--color-surface-hover, #333);
    color: var(--color-text-muted, #888);
    border: none;
    transition: all 0.2s;
}

.action-btn:hover {
    background: var(--color-border, #444);
    color: var(--color-text, #fff);
}

.action-btn.copied {
    background: var(--color-success-bg, rgba(16, 185, 129, 0.2));
    color: var(--color-success, #10b981);
}

.action-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
}

 means the business is not entirely dependent on a single product's performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform's central role, however, means it deserves continued prioritization in both R&D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter's Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n> *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*\n```\n\n## Data Table\ntable_data: ```\n{\n    \"title\": \"Q4 2025 Sales Data Analysis \\u2014 Key Insights Summary\",\n    \"sections\": [\n        {\n            \"section\": \"1. Regional Performance\",\n            \"table\": {\n                \"headers\": [\n                    \"Region\",\n                    \"Revenue\",\n                    \"Growth\",\n                    \"Notable\"\n                ],\n                \"rows\": [\n                    [\n                        \"North America\",\n                        \"~.1B\",\n                        \"+18%\",\n                        null\n                    ],\n                    [\n                        \"Europe\",\n                        \"~.4B\",\n                        \"+12%\",\n                        null\n                    ],\n                    [\n                        \"Asia-Pacific\",\n                        \"~M\",\n                        \"+25%\",\n                        \"Fastest-growing region\"\n                    ]\n                ]\n            }\n        },\n        {\n            \"section\": \"2. Product Portfolio Health\",\n            \"table\": {\n                \"headers\": [\n                    \"Product\",\n                    \"Role\",\n                    \"N ful **land-and-expand** or direct enterprise sales execution\n\n---\n\n## \ud83d\udd11 Strategic Takeaways\n\n1. **Double down on Asia-Pacific** \u2014 25% growth warrants increased sales/marketing investment\n2. **Cloud Platform is the core growth engine** \u2014 protect and expand this product line\n3. **Churn reduction is a competitive advantage** \u2014 identify what drove it and systematize it\n4. **Enterprise segment is scaling** \u2014 145 large deals signals repeatable sales motion\n\n---\n\n## \ud83d\udccc Recommendation\nPlease **verify and resubmit the raw currency figures** to enable precise revenue totals, growth-dollar calculations, and accurate regional share analysis."}, "s_929553a495": {"text": "```json\n{\n  \"dashboard\": {\n    \"title\": \"Q4 2025 Sales Performance Dashboard\",\n    \"theme\": {\n      \"background\": \"#0f172a\",\n      \"cardBackground\": \"#1e293b\",\n      \"accent\": \"#6366f1\",\n      \"success\": \"#10b981\",\n      \"warning\": \"#f59e0b\",\n      \"danger\": \"#ef4444\",\n      \"textPrimary\": \"#f1f5f9\",\n      \"textSecondary\": \"#94a3b8\",\n      \"gridLines\": \"#334155\"\n    },\n    \"charts\": [\n      {\n        \"id\": \"regional-growth-bar\",\n        \"type\": \"bar\",\n        \"title\": \"Regional Growth Rate Comparison (%)\",\n        \"subtitle\": \"Q4 2025 \u2014 Year-over-Year Growth\",\n        \"position\": { \"col\": 1, \"row\": 1, \"colSpan\": 2, \"rowSpan\": 1 },\n        \"data\": {\n          \"labels\": [\"North America\", \"Europe\", \"Asia-Pacific\"],\n          \"datasets\": [\n            {\n              \"label\": \"YoY Growth (%)\",\n              \"values\": [18, 12, 25],\n              \"colors\": [\"#6366f1\", \"#818cf8\", \"#10b981\"],\n              \"borderRadius\": 6\n            }\n          ]\n        },\n        \"annotations\": [\n          {\n            \"type\": \"label\",\n            \"targetBar\": \"Asia-Pacific\",\n            \"text\": \"\u26a1 Fastest Growing\",\n s posted positive growth in Q4, but Asia-Pacific stood out as the clear frontrunner, expanding at **25% \u2014 more than double the rate of Europe's 12% and well ahead of North America's 18%**. This is not a marginal difference. A 25% regional growth rate in a mature enterprise software environment signals genuine market expansion, not simply wallet-share capture from existing customers. For leadership, this raises an important strategic question: is the current level of investment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and that reallocating sales and marketing resources toward the region could yield outsized returns in coming quarters.\n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe's 12% growth, though the slowest of the three, still represents healthy expansion and should not be overlooked as a stable, compounding contributor.\n\n---\n\n## Product Portfolio: Cloud Platform Anchors a Balanced Stack\n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue driver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind of diversification matters. It means the business is not entirely dependent on a single product's performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform's central role, however, means it deserves continued prioritization in both R&D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter's Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n> *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*"}, "s_ca44bb81b4": {"chart_spec": {"text": "```json\n{\n  \"dashboard\": {\n    \"title\": \"Q4 2025 Sales Performance Dashboard\",\n    \"theme\": {\n      \"background\": \"#0f172a\",\n      \"cardBackground\": \"#1e293b\",\n      \"accent\": \"#6366f1\",\n      \"success\": \"#10b981\",\n      \"warning\": \"#f59e0b\",\n      \"danger\": \"#ef4444\",\n      \"textPrimary\": \"#f1f5f9\",\n      \"textSecondary\": \"#94a3b8\",\n      \"gridLines\": \"#334155\"\n    },\n    \"charts\": [\n      {\n        \"id\": \"regional-growth-bar\",\n        \"type\": \"bar\",\n        \"title\": \"Regional Growth Rate Comparison (%)\",\n        \"subtitle\": \"Q4 2025 \u2014 Year-over-Year Growth\",\n        \"position\": { \"col\": 1, \"row\": 1, \"colSpan\": 2, \"rowSpan\": 1 },\n        \"data\": {\n          \"labels\": [\"North America\", \"Europe\", \"Asia-Pacific\"],\n          \"datasets\": [\n            {\n              \"label\": \"YoY Growth (%)\",\n              \"values\": [18, 12, 25],\n              \"colors\": [\"#6366f1\", \"#818cf8\", \"#10b981\"],\n              \"borderRadius\": 6\n            }\n          ]\n        },\n        \"annotations\": [\n          {\n            \"type\": \"label\",\n            \"targetBar\": \"Asia-Pacific\",\n            \"text\": \"\u26a1 Fastest Growing\",\n            \"color\": \"#10b981\",\n            \"fontWeight\": \"bold\"\n          }\n        ],\n        \"axes\": {\n          \"x\": {\n            \"label\": \"Region\",\n            \"color\": \"#94a3b8\"\n          },\n          \"y\": {\n            \"label\": \"Growth Rate (%)\",\n            \"min\": 0,\n            \"max\": 30,\n            \"tickInterval\": 5,\n            \"color\": \"#94a3b8\"\n          }\n        },\n        \"referenceLines\": [\n          {\n            \"value\": 18.33,\n            \"label\": \"Avg Growth (18.3%)\",\n            \"style\": \"dashed\",\n d or direct enterprise sales execution"]]}}, {"section": "Strategic Takeaways", "table": {"headers": ["Priority", "Focus Area", "Action"], "rows": [["1", "Asia-Pacific Expansion", "Increase sales/marketing investment; 25% growth warrants prioritization"], ["2", "Cloud Platform", "Protect and expand core growth engine product line"], ["3", "Churn Reduction", "Identify drivers of improvement and systematize them"], ["4", "Enterprise Segment", "Scale repeatable sales motion; 145 large deals signals strong foundation"]]}}], "data_quality_notice": "Currency values in the source dataset are incomplete (e.g., '.1B', 'M' without leading digits). Revenue figures are approximate/structural only. Raw currency figures should be verified and resubmitted for precise totals, growth-dollar calculations, and regional share analysis."}}, "narrative": {"text": "# Q4 2025 Sales Performance: Narrative Summary\n\n## A Quarter Defined by Momentum\n\nQ4 2025 tells a compelling growth story across nearly every dimension of the business. While some revenue figures require verification before precise totals can be confirmed, the directional signals are clear and consistent: the company is accelerating in the right markets, retaining customers at an improving rate, and closing larger deals with greater regularity.\n\n---\n\n## Regional Growth: Asia-Pacific Takes the Lead\n\nAll three major regions posted positive growth in Q4, but Asia-Pacific stood out as the clear frontrunner, expanding at **25% \u2014 more than double the rate of Europe's 12% and well ahead of North America's 18%**. This is not a marginal difference. A 25% regional growth rate in a mature enterprise software environment signals genuine market expansion, not simply wallet-share capture from existing customers. For leadership, this raises an important strategic question: is the current level of investment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and that reallocating sales and marketing resources toward the region could yield outsized returns in coming quarters.\n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe's 12% growth, though the slowest of the three, still represents healthy expansion and should not be overlooked as a stable, compounding contributor.\n\n---\n\n## Product Portfolio: Cloud Platform Anchors a Balanced Stack\n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue driver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind of diversification matters. It means the business is not entirely dependent on a single product's performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform's central role, however, means it deserves continued prioritization in both R&D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter's Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n> *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*"}}};

nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe's 12%\ngrowth, though the slowest of the three, still represents healthy expansion and should not be       \noverlooked as a stable, compounding contributor.                                                    \n\n----------------------------------------------------------------------------------------------------\n\nProduct Portfolio: Cloud Platform Anchors a Balanced Stack                                          \n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The \nCloud Platform remains the dominant revenue driver \u2014 the single largest contributor to the top line \n\u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind  \nof diversification matters. It means the business is not entirely dependent on a single product's   \nperformance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud    \nPlatform's central role, however, means it deserves continued prioritization in both R&D investment \nand go-to-market focus. It is the engine; everything else benefits when it runs well.               \n\n----------------------------------------------------------------------------------------------------\n\nCustomer Retention: The Quarter's Most Underrated Win                                               \n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines:   \nchurn dropped from 5.8% to 4.2%, representing a 27.6% improvement in retention. This is a           \nsubstantial operational achievement. In subscription and SaaS businesses, churn reduction compounds \nover time in ways that new customer acquisition simply cannot replicate on its own. Every percentage\npoint of churn eliminated means more revenue stays on the books, more relationships deepen into     \nexpansion opportunities, and the cost of growth decreases. Whether this improvement was driven by   \nproduct enhancements, a stronger customer success function, or improved onboarding, the priority now\nshould be to understand exactly what changed \u2014 and to systematize it so the gains hold and continue \nto improve.                                                                                         \n\n----------------------------------------------------------------------------------------------------\n\nEnterprise Sales: A Repeatable Motion Takes Shape                                                   \n\nThe closing of 145 deals above the enterprise ARR threshold in a single quarter is a strong         \nindicator that the upmarket sales motion is maturing. This volume of high-value contracts does not  \nhappen by accident. It reflects either a well-functioning direct enterprise sales team, a successful\nland-and-expand strategy converting mid-market accounts into enterprise relationships, or both.     \nEither way, 145 large deals in one quarter suggests the sales process is becoming repeatable and    \nscalable \u2014 one of the most valuable things a growing company can build.                             \n\n----------------------------------------------------------------------------------------------------\n\nThe Bottom Line                                                                                     \n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth   \nmarket. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and   \nmeasurable way. And enterprise sales volume confirms that the company is successfully competing and \nwinning at the top of the market. The immediate priorities are straightforward: increase investment \nin Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of churn          \nreduction, and continue scaling the enterprise sales playbook.                                      \n\n\u258c Note: Precise revenue totals and growth-dollar calculations are pending verification of the     \n\u258c underlying currency figures. The strategic conclusions above are based on confirmed growth      \n\u258c rates, deal volume, and churn metrics, all of which are reliable.                               \n\n                                                                                                    \n                                                                                                    \n ## Data Table                                                                                      \n table_data: ```                                                                                    \n {                                                                                                  \n     \"title\": \"Q4 2025 Sales Data Analysis \\u2014 Key Insights Summary\",                            \n     \"sections\": [                                                                                  \n         {                                                                                          \n             \"section\": \"1. Regional Performance\",                                                  \n             \"table\": {                                                                             \n                 \"headers\": [                                                                       \n                     \"Region\",                                                                      \n                     \"Revenue\",                                                                     \n                     \"Growth\",                                                                      \n                     \"Notable\"                                                                      \n                 ],                                                                                 \n recise totals, growth-dollar calculations, and regional \nshare analysis.\"\n}\n", "s_c231e5be22": "                            Q4 2025 Sales Performance: Narrative Summary                            \n\nA Quarter Defined by Momentum                                                                       \n\nQ4 2025 tells a compelling growth story across nearly every dimension of the business. While some   \nrevenue figures require verification before precise totals can be confirmed, the directional signals\nare clear and consistent: the company is accelerating in the right markets, retaining customers at  \nan improving rate, and closing larger deals with greater regularity.                                \n\n----------------------------------------------------------------------------------------------------\n\nRegional Growth: Asia-Pacific Takes the Lead                                                        \n\nAll three major regions posted positive growth in Q4, but Asia-Pacific stood out as the clear       \nfrontrunner, expanding at 25% \u2014 more than double the rate of Europe's 12% and well ahead of North   \nAmerica's 18%. This is not a marginal difference. A 25% regional growth rate in a mature enterprise \nsoftware environment signals genuine market expansion, not simply wallet-share capture from existing\ncustomers. For leadership, this raises an important strategic question: is the current level of     \ninvestment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may \nnot be, and that reallocating sales and marketing resources toward the region could yield outsized  \nreturns in coming quarters.                                                                         \n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe's 12%\ngrowth, though the slowest of the three, still represents healthy expansion and should not be       \noverlooked as a stable, compounding contributor.                                                    \n\n----------------------------------------------------------------------------------------------------\n\nProduct Portfolio: Cloud Platform Anchors a Balanced Stack                                          \n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The \nCloud Platform remains the dominant revenue driver \u2014 the single largest contributor to the top line \n\u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind  \nof diversification matters. It means the business is not entirely dependent on a single product's   \nperformance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud    \nPlatform's central role, however, means it deserves continued prioritization in both R&D investment \nand go-to-market focus. It is the engine; everything else benefits when it runs well.               \n\n----------------------------------------------------------------------------------------------------\n\nCustomer Retention: The Quarter's Most Underrated Win                                               \n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines:   \nchurn dropped from 5.8% to 4.2%, representing a 27.6% improvement in retention. This is a           \nsubstantial operational achievement. In subscription and SaaS businesses, churn reduction compounds \nover time in ways that new customer acquisition simply cannot replicate on its own. Every percentage\npoint of churn eliminated means more revenue stays on the books, more relationships deepen into     \nexpansion opportunities, and the cost of growth decreases. Whether this improvement was driven by   \nproduct enhancements, a stronger customer success function, or improved onboarding, the priority now\nshould be to understand exactly what changed \u2014 and to systematize it so the gains hold and continue \nto improve.                                                                                         \n\n----------------------------------------------------------------------------------------------------\n\nEnterprise Sales: A Repeatable Motion Takes Shape                                                   \n\nThe closing of 145 deals above the enterprise ARR threshold in a single quarter is a strong         \nindicator that the upmarket sales motion is maturing. This volume of high-value contracts does not  \nhappen by accident. It reflects either a well-functioning direct enterprise sales team, a successful\nland-and-expand strategy converting mid-market accounts into enterprise relationships, or both.     \nEither way, 145 large deals in one quarter suggests the sales process is becoming repeatable and    \nscalable \u2014 one of the most valuable things a growing company can build.                             \n\n----------------------------------------------------------------------------------------------------\n\nThe Bottom Line                                                                                     \n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth   \nmarket. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and   \nmeasurable way. And enterprise sales volume confirms that the company is successfully competing and \nwinning at the top of the market. The immediate priorities are straightforward: increase investment \nin Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of churn          \nreduction, and continue scaling the enterprise sales playbook.                                      \n\n\u258c Note: Precise revenue totals and growth-dollar calculations are pending verification of the     \n\u258c underlying currency figures. The strategic conclusions above are based on confirmed growth      \n\u258c rates, deal volume, and churn metrics, all of which are reliable.                               \n", "s_ca44bb81b4": "{\n    \"chart_spec\": {\n        \"text\": \"```json\\n{\\n  \\\"dashboard\\\": {\\n    \\\"title\\\": \\\"Q4 2025 Sales Performance \nDashboard\\\",\\n    \\\"theme\\\": {\\n      \\\"background\\\": \\\"#0f172a\\\",\\n      \\\"cardBackground\\\": \n\\\"#1e293b\\\",\\n      \\\"accent\\\": \\\"#6366f1\\\",\\n      \\\"success\\\": \\\"#10b981\\\",\\n      \\\"warning\\\": \n\\\"#f59e0b\\\",\\n      \\\"danger\\\": \\\"#ef4444\\\",\\n      \\\"textPrimary\\\": \\\"#f1f5f9\\\",\\n      \n\\\"textSecondary\\\": \\\"#94a3b8\\\",\\n      \\\"gridLines\\\": \\\"#334155\\\"\\n    },\\n    \\\"charts\\\": [\\n      \n{\\n        \\\"id\\\": \\\"regional-growth-bar\\\",\\n        \\\"type\\\": \\\"bar\\\",\\n        \\\"title\\\": \n\\\"Regional Growth Rate Comparison (%)\\\",\\n        \\\"subtitle\\\": \\\"Q4 2025 \u2014 Year-over-Year \nGrowth\\\",\\n        \\\"position\\\": { \\\"col\\\": 1, \\\"row\\\": 1, \\\"colSpan\\\": 2, \\\"rowSpan\\\": 1 },\\n      \n\\\"data\\\": {\\n          \\\"labels\\\": [\\\"North America\\\", \\\"Europe\\\", \\\"Asia-Pacific\\\"],\\n          \n\\\"datasets\\\": [\\n            {\\n              \\\"label\\\": \\\"YoY Growth (%)\\\",\\n              \n\\\"values\\\": [18, 12, 25],\\n              \\\"colors\\\": [\\\"#6366f1\\\", \\\"#818cf8\\\", \\\"#10b981\\\"],\\n     \n\\\"borderRadius\\\": 6\\n            }\\n          ]\\n        },\\n        \\\"annotations\\\": [\\n          \n{\\n            \\\"type\\\": \\\"label\\\",\\n            \\\"targetBar\\\": \\\"Asia-Pacific\\\",\\n            \n\\\"text\\\": \\\"\u26a1 Fastest Growing\\\",\\n            \\\"color\\\": \\\"#10b981\\\",\\n            \\\"fontWeight\\\": \n\\\"bold\\\"\\n          }\\n        ],\\n        \\\"axes\\\": {\\n          \\\"x\\\": {\\n            \\\"label\\\": \n\\\"Region\\\",\\n            \\\"color\\\": \\\"#94a3b8\\\"\\n          },\\n te in a mature enterprise software environment \nsignals genuine market expansion, not simply wallet-share capture from existing customers. For \nleadership, this raises an important strategic question: is the current level of investment in \nAsia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and \nthat reallocating sales and marketing resources toward the region could yield outsized returns in \ncoming quarters.\\n\\nNorth America, while growing more modestly at 18%, remains a foundational \nrevenue base. Europe's 12% growth, though the slowest of the three, still represents healthy \nexpansion and should not be overlooked as a stable, compounding contributor.\\n\\n---\\n\\n## Product \nPortfolio: Cloud Platform Anchors a Balanced Stack\\n\\nThe product mix heading into year-end reflects\na well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue \ndriver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics \nproducts serve as meaningful secondary pillars. This kind of diversification matters. It means the \nbusiness is not entirely dependent on a single product's performance, and it creates natural \ncross-sell pathways for the enterprise sales team. The Cloud Platform's central role, however, means\nit deserves continued prioritization in both R&D investment and go-to-market focus. It is the \nengine; everything else benefits when it runs well.\\n\\n---\\n\\n## Customer Retention: The Quarter's \nMost Underrated Win\\n\\nPerhaps the most strategically significant data point from Q4 is one that \nrarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in\nretention. This is a substantial operational achievement. In subscription and SaaS businesses, churn\nreduction compounds over time in ways that new customer acquisition simply cannot replicate on its \nown. Every percentage point of churn eliminated means more revenue stays on the books, more \nrelationships deepen into expansion opportunities, and the cost of growth decreases. Whether this \nimprovement was driven by product enhancements, a stronger customer success function, or improved \nonboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it \nso the gains hold and continue to improve.\\n\\n---\\n\\n## Enterprise Sales: A Repeatable Motion Takes \nShape\\n\\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a \nstrong indicator that the upmarket sales motion is maturing. This volume of high-value contracts \ndoes not happen by accident. It reflects either a well-functioning direct enterprise sales team, a \nsuccessful land-and-expand strategy converting mid-market accounts into enterprise relationships, or\nboth. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable \nand scalable \u2014 one of the most valuable things a growing company can build.\\n\\n---\\n\\n## The Bottom \nLine\\n\\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority \ngrowth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful\nand measurable way. And enterprise sales volume confirms that the company is successfully competing \nand winning at the top of the market. The immediate priorities are straightforward: **increase \ninvestment in Asia-Pacific, protect and extend the Cloud Platform's lead, codify the drivers of \nchurn reduction, and continue scaling the enterprise sales playbook.**\\n\\n> *Note: Precise revenue \ntotals and growth-dollar calculations are pending verification of the underlying currency figures. \nThe strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics,\nall of which are reliable.*\"\n    }\n}\n"};
const stuffDataHtml = {"s_27b61c2f4a": "# Data Report\n\n## Narrative\nnarrative: ```\n# Q4 2025 Sales Performance: Narrative Summary\n\n## A Quarter Defined by Momentum\n\nQ4 2025 tells a compelling growth story across nearly every dimension of the business. While some revenue figures require verification before precise totals can be confirmed, the directional signals are clear and consistent: the company is accelerating in the right markets, retaining customers at an improving rate, and closing larger deals with greater regularity.\n\n---\n\n## Regional Growth: Asia-Pacific Takes the Lead\n\nAll three major regions posted positive growth in Q4, but Asia-Pacific stood out as the clear frontrunner, expanding at **25% \u2014 more than double the rate of Europe&#x27;s 12% and well ahead of North America&#x27;s 18%**. This is not a marginal difference. A 25% regional growth rate in a mature enterprise software environment signals genuine market expansion, not simply wallet-share capture from existing customers. For leadership, this raises an important strategic question: is the current level of investment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and that reallocating sales and marketing resources toward the region could yield outsized returns in coming quarters.\n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe&#x27;s 12% growth, though the slowest of the three, still represents healthy expansion and should not be overlooked as a stable, compounding contributor.\n\n---\n\n## Product Portfolio: Cloud Platform Anchors a Balanced Stack\n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue driver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind of diversification matters. It means the business is not entirely dependent on a single product&#x27;s performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform&#x27;s central role, however, means it deserves continued prioritization in both R&amp;D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter&#x27;s Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform&#x27;s lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n&gt; *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*\n```\n\n## Data Table\ntable_data: ```\n{\n    &quot;title&quot;: &quot;Q4 2025 Sales Data Analysis \\u2014 Key Insights Summary&quot;,\n    &quot;sections&quot;: [\n        {\n            &quot;section&quot;: &quot;1. Regional Performance&quot;,\n            &quot;table&quot;: {\n                &quot;headers&quot;: [\n                    &quot;Region&quot;,\n                    &quot;Revenue&quot;,\n                    &quot;Growth&quot;,\n                    &quot;Notable&quot;\n                ],\n                &quot;rows&quot;: [\n                    [\n                        &quot;North America&quot;,\n                        &quot;~.1B&quot;,\n                        &quot;+18%&quot;,\n                        null\n                    ],\n                    [\n                        &quot;Europe&quot;,\n                        &quot;~.4B&quot;,\n                        &quot;+12%&quot;,\n                        null\n                    ],\n                    [\n                        &quot;Asia-Pacific&quot;,\n                        &quot;~M&quot;,\n                        &quot;+25%&quot;,\n                        &quot;Fastest-growing region&quot;\n                    ]\n                ]\n            }\n        },\n s (above threshold ARR)</li><li>145</li><li>Strong upmarket motion; repeatable land-and-expand or direct enterprise sales execution</li></ul></li></ul></td></tr></table></td></tr><tr><td>Strategic Takeaways</td><td><table ><tr><th>headers</th><td><ul><li>Priority</li><li>Focus Area</li><li>Action</li></ul></td></tr><tr><th>rows</th><td><ul><li><ul><li>1</li><li>Asia-Pacific Expansion</li><li>Increase sales/marketing investment; 25% growth warrants prioritization</li></ul></li><li><ul><li>2</li><li>Cloud Platform</li><li>Protect and expand core growth engine product line</li></ul></li><li><ul><li>3</li><li>Churn Reduction</li><li>Identify drivers of improvement and systematize them</li></ul></li><li><ul><li>4</li><li>Enterprise Segment</li><li>Scale repeatable sales motion; 145 large deals signals strong foundation</li></ul></li></ul></td></tr></table></td></tr></tbody></table></td></tr><tr><th>data_quality_notice</th><td>Currency values in the source dataset are incomplete (e.g., &#x27;.1B&#x27;, &#x27;M&#x27; without leading digits). Revenue figures are approximate/structural only. Raw currency figures should be verified and resubmitted for precise totals, growth-dollar calculations, and regional share analysis.</td></tr></table>", "s_c231e5be22": "# Q4 2025 Sales Performance: Narrative Summary\n\n## A Quarter Defined by Momentum\n\nQ4 2025 tells a compelling growth story across nearly every dimension of the business. While some revenue figures require verification before precise totals can be confirmed, the directional signals are clear and consistent: the company is accelerating in the right markets, retaining customers at an improving rate, and closing larger deals with greater regularity.\n\n---\n\n## Regional Growth: Asia-Pacific Takes the Lead\n\nAll three major regions posted positive growth in Q4, but Asia-Pacific stood out as the clear frontrunner, expanding at **25% \u2014 more than double the rate of Europe&#x27;s 12% and well ahead of North America&#x27;s 18%**. This is not a marginal difference. A 25% regional growth rate in a mature enterprise software environment signals genuine market expansion, not simply wallet-share capture from existing customers. For leadership, this raises an important strategic question: is the current level of investment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and that reallocating sales and marketing resources toward the region could yield outsized returns in coming quarters.\n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe&#x27;s 12% growth, though the slowest of the three, still represents healthy expansion and should not be overlooked as a stable, compounding contributor.\n\n---\n\n## Product Portfolio: Cloud Platform Anchors a Balanced Stack\n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue driver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind of diversification matters. It means the business is not entirely dependent on a single product&#x27;s performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform&#x27;s central role, however, means it deserves continued prioritization in both R&amp;D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter&#x27;s Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform&#x27;s lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n&gt; *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*", "s_ca44bb81b4": "<table><tr><th>chart_spec</th><td>```json\n{\n  &quot;dashb </li><li>Previous Value</li><li>Current Value</li><li>Change</li><li>Significance</li></ul></td></tr><tr><th>rows</th><td><ul><li><ul><li>Churn Rate</li><li>5.8%</li><li>4.2%</li><li>-1.6pp (-27.6% improvement)</li><li>Strong operational win; compounds ARR growth</li></ul></li></ul></td></tr></table></td></tr><tr><td>4. Enterprise Sales Momentum</td><td><table ><tr><th>headers</th><td><ul><li>Metric</li><li>Value</li><li>Implication</li></ul></td></tr><tr><th>rows</th><td><ul><li><ul><li>Enterprise Deals (above threshold ARR)</li><li>145</li><li>Strong upmarket motion; repeatable land-and-expand or direct enterprise sales execution</li></ul></li></ul></td></tr></table></td></tr><tr><td>Strategic Takeaways</td><td><table ><tr><th>headers</th><td><ul><li>Priority</li><li>Focus Area</li><li>Action</li></ul></td></tr><tr><th>rows</th><td><ul><li><ul><li>1</li><li>Asia-Pacific Expansion</li><li>Increase sales/marketing investment; 25% growth warrants prioritization</li></ul></li><li><ul><li>2</li><li>Cloud Platform</li><li>Protect and expand core growth engine product line</li></ul></li><li><ul><li>3</li><li>Churn Reduction</li><li>Identify drivers of improvement and systematize them</li></ul></li><li><ul><li>4</li><li>Enterprise Segment</li><li>Scale repeatable sales motion; 145 large deals signals strong foundation</li></ul></li></ul></td></tr></table></td></tr></tbody></table></td></tr><tr><th>data_quality_notice</th><td>Currency values in the source dataset are incomplete (e.g., &#x27;.1B&#x27;, &#x27;M&#x27; without leading digits). Revenue figures are approximate/structural only. Raw currency figures should be verified and resubmitted for precise totals, growth-dollar calculations, and regional share analysis.</td></tr></table></td></tr><tr><th>narrative</th><td># Q4 2025 Sales Performance: Narrative Summary\n\n## A Quarter Defined by Momentum\n\nQ4 2025 tells a compelling growth story across nearly every dimension of the business. While some revenue figures require verification before precise totals can be confirmed, the directional signals are clear and consistent: the company is accelerating in the right markets, retaining customers at an improving rate, and closing larger deals with greater regularity.\n\n---\n\n## Regional Growth: Asia-Pacific Takes the Lead\n\nAll three major regions posted positive growth in Q4, but Asia-Pacific stood out as the clear frontrunner, expanding at **25% \u2014 more than double the rate of Europe&#x27;s 12% and well ahead of North America&#x27;s 18%**. This is not a marginal difference. A 25% regional growth rate in a mature enterprise software environment signals genuine market expansion, not simply wallet-share capture from existing customers. For leadership, this raises an important strategic question: is the current level of investment in Asia-Pacific proportionate to the opportunity it represents? The data suggests it may not be, and that reallocating sales and marketing resources toward the region could yield outsized returns in coming quarters.\n\nNorth America, while growing more modestly at 18%, remains a foundational revenue base. Europe&#x27;s 12% growth, though the slowest of the three, still represents healthy expansion and should not be overlooked as a stable, compounding contributor.\n\n---\n\n## Product Portfolio: Cloud Platform Anchors a Balanced Stack\n\nThe product mix heading into year-end reflects a well-structured enterprise software portfolio. The **Cloud Platform remains the dominant revenue driver** \u2014 the single largest contributor to the top line \u2014 while the Security Suite and Analytics products serve as meaningful secondary pillars. This kind of diversification matters. It means the business is not entirely dependent on a single product&#x27;s performance, and it creates natural cross-sell pathways for the enterprise sales team. The Cloud Platform&#x27;s central role, however, means it deserves continued prioritization in both R&amp;D investment and go-to-market focus. It is the engine; everything else benefits when it runs well.\n\n---\n\n## Customer Retention: The Quarter&#x27;s Most Underrated Win\n\nPerhaps the most strategically significant data point from Q4 is one that rarely makes headlines: **churn dropped from 5.8% to 4.2%**, representing a **27.6% improvement** in retention. This is a substantial operational achievement. In subscription and SaaS businesses, churn reduction compounds over time in ways that new customer acquisition simply cannot replicate on its own. Every percentage point of churn eliminated means more revenue stays on the books, more relationships deepen into expansion opportunities, and the cost of growth decreases. Whether this improvement was driven by product enhancements, a stronger customer success function, or improved onboarding, the priority now should be to understand *exactly* what changed \u2014 and to systematize it so the gains hold and continue to improve.\n\n---\n\n## Enterprise Sales: A Repeatable Motion Takes Shape\n\nThe closing of **145 deals above the enterprise ARR threshold** in a single quarter is a strong indicator that the upmarket sales motion is maturing. This volume of high-value contracts does not happen by accident. It reflects either a well-functioning direct enterprise sales team, a successful land-and-expand strategy converting mid-market accounts into enterprise relationships, or both. Either way, 145 large deals in one quarter suggests the sales process is becoming repeatable and scalable \u2014 one of the most valuable things a growing company can build.\n\n---\n\n## The Bottom Line\n\nQ4 2025 was a quarter of broad-based strength. Asia-Pacific is emerging as a high-priority growth market. The Cloud Platform continues to anchor the business. Churn is falling in a meaningful and measurable way. And enterprise sales volume confirms that the company is successfully competing and winning at the top of the market. The immediate priorities are straightforward: **increase investment in Asia-Pacific, protect and extend the Cloud Platform&#x27;s lead, codify the drivers of churn reduction, and continue scaling the enterprise sales playbook.**\n\n&gt; *Note: Precise revenue totals and growth-dollar calculations are pending verification of the underlying currency figures. The strategic conclusions above are based on confirmed growth rates, deal volume, and churn metrics, all of which are reliable.*</td></tr></table>"};

// XSS-safe HTML escaping
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Make all links in a container open in new windows
function makeLinksOpenInNewWindow(container) {
    if (!container) return;
    const links = container.querySelectorAll('a');
    links.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
    });
}

// Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}

function applyPageTheme(theme) {
    const palette = themePalettes[theme]?.page || themePalettes.default.page;
    document.documentElement.style.setProperty('--bg-color', palette.bg);
    document.documentElement.style.setProperty('--text-color', palette.text);
    document.documentElement.style.setProperty('--label-color', palette.label);
    document.documentElement.style.setProperty('--border-color', palette.border);
    document.documentElement.style.setProperty('--border-hover', palette.borderHover);
    document.documentElement.style.setProperty('--select-bg', palette.selectBg);
    document.documentElement.style.setProperty('--container-bg', palette.containerBg);
}

function applyThemeColors(code, theme) {
    const palette = themePalettes[theme] || themePalettes.default;
    let result = code;

    // Replace classDef colors
    result = result.replace(
        /classDef\s+failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+controller\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef controller fill:${palette.controller.fill},stroke:${palette.controller.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe fill:${palette.pipe.fill},stroke:${palette.pipe.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe_failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe_failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+stuff\s+fill:[^,]+,stroke:[^,]+/g,
        `classDef stuff fill:${palette.stuff.fill},stroke:${palette.stuff.stroke}`
    );

    // Replace subgraph fill colors (style sg_xxx fill:#xxx)
    const subgraphColors = palette.subgraph;
    let colorIndex = 0;
    result = result.replace(
        /style\s+(sg_[^\s]+)\s+fill:#[a-fA-F0-9]+/g,
        (match, subgraphId) => {
            const color = subgraphColors[colorIndex % subgraphColors.length];
            colorIndex++;
            return `style ${subgraphId} fill:${color}`;
        }
    );

    return result;
}

function attachClickHandlers() {
    // Wait for mermaid to render, then attach click handlers
    setTimeout(() => {
        const svgContainer = document.querySelector('.mermaid svg');
        if (!svgContainer) return;

        // Find nodes by their flowchart IDs - use any available data source
        const allStuffIds = new Set([
            ...Object.keys(stuffDataJson || {}),
            ...Object.keys(stuffDataText || {}),
            ...Object.keys(stuffDataHtml || {})
        ]);

        for (const stuffId of allStuffIds) {
            // Mermaid generates IDs like 'flowchart-s_xxx-123'
            const nodes = svgContainer.querySelectorAll(`[id^="flowchart-${stuffId}"]`);
            nodes.forEach(node => {
                node.classList.add('clickable-stuff');
                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal(stuffId);
                });
            });
        }
    }, 500);
}

    document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));

    if (currentStuffId) {

function renderContent(stuffId, format) {
    const content = document.getElementById('modal-content');
    content.classList.remove('html-content', 'text-content', 'pdf-content', 'image-content');

    // Handle PDF content type with embedded viewer
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];

    if (format === 'html' && contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            content.classList.add('pdf-content');
            content.innerHTML = '';
            const embed = document.createElement('embed');
            embed.src = pdfUrl;
            embed.type = 'application/pdf';
            embed.style.cssText = 'width:100%; height:100%; border:none; min-height:500px;';
            content.appendChild(embed);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    // Handle image content type
    if (format === 'html' && contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            content.classList.add('image-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = 'max-width:100%; max-height:100%; object-fit:contain;';
            img.alt = 'Image content';
            content.appendChild(img);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    if (format === 'json') {
        const data = stuffDataJson?.[stuffId];
        content.innerHTML = '';
        content.textContent = data ? JSON.stringify(data, null, 2) : 'No JSON data available';
    } else if (format === 'text') {
        const data = stuffDataText?.[stuffId];
        content.classList.add('text-content');
        content.innerHTML = '';
        content.textContent = data || 'No text data available';
    } else if (format === 'html') {
        const data = stuffDataHtml?.[stuffId];
        if (data) {
            content.classList.add('html-content');
            content.innerHTML = DOMPurify.sanitize(data);
            makeLinksOpenInNewWindow(content);
        } else {
            content.innerHTML = '';
            content.textContent = 'No HTML data available';
        }
    }

    updateOpenExternalButton(stuffId, contentType, jsonData);
}

// Update visibility of the "open in new window" button (PDF only)

    const url = extractUrl(jsonData);
    // Only show for PDFs (images are handled by the download button)
    const shouldShow = contentType === 'application/pdf' && !!url;
    openExternalBtn.style.display = shouldShow ? '' : 'none';
}

function updateTabAvailability(stuffId) {
    const jsonTab = document.getElementById('tab-json');
    const textTab = document.getElementById('tab-text');
    const htmlTab = document.getElementById('tab-html');

    jsonTab.disabled = !stuffDataJson?.[stuffId];
    textTab.disabled = !stuffDataText?.[stuffId];

    // For PDF and image content types, the tab can render from JSON data via extractUrl()
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];
    const canRenderFromJson = (contentType === 'application/pdf' || contentType?.startsWith('image/')) && extractUrl(jsonData);
    htmlTab.disabled = !stuffDataHtml?.[stuffId] && !canRenderFromJson;

    // Update HTML tab label based on content type
    if (contentType === 'application/pdf') {
        htmlTab.textContent = 'PDF';
    } else if (contentType?.startsWith('image/')) {
        htmlTab.textContent = 'Image';
    } else {
        htmlTab.textContent = 'HTML';
    }

    // Find first available format (HTML -> JSON -> Pretty)
    if (!htmlTab.disabled) return 'html';
    if (!jsonTab.disabled) return 'json';
    if (!textTab.disabled) return 'text';
    return 'html';
}

function showModal(stuffId) {
    currentStuffId = stuffId;
    const modal = document.getElementById('data-modal');
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    // Build title from metadata (name + concept as primary, ID as secondary)
    const meta = stuffMetadata?.[stuffId];
    if (meta && (meta.name || meta.concept)) {
        const primaryParts = [];
        if (meta.name) primaryParts.push(escapeHtml(meta.name));
        if (meta.concept) primaryParts.push(`(${escapeHtml(meta.concept)})`);
        const primary = `<span class="data-modal-title-primary">${primaryParts.join(' ')}</span>`;
        const secondary = `<span class="data-modal-title-secondary">${escapeHtml(stuffId)}</span>`;
        title.innerHTML = primary + secondary;
    } else {
        title.innerHTML = `<span class="data-modal-title-primary">${escapeHtml(stuffId)}</span>`;
    }

    // Update tab availability and select best format
    const availableFormat = updateTabAvailability(stuffId);

    // If current format is not available, switch to available one
    const currentTab = document.getElementById(`tab-${currentFormat}`);
    if (currentTab.disabled) {
        setFormat(availableFormat);
    } else {
        renderContent(stuffId, currentFormat);
    }

    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function hideModal() {
    document.getElementById('data-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    currentStuffId = null;
}

// Get current content based on format
function getCurrentContent() {
    if (!currentStuffId) return null;

    if (currentFormat === 'json') {
        const data = stuffDataJson?.[currentStuffId];
        if (!data) return null;
        return { content: JSON.stringify(data, null, 2), ext: 'json', mime: 'application/json' };
    } else if (currentFormat === 'text') {
        const data = stuffDataText?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'txt', mime: 'text/plain' };
    } else if (currentFormat === 'html') {
        const data = stuffDataHtml?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'html', mime: 'text/html' };
    }
    return null;
}

// Copy content to clipboard
function copyContent() {
    const data = getCurrentContent();
    if (!data) return;

    navigator.clipboard.writeText(data.content).then(() => {
        const btn = document.getElementById('copy-btn');
        const checkIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z' +
            'm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z' +
            'm0 16H8V7h11v14z"/></svg>';
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = copyIcon;
            btn.classList.remove('copied');
        }, 1500);
    });
}

// Download content as file
function downloadContent() {
    if (!currentStuffId) return;

    // Get name from metadata or use ID
    const meta = stuffMetadata?.[currentStuffId];
    const baseName = meta?.name || currentStuffId || 'data';
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    // For images, download the actual image file directly
    if (contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            const ext = contentType.split('/')[1] || 'png';
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${ext}`;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    // For PDFs, download the actual PDF file directly
    if (contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    const data = getCurrentContent();
    if (!data) return;

    const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${data.ext}`;
    const blob = new Blob([data.content], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

function openExternal() {
    if (!currentStuffId) return;
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    if (contentType === 'application/pdf') {
        const url = extractUrl(jsonData);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }
}
