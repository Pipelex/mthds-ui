                      "text": "# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n"

\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n"

asonal inventory\n\nVOLUNTEER EXPERIENCE:\n\nTARGET CORPORATION\nBrand Ambassador\n\nCity, State\nAugust 2009\n\n\" Represented Periscope Marketing and Target Inc. at a college event\n\n\" Engaged University of Minnesota freshman in the Target brand experience\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n</cv_pages>\n\n<job_offer_pages>\n\n \u2022 item #1:\n\n# text_and_images\n\n## text\n\n### text\n\n# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n \u2022 item #2:\n\n# text_and_images\n\n## text\n\n### text\n\n\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00b7 Relocation assistance available</td>\n</tr>\n</table>\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n</job_offer_pages>\n\n---\nThe instance we want to generate will be for the following class:\nclass candidate_screening__DetailedMatchResult(candidate_screening__MatchResult):\n    \"\"\"An enriched match assessment specifically for technical roles, inheriting the base match structure with narrower\n\n    semantics for skill-level analysis.\n    \"\"\"\n\nclass candidate_screening__MatchResult(StructuredContent):\n    \"\"\"A structured assessment of whether a candidate's CV matches a job offer.\"\"\"\n    is_match: bool  # Whether the candidate's profile is a good match for the job offer\n    match_analysis: str  # Brief explanation of the reasoning behind the match or mismatch determination\n\nDO NOT create information.\nIf some information is not present for an attribute, output the default value or No                       "text": "# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n"

                      "text": "\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00         "rendered_system_prompt": "You are a seasoned HR professional skilled at writing empathetic, professional correspondence. Your task is to draft a refusal email to a candidate whose profile does not match a job offer. The email must be courteous, respectful, and encouraging, while referencing specific reasons from the match analysis to explain the decision. Be concise.",
        "rendered_user_prompt": "Based on the candidate's CV and the job offer below, write a professional refusal email. Use the match result to reference specific reasons why the candidate's profile does not fit the role.\n\n<cv_pages>\n\n \u2022 item #1:\n\n# text_and_images\n\n## text\n\n### text\n\n# JOHN DOE\n\n\n## Full Address . City, State, ZIP . Phone Number . E-mail\n\nOBJECTIVE: Design apparel print for an innovative retail company\n\nEDUCATION:\n\nUNIVERSITY OF MINNESOTA\nCollege of Design\n\" Bachelor of Science in Graphic Design\n\n\" Cumulative GPA 3.93, Dean's List\n\n\" Twin cities Iron Range Scholarship\n\nCity, State\nMay 2011\n\nWORK EXPERIENCE:\n\nAMERICAN EAGLE\nSales Associate\n\nCity, State\nJuly 2009 - present\n\n\u00b7 Collaborated with the store merchandiser creating displays to attract clientele\n\n\" Use my trend awareness to assist customers in their shopping experience\n\n\" Thoroughly scan every piece of merchandise for inventory control\n\n\" Process shipment to increase my product knowledge\n\nPLANET BEACH\nSpa Consultant\nCity, State\nAug. 2008 - present\n\n\" Sell retail and memberships to meet company sales goals\n\n\" Build organizational skills by single handedly running all operating procedures\n\n\" Communicate with clients to fulfill their wants and needs\n\n\" Attend promotional events to market our services\n\n\" Handle cash and deposits during opening and closing\n\n\" Received employee of the month award twice\n\nHEARTBREAKER\nSales Associate\nCity, State\nMay 2008 - Aug. 2008\n\n\u00b7 Stocked sales floor with fast fashion inventory\n\n\u00b7 Marked down items allowing me to see unsuccessful merchandise in a retail market\n\n\" Offered advice and assistance to each guest\n\nVICTORIA'S SECRET\nFashion Representative\nCity, State\nJan. 2006 - Feb. 2009\n\n\" Applied my leadership skills by assisting in the training of coworkers\n\n\" Set up mannequins and displays in order to entice future customers\n\n\u00b7 Provided superior customer service by helping with consumer decisions\n\n\" Took seasonal inventory\n\nVOLUNTEER EXPERIENCE:\n\nTARGET CORPORATION\nBrand Ambassador\n\nCity, State\nAugust 2009\n\n\" Represented Periscope Marketing and Target Inc. at a college event\n\n\" Engaged University of Minnesota freshman in the Target brand experience\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n</cv_pages>\n\n<job_offer_pages>\n\n \u2022 item #1:\n\n# text_and_images\n\n## text\n\n### text\n\n# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n \u2022 item #2:\n\n# text_and_images\n\n## text\n\n### text\n\n\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00b7 Relocation assistance available</td>\n</tr>\n</table>\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n</job_offer_pages>\n\n<match_result>\n# is_match: False\n\n# match_analysis: The candidate is a severe mismatch for this role. The position is for a Vice President of Enterprise Sales requiring 12+ years of progressive B2B SaaS sales experience, at least 5 years in VP-level leadership, a proven track record of building/scaling enterprise sales teams of 50+ people, and managing $100M+ ARR quotas selling to Fortune 500 enterprises. The candidate, John Doe, is a recent graduate (BS in Graphic Design, May 2011) whose objective is to design apparel print for a retail company. His experience consists entirely of entry-level retail roles (Sales Associate at American Eagle, Spa Consultant at Planet Beach, Sales Associate at Heartbreaker, Fashion Representative at Victoria's Secret). He has no B2B SaaS sales experience, no enterprise sales leadership, no team management at scale, no quota accountability, and no MBA or executive-level credentials. His background, skills, and career goals are entirely unrelated to executive-level enterprise software sales. There is no meaningful overlap in required qualifications, competencies, or seniority.\n</match_result>",
