 that accelerate pipeline growth and increase win rates; build and maintain executive relationships with C-level stakeholders at the largest accounts; drive operational rigor through accurate forecasting, process optimization, and data-driven decision making; coach, mentor, and develop the next generation of sales leaders; partner cross-functionally with Product, Marketing, Customer Success, and Channel teams to deliver integrated solutions; champion new sales methodologies, tools, and approaches to improve team productivity.", "qualifications": "12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles; proven track record of building and scaling enterprise sales teams of 50+ people; demonstrated success managing $100M+ ARR quotas and consistently exceeding targets; deep expertise in complex, consultative sales with 6-12 month sales cycles; experience selling SaaS solutions to Fortune 500 enterprises; Bachelor's degree required (MBA preferred).", "nice_to_haves": "Experience in CRM, cloud infrastructure, or enterprise software markets; track record of building sales teams from early stage through scale; expertise in account-based selling and strategic account management; strong analytical skills with proficiency in ACME and sales analytics tools; history of developing talent with multiple direct reports promoted to leadership roles; experience with channel/partner sales models; passion for coaching and developing high-performing teams; MBA."}, "s_59e9ed7dc2": {"items": [{"text_and_images": {"text": {"text": "# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n"}, "images": [], "raw_html": null}, "page_view": null}, {"text_and_images": {"text": {"text": "\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00b7 Relocation assistance available</td>\n</tr>\n</table>\n"}, "images": [], "raw_html": null}, "page_view": null}]}, "s_f4a92ea74a": {"match_score": 4.0, "strengths": "The candidate does possess a few loosely transferable competencies. As a business owner, he managed all aspects of operations including scheduling, client relationships, invoicing, and procurement, which reflects some general leadership, financial oversight, and P&L-adjacent experience. He led small teams (3 journeyman plumbers) and trained/mentored 2 apprentices, indicating basic coaching and talent development capability. His 22 years of experience, strong customer service orientation (4.9/5 Google rating with 200+ customers), and project estimation/consultation work demonstrate relationship-building and communication skills. He also grew a business to $480K annual revenue, showing entrepreneurial and revenue-growth mindset.", "gaps": "The candidate is fundamentally misaligned with this role, which is an enterprise SaaS/B2B sales leadership (VP-level) position, while his entire career is in the skilled trades as a master plumber. Critical gaps include: no B2B or SaaS sales experience whatsoever (role requires 12+ years progressive B2B sales with 5+ years VP-level leadership); no experience selling to Fortune 500 or C-suite enterprise buyers; no experience building or scaling enterprise sales teams of 50+ (he led teams of 3-4 people, not 60+); no experience managing $100M+ ARR (his revenue peaked at $480K); no expertise in complex consultative SaaS sales cycles, forecasting, sales analytics tools (ACME), CRM/cloud infrastructure markets, or account-based selling. He also lacks the required Bachelor's degree (holds a Plumbing Technology Certificate and high school diploma; no MBA). None of his technical skills (pipe fitting, soldering, blueprint reading) transfer to the position.", "overall_assessment": "This candidate is not a suitable fit for the position. The role is a senior VP-level enterprise sales leadership position requiring deep B2B/SaaS sales experience, management of $180M+ ARR, and leadership of 60+ person sales teams selling to Fortune 500 accounts. The candidate is a highly accomplished master plumber with 22 years in the skilled trades and small-business ownership. While he demonstrates strong customer service, entrepreneurial drive, and small-scale team leadership, these do not remotely meet the enterprise sales, scale, industry, or educational requirements of the role. This appears to be a domain mismatch, and the candidate should not advance for this position."}, "s_8662469bbc": {"url": "pipelex-storage://normalized/PnuL6KmrCamJDe2eCLbyUo.pdf", "public_url": "file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/PnuL6KmrCamJDe2eCLbyUo.pdf", "mime_type": "application/pdf", "filename": "Bobby-Jenkins-CV.pdf", "title": null, "snippet": null}, "s_13128a825a": {"items": [{"text_and_images": {"text": {"text": "# Robert \"Bobby\" Jenkins Tulsa, OK bobby.jenkins@email.com\n\n\n## PROFESSIONAL SUMMARY\n\nDedicated master plumber with 22 years of experience in residential and commercial plumbing. Known for excellent\ncustomer service, reliable project delivery, and strong work ethic. Experienced small business owner with a track\nrecord of building lasting client relationships and managing teams. Seeking new career opportunities to leverage\nleadership and customer-facing skills.\n\n\n## WORK EXPERIENCE\n\nOwner & Master Plumber\n\nJenkins Plumbing Solutions - Tulsa, OK | 2012 - 2025\n\n\u00b7 Founded and operated a plumbing business with 4 employees, growing annual revenue to $480K\n\n\u00b7 Managed all aspects of operations: scheduling, client relationships, invoicing, and procurement\n\n\u00b7 Specialized in residential renovations and commercial bathroom installations\n\n\u00b7 Maintained a 4.9/5 rating on Google Reviews with 200+ satisfied customers\n\n\n### Senior Plumber\n\nTulsa Metro Plumbing Co. - Tulsa, OK | 2006 - 2012\n\n\u00b7 Led a team of 3 journeyman plumbers on commercial plumbing projects\n\n\u00b7 Handled estimates and client consultations for projects valued up to $50K\n\n\u00b7 Trained and mentored 2 apprentice plumbers through their certification programs\n\n\n### Apprentice to Journeyman Plumber\n\nRotoRooter Franchise - Broken Arrow, OK | 2003 - 2006\n\n\u00b7 Completed apprenticeship program and earned journeyman certification\n\n\u00b7 Performed emergency service calls, drain cleaning, and water heater installations\n\n\u00b7 Recognized as Employee of the Quarter twice for outstanding customer service\n\n\n## EDUCATION\n\nPlumbing Technology Certificate - Tulsa Technology Center, 2003\nHigh School Diploma - Broken Arrow High School, 2001\n\n\n## CERTIFICATIONS\n\n\u00b7 Oklahoma Master Plumber License . OSHA 30-Hour Construction Safety\n\n\u00b7 Backflow Prevention Certification . EPA Section 608 Certification\n\n\n## SKILLS\n\nPipe Fitting | Soldering | Blueprint Reading | Customer Service | Project Estimation | Team Supervision\nQuickBooks | Basic Excel\n"}, "images": [], "raw_html": null}, "page_view": null}]}, "s_0b48b80ae5": {"match_score": 3.0, "strengths": "The candidate does possess some genuinely transferable elements, though they are minimal relative to this role. They have a Lab Director title (2019\u2013Present), which indicates some leadership responsibility, and they demonstrate operational rigor by verifying over 500 items per month\u2014suggesting comfort with high-volume, detail-oriented processes. They also have client-facing experience through liaising with private sellers to establish reserve prices, which shows some ability to negotiate and engage with stakeholders. Additionally, they hold a Bachelor's degree (B.A. Art History), satisfying the minimum degree requirement, and have roughly 10 years of professional experience overall.", "gaps": "The candidate's background is in gemology, jewelry appraisal, and luxury accessory authentication\u2014an entirely different domain from enterprise B2B/SaaS sales leadership. There is no evidence of any of the core required qualifications: no 12+ years of progressive B2B sales experience, no VP-level enterprise sales leadership, no experience building or scaling enterprise sales teams of 50+ people, and no track record managing $100M+ ARR quotas or P&L accountability. The role requires selling SaaS solutions to Fortune 500 enterprises with 6\u201312 month consultative sales cycles, C-suite relationship building, sales forecasting, revenue/P&L management, and cross-functional collaboration with Product, Marketing, and Channel teams\u2014none of which appear in the candidate's profile. There is also no MBA, no exposure to CRM/cloud/enterprise software markets, no sales analytics tools proficiency, and no history of coaching or promoting sales leaders. The candidate's leadership experience is confined to a small authentication lab rather than a distributed 60+ person sales organization.", "overall_assessment": "This candidate is a highly qualified gemologist and luxury goods appraiser but is fundamentally mismatched for a VP-level enterprise SaaS sales leadership position. Their expertise lies in gemstone identification, diamond grading, and antique jewelry valuation\u2014domains with essentially no overlap with the position's requirements around consultative B2B/SaaS sales, revenue and P&L ownership, and scaling large enterprise sales teams. Aside from a nominal leadership title and a Bachelor's degree, the candidate fails to meet nearly every core qualification and responsibility. This is not a viable match, and the candidate should not advance for this specific role."}, "s_b01beec52d": {"url": "pipelex-storage://normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf", "public_url": "file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf", "mime_type": "application/pdf", "filename": "CV-Sarah-Vaugier.pdf", "title": null, "snippet": null}, "s_3ee9355a99": {"items": [{"text_and_images": {"text": {"text": "# CONTACT\n\nEmail:\nsarah.vaugier@example.com\n\nLocation:\n\nLondon, UK\n\n\n## EDUCATION\n\nGraduate Gemologist\n(G.G.)\n\nGemological Institute of\n\nAmerica (GIA)\n\nB.A. Art History\nUniversity of Florence\n\n\n## EXPERTISE\n\n\u00b7 Colored Stone\nGrading\n\n\u00b7 Diamond Clarity &\nColor\n\n\u00b7 Antique Jewelry\nValuation\n\n\u00b7 Exotic Leathers\n(Python, Crocodile)\n\n\u00b7 Synthetic Detection\n\nSARAH VAUGIER, G.G.\n\nSenior Gemologist & Luxury Appraiser\n\n\n# PROFESSIONAL SUMMARY\n\nGIA Graduate Gemologist with a passion for rare stones and\nvintage luxury goods. 10 years of experience in auction\nhouses and high-end retail. Expert in gemstone\nidentification, synthetic detection, and the valuation of luxury\nfashion accessories.\n\n\n# WORK EXPERIENCE\n\n\n## Lab Director\n\nThe Diamond Vault | 2019 - Present\n\n\u00b7 Lead the authentication lab, verifying over 500 items per\nmonth.\n\n\u00b7 Specialist in distinguishing natural Burmese Rubies from\nflux-grown synthetics.\n\n\u00b7 Evaluated high-end glassware and crystal antiques for\nauction.\n\n\u00b7 Authored condition reports for vintage luxury bags,\nspecifically Herm\u00e8s and Chanel items in Python and\nOstrich skins.\n\nJunior Appraiser\nGold & Estate Auctions | 2014 - 2019\n\n\u00b7 Assisted in the cataloging of estate jewelry collections.\n\n\u00b7 Studied the architecture and design periods of Art Deco\nand Victorian jewelry pieces.\n\n\u00b7 Used refractometers and microscopes to test stone\nproperties.\n\n\u00b7 Liaised with private sellers to establish reserve prices.\n"}, "images": [], "raw_html": null}, "page_view": null}]}, "s_94605e0c51": {"match_score": 8.0, "strengths": "The candidate demonstrates several transferable, entry-level customer-facing competencies: retail sales, membership sales, cash handling, client communication, and customer service across multiple retail roles (American Eagle, Planet Beach, Heartbreaker, Victoria's Secret). There is limited early evidence of interpersonal leadership\u2014assisting in training coworkers at Victoria's Secret and being recognized twice as Employee of the Month at Planet Beach, which loosely relates to the coaching/talent development requirement. Exceptional communication and organizational skills are present, and the candidate meets the baseline Bachelor's degree requirement (B.S. in Graphic Design with a strong 3.93 GPA and Dean's List honors), which technically satisfies the 'Bachelor's degree required' qualification. Event promotion/brand ambassador work shows comfort engaging audiences, a distant relative of stakeholder engagement.", "gaps": "The candidate falls dramatically short of nearly every core requirement. The role demands 12+ years of progressive B2B sales experience with 5+ years at VP-level leadership; the candidate has only retail/spa consumer sales roles and no leadership title, executive experience, or B2B background. There is no evidence of building or scaling enterprise sales teams of 50+ people (role requires leading 60+ professionals), no P&L or revenue ownership (role requires $180M+ ARR and $100M+ quota management), and no complex consultative or SaaS/enterprise software sales experience with Fortune 500 accounts. Missing entirely: executive presence with C-suite buyers, forecasting and data-driven sales operations, change management, cross-functional leadership with Product/Marketing/Customer Success/Channel teams, and any of the nice-to-haves (CRM/cloud/enterprise software markets, account-based selling, sales analytics tools like ACME, channel/partner sales, developing direct reports into leaders, MBA). The candidate's degree is in Graphic Design rather than a business discipline, and no MBA is present.", "overall_assessment": "This candidate is not a viable fit for the position. The role is a senior executive sales leadership position (VP/enterprise sales leader) requiring over a decade of progressive B2B sales experience, proven P&L accountability of $180M+ ARR, and demonstrated success scaling large enterprise sales teams. The candidate's background consists of entry-level retail and spa consumer-sales roles with a Graphic Design degree and no managerial, B2B, SaaS, or enterprise sales experience. While the candidate shows strong customer service aptitude, academic excellence, and early signs of reliability and interpersonal skill, there is an enormous gap between their profile and the seniority, scope, and specialized expertise this role demands. Recommend not advancing this candidate for this position."}, "s_a95d8623a4": {"url": "pipelex-storage://normalized/AaFiTYZK98iNu47RML6nLc.pdf", "public_url": "file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/AaFiTYZK98iNu47RML6nLc.pdf", "mime_type": "application/pdf", "filename": "John-Doe-CV.pdf", "title": null, "snippet": null}, "s_c762183ec3": {"items": [{"text_and_images": {"text": {"text": "# JOHN DOE\n\n\n## Full Address . City, State, ZIP . Phone Number . E-mail\n\nOBJECTIVE: Design apparel print for an innovative retail company\n\nEDUCATION:\n\nUNIVERSITY OF MINNESOTA\nCollege of Design\n\" Bachelor of Science in Graphic Design\n\n\" Cumulative GPA 3.93, Dean's List\n\n\" Twin cities Iron Range Scholarship\n\nCity, State\nMay 2011\n\nWORK EXPERIENCE:\n\nAMERICAN EAGLE\nSales Associate\n\nCity, State\nJuly 2009 - present\n\n\u00b7 Collaborated with the store merchandiser creating displays to attract clientele\n\n\" Use my trend awareness to assist customers in their shopping experience\n\n\" Thoroughly scan every piece of merchandise for inventory control\n\n\" Process shipment to increase my product knowledge\n\nPLANET BEACH\nSpa llers to establish reserve prices. Overall 10 years of experience in auction houses and high-end retail.", "education": "Graduate Gemologist (G.G.), Gemological Institute of America (GIA). B.A. Art History, University of Florence.", "achievements": "GIA Graduate Gemologist (G.G.) certification."}};

const stuffDataHtml = {"s_a895b45a09": "<ul><li><table><tr><th>match_score</th><td>4.0</td></tr><tr><th>strengths</th><td>The candidate does possess a few loosely transferable competencies. As a business owner, he managed all aspects of operations including scheduling, client relationships, invoicing, and procurement, which reflects some general leadership, financial oversight, and P&amp;L-adjacent experience. He led small teams (3 journeyman plumbers) and trained/mentored 2 apprentices, indicating basic coaching and talent development capability. His 22 years of experience, strong customer service orientation (4.9/5 Google rating with 200+ customers), and project estimation/consultation work demonstrate relationship-building and communication skills. He also grew a business to $480K annual revenue, showing entrepreneurial and revenue-growth mindset.</td></tr><tr><th>gaps</th><td>The candidate is fundamentally misaligned with this role, which is an enterprise SaaS/B2B sales leadership (VP-level) position, while his entire career is in the skilled trades as a master plumber. Critical gaps include: no B2B or SaaS sales experience whatsoever (role requires 12+ years progressive B2B sales with 5+ years VP-level leadership); no experience selling to Fortune 500 or C-suite enterprise buyers; no experience building or scaling enterprise sales teams of 50+ (he led teams of 3-4 people, not 60+); no experience managing $100M+ ARR (his revenue peaked at $480K); no expertise in complex consultative SaaS sales cycles, forecasting, sales analytics tools (ACME), CRM/cloud infrastructure markets, or account-based selling. He also lacks the required Bachelor&#x27;s degree (holds a Plumbing Technology Certificate and high school diploma; no MBA). None of his technical skills (pipe fitting, soldering, blueprint reading) transfer to the position.</td></tr><tr><th>overall_assessment</th><td>This candidate is not a suitable fit for the position. The role is a senior VP-level enterprise sales leadership position requiring deep B2B/SaaS sales experience, management of $180M+ ARR, and leadership of 60+ person sales teams selling to Fortune 500 accounts. The candidate is a highly accomplished master plumber with 22 years in the skilled trades and small-business ownership. While he demonstrates strong customer service, entrepreneurial drive, and small-scale team leadership, these do not remotely meet the enterprise sales, scale, industry, or educational requirements of the role. This appears to be a domain mismatch, and the candidate should not advance for this position.</td></tr></table></li><li><table><tr><th>match_score</th><td>3.0</td></tr><tr><th>strengths</th><td>The candidate does possess some genuinely transferable elements, though they are minimal relative to this role. They have a Lab Director title (2019\u2013Present), which indicates some leadership responsibility, and they demonstrate operational rigor by verifying over 500 items per month\u2014suggesting comfort with high-volume, detail-oriented processes. They also have client-facing experience through liaising with private sellers to establish reserve prices, which shows some ability to negotiate and engage with stakeholders. Additionally, they hold a Bachelor&#x27;s degree (B.A. Art History), satisfying the minimum degree requirement, and have roughly 10 years of professional experience overall.</td></tr><tr><th>gaps</th><td>The candidate&#x27;s background is in gemology, jewelry appraisal, and luxury accessory authentication\u2014an entirely different domain from enterprise B2B/SaaS sales leadership. There is no evidence of any of the core required qualifications: no 12+ years of progressive B2B sales experience, no VP-level enterprise sales leadership, no experience building or scaling enterprise sales teams of 50+ people, and no track record managing $100M+ ARR quotas or P&amp;L accountability. The role requires selling SaaS solutions to Fortune 500 enterprises with 6\u201312 month consultative sales cycles, C-suite relationship building, sales forecasting, revenue/P&amp;L management, and cross-functional collaboration with Product, Marketing, and Channel teams\u2014none of which appear in the candidate&#x27;s profile. There is also no MBA, no exposure to CRM/cloud/enterprise software markets, no sales analytics tools proficiency, and no history of coaching or promoting sales leaders. The candidate&#x27;s leadership experience is confined to a small authentication lab rather than a distributed 60+ person sales organization.</td></tr><tr><th>overall_assessment</th><td>This candidate is a highly qualified gemologist and luxury goods appraiser but is fundamentally mismatched for a VP-level enterprise SaaS sales leadership position. Their expertise lies in gemstone identification, diamond grading, and antique jewelry valuation\u2014domains with essentially no overlap with the position&#x27;s requirements around consultative B2B/SaaS sales, revenue and P&amp;L ownership, and scaling large enterprise sales teams. Aside from a nominal leadership title and a Bachelor&#x27;s degree, the candidate fails to meet nearly every core qualification and responsibility. This is not a viable match, and the candidate should not advance for this specific role.</td></tr></table></li><li><table><tr><th>match_score</th><td>8.0</td></tr><tr><th>strengths</th><td>The candidate demonstrates several transferable, entry-level customer-facing competencies: retail sales, membership sales, cash handling, client communication, and customer service across multiple retail roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret). There is limited early evidence of interpersonal leadership\u2014assisting in training coworkers at Victoria&#x27;s Secret and being recognized twice as Employee of the Month at Planet Beach, which loosely relates to the coaching/talent development requirement. Exceptional communication and organizational skills are present, and the candidate meets the baseline Bachelor&#x27;s degree requirement (B.S. in Graphic Design with a strong 3.93 GPA and Dean&#x27;s List honors), which technically satisfies the &#x27;Bachelor&#x27;s degree required&#x27; qualification. Event promotion/brand ambassador work shows comfort engaging audiences, a distant relative of stakeholder engagement.</td></tr><tr><th>gaps</th><td>The candidate falls dramatically short of nearly every core requirement. The role demands 12+ years of progressive B2B sales experience with 5+ years at VP-level leadership; the candidate has only retail/spa consumer sales roles and no leadership title, executive experience, or B2B background. There is no evidence of building or scaling enterprise sales teams of 50+ people (role requires leading 60+ professionals), no P&amp;L or revenue ownership (role requires $180M+ ARR and $100M+ quota management), and no complex consultative or SaaS/enterprise software sales experience with Fortune 500 accounts. Missing entirely: executive presence with C-suite buyers, forecasting and data-driven sales operations, change management, cross-functional leadership with Product/Marketing/Customer Success/Channel teams, and any of the nice-to-haves (CRM/cloud/enterprise software markets, account-based selling, sales analytics tools like ACME, channel/partner sales, developing direct reports into leaders, MBA). The candidate&#x27;s degree is in Graphic Design rather than a business discipline, and no MBA is present.</td></tr><tr><th>overall_assessment</th><td>This candidate is not a viable fit for the position. The role is a senior executive sales leadership position (VP/enterprise sales leader) requiring over a decade of progressive B2B sales experience, proven P&amp;L accountability of $180M+ ARR, and demonstrated success scaling large enterprise sales teams. The candidate&#x27;s background consists of entry-level retail and spa consumer-sales roles with a Graphic Design degree and no managerial, B2B, SaaS, or enterprise sales experience. While the candidate shows strong customer service aptitude, academic excellence, and early signs of reliability and interpersonal skill, there is an enormous gap between their profile and the seniority, scope, and specialized expertise this role demands. Recommend not advancing this candidate for this position.</td></tr></table></li></ul>", "s_0a3ae80071": "<a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/a9Cei4749mugvcXjrsHMfP.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/a9Cei4749mugvcXjrsHMfP.pdf</a>", "s_71d650b590": "<ul><li><a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/PnuL6KmrCamJDe2eCLbyUo.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/PnuL6KmrCamJDe2eCLbyUo.pdf</a></li><li><a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf</a></li><li><a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/AaFiTYZK98iNu47RML6nLc.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/AaFiTYZK98iNu47RML6nLc.pdf</a></li></ul>", "s_0b50680751": "<table><tr><th>required_skills</th><td>Strong executive presence with ability to engage C-suite buyers; expertise in complex, consultative sales; ability to build and scale enterprise sales teams; revenue and P&amp;L management; accurate forecasting, process optimization, and data-driven decision making; strategic thinking and business acumen; exceptional communication; change management and organizational development; cross-functional collaboration; coaching and talent development; diversity, equity, and inclusion advocacy.</td></tr><tr><th>responsibilities</th><td>Lead and scale a high-performing team of 60+ enterprise sales professionals across multiple regions; own and deliver $180M+ ARR with full P&amp;L accountability and strategic planning responsibility; develop and implement sales strategies that accelerate pipeline growth and increase win rates; build and maintain executive relationships with C-level stakeholders at the largest accounts; drive operational rigor through accurate forecasting, process optimization, and data-driven decision making; coach, mentor, and develop the next generation of sales leaders; partner cross-functionally with Product, Marketing, Customer Success, and Channel teams to deliver integrated solutions; champion new sales methodologies, tools, and approaches to improve team productivity.</td></tr><tr><th>qualifications</th><td>12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles; proven track record of building and scaling enterprise sales teams of 50+ people; demonstrated success managing $100M+ ARR quotas and consistently exceeding targets; deep expertise in complex, consultative sales with 6-12 month sales cycles; experience selling SaaS solutions to Fortune 500 enterprises; Bachelor&#x27;s degree required (MBA preferred).</td></tr><tr><th>nice_to_haves</th><td>Experience in CRM, cloud infrastructure, or enterprise software markets; track record of building sales teams from early stage through scale; expertise in account-based selling and strategic account management; strong analytical skills with proficiency in ACME and sales analytics tools; history of developing talent with multiple direct reports promoted to leadership roles; experience with channel/partner sales models; passion for coaching and developing high-performing teams; MBA.</td></tr></table>", "s_59e9ed7dc2": "<ul><li><table><tr><th>text_and_images</th><td># Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we&#x27;re transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe&#x27;re seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you&#x27;ll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you&#x27;ll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world&#x27;s\nmost innovative technology companies.\n\n\n## What You&#x27;ll Do\n\n\u00b7 Lead &amp; Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&amp;L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n&lt;!-- PageBreak --&gt;\n\n</td></tr></table></li><li><table><tr><th>text_and_images</th><td>\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor&#x27;s degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation &amp; Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n&lt;table&gt;\n&lt;tr&gt;\n&lt;td&gt;\u00b7 Premium medical, dental, and vision coverage&lt;/td&gt;\n&lt;td&gt;\u00b7 401(k) with 6% company match&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\u00b7 Flexible PTO policy&lt;/td&gt;\n&lt;td&gt;\u00b7 $5,000 annual professional development budget&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\u00b7 Executive coaching program&lt;/td&gt;\n&lt;td&gt;\u00b7 Wellness reimbursement ($1,200/year)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\u00b7 8 paid volunteer days (VTO)&lt;/td&gt;\n&lt;td&gt;\u00b7 Paid parental leave (26 weeks primary caregiver)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\u00b7 Employee stock purchase plan (15% discount)&lt;/td&gt;\n&lt;td&gt;\u00b7 Relocation assistance available&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/table&gt;\n</td></tr></table></li></ul>", "s_f4a92ea74a": "<table><tr><th>match_score</th><td>4.0</td></tr><tr><th>strengths</th><td>The candidate does possess a few loosely transferable competencies. As a business owner, he managed all aspects of operations including scheduling, client relationships, invoicing, and procurement, which reflects some general leadership, financial oversight, and P&amp;L-adjacent experience. He led small teams (3 journeyman plumbers) and trained/mentored 2 apprentices, indicating basic coaching and talent development capability. His 22 years of experience, strong customer service orientation (4.9/5 Google rating with 200+ customers), and project estimation/consultation work demonstrate relationship-building and communication skills. He also grew a business to $480K annual revenue, showing entrepreneurial and revenue-growth mindset.</td></tr><tr><th>gaps</th><td>The candidate is fundamentally misaligned with this role, which is an enterprise SaaS/B2B sales leadership (VP-level) position, while his entire career is in the skilled trades as a master plumber. Critical gaps include: no B2B or SaaS sales experience whatsoever (role requires 12+ years progressive B2B sales with 5+ years VP-level leadership); no experience selling to Fortune 500 or C-suite enterprise buyers; no experience building or scaling enterprise sales teams of 50+ (he led teams of 3-4 people, not 60+); no experience managing $100M+ ARR (his revenue peaked at $480K); no expertise in complex consultative SaaS sales cycles, forecasting, sales analytics tools (ACME), CRM/cloud infrastructure markets, or account-based selling. He also lacks the required Bachelor&#x27;s degree (holds a Plumbing Technology Certificate and high school diploma; no MBA). None of his technical skills (pipe fitting, soldering, blueprint reading) transfer to the position.</td></tr><tr><th>overall_assessment</th><td>This candidate is not a suitable fit for the position. The role is a senior VP-level enterprise sales leadership position requiring deep B2B/SaaS sales experience, management of $180M+ ARR, and leadership of 60+ person sales teams selling to Fortune 500 accounts. The candidate is a highly accomplished master plumber with 22 years in the skilled trades and small-business ownership. While he demonstrates strong customer service, entrepreneurial drive, and small-scale team leadership, these do not remotely meet the enterprise sales, scale, industry, or educational requirements of the role. This appears to be a domain mismatch, and the candidate should not advance for this position.</td></tr></table>", "s_8662469bbc": "<a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/PnuL6KmrCamJDe2eCLbyUo.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/PnuL6KmrCamJDe2eCLbyUo.pdf</a>", "s_13128a825a": "<ul><li><table><tr><th>text_and_images</th><td># Robert &quot;Bobby&quot; Jenkins Tulsa, OK bobby.jenkins@email.com\n\n\n## PROFESSIONAL SUMMARY\n\nDedicated master plumber with 22 years of experience in residential and commercial plumbing. Known for excellent\ncustomer service, reliable project delivery, and strong work ethic. Experienced small business owner with a track\nrecord of building lasting client relationships and managing teams. Seeking new career opportunities to leverage\nleadership and customer-facing skills.\n\n\n## WORK EXPERIENCE\n\nOwner &amp; Master Plumber\n\nJenkins Plumbing Solutions - Tulsa, OK | 2012 - 2025\n\n\u00b7 Founded and operated a plumbing business with 4 employees, growing annual revenue to $480K\n\n\u00b7 Managed all aspects of operations: scheduling, client relationships, invoicing, and procurement\n\n\u00b7 Specialized in residential renovations and commercial bathroom installations\n\n\u00b7 Maintained a 4.9/5 rating on Google Reviews with 200+ satisfied customers\n\n\n### Senior Plumber\n\nTulsa Metro Plumbing Co. - Tulsa, OK | 2006 - 2012\n\n\u00b7 Led a team of 3 journeyman plumbers on commercial plumbing projects\n\n\u00b7 Handled estimates and client consultations for projects valued up to $50K\n\n\u00b7 Trained and mentored 2 apprentice plumbers through their certification programs\n\n\n### Apprentice to Journeyman Plumber\n\nRotoRooter Franchise - Broken Arrow, OK | 2003 - 2006\n\n\u00b7 Completed apprenticeship program and earned journeyman certification\n\n\u00b7 Performed emergency service calls, drain cleaning, and water heater installations\n\n\u00b7 Recognized as Employee of the Quarter twice for outstanding customer service\n\n\n## EDUCATION\n\nPlumbing Technology Certificate - Tulsa Technology Center, 2003\nHigh School Diploma - Broken Arrow High School, 2001\n\n\n## CERTIFICATIONS\n\n\u00b7 Oklahoma Master Plumber License . OSHA 30-Hour Construction Safety\n\n\u00b7 Backflow Prevention Certification . EPA Section 608 Certification\n\n\n## SKILLS\n\nPipe Fitting | Soldering | Blueprint Reading | Customer Service | Project Estimation | Team Supervision\nQuickBooks | Basic Excel\n</td></tr></table></li></ul>", "s_0b48b80ae5": "<table><tr><th>match_score</th><td>3.0</td></tr><tr><th>strengths</th><td>The candidate does possess some genuinely transferable elements, though they are minimal relative to this role. They have a Lab Director title (2019\u2013Present), which indicates some leadership responsibility, and they demonstrate operational rigor by verifying over 500 items per month\u2014suggesting comfort with high-volume, detail-oriented processes. They also have client-facing experience through liaising with private sellers to establish reserve prices, which shows some ability to negotiate and engage with stakeholders. Additionally, they hold a Bachelor&#x27;s degree (B.A. Art History), satisfying the minimum degree requirement, and have roughly 10 years of professional experience overall.</td></tr><tr><th>gaps</th><td>The candidate&#x27;s background is in gemology, jewelry appraisal, and luxury accessory authentication\u2014an entirely different domain from enterprise B2B/SaaS sales leadership. There is no evidence of any of the core required qualifications: no 12+ years of progressive B2B sales experience, no VP-level enterprise sales leadership, no experience building or scaling enterprise sales teams of 50+ people, and no track record managing $100M+ ARR quotas or P&amp;L accountability. The role requires selling SaaS solutions to Fortune 500 enterprises with 6\u201312 month consultative sales cycles, C-suite relationship building, sales forecasting, revenue/P&amp;L management, and cross-functional collaboration with Product, Marketing, and Channel teams\u2014none of which appear in the candidate&#x27;s profile. There is also no MBA, no exposure to CRM/cloud/enterprise software markets, no sales analytics tools proficiency, and no history of coaching or promoting sales leaders. The candidate&#x27;s leadership experience is confined to a small authentication lab rather than a distributed 60+ person sales organization.</td></tr><tr><th>overall_assessment</th><td>This candidate is a highly qualified gemologist and luxury goods appraiser but is fundamentally mismatched for a VP-level enterprise SaaS sales leadership position. Their expertise lies in gemstone identification, diamond grading, and antique jewelry valuation\u2014domains with essentially no overlap with the position&#x27;s requirements around consultative B2B/SaaS sales, revenue and P&amp;L ownership, and scaling large enterprise sales teams. Aside from a nominal leadership title and a Bachelor&#x27;s degree, the candidate fails to meet nearly every core qualification and responsibility. This is not a viable match, and the candidate should not advance for this specific role.</td></tr></table>", "s_b01beec52d": "<a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/BMn4RJRtdQLpgFtmCa9SQz.pdf</a>", "s_3ee9355a99": "<ul><li><table><tr><th>text_and_images</th><td># CONTACT\n\nEmail:\nsarah.vaugier@example.com\n\nLocation:\n\nLondon, UK\n\n\n## EDUCATION\n\nGraduate Gemologist\n(G.G.)\n\nGemological Institute of\n\nAmerica (GIA)\n\nB.A. Art History\nUniversity of Florence\n\n\n## EXPERTISE\n\n\u00b7 Colored Stone\nGrading\n\n\u00b7 Diamond Clarity &amp;\nColor\n\n\u00b7 Antique Jewelry\nValuation\n\n\u00b7 Exotic Leathers\n(Python, Crocodile)\n\n\u00b7 Synthetic Detection\n\nSARAH VAUGIER, G.G.\n\nSenior Gemologist &amp; Luxury Appraiser\n\n\n# PROFESSIONAL SUMMARY\n\nGIA Graduate Gemologist with a passion for rare stones and\nvintage luxury goods. 10 years of experience in auction\nhouses and high-end retail. Expert in gemstone\nidentification, synthetic detection, and the valuation of luxury\nfashion accessories.\n\n\n# WORK EXPERIENCE\n\n\n## Lab Director\n\nThe Diamond Vault | 2019 - Present\n\n\u00b7 Lead the authentication lab, verifying over 500 items per\nmonth.\n\n\u00b7 Specialist in distinguishing natural Burmese Rubies from\nflux-grown synthetics.\n\n\u00b7 Evaluated high-end glassware and crystal antiques for\nauction.\n\n\u00b7 Authored condition reports for vintage luxury bags,\nspecifically Herm\u00e8s and Chanel items in Python and\nOstrich skins.\n\nJunior Appraiser\nGold &amp; Estate Auctions | 2014 - 2019\n\n\u00b7 Assisted in the cataloging of estate jewelry collections.\n\n\u00b7 Studied the architecture and design periods of Art Deco\nand Victorian jewelry pieces.\n\n\u00b7 Used refractometers and microscopes to test stone\nproperties.\n\n\u00b7 Liaised with private sellers to establish reserve prices.\n</td></tr></table></li></ul>", "s_94605e0c51": "<table><tr><th>match_score</th><td>8.0</td></tr><tr><th>strengths</th><td>The candidate demonstrates several transferable, entry-level customer-facing competencies: retail sales, membership sales, cash handling, client communication, and customer service across multiple retail roles (American Eagle, Planet Beach, Heartbreaker, Victoria&#x27;s Secret). There is limited early evidence of interpersonal leadership\u2014assisting in training coworkers at Victoria&#x27;s Secret and being recognized twice as Employee of the Month at Planet Beach, which loosely relates to the coaching/talent development requirement. Exceptional communication and organizational skills are present, and the candidate meets the baseline Bachelor&#x27;s degree requirement (B.S. in Graphic Design with a strong 3.93 GPA and Dean&#x27;s List honors), which technically satisfies the &#x27;Bachelor&#x27;s degree required&#x27; qualification. Event promotion/brand ambassador work shows comfort engaging audiences, a distant relative of stakeholder engagement.</td></tr><tr><th>gaps</th><td>The candidate falls dramatically short of nearly every core requirement. The role demands 12+ years of progressive B2B sales experience with 5+ years at VP-level leadership; the candi // XSS-safe HTML escaping
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Make all links in a container open in new windows
function makeLinksOpenInNewWindow(container) {
    if (!container) return;
    const links = container.querySelectorAll('a');
    links.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
    });
}

// Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}

function applyPageTheme(theme) {
    const palette = themePalettes[theme]?.page || themePalettes.default.page;
    document.documentElement.style.setProperty('--bg-color', palette.bg);
    document.documentElement.style.setProperty('--text-color', palette.text);
    document.documentElement.style.setProperty('--label-color', palette.label);
    document.documentElement.style.setProperty('--border-color', palette.border);
    document.documentElement.style.setProperty('--border-hover', palette.borderHover);
    document.documentElement.style.setProperty('--select-bg', palette.selectBg);
    document.documentElement.style.setProperty('--container-bg', palette.containerBg);
}

function applyThemeColors(code, theme) {
    const palette = themePalettes[theme] || themePalettes.default;
    let result = code;

    // Replace classDef colors
    result = result.replace(
        /classDef\s+failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+controller\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef controller fill:${palette.controller.fill},stroke:${palette.controller.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe fill:${palette.pipe.fill},stroke:${palette.pipe.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe_failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe_failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+stuff\s+fill:[^,]+,stroke:[^,]+/g,
        `classDef stuff fill:${palette.stuff.fill},stroke:${palette.stuff.stroke}`
    );

    // Replace subgraph fill colors (style sg_xxx fill:#xxx)
    const subgraphColors = palette.subgraph;
    let colorIndex = 0;
    result = result.replace(
        /style\s+(sg_[^\s]+)\s+fill:#[a-fA-F0-9]+/g,
        (match, subgraphId) => {
            const color = subgraphColors[colorIndex % subgraphColors.length];
            colorIndex++;
            return `style ${subgraphId} fill:${color}`;
        }
    );

    return result;
}

function attachClickHandlers() {
    // Wait for mermaid to render, then attach click handlers
    setTimeout(() => {
        const svgContainer = document.querySelector('.mermaid svg');
        if (!svgContainer) return;

        // Find nodes by their flowchart IDs - use any available data source
        const allStuffIds = new Set([
            ...Object.keys(stuffDataJson || {}),
            ...Object.keys(stuffDataText || {}),
            ...Object.keys(stuffDataHtml || {})
        ]);

        for (const stuffId of allStuffIds) {
            // Mermaid generates IDs like 'flowchart-s_xxx-123'
            const nodes = svgContainer.querySelectorAll(`[id^="flowchart-${stuffId}"]`);
            nodes.forEach(node => {
                node.classList.add('clickable-stuff');
                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal(stuffId);
                });
            });
        }
    }, 500);
}

    applyPageTheme(theme);

    await mermaid.run({ nodes: [container] });
    attachClickHandlers();
}

function setFormat(format) {
    currentFormat = format;
    // Update tab styling
    document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${format}`).classList.add('active');
    // Re-render content if modal is open
    if (currentStuffId) {
        renderContent(currentStuffId, format);
    }
}

function renderContent(stuffId, format) {
    const content = document.getElementById('modal-content');
    content.classList.remove('html-content', 'text-content', 'pdf-content', 'image-content');

    // Handle PDF content type with embedded viewer
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];

    if (format === 'html' && contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            content.classList.add('pdf-content');
            content.innerHTML = '';
            const embed = document.createElement('embed');
            embed.src = pdfUrl;
            embed.type = 'application/pdf';
            embed.style.cssText = 'width:100%; height:100%; border:none; min-height:500px;';
            content.appendChild(embed);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    // Handle image content type
    if (format === 'html' && contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            content.classList.add('image-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = 'max-width:100%; max-height:100%; object-fit:contain;';
            img.alt = 'Image content';
            content.appendChild(img);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    if (format === 'json') {
        const data = stuffDataJson?.[stuffId];
        content.innerHTML = '';
        content.textContent = data ? JSON.stringify(data, null, 2) : 'No JSON data available';
    } else if (format === 'text') {
        const data = stuffDataText?.[stuffId];
        content.classList.add('text-content');
        content.innerHTML = '';
        content.textContent = data || 'No text data available';
    } else if (format === 'html') {
        const data = stuffDataHtml?.[stuffId];
        if (data) {
            content.classList.add('html-content');
            content.innerHTML = DOMPurify.sanitize(data);
            makeLinksOpenInNewWindow(content);
        } else {
            content.innerHTML = '';
            content.textContent = 'No HTML data available';
        }
    }

    updateOpenExternalButton(stuffId, contentType, jsonData);
}

// Update visibility of the "open in new window" button (PDF only)
function updateOpenExternalButton(stuffId, contentType, jsonData) {
    const openExternalBtn = document.getElementById('open-external-btn');
    if (!openExternalBtn) return;

    const url = extractUrl(jsonData);
    // Only show for PDFs (images are handled by the download button)
    const shouldShow = contentType === 'application/pdf' && !!url;
    openExternalBtn.style.display = shouldShow ? '' : 'none';
}

function updateTabAvailability(stuffId) {
    const jsonTab = document.getElementById('tab-json');
    const textTab = document.getElementById('tab-text');
    const htmlTab = document.getElementById('tab-html');

    jsonTab.disabled = !stuffDataJson?.[stuffId];
    textTab.disabled = !stuffDataText?.[stuffId];

    // For PDF and image content types, the tab can render from JSON data via extractUrl()
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];
    const canRenderFromJson = (contentType === 'application/pdf' || contentType?.startsWith('image/')) && extractUrl(jsonData);
    htmlTab.disabled = !stuffDataHtml?.[stuffId] && !canRenderFromJson;

    // Update HTML tab label based on content type
    if (contentType === 'application/pdf') {
        htmlTab.textContent = 'PDF';
    } else if (contentType?.startsWith('image/')) {
        htmlTab.textContent = 'Image';
    } else {
        htmlTab.textContent = 'HTML';
    }

    // Find first available format (HTML -> JSON -> Pretty)
    if (!htmlTab.disabled) return 'html';
    if (!jsonTab.disabled) return 'json';
    if (!textTab.disabled) return 'text';
    return 'html';
}

function showModal(stuffId) {
    currentStuffId = stuffId;
    const modal = document.getElementById('data-modal');
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    // Build title from metadata (name + concept as primary, ID as secondary)
    const meta = stuffMetadata?.[stuffId];
    if (meta && (meta.name || meta.concept)) {
        const primaryParts = [];
        if (meta.name) primaryParts.push(escapeHtml(meta.name));
        if (meta.concept) primaryParts.push(`(${escapeHtml(meta.concept)})`);
        const primary = `<span class="data-modal-title-primary">${primaryParts.join(' ')}</span>`;
        const secondary = `<span class="data-modal-title-secondary">${escapeHtml(stuffId)}</span>`;
        title.innerHTML = primary + secondary;
    } else {
        title.innerHTML = `<span class="data-modal-title-primary">${escapeHtml(stuffId)}</span>`;
    }

    // Update tab availability and select best format
    const availableFormat = updateTabAvailability(stuffId);

    // If current format is not available, switch to available one
    const currentTab = document.getElementById(`tab-${currentFormat}`);
    if (currentTab.disabled) {
        setFormat(availableFormat);
    } else {
        renderContent(stuffId, currentFormat);
    }

    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function hideModal() {
    document.getElementById('data-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    currentStuffId = null;
}

// Get current content based on format
function getCurrentContent() {
    if (!currentStuffId) return null;

    if (currentFormat === 'json') {
        const data = stuffDataJson?.[currentStuffId];
        if (!data) return null;
        return { content: JSON.stringify(data, null, 2), ext: 'json', mime: 'application/json' };
    } else if (currentFormat === 'text') {
        const data = stuffDataText?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'txt', mime: 'text/plain' };
    } else if (currentFormat === 'html') {
        const data = stuffDataHtml?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'html', mime: 'text/html' };
    }
    return null;
}

// Copy content to clipboard
function copyContent() {
    const data = getCurrentContent();
    if (!data) return;

    navigator.clipboard.writeText(data.content).then(() => {
        const btn = document.getElementById('copy-btn');
        const checkIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z' +
            'm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z' +
            'm0 16H8V7h11v14z"/></svg>';
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = copyIcon;
            btn.classList.remove('copied');
        }, 1500);
    });
}

// Download content as file
function downloadContent() {
    if (!currentStuffId) return;

    // Get name from metadata or use ID
    const meta = stuffMetadata?.[currentStuffId];
    const baseName = meta?.name || currentStuffId || 'data';
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    // For images, download the actual image file directly
    if (contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            const ext = contentType.split('/')[1] || 'png';
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${ext}`;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    // For PDFs, download the actual PDF file directly
    if (contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    const data = getCurrentContent();
    if (!data) return;

    const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${data.ext}`;
    const blob = new Blob([data.content], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Close modal when clicking overlay
document.getElementById('modal-overlay').addEventListener('click', hideModal);

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideModal();
});

// Open external URL for PDF content
function openExternal() {
    if (!currentStuffId) return;
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    if (contentType === 'application/pdf') {
        const url = extractUrl(jsonData);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }
}
