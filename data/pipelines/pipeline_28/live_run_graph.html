                      "text": "# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n"

                      "text": "\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00b7 Relocation assistance available</td>\n</tr>\n</table>\n"

        "rendered_user_prompt": "Analyze the following job offer content and extract the key requirements for the position.\n\n<job_offer_pages>\n\n \u2022 item #1:\n\n# text_and_images\n\n## text\n\n### text\n\n# Vice President, Enterprise Sales\n\nACME \u00b7 San Francisco, CA (Hybrid)\nFull-time . Executive Level\n\n\n## About ACME\n\nACME is the global leader in CRM, empowering companies to connect with their customers in entirely new ways.\nBuilt on our core values of Trust, Customer Success, Innovation, and Equality, we're transforming how businesses\nengage with their customers across sales, service, marketing, and more.\n\n\n## The Opportunity\n\nWe're seeking an exceptional Vice President of Enterprise Sales to lead our North American Enterprise\nsegment and drive the next phase of our growth. This is a high-impact role where you'll build and scale a world-\nclass sales organization, own significant revenue accountability, and work directly with C-suite executives at\nFortune 500 companies.\n\nAs VP of Enterprise Sales, you'll lead 60+ enterprise account executives, own $180M+ in ARR quota, and play a\ncritical role in shaping our go-to-market strategy. This is an opportunity to make your mark at one of the world's\nmost innovative technology companies.\n\n\n## What You'll Do\n\n\u00b7 Lead & Scale: Build and develop a high-performing team of 60+ enterprise sales professionals across multiple\nregions\n\n\u00b7 Drive Revenue: Own and deliver $180M+ ARR with full P&L accountability and strategic planning\nresponsibility\n\n\u00b7 Strategic Execution: Develop and implement sales strategies that accelerate pipeline growth and increase\nwin rates\n\n\u00b7 Customer Relationships: Build and maintain executive relationships with C-level stakeholders at our largest\naccounts\n\n\u00b7 Sales Excellence: Drive operational rigor through accurate forecasting, process optimization, and data-driven\ndecision making\n\n\u00b7 Talent Development: Coach, mentor, and develop the next generation of sales leaders\n\n\u00b7 Cross-functional Leadership: Partner with Product, Marketing, Customer Success, and Channel teams to\ndeliver integrated solutions\n\n\u00b7 Innovation: Champion new sales methodologies, tools, and approaches that improve team productivity\n\n\n## What You Bring\n\n\n### Required Qualifications\n\n\u00b7 12+ years of progressive B2B sales experience with at least 5 years in VP-level or equivalent leadership roles\n\n\u00b7 Proven track record of building and scaling enterprise sales teams of 50+ people\n\n\u00b7 Demonstrated success managing $100M+ ARR quotas and consistently exceeding targets\n\n\u00b7 Deep expertise in complex, consultative sales with 6-12 month sales cycles\n\n<!-- PageBreak -->\n\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n \u2022 item #2:\n\n# text_and_images\n\n## text\n\n### text\n\n\u00b7 Experience selling SaaS solutions to Fortune 500 enterprises\n\n\u00b7 Strong executive presence with ability to engage C-suite buyers\n\n\u00b7 Bachelor's degree required; MBA preferred\n\n\n### What Sets You Apart\n\n\u00b7 Experience in CRM, cloud infrastructure, or enterprise software markets\n\n\u00b7 Track record of building sales teams from early stage through scale\n\n\u00b7 Expertise in account-based selling and strategic account management\n\n\u00b7 Strong analytical skills with proficiency in ACME, sales analytics tools\n\n\u00b7 History of developing talent - multiple direct reports promoted to leadership roles\n\n\u00b7 Experience with channel/partner sales models\n\n\u00b7 Passion for coaching and developing high-performing teams\n\n\n### Leadership Competencies\n\n\u00b7 Strategic thinking and business acumen\n\n\u00b7 Exceptional communication and executive presence\n\n\u00b7 Data-driven decision making\n\n\u00b7 Change management and organizational development\n\n\u00b7 Cross-functional collaboration\n\n\u00b7 Diversity, equity, and inclusion advocacy\n\n\n### Compensation & Benefits\n\n\n#### Total Target Compensation: $975,000\n\n\u00b7 Base Salary: $325,000\n\n\u00b7 Variable Compensation: $650,000 (at 100% quota attainment)\n\n\u00b7 Equity: RSU grant valued at $500,000 (4-year vesting)\n\n\u00b7 Sign-on Bonus: $100,000\n\n\n#### Comprehensive Benefits Package\n\n\n<table>\n<tr>\n<td>\u00b7 Premium medical, dental, and vision coverage</td>\n<td>\u00b7 401(k) with 6% company match</td>\n</tr>\n<tr>\n<td>\u00b7 Flexible PTO policy</td>\n<td>\u00b7 $5,000 annual professional development budget</td>\n</tr>\n<tr>\n<td>\u00b7 Executive coaching program</td>\n<td>\u00b7 Wellness reimbursement ($1,200/year)</td>\n</tr>\n<tr>\n<td>\u00b7 8 paid volunteer days (VTO)</td>\n<td>\u00b7 Paid parental leave (26 weeks primary caregiver)</td>\n</tr>\n<tr>\n<td>\u00b7 Employee stock purchase plan (15% discount)</td>\n<td>\u00b7 Relocation assistance available</td>\n</tr>\n</table>\n\n\n## images: \n\n## raw_html: None\n\n# page_view: None\n\n</job_offer_pages>\n\n---\nThe instance we want to generate will be for the following class:\nclass cv_batch_screening__JobRequirements(StructuredContent):\n    \"\"\"A structured summary of what a job position requires from candidates.\"\"\"\n    required_skills: str  # Skills that are mandatory for the position\n    responsibilities: str  # Main duties and tasks of the role\n    qualifications: str  # Required education, certifications, or experience levels\n    nice_to_haves: str | None = None  # Preferred but not mandatory qualifications\n\nDO NOT create information.\nIf some information is not present for an attribute, output the default value or None according to the attribute definition.",

                      "text": "# CONTACT\n\nEmail:\nsarah.vaugier@example.com\n\nLocation:\n\nLondon, UK\n\n\n## EDUCATION\n\nGraduate Gemologist\n(G.G.)\n\nGemological Institute of\n\nAmerica (GIA)\n\nB.A. Art History\nUniversity of Florence\n\n\n## EXPERTISE\n\n\u00b7 Colored Stone\nGrading\n\n\u00b7 Diamond Clarity &\nColor\n\n\u00b7 Antique Jewelry\nValuation\n\n\u00b7 Exotic Leathers\n(Python, Crocodile)\n\n\u00b7 Synthetic Detection\n\nSARAH VAUGIER, G.G.\n\nSenior Gemologist & Luxury Appraiser\n\n\n# PROFESSIONAL SUMMARY\n\nGIA Graduate Gemologist with a passion for rare stones and\nvintage luxury goods. 10 years of experience in auction\nhouses and high-end retail. Expert in gemstone\nidentification, synthetic detection, and the valuation of luxury\nfashion accessories.\n\n\n# WORK EXPERIENCE\n\n\n## Lab Director\n\nThe Diamond Vault | 2019 - Present\n\n\u00b7 Lead the authentication lab, verifying over 500 items per\nmonth.\n\n\u00b7 Specialist in distinguishing natural Burmese Rubies from\nflux-grown synthetics.\n\n\u00b7 Evaluated high-end glassware and crystal antiques for\nauction.\n\n\u00b7 Authored condition reports for vintage luxury bags,\nspecifically Herm\u00e8s and Chanel items in Python and\nOstrich skins.\n\nJunior Appraiser\nGold & Estate Auctions | 2014 - 2019\n\n\u00b7 Assisted in the cataloging of estate jewelry collections.\n\n\u00b7 Studied the architecture and design periods of Art Deco\nand Victorian jewelry pieces.\n\n\u00b7 Used refractometers and microscopes to test stone\nproperties.\n\n\u00b7 Liaised with private sellers to establish reserve prices.\n"
