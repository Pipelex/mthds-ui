es-for-outreach/) roundup.\n### Template 5: Follow-up meeting request  \n**Subject:** Following up: \\[original topic]  \nHi \\[Name],  \nI reached out last week about \\[topic]. I know you're busy, so I'll keep this short.  \nSince then, I came across \\[new relevant insight/data point] that I think would be valuable for \n\\[their specific situation]. Worth a 10-minute call?  \nIf the timing isn't right, no worries at all. Just let me know.  \n\\[Your name]  \nSkip the manual outreach  \nMentionAgent automatically finds relevant prospects, writes personalized emails, and handles \nfollow-ups. Get meetings booked without the busywork.  \n[Start Getting Mentioned On Autopilot](https://mentionagent.ai/#pricing)\n\nHow to Write Meeting Request Emails + Examples | SalesAR \n(https://salesar.io/blog/how-to-write-meeting-request-emails-examples)\n  Clear and effective communication is not just a desirable skill but an essential one. It acts as \nthe cornerstone of efficient collaborations, bridging gaps between diverse teams and driving \ntargeted results. At the heart of this communication spectrum lies the \u2018meeting request email\u2019.  \nThese emails do more than merely seek a slot in someone\u2019s calendar. They are a formalized invitation\nfor collective problem-solving, an avenue for brainstorming and innovation, a catalyst for project \nadvancements, and an opportunity for team alignment. Crafting a precise, well-structured meeting \nrequest email is a testament to one\u2019s professionalism. It signifies respect for the recipient\u2019s \ntime, ensuring they have all the requisite information to prepare and engage in a meaningful \ndiscussion.  \nWith the rise of remote work and global collaborations, the humble meeting request email has \nevolved. No longer is it just about fixing a time to sit in a conference room, it\u2019s about syncing \nacross time zones, selecting appropriate virtual platforms, and ensuring accessibility for all \nstakeholders. This evolution underscores the importance of mastering the art of crafting these \nemails and adapting to modern challenges and expectations.\n## Meeting Request Email Examples  \nLet\u2019s walk through some practical examples of meeting request emails, considering various scenarios \nand audiences.\n### Urgent Meeting Request with Senior Management  \n*Subject:* Immediate Meeting Required: Addressing Q1 Sales Decline  \nDear {{Recipient\u2019s Last Name}},  \nI\u2019m reaching out to request an urgent discussion regarding the unforeseen decline in our Q1 sales \nfigures. I believe collaborative brainstorming can help us pinpoint issues and devise a recovery \nstrategy.  \n- Objective: Analyze Q1 sales data and strategize recovery\n- Proposed Time: At your earliest convenience this week\n- Duration: 60 minutes  \nKindly let me know your availability, and I\u2019ll coordinate accordingly. I understand the urgency and \nassure you that I\u2019ve assembled all the necessary data to make our discussion efficient and \nactionable.  \nThank you for your prompt attention to this matter.  \nSincerely, {{Your Name}}\n\n36 Best Meeting Request Email Templates [Free + Examples] \n(https://smartreach.io/blog/meeting-request-email-template/)\n  ### Urgent meeting request email template  \n**When to use this**: Only for genuinely time-sensitive matters requiring immediate attention, \ncrises, urgent decisions, or critical issues. Overusing \u201curgent\u201d reduces your credibility.  \nSubject: Urgent Meeting Request: \\[Meeting Topic]  \nDear \\[Name]  \nThis email is regarding an urgent matter concerning \\[Meeting Topic]. It requires immediate \nattention and discussion.  \nWould you be available for a meeting as soon as possible? I\u2019m flexible and can adjust my schedule to\naccommodate yours.  \nPlease let me know your availability.  \nThanks  \n\\[Your Name]\n### Follow Up meeting request email template  \n**When to use this**: When you haven\u2019t received a response to your initial meeting request after 3-5\nbusiness days. Keep it brief, reference your original email, and offer new time options.  \nSubject: Following Up: Meeting Request \u2013 \\[Original Meeting Topic]  \nDear \\[Name]  \nI hope this email finds you well.  \nI\u2019m following up on my previous email requesting a meeting to discuss \\[Original Meeting Topic]. I \nunderstand you may be busy, but I believe a conversation on this topic could be very beneficial.  \nAre you available for a meeting sometime next week? I\u2019m flexible and can work around your schedule. \nThank you for your time and consideration.  \nBest regards  \n\\[Your Name]\n### How far in advance should I send a meeting request email?  \nIt\u2019s best to send an email at least one to two weeks in advance. This gives the recipient enough \ntime to consider the request, check their schedule, and prepare for the meeting.\n\nHow to Requests Meetings Through Cold Emails | Mailarrow \n(https://mailarrow.com/cold-call-email-for-meeting/)\n  ## Crafting Compelling Subject Lines  \nThe importance of compelling subject lines in business meeting request emails, cannot be overstated.\nA great subject line should be captivating, genuine, and create a sense of urgency or curiosity. \nHere are a few ideas for irresistible subject lines:  \n- \u201cExploring synergies between \\[recipient\u2019s company] and \\[your company name]\u201d\n- \u201c\\[Your company name] offers solutions for \\[recipient\u2019s main pain point]\u201d\n- \u201cLet\u2019s discuss \\[benefit] for \\[recipient\u2019s company] next week\u201d  \nRemember, the right person receiving the email may be inundated with numerous other emails, so it\u2019s \ncrucial to stand out. Make the subject line personal, clear, and appealing, and your cold email is \nmore likely to be opened.  \nThe body of your cold email should be professional, yet personable, addressing the recipient\u2019s main \npain point and introducing your company\u2019s solutions.  \nA personalized email can make the recipient feel unique and valued, increasing the chances of a \ngreat response. Let\u2019s take a look at a cold email template for a business meeting request:  \n> Subject: Solving \\[Main Pain Point] at \\[Recipient\u2019s Company] \u2013 Quick Meeting?\n>\n> Hi \\[Recipient\u2019s First Name],\n>\n> I\n>\n> [hope this email finds you well](). My name is \\[Your Name] and I work at \\[Your Company], where \nwe specialize in \\[Your Area of Expertise].\n>\n## The Power of Meeting Request Email Templates  \nA great meeting request email can open doors for new business opportunities. Having a set of \neffective meeting request email templates at your disposal can help streamline the process and \nincrease efficiency.  \nHowever, while using templates, it\u2019s crucial to personalize each email to avoid sounding like a \nrobot.\n## Leveraging Networking Events  \nNetworking events present a unique opportunity to meet prospective clients in person. You can follow\nup on these events by sending a business meeting request email, recalling your encounter, and \nsuggesting an in-depth discussion about potential collaborations.  \nHere\u2019s a meeting request email template for such scenarios:  \n> Subject Line: Continuing Our Conversation from \\[Event]\n>\n> Hi \\[Recipient\u2019s Name],\n>\n> It was great meeting you at \\[Event] last week. Our conversation about \\[Pain Point or Discussion]\nsparked some valuable insights that I believe could benefit \\[Recipient\u2019s Company].\n>\n> Would you be open to a quick meeting to discuss this further? I\u2019m available on \\[Date and Time], \nbut I\u2019m flexible to accommodate your schedule.\n>\n> Looking forward to hearing from you.\n>\n> Kind regards, \\[Your Name]\n\n3 Meeting Request Email Templates for your Leads &amp; Clients \n(https://www.appointlet.com/blog/meeting-request-emails)\n  ### **Tips for composing a Meeting Request Email (that actually work)**  \nHere are some of the most important things to keep in mind when you\u2019re crafting a new meeting \nrequest email, regardless of who the recipient is.  \n1. Write an engaging[email subject \nline](https://www.appointlet.com/blog/sales-email-subject-lines-how-to-increase-your-click-through-r\nate)for better open rates\n2. Make sure you\u2019re contacting a decision maker with the right contact information. Verify their \naddress using email verification tools.\n3. Craft customizable messages according to the recipient. An [email \ngenerator](https://www.hostinger.com/ai-email-generator)can help you speed this up.\n4. Send your email at a convenient time of day\n5. Keep the meeting purpose well defined\n6. Communicate clear expectations in the body of your email by [rephrasing your \nsentences](https://www.duplichecker.com/paraphrase-tool.php)to keep them in an active voice\n7. Set up an email calendar for yourself (to better track your availability)\n8. Use an [online scheduling tool](https://www.appointlet.com/blog/schedule-a-meeting)to present \npotential meeting dates\n9. Improve your response rates with an offer to answer any lingering questions\n### Meeting Request Email **#1: The Warm Lead**  \nIf you\u2019ve already met with someone previously or had a few interactions via email, then you can take\na different approach to the business meeting request email. It doesn\u2019t need to be quite as formal, \nbut the value of the call should still be clearly stated. And just like before, you\u2019ll want to use \nan online scheduling tool to speed up the actual scheduling process. This helps streamline the \nregistration process.  \nHere is an email template you can literally copy and paste, though we recommend making changes as \nneeded to fit your business model.  \n> *Dear {client-name},It was nice speaking with you last week. After reviewing the {company-name} \nwebsite, I am confident that we can help you to save time and grow your business quickly with just a\nfew updates.In fact, earlier this year we helped another client with a similar problem streamline \ntheir operations and increase sales by more than 250% in the first three months. We can work with \nyou to create similar results.Since you already have a general sense of how our services work, I\u2019d \nlove to get on a phone call with you next week to provide a full product demo.Pleaseclick here*to \nschedule a quick chat and discuss this opportunity in more detail.*If you have any other questions \nbefore we jump on a call, just let me know!*\n### Meeting Request Email **#2: The Warm Customer**  \nThe average customer already knows who you are and the value that they should be getting from your \nservice.  \n*The customer supportmeetingrequestemailsample*  \nTypically a meeting request email goes out when customer support has been escalated to a success \nmanager. A brief but professional email might look something like this:  \n> *first-name,That sounds good.Let\u2019s book a time to talk so we can review all the details of your \nrequest. Once we have all that information, I\u2019ll work with our team to get this taken care \nof.Pleaseclick here*to schedule your meeting.*Talk soon!*\n\nBook More Calls Using 40 Sales Meeting Request Email Templates \n(https://www.getmagical.com/blog/meeting-request-email-templates)\n  ### Template 8 - Availability for meeting request  \nHello \\[Recipient's name],  \nI hope this email finds you well. I'm reaching out to you regarding a meeting I'm organizing to \ndiscuss \\[insert details].  \nIf possible, could you please provide me with your availability for the next two weeks? Once I've \ngathered everyone's availability, I'll select a date and send out a calendar invite.  \nThank you, and I look forward to hearing from you.  \nBest regards, \\[Your name]\n### Template 10 - Introduction meeting request  \nDear \\[Recipient's name],  \nI hope this email finds you well. I'm writing to request a meeting with you to introduce my new \ncolleague, \\[name], who has recently joined us as \\[job title].  \nWe're excited to have \\[name] on board, and we believe that she will make a significant impact on \nour working relationship.  \nCould you please let me know your availability for next week, and I will arrange a time that works \nfor all of us.  \nThank you for your time, and I look forward to hearing back from you soon.  \nBest regards, \\[Your name]\n### Template 16 - Urgent meeting request  \nHello \\[Recipient's name],  \nI am writing to request an urgent meeting with you to discuss \\[insert details].  \nGiven the urgency of the matter, I suggest we meet on \\[insert details]. Please let me know if this \ndate and time works for you. If not, please suggest an alternative time that works for both of us.  \nThank you for your prompt attention to this matter.  \nBest regards, \\[Your name]\n", "s_6cdaba09ca": " Attribute \u2503 Value                                                              \n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2547\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n subject   \u2502 Urgent: Project Alpha Status Meeting Required \u2013 Action Needed      \n           \u2502 Within 24 Hours                                                    \n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u250 ef=\"https://www.sequenzy.com/blog/how-to-write-a-meeting-request-email\" class=\"msg-document\">How to Write a Meeting Request Email (Templates &amp; Examples) | Sequenzy</a><br/><small>Subject: Reschedule Request: [Original Meeting Name] - New Time Suggestions ... I apologize, but I need to reschedule our meeting originally planned for Tuesday at 2 PM. An urgent client situation came up that I need to address.\nI&#39;m available most days next week and happy to work around your schedule. ... For more on writing effective partnership outreach, see our guide on how to write a business proposal email. Subject: Reschedule Request: [Original Meeting Name] - New Time Suggestions ... I apologize, but I need to reschedule our meeting originally planned for Tuesday at 2 PM. An urgent client situation came up that I need to address.\nLearn how to write meeting request emails that get accepted. Templates for internal meetings, client meetings, informational interviews, and rescheduling requests.\nThe average professional attends 15-20 meetings per week, and most of them feel unproductive. This means your recipient&#39;s default response to &#34;Can we schedule a meeting?&#34; is &#34;Do we really need to?&#34; Your meeting request email must overcome that default by proving three things:\nRequesting too many meetings. If you&#39;re requesting meetings with the same person more than once a week, consolidate.</small></li><li><a href=\"https://www.indeed.com/career-advice/career-development/how-to-schedule-a-meeting-by-email\" class=\"msg-document\">How To Schedule a Meeting by Email (With Templates) | Indeed.com</a><br/><small>If you have a common acquaintance ... name.]I would love to meet for [breakfast/coffee/lunch in your office/in my office/somewhere else] sometime [name a period of time, such as \u201cnext week\u201d], if that works for you.Please let ...\nIf you have a common acquaintance who referred you, this is a good time to mention that name.]I would love to meet for [breakfast/coffee/lunch in your office/in my office/somewhere else] sometime [name a period of time, such as \u201cnext week\u201d], if that works for you.Please let me know when and where you would prefer to meet. I look forward to speaking to you in person.Sincerely, [Your Name]Related: How to Take and Deliver Meeting Minutes \u00b7 Here are three sample email meeting requests you could use to help inspire you to write your own:\nMy work shift begins at 11 a.m., and I take a lunch break at 2 p.m., so I would be available to meet at 10 a.m. or 2 p.m. on any weekday next week. I would be happy to come up to your office, but please let me know if you prefer to meet elsewhere. Thank you very much.Sincerely, Aleisha Johnson \u00b7 Subject: Meeting with Rep. Walton, Re: Water Restrictions; Reply RequestedDear Mr.\nI met your friend Brian Wallace at a town hall meeting last night, and he informed me that I might be able to help you relocate your office. I have successfully found new homes for several local businesses with complicated needs, including a brewery and a nonprofit children\u2019s preschool, so I am confident that I can assist you. I would love to meet you over lunch one day next week, perhaps at Straub\u2019s Steakhouse near your present office.\nFor example, you can use subject lines like &#34;Request to set up a meeting,&#34; &#34;Please respond regarding the best meeting time,&#34; or &#34;Claire Hollowell suggested we meet.&#34; Using a businesslike format is always proper in a work setting, so start your email with a salutation as you would with a business letter. Generally, you can use their first and last names: \u201cHello Jane Smith.\u201d If you are inviting multiple people, you can use a group title, such as \u201cHello Marketing Department.\u201dRelated: How to Address a Cover Letter (With Examples)</small></li><li><a href=\"https://prospeo.io/s/urgent-meeting-request-email\" class=\"msg-document\">Urgent Meeting Request Email: Templates That Work (2026)</a><br/><small>You need to send an urgent meeting request email - today. The problem? One study found 83% of meeting request emails never get a response. Most templates floating around are built for &amp;quot;sometime next week,&amp;quot; not a time-sensitive request that needs a yes in the next two hours.\nSend an urgent meeting request email that gets a yes in hours. Copy-paste templates, subject lines, and follow-up tactics for 2026.\nIf your request can survive a vague deadline, it&#39;s not urgent. Don&#39;t dress it up as one. Aim for 50-60 characters and lead with the decision + deadline. Meeting-request templates can hit ~46% open rates, while a typical B2B baseline sits closer to ~15%. If your opens are low, the subject line is the first thing to fix. ... Avoid spammy urgency. About 16.9% of emails never reach the inbox, and &#34;URGENT!!!&#34; style subjects make it worse.\nEmail is async. If you need a sync answer, act like it. Call instead when you need a response in under 15 minutes, when you&#39;ve followed up once and still have no reply after an hour, or when missing the deadline is irreversible - a lost client, a missed launch, a compliance breach. Then send the urgent meeting request email afterward as documentation.\nYour urgent meeting request is useless if it bounces. Verify emails with 98% accuracy before you hit send.Verify Emails Free \u2192</small></li><li><a href=\"https://fireflies.ai/blog/writing-a-meeting-request-email/\" class=\"msg-document\">Writing Meeting Request Emails: A Step-By-Step Guide</a><br/><small>Subject: Request for a meeting regarding possible product collaboration Hi [Prospect], Thank you for your interest in (Your company)! Here are answers to some of the questions you asked in your last email: - USP of (Your Company) - Use cases from other customers from the same field/expertise - Answer to any other specific question To explore how (Your solution) can help your business, I would like to invite you to a 30-minute meeting to assess if our solution is the right fit for your company and give you a quick demo of our product and its capabilities.\nCalling an urgent meeting can be a challenge as everyone&#39;s schedules are often packed. It&#39;s crucial to communicate why your meeting is a priority and ensure that it stays focused on the key issues. ... Subject: [URG] Request for a meeting regarding [matter to be discussed] Hi [Name], I am reaching out to request an urgent meeting with you regarding [issue at hand]. I want to discuss [the problem] with you all as it requires our immediate attention.\nSubject: Request for a meeting regarding possible product collaboration Hi [Prospect], Thank you for your interest in (Your company)! Here are answers to some of the questions you asked in your last email: - USP of (Your Company) - Use cases from other customers from the same field/expertise - Answer to any other specific question To explore how (Your solution) can help your business, I would like to invite you to a 30-minute meeting to assess if our solution is the right fit for your company and give you a quick demo of our product and its capabilities.\nCrafting a well-written email can make all the difference in setting the tone for a productive meeting and achieving your goals. You don&#39;t want to come across as too pushy or unprofessional. In this blog, we will cover some dos and don&#39;ts of writing a great meeting request email.\nJumping into the contents of your email before greeting your recipient can make you seem abrupt and/or cold. Similar to the &#34;hello&#34;s you say during a phone call, a salutation personalizes your meeting request email.</small></li><li><a href=\"https://www.saleshandy.com/blog/meeting-request-email/\" class=\"msg-document\">Meeting Request Email That Gets Replies, 10 Templates</a><br/><small>When to use: You sent a meeting request 3-5 days ago and have not received a response. ... I wanted to follow up on my email from last [Day] about [ u2019s professionalism. It signifies respect for the recipient\u2019s time, ensuring they have all the requisite information to prepare and engage in a meaningful discussion.  \nWith the rise of remote work and global collaborations, the humble meeting request email has evolved. No longer is it just about fixing a time to sit in a conference room, it\u2019s about syncing across time zones, selecting appropriate virtual platforms, and ensuring accessibility for all stakeholders. This evolution underscores the importance of mastering the art of crafting these emails and adapting to modern challenges and expectations.\n## Meeting Request Email Examples  \nLet\u2019s walk through some practical examples of meeting request emails, considering various scenarios and audiences.\n### Urgent Meeting Request with Senior Management  \n*Subject:* Immediate Meeting Required: Addressing Q1 Sales Decline  \nDear {{Recipient\u2019s Last Name}},  \nI\u2019m reaching out to request an urgent discussion regarding the unforeseen decline in our Q1 sales figures. I believe collaborative brainstorming can help us pinpoint issues and devise a recovery strategy.  \n- Objective: Analyze Q1 sales data and strategize recovery\n- Proposed Time: At your earliest convenience this week\n- Duration: 60 minutes  \nKindly let me know your availability, and I\u2019ll coordinate accordingly. I understand the urgency and assure you that I\u2019ve assembled all the necessary data to make our discussion efficient and actionable.  \nThank you for your prompt attention to this matter.  \nSincerely, {{Your Name}}</small></li><li><a href=\"https://smartreach.io/blog/meeting-request-email-template/\" class=\"msg-document\">36 Best Meeting Request Email Templates [Free + Examples]</a><br/><small>### Urgent meeting request email template  \n**When to use this**: Only for genuinely time-sensitive matters requiring immediate attention, crises, urgent decisions, or critical issues. Overusing \u201curgent\u201d reduc ates</a><br/><small>### Template 8 - Availability for meeting request  \nHello \\[Recipient&#39;s name],  \nI hope this email finds you well. I&#39;m reaching out to you regarding a meeting I&#39;m organizing to discuss \\[insert details].  \nIf possible, could you please provide me with your availability for the next two weeks? Once I&#39;ve gathered everyone&#39;s availability, I&#39;ll select a date and send out a calendar invite.  \nThank you, and I look forward to hearing from you.  \nBest regards, \\[Your name]\n### Template 10 - Introduction meeting request  \nDear \\[Recipient&#39;s name],  \nI hope this email finds you well. I&#39;m writing to request a meeting with you to introduce my new colleague, \\[name], who has recently joined us as \\[job title].  \nWe&#39;re excited to have \\[name] on board, and we believe that she will make a significant impact on our working relationship.  \nCould you please let me know your availability for next week, and I will arrange a time that works for all of us.  \nThank you for your time, and I look forward to hearing back from you soon.  \nBest regards, \\[Your name]\n### Template 16 - Urgent meeting request  \nHello \\[Recipient&#39;s name],  \nI am writing to request an urgent meeting with you to discuss \\[insert details].  \nGiven the urgency of the matter, I suggest we meet on \\[insert details]. Please let me know if this date and time works for you. If not, please suggest an alternative time that works for both of us.  \nThank you for your prompt attention to this matter.  \nBest regards, \\[Your name]</small></li></ul></div>", "s_6cdaba09ca": "<table><tr><th>subject</th><td>Urgent: Project Alpha Status Meeting Required \u2013 Action Needed Within 24 Hours</td></tr><tr><th>priority</th><td>needs_review</td></tr><tr><th>summary</th><td>An urgent meeting request regarding a significant change in the Project Alpha timeline. The sender requests immediate attention to discuss strategy adjustments and agree on next st // Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}

function applyPageTheme(theme) {
    const palette = themePalettes[theme]?.page || themePalettes.default.page;
    document.documentElement.style.setProperty('--bg-color', palette.bg);
    document.documentElement.style.setProperty('--text-color', palette.text);
    document.documentElement.style.setProperty('--label-color', palette.label);
    document.documentElement.style.setProperty('--border-color', palette.border);
    document.documentElement.style.setProperty('--border-hover', palette.borderHover);
    document.documentElement.style.setProperty('--select-bg', palette.selectBg);
    document.documentElement.style.setProperty('--container-bg', palette.containerBg);
}

function applyThemeColors(code, theme) {
    const palette = themePalettes[theme] || themePalettes.default;
    let result = code;

    // Replace classDef colors
    result = result.replace(
        /classDef\s+failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+controller\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef controller fill:${palette.controller.fill},stroke:${palette.controller.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe fill:${palette.pipe.fill},stroke:${palette.pipe.stroke}`
    );
    result = result.replace(
        /classDef\s+pipe_failed\s+fill:[^,]+,stroke:[^\s\n]+/g,
        `classDef pipe_failed fill:${palette.failed.fill},stroke:${palette.failed.stroke}`
    );
    result = result.replace(
        /classDef\s+stuff\s+fill:[^,]+,stroke:[^,]+/g,
        `classDef stuff fill:${palette.stuff.fill},stroke:${palette.stuff.stroke}`
    );

    // Replace subgraph fill colors (style sg_xxx fill:#xxx)
    const subgraphColors = palette.subgraph;
    let colorIndex = 0;
    result = result.replace(
        /style\s+(sg_[^\s]+)\s+fill:#[a-fA-F0-9]+/g,
        (match, subgraphId) => {
            const color = subgraphColors[colorIndex % subgraphColors.length];
            colorIndex++;
            return `style ${subgraphId} fill:${color}`;
        }
    );

    return result;
}

            content.classList.add('image-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = 'max-width:100%; max-height:100%; object-fit:contain;';
            img.alt = 'Image content';
            content.appendChild(img);
            updateOpenExternalButton(stuffId, contentType, jsonData);
            return;
        }
    }

    if (format === 'json') {
        const data = stuffDataJson?.[stuffId];
        content.innerHTML = '';
        content.textContent = data ? JSON.stringify(data, null, 2) : 'No JSON data available';
    } else if (format === 'text') {
        const data = stuffDataText?.[stuffId];
        content.classList.add('text-content');
        content.innerHTML = '';
        content.textContent = data || 'No text data available';
    } else if (format === 'html') {
        const data = stuffDataHtml?.[stuffId];
        if (data) {
            content.classList.add('html-content');
            content.innerHTML = DOMPurify.sanitize(data);
            makeLinksOpenInNewWindow(content);
        } else {
            content.innerHTML = '';
            content.textContent = 'No HTML data available';
        }
    }

    updateOpenExternalButton(stuffId, contentType, jsonData);
}

// Update visibility of the "open in new window" button (PDF only)
function updateOpenExternalButton(stuffId, contentType, jsonData) {
    const openExternalBtn = document.getElementById('open-external-btn');
    if (!openExternalBtn) return;

    const url = extractUrl(jsonData);
    // Only show for PDFs (images are handled by the download button)
    const shouldShow = contentType === 'application/pdf' && !!url;
    openExternalBtn.style.display = shouldShow ? '' : 'none';
}

function updateTabAvailability(stuffId) {
    const jsonTab = document.getElementById('tab-json');
    const textTab = document.getElementById('tab-text');
    const htmlTab = document.getElementById('tab-html');

    jsonTab.disabled = !stuffDataJson?.[stuffId];
    textTab.disabled = !stuffDataText?.[stuffId];

    // For PDF and image content types, the tab can render from JSON data via extractUrl()
    const contentType = stuffContentType?.[stuffId];
    const jsonData = stuffDataJson?.[stuffId];
    const canRenderFromJson = (contentType === 'application/pdf' || contentType?.startsWith('image/')) && extractUrl(jsonData);
    htmlTab.disabled = !stuffDataHtml?.[stuffId] && !canRenderFromJson;

    // Update HTML tab label based on content type
    if (contentType === 'application/pdf') {
        htmlTab.textContent = 'PDF';
    } else if (contentType?.startsWith('image/')) {
        htmlTab.textContent = 'Image';
    } else {
        htmlTab.textContent = 'HTML';
    }

    // Find first available format (HTML -> JSON -> Pretty)
    if (!htmlTab.disabled) return 'html';
    if (!jsonTab.disabled) return 'json';
    if (!textTab.disabled) return 'text';
    return 'html';
}

function showModal(stuffId) {
    currentStuffId = stuffId;
    const modal = document.getElementById('data-modal');
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    // Build title from metadata (name + concept as primary, ID as secondary)
    const meta = stuffMetadata?.[stuffId];
    if (meta && (meta.name || meta.concept)) {
        const primaryParts = [];
        if (meta.name) primaryParts.push(escapeHtml(meta.name));
        if (meta.concept) primaryParts.push(`(${escapeHtml(meta.concept)})`);
        const primary = `<span class="data-modal-title-primary">${primaryParts.join(' ')}</span>`;
        const secondary = `<span class="data-modal-title-secondary">${escapeHtml(stuffId)}</span>`;
        title.innerHTML = primary + secondary;
    } else {
        title.innerHTML = `<span class="data-modal-title-primary">${escapeHtml(stuffId)}</span>`;
    }

    // Update tab availability and select best format
    const availableFormat = updateTabAvailability(stuffId);

    // If current format is not available, switch to available one
    const currentTab = document.getElementById(`tab-${currentFormat}`);
    if (currentTab.disabled) {
        setFormat(availableFormat);
    } else {
        renderContent(stuffId, currentFormat);
    }

    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function hideModal() {
    document.getElementById('data-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    currentStuffId = null;
}

// Get current content based on format
function getCurrentContent() {
    if (!currentStuffId) return null;

    if (currentFormat === 'json') {
        const data = stuffDataJson?.[currentStuffId];
        if (!data) return null;
        return { content: JSON.stringify(data, null, 2), ext: 'json', mime: 'application/json' };
    } else if (currentFormat === 'text') {
        const data = stuffDataText?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'txt', mime: 'text/plain' };
    } else if (currentFormat === 'html') {
        const data = stuffDataHtml?.[currentStuffId];
        if (!data) return null;
        return { content: data, ext: 'html', mime: 'text/html' };
    }
    return null;
}

// Copy content to clipboard
function copyContent() {
    const data = getCurrentContent();
    if (!data) return;

    navigator.clipboard.writeText(data.content).then(() => {
        const btn = document.getElementById('copy-btn');
        const checkIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24">' +
            '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z' +
            'm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z' +
            'm0 16H8V7h11v14z"/></svg>';
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = copyIcon;
            btn.classList.remove('copied');
        }, 1500);
    });
}

// Download content as file
function downloadContent() {
    if (!currentStuffId) return;

    // Get name from metadata or use ID
    const meta = stuffMetadata?.[currentStuffId];
    const baseName = meta?.name || currentStuffId || 'data';
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    // For images, download the actual image file directly
    if (contentType?.startsWith('image/')) {
        const imageUrl = extractUrl(jsonData);
        if (imageUrl) {
            const ext = contentType.split('/')[1] || 'png';
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${ext}`;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    // For PDFs, download the actual PDF file directly
    if (contentType === 'application/pdf') {
        const pdfUrl = extractUrl(jsonData);
        if (pdfUrl) {
            const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            return;
        }
    }

    const data = getCurrentContent();
    if (!data) return;

    const filename = `${baseName.replace(/[^a-zA-Z0-9_-]/g, '_')}.${data.ext}`;
    const blob = new Blob([data.content], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Close modal when clicking overlay
document.getElementById('modal-overlay').addEventListener('click', hideModal);

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideModal();
});

// Open external URL for PDF content
function openExternal() {
    if (!currentStuffId) return;
    const contentType = stuffContentType?.[currentStuffId];
    const jsonData = stuffDataJson?.[currentStuffId];

    if (contentType === 'application/pdf') {
        const url = extractUrl(jsonData);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }
}
