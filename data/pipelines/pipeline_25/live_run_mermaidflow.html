tum in 2026 and is raising its revenue target for 2026 to at least $375 million, which represents a nearly 7-fold increase from 2025 and is more than double its prior outlook last shared in January 2026. For the first quarter of 2026 Ondas is targeting revenue of $38 - $40 million, representing year-over-year growth of 820%. Growth will be led by our OAS business unit and is supported by $68.3 million in backlog and includes significant contributions from the recently announced acquired businesses.\n(Nasdaq:ONDS) (\"Ondas\" or the \"Company\"), a leading provider of autonomous aerial and ground robot intelligence through its Ondas Autonomous Systems (OAS) business unit and private wireless solutions through Ondas Networks, reported financial and operating results for the fourth quarter and full year ended December 31, 2025."}, {"url": "https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/", "public_url": "https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/", "mime_type": "text/html", "filename": null, "title": "Business West | Quarterly Economic Survey Q4 2025", "snippet": "# Quarterly Economic Survey Q4 2025  \nBusiness West, a business leadership and support organisation, helps companies grow, innovate and export.  \nEverything we do contributes to making the South West the best place to live, learn and work. We run the Chambers of Commerce for Bristol, Bath, Gloucestershire and Wiltshire as an accredited member of the British Chambers of Commerce. The quarterly economic survey is the longest running survey of its kind which is used by the Bank of England as one of the first economic indicators of each quarter.  \nWe would like to thank all respondents for their time in completing the survey, which provides Business West with invaluable up to date insight into the trends and state of business health in our region.  \nRESOURCES\n## Download the report \"Quarterly Economic Survey Q4 2025\""}, {"url": "https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025", "public_url": "https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025", "mime_type": "text/html", "filename": null, "title": "Investment Quarterly | Q4 2025 | Carter Jonas", "snippet": "# Investment Quarterly | Q4 2025  \nOur research specialists, working with our national and regional investment professionals, have released the latest Carter Jonas UK Investment Quarterly report for Q4 2025.\n## Tailored newsletters for you  \nSign up to our newsletter to receive further information and news tailored to you.  \nUK commercial property investment volumes rebounded strongly in Q4 2025, following softer activity in the previous quarter. Industrial investment rose sharply, while office and retail activity also recovered, signalling improving confidence as pricing clarity continued to build. Alternatives remained a significant source of capital deployment, reinforcing ongoing investor selectivity rather than a broad-based rebound.  \nA total of \u00a317.5bn was traded in Q4 2025, representing a 78% increase quarter-on-quarter and a 13% rise year-on-year. Quarterly volumes were also around 32% above the five-year quarterly average, reflecting a strong year-end uplift in deal completion. Reported volumes exclude transactions where the real estate value cannot be robustly separated from operating business considerations, most notably Welltower\u2019s circa \u00a35.2bn off-market acquisition of a UK care home portfolio from Barchester. The rolling annual total edged up modestly to \u00a347.8bn, remaining broadly stable quarter-on-quarter but still around 10% below the five-year average of \u00a353.2bn, highlighting that while momentum improved materially in Q4, the recovery in annual volumes remains uneven.\n### Retail  \nRetail investment totalled \u00a32.8bn in Q4 2025, up 87% on the previous quarter and 37% above the five-year quarterly average. Several sizeable transactions involving prime retail assets, shopping centres, and supermarkets supported volumes during the quarter. Frasers Group acquired Braehead Shopping Centre in Glasgow for circa \u00a3220m, while Blue Owl Capital purchased 10 Asda supermarket stores across the UK and one distribution Centre in Lutterworth from Asda in a sale-and-leaseback deal for \u00a3270m."}, {"url": "https://www.investopedia.com/terms/q/quarter.asp", "public_url": "https://www.investopedia.com/terms/q/quarter.asp", "mime_type": "text/html", "filename": null, "title": "Fiscal Quarter: What It Is, How It\u2019s Used, and More", "snippet": "In this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year.\nIn this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year. A fiscal calendar is an arbitrary range of dates that defines a company\u2019s annual reporting cycle.\nFor instance, if a company chooses to have its fiscal year starting in February rather than January, then its first quarter would consist of February, March, and April. Companies sometimes choose to do this if they want their fiscal year to end in their own peak season. Alternatively, since finishing the year often involves a lot of additional accounting work, some companies choose to end their fiscal year on a relatively calm month. There are two components to Q4 2025.\nA fiscal quarter is a three-month period on a company\u2019s financial calendar that acts as a basis for reporting earnings and paying dividends.\nAs its name suggests, there are four quarterly periods in a year, meaning a publicly traded company would issue four quarterly reports per year. Companies and investors alike use fiscal quarters to keep track of their financial results and business developments over time. These quarters are often referred to as Q1, Q2, Q3, and Q4."}, {"url": "https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/", "public_url": "https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/", "mime_type": "text/html", "filename": null, "title": "Dallas Office | Q4 2025 | Quarterly Market Report", "snippet": "# DFW Office Market Activity Slows Down in Q4 2025  \n#### **EXECUTIVE SUMMARY**  \nMomentum slowed between quarters in the Dallas-Fort Worth office market. Leasing activity decreased 31.7% quarterly from 4.4 million sq. ft. to 3.0 million sq. ft. Total net absorption saw a significant drop for the quarter, decreasing 80.0% from 1.4 million sq. ft. in Q3 to 285,197 sq. ft. in Q4 2025. Class A properties recorded positive absorption while Class B properties posted negative absorption. Due to the slowdown in deliveries and Class A positive absorption, the vacancy rate remained unchanged at 25.3%.  \nConstruction deliveries for the quarter totaled 189,382 sq. ft., down significantly from the previous quarter, and the construction pipeline increased 14.2% over the quarter to 2.9 million sq. ft. Rental rates rose 2.5% over the quarter and 4.8% over the year to $32.06 per sq. ft. Class A gross rental rates rose again to a record high of $36.20 per sq. ft. and are forecasted to continue to rise. Class B rental rates increased to $25.58 per sq. ft. from $25.22 per sq. ft. in Q3 2025.\n**Leasing Activity Decreased Quarterly and Annually**  \nQuarterly leasing velocity, which is comprised of both new leases and renewals, stood at 3.0 million sq. ft. during Q4 2025, a 31.7% decrease over last quarter and down 29.2% from Q4 2024. Notable lease transactions in Q4 2025 include Fujitsu\u2019s 70,000 sq. ft. lease at Galatyn Commons C in Richardson, Unleashed Brands\u2019 51,000 sq. ft. lease in 600 ELC, and Newrez\u2019s 47,000 sq. ft. lease at Cypress Waters in Coppell.  \n**Net Absorption Positive, But Experiences a Sharp Drop Over the Quarter**  \nNet absorption\u2014move-ins minus move-outs\u2014was positive 285,197 sq. ft. in Q4 2025, sharply down 80% quarter over quarter. Only Class A properties contributed to positive absorption, with Class A recording 310,702 sq. ft. Class B posted -25,505 sq. ft. of negative net absorption in Q4 2025. Some tenants that moved in during Q4 2025 included State Farm, which moved into 426,000 sq. ft. at Four CityLine, and GEICO, which took 165,000 sq. ft. at Galatyn Commons B.  \n**Investment Sales Trends**\n**Investment Sales Trends**  \nCoStar Capital Market Analytics reports the cumulative 12-month sales volume at $1.3 billion in the DFW office market. With 204 deals completed, the average transaction price currently stands at $286 per sq. ft. with an average cap rate of 7.9%. Notable recent sale transactions in Q4 2025 include Crescent Real Estate LLC\u2019s purchase of 2100 McKinney from MetLife Investment Management for a reported price of $218 million or $604 per sq. ft. The 360,860 sq. ft. property is 81% leased. Also, Real Capital Solutions, Inc. purchased the 464,290 sq. ft. Walnut Glen Tower from Intercontinental Real Estate Corporation for $26.1 million or $56.21 per sq. ft. The property, located in the Central Expressway submarket, is 76.8% leased.  \n**Rental Rates Continue to Rise**  \nThe average gross rental rate for the DFW office market is $32.33 per sq. ft., up 0.8% quarterly from $32.06 per sq. ft., and up 4.6% annually. The Uptown/Turtle Creek submarket boasts the highest rental rates, with the overall average gross rent currently sitting at $62.10 per sq. ft. The lowest rental rate in the Stemmons Freeway submarket is $21.46 per sq. ft.  \n**For More Information, Contact:**  \n**Steve Triolet**\nSVP of Research and Market Forecasting\ntel 214 223 4008\n[\\[emailprotected\\]](https://partnersrealestate.com/cdn-cgi/l/email-protection)"}, {"url": "https://www.cbre.com/press-releases/cbre-q4-2025-earnings", "public_url": "https://www.cbre.com/press-releases/cbre-q4-2025-earnings", "mime_type": "text/html", "filename": null, "title": "CBRE Group, Inc. Reports Financial Results for Q4 and Full Year 2025 | CBRE", "snippet": "Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for ...\n(NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025. Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for 2025 \u00b7\nCBRE Group, Inc. delivers robust financial performance for Q4 and full-year 2025, with double-digit growth in revenue and core EPS.\nCBRE Group, Inc. (NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025.\n\u201cWe had a strong end to 2025, with fourth-quarter revenue and core earnings-per-share rising by double digits and both reaching their highest levels ever for CBRE,\u201d said Bob Sulentic, CBRE\u2019s chair and chief executive officer. \u201cOur strength was broad-based. We saw significant gains in sales and leasing in the U.S. and much of the rest of the world and our resilient businesses continued to post double-digit revenue growth, a trend we see continuing.\u201d"}, {"url": "https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews", "public_url": "https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews", "mime_type": "text/html", "filename": null, "title": "Quarterly Business Reviews | Washington Department of Revenue", "snippet": "For Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter 4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nFor Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter 4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nTo explore the statistical data available, use our Create a report tool to create local sales and use tax reports for specific jurisdictions, gross business income tables, state retail sales tax tables and a variety of other reports. The QBR publications contain standardized tables detailing gross business income, taxable retail sales and accrued tax liability by major industry. Beginning with 2005, the QBR tables were converted from SIC to NAICS codes. This was an effort to move in line with national standards. For more information on SIC and NAICS codes please visit our Frequently asked ques\nA compilation of statistics on gross income, taxable retail sales and accrued tax liability as reported by Washington state excise taxpayers.\nFor Quarters 1, 2 and 3, we allow two months for operations review and one month for statistical processing. Our goal is to post early in the fourth month after the return due date. For example, Quarter 1 returns are due April 30, so our goal is to post data by early August."}, {"url": "https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html", "public_url": "https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html", "mime_type": "text/html", "filename": null, "title": "Q4: Quarterly Business Report | Greater Birmingham Chambers of Commerce", "snippet": "## **Developing Workforce Skills in**Greater Birmingham  \n##### **Sponsored by:**  \nThe future of Greater Birmingham\u2019s economy depends on a skilled and adaptable workforce. Ensuring effective structures are in place to support skills development is critical to retaining local talent and supporting business growth.  \nRecent data from the Q3 Quarterly Business Report found that 60% of Greater Birmingham businesses faced recruitment difficulties last quarter, with almost half attributing these challenges to a lack of suitably skilled applicants.  \nWith this in mind, the Q4 Quarterly Business Report launch event will focus on \u2018Developing Workforce Skills in Greater Birmingham.\u2019 The event will bring together local policymakers and business leaders to discuss the current direction of skills policy and support in the region, and explore how organisations with diverse skills needs are addressing these challenges and investing in their workforce.  \nAlongside these discussions, delegates will receive a copy of the Q4 2025 Greater Birmingham Quarterly Business Report and gain insight into the latest survey results.  \nJoin c.60 senior delegates for this insightful event, sponsored by Birmingham City University.\n#### **Attend for**:  \n- Headline economic findings from the latest quarterly business report\n- Expert panel discussion on developing and investing in workforce skills\n- Networking opportunities with c.60 senior business leaders from across Greater Birmingham\n#### **Speakers**  \n**Agenda**  \n09:00am: Registration & Networking  \n09:30am: Welcome & Introduction  \n09:40am: Quarterly Business Report Results  \n09:50am: Presentations  \n11:00am: Event Close"}, {"url": "https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/", "public_url": "https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/", "mime_type": "text/html", "filename": null, "title": "ComReg issues Electronic Communications Sector Quarterly Report for Q4 2025 | Commission for Communications Regulation", "snippet": "The Commission for Communications Regulation (ComReg) today released its Quarterly Key Data Report on the Electronic Communications market for the period (1 October to 31 December), Q4 2025.  \nFibre-to-the-premises (FTTP) subscriber lines stand at 1,050,123 million in Q4 2025, representing 59% of total fixed broadband subscriber lines, up from 51% in Q4 2024. Overall, fixed broadband subscriber lines increased to 1.76 million, an increase of 4% compared to Q4 2024.  \nComReg\u2019s [Open Data Map Hub](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fdatamaps-comreg.hub.arcgis.com%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818231141%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=2SLm1ppCubzMh4B4TYxZhJkqiW5jcy2cJM8WGLUDTDI%3D&reserved=0) includes Q4 data on Coverage and Take-Up of Gigabit Broadband (FTTP and Cable) by County, Electoral Division and other geographical areas across Ireland. The county with the highest level of FTTP coverage is Westmeath at 95%. Westmeath also has the highest level of Gigabit coverage at 96%.\nFTTP is the most purchased broadband technology and is available at 84% of all premises in Ireland. Gigabit broadband is available at 90% of all premises in Ireland. In terms of FTTP take up, 51% of all premises with FTTP available had an active FTTP service at the end of Q4 2025.  \nOn a monthly basis an average residential fixed broadband subscriber line used 563 GB of data, an increase of 11% since Q4 2024. Businesses have used 371 GB of data, an increase of 8% compared to Q4 2024.  \nIn Q4 2025, approximately 71% of fixed broadband subscriber lines had purchased broadband with speeds greater or equal to 500Mbps, up from 65% in Q4 2024, while 24% purchased broadband speeds greater than or equal to 1Gbps. Of the 1,050,123 FTTP subscriber lines, 93% have broadband speeds greater than or equal to 500 Mbps.  \nTotal mobile subscriptions (including mobile broadband and machine-to-machine (M2M) increased to 10.8 million in Q4 2025 \u2013 driven by a rise in bill pay subscriptions which represent 78% of all mobile subscriptions. 5G subscribers increased to 2.8 million in Q4 2025, an increase of 43% since Q4 2024.  \nOn a monthly basis an average mobile voice subscriber used 150 minutes, sent 32 texts (8% annual decrease), and used 21GB of data (13% annual increase).\nThe Quarterly Key Data Report for Q4 2025 is available on the [Quarterly Key Data Report section](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fmarket-information%2Fquarterly-key-data-report%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818261909%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=laOcyAuAvmsgmn1c6TYErH3Tr9n50RSUi3KRARoaKWM%3D&reserved=0) of ComReg.ie. The attached infographic highlights key trends from the report.  \nThe data portal which contains the full set of data and associated map visualisations and charts is available on [https://www.comreg.ie/industry/electronic-communications/data-portal/](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fdata-portal%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818286257%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=QCoSWFaMBk6b5noPlTzKz2MAcCRuoCwXmwzQuDEfcJI%3D&reserved=0)"}, {"url": "https://ir.quanterix.com/financial-information/quarterly-results", "public_url": "https://ir.quanterix.com/financial-information/quarterly-results", "mime_type": "text/html", "filename": null, "title": "Quarterly Results | Quanterix", "snippet": "Quarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuanterix Corporation Releases Operating Results for Second Quarter 2022, Announces Business Re-Alignment Plan and Revises 2022 Guidance\nQuanterix Releases Operating Results for Fourth Quarter and Full Year 2022; Aligned with Expectations"}]}}, "s_70cd2b65c2": {"items": [{"text": "## Q4 2025 Quarterly Business Report Summary\n\n**Financial Performance**\n- Revenue reached **$4.2 billion**, up 15% year-over-year\n- Operating margin improved to **28%** (up from 24% in Q3)\n- Customer acquisition costs dropped **12%** due to better marketing efficiency\n\n**Growth Highlights**\n- Active users grew 22% to **45 million**\n- Monthly recurring revenue hit **$350M**\n- Expanded into **3 new markets**: Southeast Asia, Eastern Europe, and South America\n\n**Other Key Metrics**\n- Net Promoter Score improved from 62 \u2192 **71**\n- Headcount grew to **8,500** employees across 12 global offices\n- R&D investment of **$840M** (20% of revenue)\n\n**Q1 2026 Outlook**\n- Revenue projected between **$4.4B\u2013$4.6B**\n- Key initiatives: AI-powered analytics platform launch, partner ecosystem expansion, and SOC 2 Type II certification for cloud products"}]}, "s_4cb9bcc9a1": {"text": "## Q4 2025 Quarterly Business Report Summary\n\n**Financial Performance**\n- Revenue reached **$4.2 billion**, up 15% year-over-year\n- Operating margin improved to **28%** (up from 24% in Q3)\n- Customer acquisition costs dropped **12%** due to better marketing efficiency\n\n**Growth Highlights**\n- Active users grew 22% to **45 million**\n- Monthly recurring revenue hit **$350M**\n- Expanded into **3 new markets**: Southeast Asia, Eastern Europe, and South America\n\n**Other Key Metrics**\n- Net Promoter Score improved from 62 \u2192 **71**\n- Headcount grew to **8,500** employees across 12 global offices\n- R&D investment of **$840M** (20% of revenue)\n\n**Q1 2026 Outlook**\n- Revenue projected between **$4.4B\u2013$4.6B**\n- Key initiatives: AI-powered analytics platform launch, partner ecosystem expansion, and SOC 2 Type II certification for cloud products"}, "s_31b436d362": {"text_and_images": {"text": {"text": "# Quarterly Business Report - Q4 2025\n\n\n## Executive Summary\n\nRevenue grew 15% year-over-year to $4.2 billion, driven by strong performance in cloud services and\nenterprise software. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost\ndecreased by 12% due to improved marketing efficiency. The company expanded into three new\nmarkets: Southeast Asia, Eastern Europe, and South America.\n\n\n## Key Metrics\n\nActive users reached 45 million, a 22% increase. Monthly recurring revenue hit $350M. Net promoter\nscore improved from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally. R&D;\ninvestment was $840M, representing 20% of revenue.\n\n\n## Outlook\n\nFor Q1 2026, we expect revenue between $4.4B and $4.6B. Key initiatives include launching the\nAI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II\ncertification for all cloud products.\n"}, "images": [], "raw_html": null}, "page_view": null}, "s_c2a9fadc43": {"content": "The Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion, driven by strong cloud services and enterprise software performance. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing efficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active users increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net promoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with R&D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue between $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud products.", "category": "data"}};
const stuffDataText = {"s_34048b2647": "                                            Data Report                                             \n\nThe Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion,\ndriven by strong cloud services and enterprise software performance. Operating margin improved to   \n28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing          \nefficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active     \nusers increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net   \npromoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with\nR&D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue\nbetween $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform,      \nexpanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud products.  \n", "s_1391d43af5": "pipelex-storage://normalized/TdfNS2vVXbpp3SDUjQs2LQ.pdf\n", "s_8278af4607": "   1    \u2502                  Quarterly Business Report - Q4 2025                  \n        \u2502                                                                       \n        \u2502 Executive Summary                                                     \n        \u2502                                                                       \n        \u2502 Revenue grew 15% year-over-year to $4.2 billion, driven by strong     \n        \u2502 performance in cloud services and enterprise software. Operating      \n        \u2502 margin improved to 28%, up from 24% in Q3. Customer acquisition cost  \n        \u2502 decreased by 12% due to improved marketing efficiency. The company    \n        \u2502 expanded into three new markets: Southeast Asia, Eastern Europe, and  \n        \u2502 South America.                       \n\n                                                         \n Metric                     Value         Change         \n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 \n Revenue                    $4.2 Billion  +15% YoY       \n Operating Margin           28%           +4pts vs Q3    \n Monthly Recurring Revenue  $350M         \u2014              \n R&D Investment             $840M         20% of revenue \n Customer Acquisition Cost  \u2014             -12%           \n                                                         \n\n----------------------------------------------------------------------------------------------------\n\n\ud83d\udc65 Operational Highlights                                                                           \n\n                                        \n Metric              Value       Change \n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 \n Active Users        45 Million  +22%   \n Net Promoter Score  71          +9 pts \n Employee Headcount  8,500       \u2014      \n Global Offices      12          \u2014      \n                                        \n\n----------------------------------------------------------------------------------------------------\n\n\ud83c\udf0d Strategic Developments                                                                           \n\n \u2022 Market Expansion: Southeast Asia, Eastern Europe, South America                                  \n \u2022 Drivers: Cloud services & enterprise software performance                                        \n \u2022 Marketing: Improved efficiency reducing acquisition costs                                        \n\n----------------------------------------------------------------------------------------------------\n\n\ud83d\udd2e Q1 2026 Outlook                                                                                  \n\nRevenue Guidance                                                                                    \n\n\u258c $4.4B \u2013 $4.6B (projected ~5-10% sequential growth)                                              \n\nKey Initiatives                                                                                     \n\n 1 \ud83e\udd16 Launch AI-powered analytics platform                                                          \n 2 \ud83e\udd1d Expand partner ecosystem                                                                      \n 3 \ud83d\udd12 Achieve SOC 2 Type II certification across all cloud products                                 \n\n----------------------------------------------------------------------------------------------------\n\n\u2705 Overall Assessment                                                                               \n\nStrengths                                                                                           \n\n \u2022 Strong revenue growth with improving margins (28%)                                               \n \u2022 High user growth (22%) suggesting strong product-market fit                                      \n \u2022 Significant NPS improvement (+9 points) indicating better customer satisfaction                  \n \u2022 Healthy R&D investment at 20% of revenue                                                         \n\nPotential Watch Areas                                                                               \n\n \u2022 Headcount growth to 8,500 should be monitored against margin sustainability                      \n \u2022 Geographic expansion into 3 new markets simultaneously carries execution risk                    \n \u2022 SOC 2 certification listed as future goal \u2014 may signal current compliance gaps                   \n\n----------------------------------------------------------------------------------------------------\n\n\ud83d\udcdd Content Structure Notes                                                                          \n\n \u2022 No images were included despite an image section placeholder                                     \n \u2022 No raw HTML content detected                                                                     \n \u2022 Document is well-structured with clear sections but lacks granular segment breakdowns            \n", "s_5c45476820": "Search Result:\nThe Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion,\ndriven by strong cloud services and enterprise software performance. Operating margin improved to   \n28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing          \nefficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active     \nusers increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net   \npromoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with\nR&D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue\nbetween $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform,      \nexpanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud            \nproducts[1].                                                                                        \n\nSources (20):\n1 2025 Q4 REPORT Q4 2025 OCTOBER - DECEMBER Quarterly Report \n(https://mb.cision.com/Main/22283/4307468/3934804.pdf)\n  Q4 REPORT\n\nQ4 2025 Quarterly Industry Reports | Houlihan Capital \n(https://www.houlihancapital.com/q4-2025-quarterly-industry-reports-are-now-available/)\n  Q4 2025 delivered a set of market signals that are already shaping 2026 decision-making. Across \nsectors, we saw valuation sensitivity increase, capital move toward \u201cquality-first\u201d operators, and \nstrategic buyers sharpen their criteria in real time.  \nIf you\u2019re managing portfolio performance, planning an exit, or advising clients through strategic \ndecisions, Q4\u2019s data is not just interesting. It\u2019s actionable.  \nHoulihan Capital\u2019s Q4 2025 Quarterly Industry Reports are now available across nine sectors, \nhighlighting the trends we\u2019re seeing in-market and what they mean for investors, operators, and \nadvisors.\n### **Q4 2025 Industry Highlights (9 Reports)**  \n#### **Business Services**  \nBusiness services held up in Q4 2025, but performance stayed uneven as investors continued to reward\ntech-enabled, scalable service models while traditional providers lagged.M&A slowed to 1,478 deals \n(a two-year low) as buyers stayed selective, even with financing conditions improving.*Access the \nreport here.*\n#### **Crypto Market + VC**  \nEven with crypto down \\~24% QoQ in Q4 2025, VC interest held up\u2014crypto funding surged \\~77% QoQ to \n\\~$8.5B, signaling conviction in the category despite volatility. Across broader VC, dollars rose \nwhile deal count stayed tight, showing capital concentrating into fewer, larger, fundamentals-driven\nrounds.[Access the report \nhere.](https://www.houlihancapital.com/industry-intelligence-hub/crypto-venture-capital-market-intel\nligence/)  \n**Access the Full Q4 2025 Reports**  \nEach report includes sector-specific data, market activity, and the trends we believe matter most \nfor strategic planning and transaction execution.  \nClick the button below to access the reports.\n\nQ4 2025 Quarterly Economic Survey Report \n(https://www.jamescowperkreston.co.uk/news/q4-2025-quarterly-economic-survey-report/)\n  20 January 2026  \n**by Darren O'Connor**  \nPartner  \nWe are proud to have sponsored the[Q4 2025 Quarterly Economic Survey (QES) \nReport](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q\n4-2025-Report.pdf),theUK'slongest runningand largestbusiness sentiment survey,recently published by \nthe [Thames Valley Chamber of Commerce (TVCC)](http://www.thamesvalleychamber.co.uk/).This latest \nedition follows the release of the national results by the [British Chambers of Commerce \n(BCC)](http://www.britishchambers.org.uk/), providingtimelyand vital insights into the economic \nlandscape as businesses navigate weakening demand and escalating costs.  \nThe Q4 2025 Quarterly Economic Survey, conducted between 10 November and 8 December 2025, reflects \nresponses from a broad cross-section of local businesses, capturing trends across key indicators \nincluding sales, employment, cash flow, investment and price pressures.  \nIt highlights a more challenging environment for regional businesses than in previous quarters. \nAlthough pockets of resilience remain, sustained cost pressures and lower demands have led to a \nnoticeable easing in overall confidence. This quarter\u2019s data also revealed that a large proportion \nof businesses anticipates further price increases, driven most strongly by rising labour costs \nrather than improved margins.  \nKey findings include:\nKey findings include:  \n[Darren O\u2019Connor](https://www.jamescowperkreston.co.uk/darren-oconnor/), Partner at [James Cowper \nKreston](https://www.jamescowperkreston.co.uk/),commented:\u201cThe Quarterly Economic Survey \n(QES)remainsa vital barometer for the UK\u2019s business community. This Q4 2025 edition arrives at a \ntime of considerable challenge, as businesses navigate weakening demand, rising costs, and \npersistent uncertainty. Demand has softened, with many businesses reporting flat or declining orders\nand sales, compounded by a cautious consumer base. Risinglabour, fuel, utility, and finance costs \nare squeezing margins and forcing difficult investment decisions, while skills shortages continue to\nconstrain recruitment and growth. As we look ahead, with Rachel Reeve\u2019s budget behind us, we are all\nhoping for greater certainty to help long-term decision-making.\u201d\n[Paul Britton](http://www.thamesvalleychamber.co.uk/staff-member/paul-britton/), CEO of [Thames \nValley Chamber of Commerce](http://www.thamesvalleychamber.co.uk/),said:\u201cThe latest QES results \nreflect a challenging picture for Thames Valley firms amid weakening demand and rising costs. \nConcerns about tax rises were not fully eased by the November 26th Budget. \nBusinessesanticipatefurther price increases driven by risinglabourcosts, while recruitment \ndifficulties and skills shortagesremaina defining constraint. Pre- and post-Budget \nsentimentremainscautious, and confidence into 2026 is expected to stay subdued unless demand \nstrengthens, interest rates fall, and Government policies provide opportunities rather than \nobligations for business.\u201d  \n[Click \nhere](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q4-\n2025-Report.pdf)to download the QES Q4 2025 report in full.\n\nQuarterly Report - 2025 Q4 | Cameco \n(https://www.cameco.com/invest/financial-information/annual-reports/2025)\n  # Quarterly Report - 2025 Q4  \n## Audio  \n**2025 Q4 Presentation**  \n**2025 Q4 - Q and A**  \nOn February 13, 2026, **Cameco (TSX: CCO; NYSE: CCJ)** reported its consolidated financial and \noperating results for the fourth quarter and year ended December 31, 2025, in accordance with \nInternational Financial Reporting Standards (IFRS).\n- In April, we received a cash dividend of US$87 million, net of withholdings, from JV Inkai.\n- **Dividend:**In November, to reflect the improvement in our financial performance and the \nadditional distribution received from Westinghouse, we advanced our dividend growth plan. We \nincreased our annual dividend to $0.24 per common share in 2025, advancing our plan to increase the \ndividend to $0.24 per common share by one year.[See Return in our annual MD&A for more \ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=30)\n- **Uranium:**Fourth quarter earnings before taxes decreased by $15 million and adjusted EBITDA \nincreased by $5 million, compared to 2024, mainly as a result of lower sales volume due to timing of\nsales. Annual earnings before income taxes increased by $50 million and adjusted EBITDA increased by\n$76 million compared to 2024.[See Financial results by segment \u2013 Uranium in our annual MD&A for more\ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=59)\n- **Westinghouse:**Westinghouse reported net earnings increased by $17 million (our share) for the \nfourth quarter, compared to the same quarter last year. Over the year, Westinghouse reported a net \nearnings increase of $276 million in comparison to 2024. To better reflect the underlying operating \nperformance, we use adjusted EBITDA as a performance measure for Westinghouse. In the fourth quarter\nof 2025, our share of Westinghouse\u2019s adjusted EBITDA increased by $49 million, compared to the \nfourth quarter of 2024, while over the year, adjusted EBITDA increased by $297 million compared to \n2024. In October 2025, Westinghouse made a second cash distribution of US$350 million (US$171.5 \nmillion our share) to its owners associated with the cash received in 2025 for its participation in \nthe construction project for two nuclear reactors at the Dukovany power plant in the Czech Republic,\nled by Korea Hydro & Nuclear Power.[See Financial results by segment - Westinghouse in our annual \nMD&A for more \ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=59)\n\nInterim consolidated report for the period ending on 31.12.2025 \n(https://investors.sirma.com/en/reports-filings/quarterly-reports/interim-consolidated-report-for-th\ne-period-ending-on-31-12-2025)\n  &lt;- Quarterly Reports  \nQ4  \n2025\n# Interim consolidated report for the period ending on 31.12.2025  \n- Revenue 66 665 EUR '000 30.37 %\n- EBITDA 4 938 EUR '000 66.86 %\n- Net Profit 1 805 EUR '000 216.88 %\n## Interim consolidated report for the period ending on 31.12.2025  \n19 Feb 2026\n\nSAP Quarterly Statement Q4 2025 \n(https://www.prnewswire.com/news-releases/sap-quarterly-statement-q4-2025-302673209.html)\n  Christian Klein, CEO: Q4 was a strong cloud quarter, with bookings resulting in 30% Total Cloud \nBacklog growth to a record 77 billion Euros. The significant Current Cloud Backlog growth in Q4 has \nlaid a strong foundation for accelerating Total ...\n29, 2026 /PRNewswire/ -- SAP SE (NYSE: SAP) announced today its financial results for the fourth \nquarter and fiscal year ended December 31, 2025. Christian Klein, CEO: Q4 was a strong cloud \nquarter, with bookings resulting in 30% Total Cloud Backlog growth to a record 77 billion Euros. The\nsignificant Current Cloud Backlog growth in Q4 has laid a strong foundation for accelerating Total \nRevenue growth through 2027. SAP Business AI has become a main driver for growth as it was included \nin two thirds of our Q4 cloud order entry, combined with strong AI adoption across the ERP Suite.\nIn January 2024, SAP announced a company-wide restructuring program which concluded as planned in \nthe first quarter 2025. Overall expenses associated with the program were approximately \u20ac3.2 \nbillion. Restructuring payouts amounted to \u20ac2.5 billion for the full-year 2024 and \u20ac0.8 billion for \nthe full year 2025. Business Highlights In the fourth quarter, customers around the globe continued \nto choose the \"RISE with SAP\" journey to drive their end-to-end business transformations.\nSupplementary financial information pertaining to the fourth quarter and full-year 2025 results can \nbe found at https://www.sap.com/investor. About SAP As a global leader in enterprise applications \nand business AI, SAP (NYSE: SAP) stands at the nexus of business and technology.\nWhile SAP's 2026 financial outlook for the income statement parameters is at constant currencies \n(including an average exchange rate of 1.13 USD per EUR), actual currency reported figures are \nexpected to be impacted by currency exchange rate fluctuations as the company progresses through the\nyear, as reflected in the table below. Currency Impact Assuming December 31, 2025 Rates Apply for \n2026\n\nQuarterly Private Markets Report: Q4 2025 \n(https://www.nepc.com/quarterly-private-markets-report-q4-2025/)\n  The fourth quarter was one of the strongest quarters of the year, helping push full-year US direct\nlending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending \nreached $248 billion.\nDownload Quarterly Private Markets Report: Q4 2025\nAn annual survey conducted by Deloitte indicates that investors and industry participants are \noptimistic about commercial real estate fundamentals, similar to what was reported in 202524; \nhowever, Preqin reports that 30% of surveyed investors plan to reduce their commitments to real \nestate in the next year, versus 27% planning to increase.25 \u00b7 The recovery in core real estate (as \nrepresented by the NFI-ODCE Index) returns flattened out in the second half of 2025, with the Index \nposting negative appreciation for the second straight quarter for the three months ended December \n31.\nWhile these strategies have lagged core real estate in 2025, it should be noted that they also did \nnot dip as negatively in the prior years. Real estate managers saw continued momentum in fundraising\nactivity in the third quarter, according to data from PitchBook. Non-core equity funds (including \nvalue-add and opportunistic strategies) reported a total of just over $72 billion in capital raised \nfor the year through September 30.\nThe fourth quarter was one of the strongest quarters of the year, helping push full-year US direct \nlending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending \nreached $248 billion. Full-year 2025 sponsor U.S. direct lending volume was down marginally by 2% \nyear over year. Sector activity was led by technology, business services, and healthcare.\n\nAEMO releases the Q4 2025 Quarterly Energy Dynamics report - WattClarity \n(https://wattclarity.com.au/articles/2026/01/aemo-releases-the-q4-2025-quarterly-energy-dynamics-rep\nort/)\n  The AEMO have today released their [Quarterly Energy Dynamics (QED) report for Q4 \n2025](https://www.aemo.com.au/energy-systems/major-publications/quarterly-energy-dynamics-qed), \ncovering outcomes across the market for the quarter ending December 31st 2025.  \nThe [accompanying media \nrelease](https://www.aemo.com.au/newsroom/media-release/renewables-supply-more-than-half-of-quarterl\ny-energy-supply) highlighted a drop in both quarter-on-quarter and year-on-year average prices, as \nwell as record volumes of generation for VRE and storage:  \n> Wholesale electricity prices for the National Electricity Market (NEM) nearly halved in the \nDecember 2025 quarter, driven by record renewable generation supplying more than half of total \nenergy needs for the first time.\n>\n> AEMO\u2019s latest Quarterly Energy Dynamics report shows wholesale electricity prices averaged $50 per\nmegawatt hour (MWh) across the NEM, a $39/MWh (-44%) reduction from Q4 2024 and a $37/MWh (-43%) \ndecline from Q3 2025.\n>\n> The quarter saw strong growth in renewable and storage output, with wind generation up 29%, grid \nscale solar up 15%, and battery discharge nearly tripling to an average of 268 megawatts (MW), \nsupported by 3,796 MW of new battery capacity added since late 2024.\n>\n> At the same time, coal-fired generation fell to an all-time quarterly low, down 4.6% year-on-year,\nwhile gas-fired generation dropped 27% to its lowest level since Q4 2000.\n>\n>\n> AEMO Executive General Manager Policy and Corporate Affairs, Violette Mouchaileh, said the quarter\nmarked a significant milestone for Australia\u2019s energy transition.\n>\n> \u201cThis is a landmark moment for the NEM. For the first time, renewables and storage supplied more \nthan half of the system\u2019s energy needs for a full quarter,\u201d Ms Mouchaileh said.\n>\n> \u201cIt reflects years of sustained investment and demonstrates that more wind, solar and battery \ncapacity in the system reduces reliance on higher cost coal and gas generation, placing sustained \ndownward pressure on wholesale electricity prices,\u201d she said.  \nKerry Galloway from the AEMO will present an online webinar on the Q4 2025 QED, hosted in \ncollaboration with the University of Melbourne, on the 11th February 2026 at 2:00pm (Melbourne \ntime). Details about the webinar are \n[here](https://energy.unimelb.edu.au/events/aemo-quarterly-energy-dynamics-q4-2025).\n# Media Coverage  \nThe reports release drew broad attention across mainstream and energy-sector media, with headlines \nlargely centred on the fall in wholesale prices and the VRE milestone. Below is a list of the \nrelated coverage we\u2019ve seen so far today:  \n- Daniel Mercer from**the ABC**wrote \u201c\u201c[Australia hits power demand record as renewables pass 50pc \nmilestone](https://www.abc.net.au/news/2026-01-29/australia-hits-power-demand-record-as-renewables-p\nass-50pc/106280246)\n- Giles Parkinson from **Renew Economy**wrote \u201c\u201c[Landmark moment: Prices plunge as renewables supply\nhalf of grid, batteries surge and coal hits new \nlow](https://reneweconomy.com.au/landmark-moment-prices-plunge-as-renewables-supply-half-of-grid-bat\nteries-surge-and-coal-hits-new-low/)\n- Angela Macdonald-Smith from **The Australian Financial Review**wrote \u201c\u201c[Landmark moment: Record \nrenewables drive down cost of \npower](https://www.afr.com/policy/energy-and-climate/landmark-moment-record-renewables-drive-down-co\nst-of-power-20260128-p5nxmn)\n- Ev Foley from **PV Magazine**wrote \u201c\u201c[Rooftop solar hits all-time output high of 4,407 MW in Q4 \n2025: \nreport](https://www.pv-magazine-australia.com/2026/01/29/rooftop-solar-hits-all-time-output-high-of-\n4407-mw-in-q4-2025-report/)\n- Charis Palmer from **The Energy**wrote \u201c\u201c[Wholesale prices down as NEM and WEM break \nrecords](https://theenergy.co/article/wholesale-prices-down-as-nem-and-wem-break-records)\n\nThe Main Street Quarterly, 2025 Q4 \n(https://www.cfib-fcei.ca/en/research-economic-analysis/main-street-quarterly)\n  The Main Street Quarterly also contains CFIB\u2019s latest estimates of[private sector job \nvacancies](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-HW.pdf)and \nan[interactive \npage](https://www.cfib-fcei.ca/en/research-economic-analysis/private-sector-job-vacancies-in-canada)\n. The \u2018In Focus\u2019 section, which covers a specific topic each quarter, focuses currently on the [B2C \nversus B2B \nfirms](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-InFocus.pdf).This \nedition analyses \n[business](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf\n) [entry and exit \ntrends](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) \nfor 2015 to 2025 by sector.  \nNext release will be around the mid April2026. For the media release, click \n[here](https://www.cfib-fcei.ca/en/media/canadian-economy-to-grow-in-q4-2025-and-in-q1-2026).\n## Related Documents  \n### Full Report  \n- [Main Street \nQuarterly](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-ALL.pdf)Q4 \n2025\n- [Small businesses' wage increase \nplans](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q12023_In_Focus.pd\nf)Q1 2023\n- [Investment plans in small \nfirms](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_MSQ_2022_Q4_In_Focus.pdf)Q4 2022\n- [The financial state of small \nbusinesses](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q32022_In_Foc\nus.pdf)Q3 2022\n\nPress Release | Q4 2025 Digital Marketing Quarterly Trends Report \n(https://skai.io/press-releases/quarterly-trends-report-q4-2025/)\n  **SAN FRANCISCO, CA \u2013 January 27, 2026 \u2013** Retail media ad spend grew 33% year-over-year in Q4 \n2025, marking the largest single-quarter increase in six years, as brands aggressively expanded \nfull-funnel strategies during the holiday season. Skai, the leading omnichannel advertising platform\nfor commerce media, today released its [Q4 2025 Digital Marketing Quarterly Trends \nReport](https://skai.io/reports-and-whitepapers/q4-2025-quarterly-digital-trends-report/), revealing\nhow retail media\u2019s rapid expansion is reshaping performance dynamics across paid search and paid \nsocial, while AI-powered discovery accelerates changes in consumer shopping behavior.\n## **Marketers shift AI usage from creative tasks to strategic planning**  \nAs cross-channel orchestration grows more complex, marketers are increasingly turning to AI for \ndecision-making support. Nearly two-thirds of advertisers now use generative AI within retail media \nprograms, but usage patterns reveal a clear evolution. Analysis from Skai\u2019s proprietary GenAI \nmarketing agent found that strategy and planning queries accounted for 35.5% of prompts in Q4, while\ncreative and messaging requests fell to just 3%. This indicates that marketers are moving AI beyond \ncontent generation toward the strategic decisions that matter most: budget allocation, channel \nprioritization, and cross-channel optimization.  \n\u201cThis is one of the most revealing trends reports we\u2019ve published because it shows how dramatically \nmarketing behavior has evolved in just a year,\u201d said Michelle Urwin, Chief Marketing Officer at \nSkai. \u201cRetail media is scaling rapidly into the upper funnel, omnichannel execution is now the norm,\nand GenAI is emerging both as a new, agentic channel shaping discovery and as a layer across \nexisting channels like search and retail. At the same time, GenAI is changing how marketers make \ndecisions. These are early signals of changes that began to take hold in Q4 and will continue to \nshape how commerce media operates throughout 2026.\u201d\nTo access the full Q4 2025 report, visit \n[skai.io/quarterly-trends-hub.](https://skai.io/reports-and-whitepapers/q3-2025-quarterly-digital-tr\nends-report/)  \n**Methodology**\nAnalysis is based on 972 billion impressions, 8.7 billion clicks, and $9.2 billion of Skai platform \nactivity across retail media, paid search, and [paid social \nadvertising](https://skai.io/glossary/paid-social-advertising/) in Q4 2025 (October 1 \u2013 December \n31). Data is aggregated and anonymized across Skai accounts, including many of the world\u2019s leading \nconsumer brands and agencies. Year-over-year comparisons reflect the same period in Q4 2024. Only \nadvertisers active on the Skai platform for the full duration of both periods were included to \nensure consistency.  \n**About Skai**\nSkai (formerly Kenshoo) is the leading omnichannel advertising platform for commerce media, \ncombining advanced digital marketing capabilities with commerce insights and operations to drive \ngrowth for brands and agencies. Powered by unified data and proprietary GenAI, Skai delivers \nfull-funnel media planning, optimization, and measurement, as well as insights and automation that \nhelp brands improve digital shelf performance, retail execution, and revenue recovery. This \nintegrated approach maximizes sales, profitability, and market share across media and commerce \ntouchpoints.\n\nOndas Inc. Reports Record Fourth Quarter and Full Year 2025 Financial Results: Expects Outsized \nGrowth in 2026 Driven by Execution at OAS, Accelerated Strategic Growth Program and Strong Global \nDemand for Autonomous Systems :: Ondas Inc. (ONDS) \n(https://ir.ondas.com/press-releases/detail/296/ondas-inc-reports-record-fourth-quarter-and-full-yea\nr-2025)\n  Q4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and \nrepresents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, \nmeeting the high end of our recently pre-announced ...\nQ4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and \nrepresents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, \nmeeting the high end of our recently pre-announced target range, representing approximately 605% \nyear-over-year growth\nThe current quarter loss included a non-cash charge of $82.2 million relating to warrants issued in \nconnection with the October 2025 equity raise (\"2025 Warrants\") that have been classified as a \nliability using a Black-Scholes valuation as of December 31, 2025. The valuation of this liability \nis subject to material changes from period to period without having any impact on the business of \nthe company or the underlying economics of the warrant.\nThe Company expects continued strong momentum in 2026 and is raising its revenue target for 2026 to \nat least $375 million, which represents a nearly 7-fold increase from 2025 and is more than double \nits prior outlook last shared in January 2026. For the first quarter of 2026 Ondas is targeting \nrevenue of $38 - $40 million, representing year-over-year growth of 820%. Growth will be led by our \nOAS business unit and is supported by $68.3 million in backlog and includes significant \ncontributions from the recently announced acquired businesses.\n(Nasdaq:ONDS) (\"Ondas\" or the \"Company\"), a leading provider of autonomous aerial and ground robot \nintelligence through its Ondas Autonomous Systems (OAS) business unit and private wireless solutions\nthrough Ondas Networks, reported financial and operating results for the fourth quarter and full \nyear ended December 31, 2025.\n\nBusiness West | Quarterly Economic Survey Q4 2025 \n(https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/)\n  # Quarterly Economic Survey Q4 2025  \nBusiness West, a business leadership and support organisation, helps companies grow, innovate and \nexport.  \nEverything we do contributes to making the South West the best place to live, learn and work. We run\nthe Chambers of Commerce for Bristol, Bath, Gloucestershire and Wiltshire as an accredited member of\nthe British Chambers of Commerce. The quarterly economic survey is the longest running survey of its\nkind which is used by the Bank of England as one of the first economic indicators of each quarter.  \nWe would like to thank all respondents for their time in completing the survey, which provides \nBusiness West with invaluable up to date insight into the trends and state of business health in our\nregion.  \nRESOURCES\n## Download the report \"Quarterly Economic Survey Q4 2025\"\n\nInvestment Quarterly | Q4 2025 | Carter Jonas \n(https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025)\n  # Investment Quarterly | Q4 2025  \nOur research specialists, working with our national and regional investment professionals, have \nreleased the latest Carter Jonas UK Investment Quarterly report for Q4 2025.\n## Tailored newsletters for you  \nSign up to our newsletter to receive further information and news tailored to you.  \nUK commercial property investment volumes rebounded strongly in Q4 2025, following softer activity \nin the previous quarter. Industrial investment rose sharply, while office and retail activity also \nrecovered, signalling improving confidence as pricing clarity continued to build. Alternatives \nremained a significant source of capital deployment, reinforcing ongoing investor selectivity rather\nthan a broad-based rebound.  \nA total of \u00a317.5bn was traded in Q4 2025, representing a 78% increase quarter-on-quarter and a 13% \nrise year-on-year. Quarterly volumes were also around 32% above the five-year quarterly average, \nreflecting a strong year-end uplift in deal completion. Reported volumes exclude transactions where \nthe real estate value cannot be robustly separated from operating business considerations, most \nnotably Welltower\u2019s circa \u00a35.2bn off-market acquisition of a UK care home portfolio from Barchester.\nThe rolling annual total edged up modestly to \u00a347.8bn, remaining broadly stable quarter-on-quarter \nbut still around 10% below the five-year average of \u00a353.2bn, highlighting that while momentum \nimproved materially in Q4, the recovery in annual volumes remains uneven.\n### Retail  \nRetail investment totalled \u00a32.8bn in Q4 2025, up 87% on the previous quarter and 37% above the \nfive-year quarterly average. Several sizeable transactions involving prime retail assets, shopping \ncentres, and supermarkets supported volumes during the quarter. Frasers Group acquired Braehead \nShopping Centre in Glasgow for circa \u00a3220m, while Blue Owl Capital purchased 10 Asda supermarket \nstores across the UK and one distribution Centre in Lutterworth from Asda in a sale-and-leaseback \ndeal for \u00a3270m.\n\nFiscal Quarter: What It Is, How It\u2019s Used, and More \n(https://www.investopedia.com/terms/q/quarter.asp)\n  In this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes\nboth the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year\nthat is the same as a calendar year.\nIn this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes \nboth the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year\nthat is the same as a calendar year. A fiscal calendar is an arbitrary range of dates that defines a\ncompany\u2019s annual reporting cycle.\nFor instance, if a company chooses to have its fiscal year starting in February rather than January,\nthen its first quarter would consist of February, March, and April. Companies sometimes choose to do\nthis if they want their fiscal year to end in their own peak season. Alternatively, since finishing \nthe year often involves a lot of additional accounting work, some companies choose to end their \nfiscal year on a relatively calm month. There are two components to Q4 2025.\nA fiscal quarter is a three-month period on a company\u2019s financial calendar that acts as a basis for \nreporting earnings and paying dividends.\nAs its name suggests, there are four quarterly periods in a year, meaning a publicly traded company \nwould issue four quarterly reports per year. Companies and investors alike use fiscal quarters to \nkeep track of their financial results and business developments over time. These quarters are often \nreferred to as Q1, Q2, Q3, and Q4.\n\nDallas Office | Q4 2025 | Quarterly Market Report \n(https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/)\n  # DFW Office Market Activity Slows Down in Q4 2025  \n#### **EXECUTIVE SUMMARY**  \nMomentum slowed between quarters in the Dallas-Fort Worth office market. Leasing activity decreased \n31.7% quarterly from 4.4 million sq. ft. to 3.0 million sq. ft. Total net absorption saw a \nsignificant drop for the quarter, decreasing 80.0% from 1.4 million sq. ft. in Q3 to 285,197 sq. ft.\nin Q4 2025. Class A properties recorded positive absorption while Class B properties posted negative\nabsorption. Due to the slowdown in deliveries and Class A positive absorption, the vacancy rate \nremained unchanged at 25.3%.  \nConstruction deliveries for the quarter totaled 189,382 sq. ft., down significantly from the \nprevious quarter, and the construction pipeline increased 14.2% over the quarter to 2.9 million sq. \nft. Rental rates rose 2.5% over the quarter and 4.8% over the year to $32.06 per sq. ft. Class A \ngross rental rates rose again to a record high of $36.20 per sq. ft. and are forecasted to continue \nto rise. Class B rental rates increased to $25.58 per sq. ft. from $25.22 per sq. ft. in Q3 2025.\n**Leasing Activity Decreased Quarterly and Annually**  \nQuarterly leasing velocity, which is comprised of both new leases and renewals, stood at 3.0 million\nsq. ft. during Q4 2025, a 31.7% decrease over last quarter and down 29.2% from Q4 2024. Notable \nlease transactions in Q4 2025 include Fujitsu\u2019s 70,000 sq. ft. lease at Galatyn Commons C in \nRichardson, Unleashed Brands\u2019 51,000 sq. ft. lease in 600 ELC, and Newrez\u2019s 47,000 sq. ft. lease at \nCypress Waters in Coppell.  \n**Net Absorption Positive, But Experiences a Sharp Drop Over the Quarter**  \nNet absorption\u2014move-ins minus move-outs\u2014was positive 285,197 sq. ft. in Q4 2025, sharply down 80% \nquarter over quarter. Only Class A properties contributed to positive absorption, with Class A \nrecording 310,702 sq. ft. Class B posted -25,505 sq. ft. of negative net absorption in Q4 2025. Some\ntenants that moved in during Q4 2025 included State Farm, which moved into 426,000 sq. ft. at Four \nCityLine, and GEICO, which took 165,000 sq. ft. at Galatyn Commons B.  \n**Investment Sales Trends**\n**Investment Sales Trends**  \nCoStar Capital Market Analytics reports the cumulative 12-month sales volume at $1.3 billion in the \nDFW office market. With 204 deals completed, the average transaction price currently stands at $286 \nper sq. ft. with an average cap rate of 7.9%. Notable recent sale transactions in Q4 2025 include \nCrescent Real Estate LLC\u2019s purchase of 2100 McKinney from MetLife Investment Management for a \nreported price of $218 million or $604 per sq. ft. The 360,860 sq. ft. property is 81% leased. Also,\nReal Capital Solutions, Inc. purchased the 464,290 sq. ft. Walnut Glen Tower from Intercontinental \nReal Estate Corporation for $26.1 million or $56.21 per sq. ft. The property, located in the Central\nExpressway submarket, is 76.8% leased.  \n**Rental Rates Continue to Rise**  \nThe average gross rental rate for the DFW office market is $32.33 per sq. ft., up 0.8% quarterly \nfrom $32.06 per sq. ft., and up 4.6% annually. The Uptown/Turtle Creek submarket boasts the highest \nrental rates, with the overall average gross rent currently sitting at $62.10 per sq. ft. The lowest\nrental rate in the Stemmons Freeway submarket is $21.46 per sq. ft.  \n**For More Information, Contact:**  \n**Steve Triolet**\nSVP of Research and Market Forecasting\ntel 214 223 4008\n[\\[emailprotected\\]](https://partnersrealestate.com/cdn-cgi/l/email-protection)\n\nCBRE Group, Inc. Reports Financial Results for Q4 and Full Year 2025 | CBRE \n(https://www.cbre.com/press-releases/cbre-q4-2025-earnings)\n  Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS \nof $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient \nBusinesses(1) revenue up 12% for Q4 and 13% for ...\n(NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025. Key \nHighlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of \n$6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient \nBusinesses(1) revenue up 12% for Q4 and 13% for 2025 \u00b7\nCBRE Group, Inc. delivers robust financial performance for Q4 and full-year 2025, with double-digit \ngrowth in revenue and core EPS.\nCBRE Group, Inc. (NYSE: CBRE) today reported financial results for the fourth quarter ended December\n31, 2025.\n\u201cWe had a strong end to 2025, with fourth-quarter revenue and core earnings-per-share rising by \ndouble digits and both reaching their highest levels ever for CBRE,\u201d said Bob Sulentic, CBRE\u2019s chair\nand chief executive officer. \u201cOur strength was broad-based. We saw significant gains in sales and \nleasing in the U.S. and much of the rest of the world and our resilient businesses continued to post\ndouble-digit revenue growth, a trend we see continuing.\u201d\n\nQuarterly Business Reviews | Washington Department of Revenue \n(https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews)\n  For Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter\n4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal\nto post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nFor Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter 4\nreporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal \nto post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nTo explore the statistical data available, use our Create a report tool to create local sales and \nuse tax reports for specific jurisdictions, gross business income tables, state retail sales tax \ntables and a variety of other reports. The QBR publications contain standardized tables detailing \ngross business income, taxable retail sales and accrued tax liability by major industry. Beginning \nwith 2005, the QBR tables were converted from SIC to NAICS codes. This was an effort to move in line\nwith national standards. For more information on SIC and NAICS codes please visit our Frequently \nasked ques\nA compilation of statistics on gross income, taxable retail sales and accrued tax liability as \nreported by Washington state excise taxpayers.\nFor Quarters 1, 2 and 3, we allow two months for operations review and one month for statistical \nprocessing. Our goal is to post early in the fourth month after the return due date. For example, \nQuarter 1 returns are due April 30, so our goal is to post data by early August.\n\nQ4: Quarterly Business Report | Greater Birmingham Chambers of Commerce \n(https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html\n)\n  ## **Developing Workforce Skills in**Greater Birmingham  \n##### **Sponsored by:**  \nThe future of Greater Birmingham\u2019s economy depends on a skilled and adaptable workforce. Ensuring \neffective structures are in place to support skills development is critical to retaining local \ntalent and supporting business growth.  \nRecent data from the Q3 Quarterly Business Report found that 60% of Greater Birmingham businesses \nfaced recruitment difficulties last quarter, with almost half attributing these challenges to a lack\nof suitably skilled applicants.  \nWith this in mind, the Q4 Quarterly Business Report launch event will focus on \u2018Developing Workforce\nSkills in Greater Birmingham.\u2019 The event will bring together local policymakers and business leaders\nto discuss the current direction of skills policy and support in the region, and explore how \norganisations with diverse skills needs are addressing these challenges and investing in their \nworkforce.  \nAlongside these discussions, delegates will receive a copy of the Q4 2025 Greater Birmingham \nQuarterly Business Report and gain insight into the latest survey results.  \nJoin c.60 senior delegates for this insightful event, sponsored by Birmingham City University.\n#### **Attend for**:  \n- Headline economic findings from the latest quarterly business report\n- Expert panel discussion on developing and investing in workforce skills\n- Networking opportunities with c.60 senior business leaders from across Greater Birmingham\n#### **Speakers**  \n**Agenda**  \n09:00am: Registration & Networking  \n09:30am: Welcome & Introduction  \n09:40am: Quarterly Business Report Results  \n09:50am: Presentations  \n11:00am: Event Close\n\nComReg issues Electronic Communications Sector Quarterly Report for Q4 2025 | Commission for \nCommunications Regulation \n(https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/)\n  The Commission for Communications Regulation (ComReg) today released its Quarterly Key Data Report\non the Electronic Communications market for the period (1 October to 31 December), Q4 2025.  \nFibre-to-the-premises (FTTP) subscriber lines stand at 1,050,123 million in Q4 2025, representing \n59% of total fixed broadband subscriber lines, up from 51% in Q4 2024. Overall, fixed broadband \nsubscriber lines increased to 1.76 million, an increase of 4% compared to Q4 2024.  \nComReg\u2019s [Open Data Map \nHub](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fdatamaps-comreg.hub.arcgis.co\nm%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b\n8d8a6b4fee706b37fa%7C0%7C0%7C639089128818231141%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYi\nOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=2SLm1ppCubzMh4B4\nTYxZhJkqiW5jcy2cJM8WGLUDTDI%3D&reserved=0) includes Q4 data on Coverage and Take-Up of Gigabit \nBroadband (FTTP and Cable) by County, Electoral Division and other geographical areas across \nIreland. The county with the highest level of FTTP coverage is Westmeath at 95%. Westmeath also has \nthe highest level of Gigabit coverage at 96%.\nFTTP is the most purchased broadband technology and is available at 84% of all premises in Ireland. \nGigabit broadband is available at 90% of all premises in Ireland. In terms of FTTP take up, 51% of \nall premises with FTTP available had an active FTTP service at the end of Q4 2025.  \nOn a monthly basis an average residential fixed broadband subscriber line used 563 GB of data, an \nincrease of 11% since Q4 2024. Businesses have used 371 GB of data, an increase of 8% compared to Q4\n2024.  \nIn Q4 2025, approximately 71% of fixed broadband subscriber lines had purchased broadband with \nspeeds greater or equal to 500Mbps, up from 65% in Q4 2024, while 24% purchased broadband speeds \ngreater than or equal to 1Gbps. Of the 1,050,123 FTTP subscriber lines, 93% have broadband speeds \ngreater than or equal to 500 Mbps.  \nTotal mobile subscriptions (including mobile broadband and machine-to-machine (M2M) increased to \n10.8 million in Q4 2025 \u2013 driven by a rise in bill pay subscriptions which represent 78% of all \nmobile subscriptions. 5G subscribers increased to 2.8 million in Q4 2025, an increase of 43% since \nQ4 2024.  \nOn a monthly basis an average mobile voice subscriber used 150 minutes, sent 32 texts (8% annual \ndecrease), and used 21GB of data (13% annual increase).\nThe Quarterly Key Data Report for Q4 2025 is available on the [Quarterly Key Data Report \nsection](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%\n2Felectronic-communications%2Fmarket-information%2Fquarterly-key-data-report%2F&data=05%7C02%7Ccloda\ngh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C\n0%7C639089128818261909%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXa\nW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=laOcyAuAvmsgmn1c6TYErH3Tr9n50RSUi3KRARoaK\nWM%3D&reserved=0) of ComReg.ie. The attached infographic highlights key trends from the report.  \nThe data portal which contains the full set of data and associated map visualisations and charts is \navailable on \n[https://www.comreg.ie/industry/electronic-communications/data-portal/](https://eur02.safelinks.prot\nection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fdata-po\nrtal%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639de\ne4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818286257%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsI\nlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=QCoSWFaMBk6b5\nnoPlTzKz2MAcCRuoCwXmwzQuDEfcJI%3D&reserved=0)\n\nQuarterly Results | Quanterix (https://ir.quanterix.com/financial-information/quarterly-results)\n  Quarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual \nReports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix \nCorporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual \nReports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix \nCorporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuanterix Corporation Releases Operating Results for Second Quarter 2022, Announces Business \nRe-Alignment Plan and Revises 2022 Guidance\nQuanterix Releases Operating Results for Fourth Quarter and Full Year 2022; Aligned with \nExpectations\n", "s_d362e0a197": "{\n    \"analysis\": {\n        \"text\": \"# Content Analysis: Quarterly Business Report - Q4 2025\\n\\n## \ud83d\udccb Document \nOverview\\n- **Type:** Corporate Quarterly Business Report\\n- **Period:** Q4 2025\\n- **Format:** \nText-only (no images or raw HTML detected)\\n\\n---\\n\\n## \ud83d\udcca Key Financial Metrics\\n\\n| Metric | Value\n| Change |\\n|--------|-------|--------|\\n| Revenue | $4.2 Billion | +15% YoY |\\n| Operating Margin |\n28% | +4pts vs Q3 |\\n| Monthly Recurring Revenue | $350M | \u2014 |\\n| R&D Investment | $840M | 20% of \nrevenue |\\n| Customer Acquisition Cost | \u2014 | -12% |\\n\\n---\\n\\n## \ud83d\udc65 Operational Highlights\\n\\n| \nMetric | Value | Change |\\n|--------|-------|--------|\\n| Active Users | 45 Million | +22% |\\n| Net \nPromoter Score | 71 | +9 pts |\\n| Employee Headcount | 8,500 | \u2014 |\\n| Global Offices | 12 | \u2014 \n|\\n\\n---\\n\\n## \ud83c\udf0d Strategic Developments\\n- **Market Expansion:** Southeast Asia, Eastern Europe, \nSouth America\\n- **Drivers:** Cloud services & enterprise software performance\\n- **Marketing:** \nImproved efficiency reducing acquisition costs\\n\\n---\\n\\n## \ud83d\udd2e Q1 2026 Outlook\\n\\n### Revenue \nGuidance\\n> **$4.4B \u2013 $4.6B** (projected ~5-10% sequential growth)\\n\\n### Key Initiatives\\n1. \ud83e\udd16 \nLaunch **AI-powered analytics platform**\\n2. \ud83e\udd1d Expand **partner ecosystem**\\n3. \ud83d\udd12 Achieve **SOC 2 \nType II certification** across all cloud products\\n\\n---\\n\\n## \u2705 Overall Assessment\\n\\n### \nStrengths\\n- Strong revenue growth with **improving margins** (28%)\\n- High **user growth** (22%) \nsuggesting strong product-market fit\\n- Significant **NPS improvement** (+9 points) indicating \nbetter customer satisfaction\\n- Healthy **R&D investment** at 20% of revenue\\n\\n### Potential Watch \nAreas\\n- Headcount growth to 8,500 should be monitored against margin sustainability\\n- Geographic \nexpansion into **3 new markets simultaneously** carries execution risk\\n- SOC 2 certification listed\nas *future* goal \u2014 may signal current compliance gaps\\n\\n---\\n\\n## \ud83d\udcdd Content Structure Notes\\n- \n**No images** were included despite an image section placeholder\\n- **No raw HTML** content \ndetected\\n- Document is well-structured with clear sections but lacks granular segment breakdowns\"\n    },\n    \"search_result\": {\n        \"answer\": \"The Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue \ngrowth to $4.2 billion, driven by strong cloud services and enterprise software performance. \nOperating margin improved to 28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due \nto better market
