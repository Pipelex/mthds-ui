const stuffDataHtml = {"s_34048b2647": "# Data Report\n\nThe Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion, driven by strong cloud services and enterprise software performance. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing efficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active users increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net promoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with R&amp;D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue between $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud products.", "s_1391d43af5": "<a href=\"file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/TdfNS2vVXbpp3SDUjQs2LQ.pdf\" class=\"msg-document\">file:///Users/thomashebrardevotis/dev/pipelex-workspace/mthds-ui/.pipelex/storage/normalized/TdfNS2vVXbpp3SDUjQs2LQ.pdf</a>", "s_8278af4607": "<ul><li><table><tr><th>text_and_images</th><td># Quarterly Business Report - Q4 2025\n\n\n## Executive Summary\n\nRevenue grew 15% year-over-year to $4.2 billion, driven by strong performance in cloud services and\nenterprise software. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost\ndecreased by 12% due to improved marketing efficiency. The company expanded into three new\nmarkets: Southeast Asia, Eastern Europe, and South America.\n\n\n## Key Metrics\n\nActive users reached 45 million, a 22% increase. Monthly recurring revenue hit $350M. Net promoter\nscore improved from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally. R&amp;D;\ninvestment was $840M, representing 20% of revenue.\n\n\n## Outlook\n\nFor Q1 2026, we expect revenue between $4.4B and $4.6B. Key initiatives include launching the\nAI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II\ncertification for all cloud products.\n</td></tr></table></li></ul>", "s_e851d4b7d2": "# Content Analysis: Quarterly Business Report - Q4 2025\n\n## \ud83d\udccb Document Overview\n- **Type:** Corporate Quarterly Business Report\n- **Period:** Q4 2025\n- **Format:** Text-only (no images or raw HTML detected)\n\n---\n\n## \ud83d\udcca Key Financial Metrics\n\n| Metric | Value | Change |\n|--------|-------|--------|\n| Revenue | $4.2 Billion | +15% YoY |\n| Operating Margin | 28% | +4pts vs Q3 |\n| Monthly Recurring Revenue | $350M | \u2014 |\n| R&amp;D Investment | $840M | 20% of revenue |\n| Customer Acquisition Cost | \u2014 | -12% |\n\n---\n\n## \ud83d\udc65 Operational Highlights\n\n| Metric | Value | Change |\n|--------|-------|--------|\n| Active Users | 45 Million | +22% |\n| Net Promoter Score | 71 | +9 pts |\n| Employee Headcount | 8,500 | \u2014 |\n| Global Offices | 12 | \u2014 |\n\n---\n\n## \ud83c\udf0d Strategic Developments\n- **Market Expansion:** Southeast Asia, Eastern Europe, South America\n- **Drivers:** Cloud services &amp; enterprise software performance\n- **Marketing:** Improved efficiency reducing acquisition costs\n\n---\n\n## \ud83d\udd2e Q1 2026 Outlook\n\n### Revenue Guidance\n&gt; **$4.4B \u2013 $4.6B** (projected ~5-10% sequential growth)\n\n### Key Initiatives\n1. \ud83e\udd16 Launch **AI-powered analytics platform**\n2. \ud83e\udd1d Expand **partner ecosystem**\n3. \ud83d\udd12 Achieve **SOC 2 Type II certification** across all cloud products\n\n---\n\n## \u2705 Overall Assessment\n\n### Strengths\n- Strong revenue growth with **improving margins** (28%)\n- High **user growth** (22%) suggesting strong product-market fit\n- Significant **NPS improvement** (+9 points) indicating better customer satisfaction\n- Healthy **R&amp;D investment** at 20% of revenue\n\n### Potential Watch Areas\n- Headcount growth to 8,500 should be monitored against margin sustainability\n- Geographic expansion into **3 new markets simultaneously** carries execution risk\n- SOC 2 certification listed as *future* goal \u2014 may signal current compliance gaps\n\n---\n\n## \ud83d\udcdd Content Structure Notes\n- **No images** were included despite an image section placeholder\n- **No raw HTML** content detected\n- Document is well-structured with clear sections but lacks granular segment breakdowns", "s_5c45476820": "<div><p>The Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion, driven by strong cloud services and enterprise software performance. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing efficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active users increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net promoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with R&amp;D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue between $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud products[1].</p><h4>Sources</h4><ul><li><a href=\"https://mb.cision.com/Main/22283/4307468/3934804.pdf\" class=\"msg-document\">1 2025 Q4 REPORT Q4 2025 OCTOBER - DECEMBER Quarterly Report</a><br/><small>Q4 REPORT</small></li><li><a href=\"https://www.houlihancapital.com/q4-2025-quarterly-industry-reports-are-now-available/\" class=\"msg-document\">Q4 2025 Quarterly Industry Reports | Houlihan Capital</a><br/><small>Q4 2025 delivered a set of market signals that are already shaping 2026 decision-making. Across sectors, we saw valuation sensitivity increase, capital move toward \u201cquality-first\u201d operators, and strategic buyers sharpen their criteria in real time.  \nIf you\u2019re managing portfolio performance, planning an exit, or advising clients through strategic decisions, Q4\u2019s data is not just interesting. It\u2019s actionable.  \nHoulihan Capital\u2019s Q4 2025 Quarterly Industry Reports are now available across nine sectors, highlighting the trends we\u2019re seeing in-market and what they mean for investors, operators, and advisors.\n### **Q4 2025 Industry Highlights (9 Reports)**  \n#### **Business Services**  \nBusiness services held up in Q4 2025, but performance stayed uneven as investors continued to reward tech-enabled, scalable service models while traditional providers lagged.M&amp;A slowed to 1,478 deals (a two-year low) as buyers stayed selective, even with financing conditions improving.*Access the report here.*\n#### **Crypto Market + VC**  \nEven with crypto down \\~24% QoQ in Q4 2025, VC interest held up\u2014crypto funding surged \\~77% QoQ to \\~$8.5B, signaling conviction in the category despite volatility. Across broader VC, dollars rose while deal count stayed tight, showing capital concentrating into fewer, larger, fundamentals-driven rounds.[Access the report here.](https://www.houlihancapital.com/industry-intelligence-hub/crypto-venture-capital-market-intelligence/)  \n**Access the Full Q4 2025 Reports**  \nEach report includes sector-specific data, market activity, and the trends we believe matter most for strategic planning and transaction execution.  \nClick the button below to access the reports.</small></li><li><a href=\"https://www.jamescowperkreston.co.uk/news/q4-2025-quarterly-economic-survey-report/\" class=\"msg-document\">Q4 2025 Quarterly Economic Survey Report</a><br/><small>20 January 2026  \n**by Darren O&#39;Connor**  \nPartner  \nWe are proud to have sponsored the[Q4 2025 Quarterly Economic Survey (QES) Report](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q4-2025-Report.pdf),theUK&#39;slongest runningand largestbusiness sentiment survey,recently published by the [Thames Valley Chamber of Commerce (TVCC)](http://www.thamesvalleychamber.co.uk/).This latest edition follows the release of the national results by the [British Chambers of Commerce (BCC)](http://www.britishchambers.org.uk/), providingtimelyand vital insights into the economic landscape as businesses navigate weakening demand and escalating costs.  \nThe Q4 2025 Quarterly Economic Survey, conducted between 10 November and 8 December 2025, reflects responses from a broad cross-section of local businesses, capturing trends across key indicators including sales, employment, cash flow, investment and price pressures.  \nIt highlights a more challenging environment for regional businesses than in previous quarters. Although pockets of resilience remain, sustained cost pressures and lower demands have led to a noticeable easing in overall confidence. This quarter\u2019s data also revealed that a large proportion of businesses anticipates further price increases, driven most strongly by rising labour costs rather than improved margins.  \nKey findings include:\nKey findings include:  \n[Darren O\u2019Connor](https://www.jamescowperkreston.co.uk/darren-oconnor/), Partner at [James Cowper Kreston](https://www.jamescowperkreston.co.uk/),commented:\u201cThe Quarterly Economic Survey (QES)remainsa vital barometer for the UK\u2019s business community. This Q4 2025 edition arrives at a time of considerable challenge, as businesses navigate weakening demand, rising costs, and persistent uncertainty. Demand has softened, with many businesses reporting flat or declining orders and sales, compounded by a cautious consumer base. Risinglabour, fuel, utility, and finance costs are squeezing margins and forcing difficult investment decisions, while skills shortages continue to constrain recruitment and growth. As we look ahead, with Rachel Reeve\u2019s budget behind us, we are all hoping for greater certainty to help long-term decision-making.\u201d\n[Paul Britton](http://www.thamesvalleychamber.co.uk/staff-member/paul-britton/), CEO of [Thames Valley Chamber of Commerce](http://www.thamesvalleychamber.co.uk/),said:\u201cThe latest QES results reflect a challenging picture for Thames Valley firms amid weakening demand and rising costs. Concerns about tax rises were not fully eased by the November 26th Budget. Businessesanticipatefurther price increases driven by risinglabourcosts, while recruitment difficulties and skills shortagesremaina defining constraint. Pre- and post-Budget sentimentremainscautious, and confidence into 2026 is expected to stay subdued unless demand strengthens, interest rates fall, and Government policies provide opportunities rather than obligations for business.\u201d  \n[Click here](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q4-2025-Report.pdf)to download the QES Q4 2025 report in full.</small></li><li><a href=\"https://www.cameco.com/invest/financial-information/annual-reports/2025\" class=\"msg-document\">Quarterly Report - 2025 Q4 | Cameco</a><br/><small># Quarterly Report - 2025 Q4  \n## Audio  \n**2025 Q4 Presentation**  \n**2025 Q4 - Q and A**  \nOn February 13, 2026, **Cameco (TSX: CCO; NYSE: CCJ)** reported its consolidated financial and operating results for the fourth quarter and year ended December 31, 2025, in accordance with International Financial Reporting Standards (IFRS).\n- In April, we received a cash dividend of US$87 million, net of withholdings, from JV Inkai.\n- **Dividend:**In November, to reflect the improvement in our financial performance and the additional distribution received from Westinghouse, we advanced our dividend growth plan. We increased our annual dividend to $0.24 per common share in 2025, advancing our plan to increase the dividend to $0.24 per common share by one year.[See Return in our annual MD&amp;A for more information.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page=30)\n- **Uranium:**Fourth quarter earnings before taxes decreased by $15 million and adjusted EBITDA increased by $5 million, compared to 2024, mainly as a result of lower sales volume due to timing of sales. Annual earnings before income taxes increased by $50 million and adjusted EBITDA increased by $76 million compared to 2024.[See Financial results by segment \u2013 Uranium in our annual MD&amp;A for more information.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page=59)\n- **Westinghouse:**Westinghouse reported net earnings increased by $17 million (our share) for the fourth quarter, compared to the same quarter last year. Over the year, Westinghouse reported a net earnings increase of $276 million in comparison to 2024. To better reflect the underlying operating performance, we use adjusted EBITDA as a performance measure for Westinghouse. In the fourth quarter of 2025, our share of Westinghouse\u2019s adjusted EBITDA increased by $49 million, compared to the fourth quarter of 2024, while over the year, adjusted EBITDA increased by $297 million compared to 2024. In October 2025, Westinghouse made a second cash distribution of US$350 million (US$171.5 million our share) to its owners associated with the cash received in 2025 for its participation in the construction project for two nuclear reactors at the Dukovany power plant in the Czech Republic, led by Korea Hydro &amp; Nuclear Power.[See Financial results by segment - Westinghouse in our annual MD&amp;A for more information.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page=59)</small></li><li><a href=\"https://investors.sirma.com/en/reports-filings/quarterly-reports/interim-consolidated-report-for-the-period-ending-on-31-12-2025\" class=\"msg-document\">Interim consolidated report for the period ending on 31.12.2025</a><br/><small>&amp;lt;- Quarterly Reports  \nQ4  \n2025\n# Interim consolidated report for the period ending on 31.12.2025  \n- Revenue 66 665 EUR &#39;000 30.37 %\n- EBITDA 4 938 EUR &#39;000 66.86 %\n- Net Profit 1 805 EUR &#39;000 216.88 %\n## Interim consolidated report for the period ending on 31.12.2025  \n19 Feb 2026</small></li><li><a href=\"https://www.prnewswire.com/news-releases/sap-quarterly-statement-q4-2025-302673209.html\" class=\"msg-document\">SAP Quarterly Statement Q4 2025</a><br/><small>Christian Klein, CEO: Q4 was a strong cloud quarter, with bookings resulting in 30% Total Cloud Backlog growth to a record 77 billion Euros. The significant Current Cloud Backlog growth in Q4 has laid a strong foundation for accelerating Total ...\n29, 2026 /PRNewswire/ -- SAP SE (NYSE: SAP) announced today its financial results for the fourth quarter and fiscal year ended December 31, 2025. Christian Klein, CEO: Q4 was a strong cloud quarter, with bookings resulting in 30% Total Cloud Backlog growth to a record 77 billion Euros. The significant Current Cloud Backlog growth in Q4 has laid a strong foundation for accelerating Total Revenue growth through 2027. SAP Business AI has become a main driver for growth as it was included in two thirds of our Q4 cloud order entry, combined with strong AI adoption across the ERP Suite.\nIn January 2024, SAP announced a company-wide restructuring program which concluded as planned in the first quarter 2025. Overall expenses associated with the program were approximately \u20ac3.2 billion. Restructuring payouts amounted to \u20ac2.5 billion for the full-year 2024 and \u20ac0.8 billion for the full year 2025. Business Highlights In the fourth quarter, customers around the globe continued to choose the &#34;RISE with SAP&#34; journey to drive their end-to-end business transformations.\nSupplementary financial information pertaining to the fourth quarter and full-year 2025 results can be found at https://www.sap.com/investor. About SAP As a global leader in enterprise applications and business AI, SAP (NYSE: SAP) stands at the nexus of business and technology.\nWhile SAP&#39;s 2026 financial outlook for the income statement parameters is at constant currencies (including an average exchange rate of 1.13 USD per EUR), actual currency reported figures are expected to be impacted by currency exchange rate fluctuations as the company progresses through the year, as reflected in the table below. Currency Impact Assuming December 31, 2025 Rates Apply for 2026</small></li><li><a href=\"https://www.nepc.com/quarterly-private-markets-report-q4-2025/\" class=\"msg-document\">Quarterly Private Markets Report: Q4 2025</a><br/><small>The fourth quarter was one of the strongest quarters of the year, helping push full-year US direct lending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending reached $248 billion.\nDownload Quarterly Private Markets Report: Q4 2025\nAn annual survey conducted by Deloitte indicates that investors and industry participants are optimistic about commercial real estate fundamentals, similar to what was reported in 202524; however, Preqin reports that 30% of surveyed investors plan to reduce their commitments to real estate in the next year, versus 27% planning to increase.25 \u00b7 The recovery in core real estate (as represented by the NFI-ODCE Index) returns flattened out in the second half of 2025, with the Index posting negative appreciation for the second straight quarter for the three months ended December 31.\nWhile these strategies have lagged core real estate in 2025, it should be noted that they also did not dip as negatively in the prior years. Real estate managers saw continued momentum in fundraising activity in the third quarter, according to data from PitchBook. Non-core equity funds (including value-add and opportunistic strategies) reported a total of just over $72 billion in capital raised for the year through September 30.\nThe fourth quarter was one of the strongest quarters of the year, helping push full-year US direct lending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending reached $248 billion. Full-year 2025 sponsor U.S. direct lending volume was down marginally by 2% year over year. Sector activity was led by technology, business services, and healthcare.</small></li><li><a href=\"https://wattclarity.com.au/articles/2026/01/aemo-releases-the-q4-2025-quarterly-energy-dynamics-report/\" class=\"msg-document\">AEMO releases the Q4 2025 Quarterly Energy Dynamics report - WattClarity</a><br/><small>The AEMO have today released their [Quarterly Energy Dynamics (QED) report for Q4 2025](https://www.aemo.com.au/energy-systems/major-publications/quarterly-energy-dynamics-qed), covering outcomes across the market for the quarter ending December 31st 2025.  \nThe [accompanying media release](https://www.aemo.com.au/newsroom/media-release/renewables-supply-more-than-half-of-quarterly-energy-supply) highlighted a drop in both quarter-on-quarter and year-on-year average prices, as well as record volumes of generation for VRE and storage:  \n&gt; Wholesale electricity prices for the National Electricity Market (NEM) nearly halved in the December 2025 quarter, driven by record renewable generation supplying more than half of total energy needs for the first time.\n&gt;\n&gt; AEMO\u2019s latest Quarterly Energy Dynamics report shows wholesale electricity prices averaged $50 per megawatt hour (MWh) across the NEM, a $39/MWh (-44%) reduction from Q4 2024 and a $37/MWh (-43%) decline from Q3 2025.\n&gt;\n&gt; The quarter saw strong growth in renewable and storage output, with wind generation up 29%, grid scale solar up 15%, and battery discharge nearly tripling to an average of 268 megawatts (MW), supported by 3,796 MW of new battery capacity added since late 2024.\n&gt;\n&gt; At the same time, coal-fired generation fell to an all-time quarterly low, down 4.6% year-on-year, while gas-fired generation dropped 27% to its lowest level since Q4 2000.\n&gt;\n&gt;\n&gt; AEMO Executive General Manager Policy and Corporate Affairs, Violette Mouchaileh, said the quarter marked a significant milestone for Australia\u2019s energy transition.\n&gt;\n&gt; \u201cThis is a landmark moment for the NEM. For the first time, renewables and storage supplied more than half of the system\u2019s energy needs for a full quarter,\u201d Ms Mouchaileh said.\n&gt;\n&gt; \u201cIt reflects years of sustained investment and demonstrates that more wind, solar and battery capacity in the system reduces reliance on higher cost coal and gas generation, placing sustained downward pressure on wholesale electricity prices,\u201d she said.  \nKerry Galloway from the AEMO will present an online webinar on the Q4 2025 QED, hosted in collaboration with the University of Melbourne, on the 11th February 2026 at 2:00pm (Melbourne time). Details about the webinar are [here](https://energy.unimelb.edu.au/events/aemo-quarterly-energy-dynamics-q4-2025).\n# Media Coverage  \nThe reports release drew broad attention across mainstream and energy-sector media, with headlines largely centred on the fall in wholesale prices and the VRE milestone. Below is a list of the related coverage we\u2019ve seen so far today:  \n- Daniel Mercer from**the ABC**wrote \u201c\u201c[Australia hits power demand record as renewables pass 50pc milestone](https://www.abc.net.au/news/2026-01-29/australia-hits-power-demand-record-as-renewables-pass-50pc/106280246)\n- Giles Parkinson from **Renew Economy**wrote \u201c\u201c[Landmark moment: Prices plunge as renewables supply half of grid, batteries surge and coal hits new low](https://reneweconomy.com.au/landmark-moment-prices-plunge-as-renewables-supply-half-of-grid-batteries-surge-and-coal-hits-new-low/)\n- Angela Macdonald-Smith from **The Australian Financial Review**wrote \u201c\u201c[Landmark moment: Record renewables drive down cost of power](https://www.afr.com/policy/energy-and-climate/landmark-moment-record-renewables-drive-down-cost-of-power-20260128-p5nxmn)\n- Ev Foley from **PV Magazine**wrote \u201c\u201c[Rooftop solar hits all-time output high of 4,407 MW in Q4 2025: report](https://www.pv-magazine-australia.com/2026/01/29/rooftop-solar-hits-all-time-output-high-of-4407-mw-in-q4-2025-report/)\n- Charis Palmer from **The Energy**wrote \u201c\u201c[Wholesale prices down as NEM and WEM break records](https://theenergy.co/article/wholesale-prices-down-as-nem-and-wem-break-records)</small></li><li><a href=\"https://www.cfib-fcei.ca/en/research-economic-analysis/main-street-quarterly\" class=\"msg-document\">The Main Street Quarterly, 2025 Q4</a><br/><small>The Main Street Quarterly also contains CFIB\u2019s latest estimates of[private sector job vacancies](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-HW.pdf)and an[interactive page](https://www.cfib-fcei.ca/en/research-economic-analysis/private-sector-job-vacancies-in-canada). The \u2018In Focus\u2019 section, which covers a specific topic each quarter, focuses currently on the [B2C versus B2B firms](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-InFocus.pdf).This edition analyses [business](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) [entry and exit trends](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) for 2015 to 2025 by sector.  \nNext release will be around the mid April2026. For the media release, click [here](https://www.cfib-fcei.ca/en/media/canadian-economy-to-grow-in-q4-2025-and-in-q1-2026).\n## Related Documents  \n### Full Report  \n- [Main Street Quarterly](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-ALL.pdf)Q4 2025\n- [Small businesses&#39; wage increase plans](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q12023_In_Focus.pdf)Q1 2023\n- [Investment plans in small firms](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_MSQ_2022_Q4_In_Focus.pdf)Q4 2022\n- [The financial state of small businesses](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q32022_In_Focus.pdf)Q3 2022</small></li><li><a href=\"https://skai.io/press-releases/quarterly-trends-report-q4-2025/\" class=\"msg-document\">Press Release | Q4 2025 Digital Marketing Quarterly Trends Report</a><br/><small>**SAN FRANCISCO, CA \u2013 January 27, 2026 \u2013** Retail media ad spend grew 33% year-over-year in Q4 2025, marking the largest single-quarter increase in six years, as brands aggressively expanded full-funnel strategies during the holiday season. Skai, the leading omnichannel advertising platform for commerce media, today released its [Q4 2025 Digital Marketing Quarterly Trends Report](https://skai.io/reports-and-whitepapers/q4-2025-quarterly-digital-trends-report/), revealing how retail media\u2019s rapid expansion is reshaping performance dynamics across paid search and paid social, while AI-powered discovery accelerates changes in consumer shopping behavior.\n## **Marketers shift AI usage from creative tasks to strategic planning**  \nAs cross-channel orchestration grows more complex, marketers are increasingly turning to AI for decision-making support. Nearly two-thirds of advertisers now use generative AI within retail media programs, but usage patterns reveal a clear evolution. Analysis from Skai\u2019s proprietary GenAI marketing agent found that strategy and planning queries accounted for 35.5% of prompts in Q4, while creative and messaging requests fell to just 3%. This indicates that marketers are moving AI beyond content generation toward the strategic decisions that matter most: budget allocation, channel prioritization, and cross-channel optimization.  \n\u201cThis is one of the most revealing trends reports we\u2019ve published because it shows how dramatically marketing behavior has evolved in just a year,\u201d said Michelle Urwin, Chief Marketing Officer at Skai. \u201cRetail media is scaling rapidly into the upper funnel, omnichannel execution is now the norm, and GenAI is emerging both as a new, agentic channel shaping discovery and as a layer across existing channels like search and retail. At the same time, GenAI is changing how marketers make decisions. These are early signals of changes that began to take hold in Q4 and will continue to shape how commerce media operates throughout 2026.\u201d\nTo access the full Q4 2025 report, visit [skai.io/quarterly-trends-hub.](https://skai.io/reports-and-whitepapers/q3-2025-quarterly-digital-trends-report/)  \n**Methodology**\nAnalysis is based on 972 billion impressions, 8.7 billion clicks, and $9.2 billion of Skai platform activity across retail media, paid search, and [paid social advertising](https://skai.io/glossary/paid-social-advertising/) in Q4 2025 (October 1 \u2013 December 31). Data is aggregated and anonymized across Skai accounts, including many of the world\u2019s leading consumer brands and agencies. Year-over-year comparisons reflect the same period in Q4 2024. Only advertisers active on the Skai platform for the full duration of both periods were included to ensure consistency.  \n**About Skai**\nSkai (formerly Kenshoo) is the leading omnichannel advertising platform for commerce media, combining advanced digital marketing capabilities with commerce insights and operations to drive growth for brands and agencies. Powered by unified data and proprietary GenAI, Skai delivers full-funnel media planning, optimization, and measurement, as well as insights and automation that help brands improve digital shelf performance, retail execution, and revenue recovery. This integrated approach maximizes sales, profitability, and market share across media and commerce touchpoints.</small></li><li><a href=\"https://ir.ondas.com/press-releases/detail/296/ondas-inc-reports-record-fourth-quarter-and-full-year-2025\" class=\"msg-document\">Ondas Inc. Reports Record Fourth Quarter and Full Year 2025 Financial Results: Expects Outsized Growth in 2026 Driven by Execution at OAS, Accelerated Strategic Growth Program and Strong Global Demand for Autonomous Systems :: Ondas Inc. (ONDS)</a><br/><small>Q4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and represents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, meeting the high end of our recently pre-announced ...\nQ4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and represents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, meeting the high end of our recently pre-announced target range, representing approximately 605% year-over-year growth\nThe current quarter loss included a non-cash charge of $82.2 million relating to warrants issued in connection with the October 2025 equity raise (&#34;2025 Warrants&#34;) that have been classified as a liability using a Black-Scholes valuation as of December 31, 2025. The valuation of this liability is subject to material changes from period to period without having any impact on the business of the company or the underlying economics of the warrant.\nThe Company expects continued strong momentum in 2026 and is raising its revenue target for 2026 to at least $375 million, which represents a nearly 7-fold increase from 2025 and is more than double its prior outlook last shared in January 2026. For the first quarter of 2026 Ondas is targeting revenue of $38 - $40 million, representing year-over-year growth of 820%. Growth will be led by our OAS business unit and is supported by $68.3 million in backlog and includes significant contributions from the recently announced acquired businesses.\n(Nasdaq:ONDS) (&#34;Ondas&#34; or the &#34;Company&#34;), a leading provider of autonomous aerial and ground robot intelligence through its Ondas Autonomous Systems (OAS) business unit and private wireless solutions through Ondas Networks, reported financial and operating results for the fourth quarter and full year ended December 31, 2025.</small></li><li><a href=\"https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/\" class=\"msg-document\">Business West | Quarterly Economic Survey Q4 2025</a><br/><small># Quarterly Economic Survey Q4 2025  \nBusiness West, a business leadership and support organisation, helps companies grow, innovate and export.  \nEverything we do contributes to making the South West the best place to live, learn and work. We run the Chambers of Commerce for Bristol, Bath, Gloucestershire and Wiltshire as an accredited member of the British Chambers of Commerce. The quarterly economic survey is the longest running survey of its kind which is used by the Bank of England as one of the first economic indicators of each quarter.  \nWe would like to thank all respondents for their time in completing the survey, which provides Business West with invaluable up to date insight into the trends and state of business health in our region.  \nRESOURCES\n## Download the report &#34;Quarterly Economic Survey Q4 2025&#34;</small></li><li><a href=\"https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025\" class=\"msg-document\">Investment Quarterly | Q4 2025 | Carter Jonas</a><br/><small># Investment Quarterly | Q4 2025  \nOur research specialists, working with our national and regional investment professionals, have released the latest Carter Jonas UK Investment Quarterly report for Q4 2025.\n## Tailored newsletters for you  \nSign up to our newsletter to receive further information and news tailored to you.  \nUK commercial property investment volumes rebounded strongly in Q4 2025, following softer activity in the previous quarter. Industrial investment rose sharply, while office and retail activity also recovered, signalling improving confidence as pricing clarity continued to build. Alternatives remained a significant source of capital deployment, reinforcing ongoing investor selectivity rather than a broad-based rebound.  \nA total of \u00a317.5bn was traded in Q4 2025, representing a 78% increase quarter-on-quarter and a 13% rise year-on-year. Quarterly volumes were also around 32% above the five-year quarterly average, reflecting a strong year-end uplift in deal completion. Reported volumes exclude transactions where the real estate value cannot be robustly separated from operating business considerations, most notably Welltower\u2019s circa \u00a35.2bn off-market acquisition of a UK care home portfolio from Barchester. The rolling annual total edged up modestly to \u00a347.8bn, remaining broadly stable quarter-on-quarter but still around 10% below the five-year average of \u00a353.2bn, highlighting that while momentum improved materially in Q4, the recovery in annual volumes remains uneven.\n### Retail  \nRetail investment totalled \u00a32.8bn in Q4 2025, up 87% on the previous quarter and 37% above the five-year quarterly average. Several sizeable transactions involving prime retail assets, shopping centres, and supermarkets supported volumes during the quarter. Frasers Group acquired Braehead Shopping Centre in Glasgow for circa \u00a3220m, while Blue Owl Capital purchased 10 Asda supermarket stores across the UK and one distribution Centre in Lutterworth from Asda in a sale-and-leaseback deal for \u00a3270m.</small></li><li><a href=\"https://www.investopedia.com/terms/q/quarter.asp\" class=\"msg-document\">Fiscal Quarter: What It Is, How It\u2019s Used, and More</a><br/><small>In this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year.\nIn this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year. A fiscal calendar is an arbitrary range of dates that defines a company\u2019s annual reporting cycle.\nFor instance, if a company chooses to have its fiscal year starting in February rather than January, then its first quarter would consist of February, March, and April. Companies sometimes choose to do this if they want their fiscal year to end in their own peak season. Alternatively, since finishing the year often involves a lot of additional accounting work, some companies choose to end their fiscal year on a relatively calm month. There are two components to Q4 2025.\nA fiscal quarter is a three-month period on a company\u2019s financial calendar that acts as a basis for reporting earnings and paying dividends.\nAs its name suggests, there are four quarterly periods in a year, meaning a publicly traded company would issue four quarterly reports per year. Companies and investors alike use fiscal quarters to keep track of their financial results and business developments over time. These quarters are often referred to as Q1, Q2, Q3, and Q4.</small></li><li><a href=\"https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/\" class=\"msg-document\">Dallas Office | Q4 2025 | Quarterly Market Report</a><br/><small># DFW Office Market Activity Slows Down in Q4 2025  \n#### **EXECUTIVE SUMMARY**  \nMomentum slowed between quarters in the Dallas-Fort Worth office market. Leasing activity decreased 31.7% quarterly from 4.4 million sq. ft. to 3.0 million sq. ft. Total net absorption saw a significant drop for the quarter, decreasing 80.0% from 1.4 million sq. ft. in Q3 to 285,197 sq. ft. in Q4 2025. Class A properties recorded positive absorption while Class B properties posted negative absorption. Due to the slowdown in deliveries and Class A positive absorption, the vacancy rate remained unchanged at 25.3%.  \nConstruction deliveries for the quarter totaled 189,382 sq. ft., down significantly from the previous quarter, and the construction pipeline increased 14.2% over the quarter to 2.9 million sq. ft. Rental rates rose 2.5% over the quarter and 4.8% over the year to $32.06 per sq. ft. Class A gross rental rates rose again to a record high of $36.20 per sq. ft. and are forecasted to continue to rise. Class B rental rates increased to $25.58 per sq. ft. from $25.22 per sq. ft. in Q3 2025.\n**Leasing Activity Decreased Quarterly and Annually**  \nQuarterly leasing velocity, which is comprised of both new leases and renewals, stood at 3.0 million sq. ft. during Q4 2025, a 31.7% decrease over last quarter and down 29.2% from Q4 2024. Notable lease transactions in Q4 2025 include Fujitsu\u2019s 70,000 sq. ft. lease at Galatyn Commons C in Richardson, Unleashed Brands\u2019 51,000 sq. ft. lease in 600 ELC, and Newrez\u2019s 47,000 sq. ft. lease at Cypress Waters in Coppell.  \n**Net Absorption Positive, But Experiences a Sharp Drop Over the Quarter**  \nNet absorption\u2014move-ins minus move-outs\u2014was positive 285,197 sq. ft. in Q4 2025, sharply down 80% quarter over quarter. Only Class A properties contributed to positive absorption, with Class A recording 310,702 sq. ft. Class B posted -25,505 sq. ft. of negative net absorption in Q4 2025. Some tenants that moved in during Q4 2025 included State Farm, which moved into 426,000 sq. ft. at Four CityLine, and GEICO, which took 165,000 sq. ft. at Galatyn Commons B.  \n**Investment Sales Trends**\n**Investment Sales Trends**  \nCoStar Capital Market Analytics reports the cumulative 12-month sales volume at $1.3 billion in the DFW office market. With 204 deals completed, the average transaction price currently stands at $286 per sq. ft. with an average cap rate of 7.9%. Notable recent sale transactions in Q4 2025 include Crescent Real Estate LLC\u2019s purchase of 2100 McKinney from MetLife Investment Management for a reported price of $218 million or $604 per sq. ft. The 360,860 sq. ft. property is 81% leased. Also, Real Capital Solutions, Inc. purchased the 464,290 sq. ft. Walnut Glen Tower from Intercontinental Real Estate Corporation for $26.1 million or $56.21 per sq. ft. The property, located in the Central Expressway submarket, is 76.8% leased.  \n**Rental Rates Continue to Rise**  \nThe average gross rental rate for the DFW office market is $32.33 per sq. ft., up 0.8% quarterly from $32.06 per sq. ft., and up 4.6% annually. The Uptown/Turtle Creek submarket boasts the highest rental rates, with the overall average gross rent currently sitting at $62.10 per sq. ft. The lowest rental rate in the Stemmons Freeway submarket is $21.46 per sq. ft.  \n**For More Information, Contact:**  \n**Steve Triolet**\nSVP of Research and Market Forecasting\ntel 214 223 4008\n[\\[emailprotected\\]](https://partnersrealestate.com/cdn-cgi/l/email-protection)</small></li><li><a href=\"https://www.cbre.com/press-releases/cbre-q4-2025-earnings\" class=\"msg-document\">CBRE Group, Inc. Reports Financial Results for Q4 and Full Year 2025 | CBRE</a><br/><small>Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for ...\n(NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025. Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for 2025 \u00b7\nCBRE Group, Inc. delivers robust financial performance for Q4 and full-year 2025, with double-digit growth in revenue and core EPS.\nCBRE Group, Inc. (NYSE: CBRE) today reported financial results for the ort-q4-2025/\" class=\"msg-document\">Quarterly Private Markets Report: Q4 2025</a><br/><small>The fourth quarter was one of the strongest quarters of the year, helping push full-year US direct lending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending reached $248 billion.\nDownload Quarterly Private Markets Report: Q4 2025\nAn annual survey conducted by Deloitte indicates that investors and industry participants are optimistic about commercial real estate fundamentals, similar to what was reported in 202524; however, Preqin reports that 30% of surveyed investors plan to reduce their commitments to real estate in the next year, versus 27% planning to increase.25 \u00b7 The recovery in core real estate (as represented by the NFI-ODCE Index) returns flattened out in the second half of 2025, with the Index posting negative appreciation for the second straight quarter for the three months ended December 31.\nWhile these strategies have lagged core real estate in 2025, it should be noted that they also did not dip as negatively in the prior years. Real estate managers saw continued momentum in fundraising activity in the third quarter, according to data from PitchBook. Non-core equity funds (including value-add and opportunistic strategies) reported a total of just over $72 billion in capital raised for the year through September 30.\nThe fourth quarter was one of the strongest quarters of the year, helping push full-year US direct lending volumes to $380 billion. Full-year 2025 new-money issuance across U.S. direct lending reached $248 billion. Full-year 2025 sponsor U.S. direct lending volume was down marginally by 2% year over year. Sector activity was led by technology, business services, and healthcare.</small></li><li><a href=\"https://wattclarity.com.au/articles/2026/01/aemo-releases-the-q4-2025-quarterly-energy-dynamics-report/\" class=\"msg-document\">AEMO releases the Q4 2025 Quarterly Energy Dynamics report - WattClarity</a><br/><small>The AEMO have today released their [Quarterly Energy Dynamics (QED) report for Q4 2025](https://www.aemo.com.au/energy-systems/major-publications/quarterly-energy-dynamics-qed), covering outcomes across the market for the quarter ending December 31st 2025.  \nThe [accompanying media release](https://www.aemo.com.au/newsroom/media-release/renewables-supply-more-than-half-of-quarterly-energy-supply) highlighted a drop in both quarter-on-quarter and year-on-year average prices, as well as record volumes of generation for VRE and storage:  \n&gt; Wholesale electricity prices for the National Electricity Market (NEM) nearly halved in the December 2025 quarter, driven by record renewable generation supplying more than half of total energy needs for the first time.\n&gt;\n&gt; AEMO\u2019s latest Quarterly Energy Dynamics report shows wholesale electricity prices averaged $50 per megawatt hour (MWh) across the NEM, a $39/MWh (-44%) reduction from Q4 2024 and a $37/MWh (-43%) decline from Q3 2025.\n&gt;\n&gt; The quarter saw strong growth in renewable and storage output, with wind generation up 29%, grid scale solar up 15%, and battery discharge nearly tripling to an average of 268 megawatts (MW), supported by 3,796 MW of new battery capacity added since late 2024.\n&gt;\n&gt; At the same time, coal-fired generation fell to an all-time quarterly low, down 4.6% year-on-year, while gas-fired generation dropped 27% to its lowest level since Q4 2000.\n&gt;\n&gt;\n&gt; AEMO Executive General Manager Policy and Corporate Affairs, Violette Mouchaileh, said the quarter marked a significant milestone for Australia\u2019s energy transition.\n&gt;\n&gt; \u201cThis is a landmark moment for the NEM. For the first time, renewables and storage supplied more than half of the system\u2019s energy needs for a full quarter,\u201d Ms Mouchaileh said.\n&gt;\n&gt; \u201cIt reflects years of sustained investment and demonstrates that more wind, solar and battery capacity in the system reduces reliance on higher cost coal and gas generation, placing sustained downward pressure on wholesale electricity prices,\u201d she said.  \nKerry Galloway from the AEMO will present an online webinar on the Q4 2025 QED, hosted in collaboration with the University of Melbourne, on the 11th February 2026 at 2:00pm (Melbourne time). Details about the webinar are [here](https://energy.unimelb.edu.au/events/aemo-quarterly-energy-dynamics-q4-2025).\n# Media Coverage  \nThe reports release drew broad attention across mainstream and energy-sector media, with headlines largely centred on the fall in wholesale prices and the VRE milestone. Below is a list of the related coverage we\u2019ve seen so far today:  \n- Daniel Mercer from**the ABC**wrote \u201c\u201c[Australia hits power demand record as renewables pass 50pc milestone](https://www.abc.net.au/news/2026-01-29/australia-hits-power-demand-record-as-renewables-pass-50pc/106280246)\n- Giles Parkinson from **Renew Economy**wrote \u201c\u201c[Landmark moment: Prices plunge as renewables supply half of grid, batteries surge and coal hits new low](https://reneweconomy.com.au/landmark-moment-prices-plunge-as-renewables-supply-half-of-grid-batteries-surge-and-coal-hits-new-low/)\n- Angela Macdonald-Smith from **The Australian Financial Review**wrote \u201c\u201c[Landmark moment: Record renewables drive down cost of power](https://www.afr.com/policy/energy-and-climate/landmark-moment-record-renewables-drive-down-cost-of-power-20260128-p5nxmn)\n- Ev Foley from **PV Magazine**wrote \u201c\u201c[Rooftop solar hits all-time output high of 4,407 MW in Q4 2025: report](https://www.pv-magazine-australia.com/2026/01/29/rooftop-solar-hits-all-time-output-high-of-4407-mw-in-q4-2025-report/)\n- Charis Palmer from **The Energy**wrote \u201c\u201c[Wholesale prices down as NEM and WEM break records](https://theenergy.co/article/wholesale-prices-down-as-nem-and-wem-break-records)</small></li><li><a href=\"https://www.cfib-fcei.ca/en/research-economic-analysis/main-street-quarterly\" class=\"msg-document\">The Main Street Quarterly, 2025 Q4</a><br/><small>The Main Street Quarterly also contains CFIB\u2019s latest estimates of[private sector job vacancies](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-HW.pdf)and an[interactive page](https://www.cfib-fcei.ca/en/research-economic-analysis/private-sector-job-vacancies-in-canada). The \u2018In Focus\u2019 section, which covers a specific topic each quarter, focuses currently on the [B2C versus B2B firms](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-InFocus.pdf).This edition analyses [business](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) [entry and exit trends](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) for 2015 to 2025 by sector.  \nNext release will be around the mid April2026. For the media release, click [here](https://www.cfib-fcei.ca/en/media/canadian-economy-to-grow-in-q4-2025-and-in-q1-2026).\n## Related Documents  \n### Full Report  \n- [Main Street Quarterly](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-ALL.pdf)Q4 2025\n- [Small businesses&#39; wage increase plans](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q12023_In_Focus.pdf)Q1 2023\n- [Investment plans in small firms](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_MSQ_2022_Q4_In_Focus.pdf)Q4 2022\n- [The financial state of small businesses](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q32022_In_Focus.pdf)Q3 2022</small></li><li><a href=\"https://skai.io/press-releases/quarterly-trends-report-q4-2025/\" class=\"msg-document\">Press Release | Q4 2025 Digital Marketing Quarterly Trends Report</a><br/><small>**SAN FRANCISCO, CA \u2013 January 27, 2026 \u2013** Retail media ad spend grew 33% year-over-year in Q4 2025, marking the largest single-quarter increase in six years, as brands aggressively expanded full-funnel strategies during the holiday season. Skai, the leading omnichannel advertising platform for commerce media, today released its [Q4 2025 Digital Marketing Quarterly Trends Report](https://skai.io/reports-and-whitepapers/q4-2025-quarterly-digital-trends-report/), revealing how retail media\u2019s rapid expansion is reshaping performance dynamics across paid search and paid social, while AI-powered discovery accelerates changes in consumer shopping behavior.\n## **Marketers shift AI usage from creative tasks to strategic planning**  \nAs cross-channel orchestration grows more complex, marketers are increasingly turning to AI for decision-making support. Nearly two-thirds of advertisers now use generative AI within retail media programs, but usage patterns reveal a clear evolution. Analysis from Skai\u2019s proprietary GenAI marketing agent found that strategy and planning queries accounted for 35.5% of prompts in Q4, while creative and messaging requests fell to just 3%. This indicates that marketers are moving AI beyond content generation toward the strategic decisions that matter most: budget allocation, channel prioritization, and cross-channel optimization.  \n\u201cThis is one of the most revealing trends reports we\u2019ve published because it shows how dramatically marketing behavior has evolved in just a year,\u201d said Michelle Urwin, Chief Marketing Officer at Skai. \u201cRetail media is scaling rapidly into the upper funnel, omnichannel execution is now the norm, and GenAI is emerging both as a new, agentic channel shaping discovery and as a layer across existing channels like search and retail. At the same time, GenAI is changing how marketers make decisions. These are early signals of changes that began to take hold in Q4 and will continue to shape how commerce media operates throughout 2026.\u201d\nTo access the full Q4 2025 report, visit [skai.io/quarterly-trends-hub.](https://skai.io/reports-and-whitepapers/q3-2025-quarterly-digital-trends-report/)  \n**Methodology**\nAnalysis is based on 972 billion impressions, 8.7 billion clicks, and $9.2 billion of Skai platform activity across retail media, paid search, and [paid social advertising](https://skai.io/glossary/paid-social-advertising/) in Q4 2025 (October 1 \u2013 December 31). Data is aggregated and anonymized across Skai accounts, including many of the world\u2019s leading consumer brands and agencies. Year-over-year comparisons reflect the same period in Q4 2024. Only advertisers active on the Skai platform for the full duration of both periods were included to ensure consistency.  \n**About Skai**\nSkai (formerly Kenshoo) is the leading omnichannel advertising platform for commerce media, combining advanced digital marketing capabilities with commerce insights and operations to drive growth for brands and agencies. Powered by unified data and proprietary GenAI, Skai delivers full-funnel media planning, optimization, and measurement, as well as insights and automation that help brands improve digital shelf performance, retail execution, and revenue recovery. This integrated approach maximizes sales, profitability, and market share across media and commerce touchpoints.</small></li><li><a href=\"https://ir.ondas.com/press-releases/detail/296/ondas-inc-reports-record-fourth-quarter-and-full-year-2025\" class=\"msg-document\">Ondas Inc. Reports Record Fourth Quarter and Full Year 2025 Financial Results: Expects Outsized Growth in 2026 Driven by Execution at OAS, Accelerated Strategic Growth Program and Strong Global Demand for Autonomous Systems :: Ondas Inc. (ONDS)</a><br/><small>Q4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and represents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, meeting the high end of our recently pre-announced ...\nQ4 revenue of $30.1 million meeting the high end of our recently pre-announced target range and represents a step-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, meeting the high end of our recently pre-announced target range, representing approximately 605% year-over-year growth\nThe current quarter loss included a non-cash charge of $82.2 million relating to warrants issued in connection with the October 2025 equity raise (&#34;2025 Warrants&#34;) that have been classified as a liability using a Black-Scholes valuation as of December 31, 2025. The valuation of this liability is subject to material changes from period to period without having any impact on the business of the company or the underlying economics of the warrant.\nThe Company expects continued strong momentum in 2026 and is raising its revenue target for 2026 to at least $375 million, which represents a nearly 7-fold increase from 2025 and is more than double its prior outlook last shared in January 2026. For the first quarter of 2026 Ondas is targeting revenue of $38 - $40 million, representing year-over-year growth of 820%. Growth will be led by our OAS business unit and is supported by $68.3 million in backlog and includes significant contributions from the recently announced acquired businesses.\n(Nasdaq:ONDS) (&#34;Ondas&#34; or the &#34;Company&#34;), a leading provider of autonomous aerial and ground robot intelligence through its Ondas Autonomous Systems (OAS) business unit and private wireless solutions through Ondas Networks, reported financial and operating results for the fourth quarter and full year ended December 31, 2025.</small></li><li><a href=\"https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/\" class=\"msg-document\">Business West | Quarterly Economic Survey Q4 2025</a><br/><small># Quarterly Economic Survey Q4 2025  \nBusiness West, a business leadership and support organisation, helps companies grow, innovate and export.  \nEverything we do contributes to making the South West the best place to live, learn and work. We run the Chambers of Commerce for Bristol, Bath, Gloucestershire and Wiltshire as an accredited member of the British Chambers of Commerce. The quarterly economic survey is the longest running survey of its kind which is used by the Bank of England as one of the first economic indicators of each quarter.  \nWe would like to thank all respondents for their time in completing the survey, which provides Business West with invaluable up to date insight into the trends and state of business health in our region.  \nRESOURCES\n## Download the report &#34;Quarterly Economic Survey Q4 2025&#34;</small></li><li><a href=\"https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025\" class=\"msg-document\">Investment Quarterly | Q4 2025 | Carter Jonas</a><br/><small># Investment Quarterly | Q4 2025  \nOur research specialists, working with our national and regional investment professionals, have released the latest Carter Jonas UK Investment Quarterly report for Q4 2025.\n## Tailored newsletters for you  \nSign up to our newsletter to receive further information and news tailored to you.  \nUK commercial property investment volumes rebounded strongly in Q4 2025, following softer activity in the previous quarter. Industrial investment rose sharply, while office and retail activity also recovered, signalling improving confidence as pricing clarity continued to build. Alternatives remained a significant source of capital deployment, reinforcing ongoing investor selectivity rather than a broad-based rebound.  \nA total of \u00a317.5bn was traded in Q4 2025, representing a 78% increase quarter-on-quarter and a 13% rise year-on-year. Quarterly volumes were also around 32% above the five-year quarterly average, reflecting a strong year-end uplift in deal completion. Reported volumes exclude transactions where the real estate value cannot be robustly separated from operating business considerations, most notably Welltower\u2019s circa \u00a35.2bn off-market acquisition of a UK care home portfolio from Barchester. The rolling annual total edged up modestly to \u00a347.8bn, remaining broadly stable quarter-on-quarter but still around 10% below the five-year average of \u00a353.2bn, highlighting that while momentum improved materially in Q4, the recovery in annual volumes remains uneven.\n### Retail  \nRetail investment totalled \u00a32.8bn in Q4 2025, up 87% on the previous quarter and 37% above the five-year quarterly average. Several sizeable transactions involving prime retail assets, shopping centres, and supermarkets supported volumes during the quarter. Frasers Group acquired Braehead Shopping Centre in Glasgow for circa \u00a3220m, while Blue Owl Capital purchased 10 Asda supermarket stores across the UK and one distribution Centre in Lutterworth from Asda in a sale-and-leaseback deal for \u00a3270m.</small></li><li><a href=\"https://www.investopedia.com/terms/q/quarter.asp\" class=\"msg-document\">Fiscal Quarter: What It Is, How It\u2019s Used, and More</a><br/><small>In this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year.\nIn this example, the phrase Q4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the year, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a calendar year. A fiscal calendar is an arbitrary range of dates that defines a company\u2019s annual reporting cycle.\nFor instance, if a company chooses to have its fiscal year starting in February rather than January, then its first quarter would consist of February, March, and April. Companies sometimes choose to do this if they want their fiscal year to end in their own peak season. Alternatively, since finishing the year often involves a lot of additional accounting work, some companies choose to end their fiscal year on a relatively calm month. There are two components to Q4 2025.\nA fiscal quarter is a three-month period on a company\u2019s financial calendar that acts as a basis for reporting earnings and paying dividends.\nAs its name suggests, there are four quarterly periods in a year, meaning a publicly traded company would issue four quarterly reports per year. Companies and investors alike use fiscal quarters to keep track of their financial results and business developments over time. These quarters are often referred to as Q1, Q2, Q3, and Q4.</small></li><li><a href=\"https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/\" class=\"msg-document\">Dallas Office | Q4 2025 | Quarterly Market Report</a><br/><small># DFW Office Market Activity Slows Down in Q4 2025  \n#### **EXECUTIVE SUMMARY**  \nMomentum slowed between quarters in the Dallas-Fort Worth office market. Leasing activity decreased 31.7% quarterly from 4.4 million sq. ft. to 3.0 million sq. ft. Total net absorption saw a significant drop for the quarter, decreasing 80.0% from 1.4 million sq. ft. in Q3 to 285,197 sq. ft. in Q4 2025. Class A properties recorded positive absorption while Class B properties posted negative absorption. Due to the slowdown in deliveries and Class A positive absorption, the vacancy rate remained unchanged at 25.3%.  \nConstruction deliveries for the quarter totaled 189,382 sq. ft., down significantly from the previous quarter, and the construction pipeline increased 14.2% over the quarter to 2.9 million sq. ft. Rental rates rose 2.5% over the quarter and 4.8% over the year to $32.06 per sq. ft. Class A gross rental rates rose again to a record high of $36.20 per sq. ft. and are forecasted to continue to rise. Class B rental rates increased to $25.58 per sq. ft. from $25.22 per sq. ft. in Q3 2025.\n**Leasing Activity Decreased Quarterly and Annually**  \nQuarterly leasing velocity, which is comprised of both new leases and renewals, stood at 3.0 million sq. ft. during Q4 2025, a 31.7% decrease over last quarter and down 29.2% from Q4 2024. Notable lease transactions in Q4 2025 include Fujitsu\u2019s 70,000 sq. ft. lease at Galatyn Commons C in Richardson, Unleashed Brands\u2019 51,000 sq. ft. lease in 600 ELC, and Newrez\u2019s 47,000 sq. ft. lease at Cypress Waters in Coppell.  \n**Net Absorption Positive, But Experiences a Sharp Drop Over the Quarter**  \nNet absorption\u2014move-ins minus move-outs\u2014was positive 285,197 sq. ft. in Q4 2025, sharply down 80% quarter over quarter. Only Class A properties contributed to positive absorption, with Class A recording 310,702 sq. ft. Class B posted -25,505 sq. ft. of negative net absorption in Q4 2025. Some tenants that moved in during Q4 2025 included State Farm, which moved into 426,000 sq. ft. at Four CityLine, and GEICO, which took 165,000 sq. ft. at Galatyn Commons B.  \n**Investment Sales Trends**\n**Investment Sales Trends**  \nCoStar Capital Market Analytics reports the cumulative 12-month sales volume at $1.3 billion in the DFW office market. With 204 deals completed, the average transaction price currently stands at $286 per sq. ft. with an average cap rate of 7.9%. Notable recent sale transactions in Q4 2025 include Crescent Real Estate LLC\u2019s purchase of 2100 McKinney from MetLife Investment Management for a reported price of $218 million or $604 per sq. ft. The 360,860 sq. ft. property is 81% leased. Also, Real Capital Solutions, Inc. purchased the 464,290 sq. ft. Walnut Glen Tower from Intercontinental Real Estate Corporation for $26.1 million or $56.21 per sq. ft. The property, located in the Central Expressway submarket, is 76.8% leased.  \n**Rental Rates Continue to Rise**  \nThe average gross rental rate for the DFW office market is $32.33 per sq. ft., up 0.8% quarterly from $32.06 per sq. ft., and up 4.6% annually. The Uptown/Turtle Creek submarket boasts the highest rental rates, with the overall average gross rent currently sitting at $62.10 per sq. ft. The lowest rental rate in the Stemmons Freeway submarket is $21.46 per sq. ft.  \n**For More Information, Contact:**  \n**Steve Triolet**\nSVP of Research and Market Forecasting\ntel 214 223 4008\n[\\[emailprotected\\]](https://partnersrealestate.com/cdn-cgi/l/email-protection)</small></li><li><a href=\"https://www.cbre.com/press-releases/cbre-q4-2025-earnings\" class=\"msg-document\">CBRE Group, Inc. Reports Financial Results for Q4 and Full Year 2025 | CBRE</a><br/><small>Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for ...\n(NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025. Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for 2025 \u00b7\nCBRE Group, Inc. delivers robust financial performance for Q4 and full-year 2025, with double-digit growth in revenue and core EPS.\nCBRE Group, Inc. (NYSE: CBRE) today reported financial results for the fourth quarter ended December 31, 2025.\n\u201cWe had a strong end to 2025, with fourth-quarter revenue and core earnings-per-share rising by double digits and both reaching their highest levels ever for CBRE,\u201d said Bob Sulentic, CBRE\u2019s chair and chief executive officer. \u201cOur strength was broad-based. We saw significant gains in sales and leasing in the U.S. and much of the rest of the world and our resilient businesses continued to post double-digit revenue growth, a trend we see continuing.\u201d</small></li><li><a href=\"https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews\" class=\"msg-document\">Quarterly Business Reviews | Washington Department of Revenue</a><br/><small>For Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter 4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nFor Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by Quarter 4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with our goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\nTo explore the statistical data available, use our Create a report tool to create local sales and use tax reports for specific jurisdictions, gross business income tables, state retail sales tax tables and a variety of other reports. The QBR publications contain standardized tables detailing gross business income, taxable retail sales and accrued tax liability by major industry. Beginning with 2005, the QBR tables were converted from SIC to NAICS codes. This was an effort to move in line with national standards. For more information on SIC and NAICS codes please visit our Frequently asked ques\nA compilation of statistics on gross income, taxable retail sales and accrued tax liability as reported by Washington state excise taxpayers.\nFor Quarters 1, 2 and 3, we allow two months for operations review and one month for statistical processing. Our goal is to post early in the fourth month after the return due date. For example, Quarter 1 returns are due April 30, so our goal is to post data by early August.</small></li><li><a href=\"https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html\" class=\"msg-document\">Q4: Quarterly Business Report | Greater Birmingham Chambers of Commerce</a><br/><small>## **Developing Workforce Skills in**Greater Birmingham  \n##### **Sponsored by:**  \nThe future of Greater Birmingham\u2019s economy depends on a skilled and adaptable workforce. Ensuring effective structures are in place to support skills development is critical to retaining local talent and supporting business growth.  \nRecent data from the Q3 Quarterly Business Report found that 60% of Greater Birmingham businesses faced recruitment difficulties last quarter, with almost half attributing these challenges to a lack of suitably skilled applicants.  \nWith this in mind, the Q4 Quarterly Business Report launch event will focus on \u2018Developing Workforce Skills in Greater Birmingham.\u2019 The event will bring together local policymakers and business leaders to discuss the current direction of skills policy and support in the region, and explore how organisations with diverse skills needs are addressing these challenges and investing in their workforce.  \nAlongside these discussions, delegates will receive a copy of the Q4 2025 Greater Birmingham Quarterly Business Report and gain insight into the latest survey results.  \nJoin c.60 senior delegates for this insightful event, sponsored by Birmingham City University.\n#### **Attend for**:  \n- Headline economic findings from the latest quarterly business report\n- Expert panel discussion on developing and investing in workforce skills\n- Networking opportunities with c.60 senior business leaders from across Greater Birmingham\n#### **Speakers**  \n**Agenda**  \n09:00am: Registration &amp; Networking  \n09:30am: Welcome &amp; Introduction  \n09:40am: Quarterly Business Report Results  \n09:50am: Presentations  \n11:00am: Event Close</small></li><li><a href=\"https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/\" class=\"msg-document\">ComReg issues Electronic Communications Sector Quarterly Report for Q4 2025 | Commission for Communications Regulation</a><br/><small>The Commission for Communications Regulation (ComReg) today released its Quarterly Key Data Report on the Electronic Communications market for the period (1 October to 31 December), Q4 2025.  \nFibre-to-the-premises (FTTP) subscriber lines stand at 1,050,123 million in Q4 2025, representing 59% of total fixed broadband subscriber lines, up from 51% in Q4 2024. Overall, fixed broadband subscriber lines increased to 1.76 million, an increase of 4% compared to Q4 2024.  \nComReg\u2019s [Open Data Map Hub](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fdatamaps-comreg.hub.arcgis.com%2F&amp;data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818231141%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=2SLm1ppCubzMh4B4TYxZhJkqiW5jcy2cJM8WGLUDTDI%3D&amp;reserved=0) includes Q4 data on Coverage and Take-Up of Gigabit Broadband (FTTP and Cable) by County, Electoral Division and other geographical areas across Ireland. The county with the highest level of FTTP coverage is Westmeath at 95%. Westmeath also has the highest level of Gigabit coverage at 96%.\nFTTP is the most purchased broadband technology and is available at 84% of all premises in Ireland. Gigabit broadband is available at 90% of all premises in Ireland. In terms of FTTP take up, 51% of all premises with FTTP available had an active FTTP service at the end of Q4 2025.  \nOn a monthly basis an average residential fixed broadband subscriber line used 563 GB of data, an increase of 11% since Q4 2024. Businesses have used 371 GB of data, an increase of 8% compared to Q4 2024.  \nIn Q4 2025, approximately 71% of fixed broadband subscriber lines had purchased broadband with speeds greater or equal to 500Mbps, up from 65% in Q4 2024, while 24% purchased broadband speeds greater than or equal to 1Gbps. Of the 1,050,123 FTTP subscriber lines, 93% have broadband speeds greater than or equal to 500 Mbps.  \nTotal mobile subscriptions (including mobile broadband and machine-to-machine (M2M) increased to 10.8 million in Q4 2025 \u2013 driven by a rise in bill pay subscriptions which represent 78% of all mobile subscriptions. 5G subscribers increased to 2.8 million in Q4 2025, an increase of 43% since Q4 2024.  \nOn a monthly basis an average mobile voice subscriber used 150 minutes, sent 32 texts (8% annual decrease), and used 21GB of data (13% annual increase).\nThe Quarterly Key Data Report for Q4 2025 is available on the [Quarterly Key Data Report section](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fmarket-information%2Fquarterly-key-data-report%2F&amp;data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818261909%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=laOcyAuAvmsgmn1c6TYErH3Tr9n50RSUi3KRARoaKWM%3D&amp;reserved=0) of ComReg.ie. The attached infographic highlights key trends from the report.  \nThe data portal which contains the full set of data and associated map visualisations and charts is available on [https://www.comreg.ie/industry/electronic-communications/data-portal/](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fdata-portal%2F&amp;data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818286257%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=QCoSWFaMBk6b5noPlTzKz2MAcCRuoCwXmwzQuDEfcJI%3D&amp;reserved=0)</small></li><li><a href=\"https://ir.quanterix.com/financial-information/quarterly-results\" class=\"msg-document\">Quarterly Results | Quanterix</a><br/><small>Quarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 Committee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation Q4 2025 Earnings Call \u00b7\nQuanterix Corporation Releases Operating Results for Second Quarter 2022, Announces Business Re-Alignment Plan and Revises 2022 Guidance\nQuanterix Releases Operating Results for Fourth Quarter and Full Year 2022; Aligned with Expectations</small></li></ul></div></td></tr></table>", "s_70cd2b65c2": "<ul><li>## Q4 2025 Quarterly Business Report Summary\n\n**Financial Performance**\n- Revenue reached **$4.2 billion**, up 15% year-over-year\n- Operating margin improved to **28%** (up from 24% in Q3)\n- Customer acquisition costs dropped **12%** due to better marketing efficiency\n\n**Growth Highlights**\n- Active users grew 22% to **45 million**\n- Monthly recurring revenue hit **$350M**\n- Expanded into **3 new markets**: Southeast Asia, Eastern Europe, and South America\n\n**Other Key Metrics**\n- Net Promoter Score improved from 62 \u2192 **71**\n- Headcount grew to **8,500** employees across 12 global offices\n- R&amp;D investment of **$840M** (20% of revenue)\n\n**Q1 2026 Outlook**\n- Revenue projected between **$4.4B\u2013$4.6B**\n- Key initiatives: AI-powered analytics platform launch, partner ecosystem expansion, and SOC 2 Type II certification for cloud products</li></ul>", "s_4cb9bcc9a1": "## Q4 2025 Quarterly Business Report Summary\n\n**Financial Performance**\n- Revenue reached **$4.2 billion**, up 15% year-over-year\n- Operating margin improved to **28%** (up from 24% in Q3)\n- Customer acquisition costs dropped **12%** due to better marketing efficiency\n\n**Growth Highlights**\n- Active users grew 22% to **45 million**\n- Monthly recurring revenue hit **$350M**\n- Expanded into **3 new markets**: Southeast Asia, Eastern Europe, and South America\n\n**Other Key Metrics**\n- Net Promoter Score improved from 62 \u2192 **71**\n- Headcount grew to **8,500** employees across 12 global offices\n- R&amp;D investment of **$840M** (20% of revenue)\n\n**Q1 2026 Outlook**\n- Revenue projected between **$4.4B\u2013$4.6B**\n- Key initiatives: AI-powered analytics platform launch, partner ecosystem expansion, and SOC 2 Type II certification for cloud products", "s_31b436d362": "<table><tr><th>text_and_images</th><td># Quarterly Business Report - Q4 2025\n\n\n## Executive Summary\n\nRevenue grew 15% year-over-year to $4.2 billion, driven by strong performance in cloud services and\nenterprise software. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost\ndecreased by 12% due to improved marketing efficiency. The company expanded into three new\nmarkets: Southeast Asia, Eastern Europe, and South America.\n\n\n## Key Metrics\n\nActive users reached 45 million, a 22% increase. Monthly recurring revenue hit $350M. Net promoter\nscore improved from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally. R&amp;D;\ninvestment was $840M, representing 20% of revenue.\n\n\n## Outlook\n\nFor Q1 2026, we expect revenue between $4.4B and $4.6B. Key initiatives include launching the\nAI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II\ncertification for all cloud products.\n</td></tr></table>", "s_c2a9fadc43": "<table><tr><th>content</th><td>The Quarterly Business Report for Q4 2025 shows a 15% year-over-year revenue growth to $4.2 billion, driven by strong cloud services and enterprise software performance. Operating margin improved to 28%, up from 24% in Q3. Customer acquisition cost decreased by 12% due to better marketing efficiency. The company expanded into Southeast Asia, Eastern Europe, and South America. Active users increased by 22% to 45 million, monthly recurring revenue reached $350 million, and the net promoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 offices globally, with R&amp;D investment at $840 million, representing 20% of revenue. The outlook for Q1 2026 expects revenue between $4.4 billion and $4.6 billion, focusing on launching an AI-powered analytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II certification for all cloud products.</td></tr><tr><th>category</th><td>data</td></tr></table>"};

// Make all links in a container open in new windows
function makeLinksOpenInNewWindow(container) {
    if (!container) return;
    const links = container.querySelectorAll('a');
    links.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
    });
}

// Validate that a URL is safe for display (prevents javascript: and data: URL injection)
function isSafeDisplayUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return url.startsWith('https://') || url.startsWith('http://') || url.startsWith('file://');
}

// Extract URL from stuff data (handles various data structures)
// Returns null for invalid/unsafe URLs (javascript:, data:, etc.)
function extractUrl(jsonData) {
    if (!jsonData) return null;
    // Check if data itself is a URL string
    if (typeof jsonData === 'string') {
        return isSafeDisplayUrl(jsonData) ? jsonData : null;
    }
    // Prefer public_url (pre-signed S3 URL or file:// URI) over url (internal pipelex-storage:// URL)
    const candidates = [jsonData.public_url, jsonData.src, jsonData.href, jsonData.uri, jsonData.url];
    for (const candidate of candidates) {
        if (isSafeDisplayUrl(candidate)) return candidate;
    }
    return null;
}
