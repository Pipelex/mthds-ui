ing efficiency. The company expanded into Southeast Asia, Eastern Europe, and South \nAmerica. Active users increased by 22% to 45 million, monthly recurring revenue reached $350 \nmillion, and the net promoter score rose from 62 to 71. Employee headcount grew to 8,500 across 12 \noffices globally, with R&D investment at $840 million, representing 20% of revenue. The outlook for \nQ1 2026 expects revenue between $4.4 billion and $4.6 billion, focusing on launching an AI-powered \nanalytics platform, expanding the partner ecosystem, and achieving SOC 2 Type II certification for \nall cloud products[1].\",\n        \"sources\": [\n            {\n                \"url\": \"https://mb.cision.com/Main/22283/4307468/3934804.pdf\",\n                \"public_url\": \"https://mb.cision.com/Main/22283/4307468/3934804.pdf\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"1 2025 Q4 REPORT Q4 2025 OCTOBER - DECEMBER Quarterly Report\",\n                \"snippet\": \"Q4 REPORT\"\n            },\n            {\n                \"url\": \n\"https://www.houlihancapital.com/q4-2025-quarterly-industry-reports-are-now-available/\",\n                \"public_url\": \n\"https://www.houlihancapital.com/q4-2025-quarterly-industry-reports-are-now-available/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Q4 2025 Quarterly Industry Reports | Houlihan Capital\",\n                \"snippet\": \"Q4 2025 delivered a set of market signals that are already shaping 2026 \ndecision-making. Across sectors, we saw valuation sensitivity increase, capital move toward \n\u201cquality-first\u201d operators, and strategic buyers sharpen their criteria in real time.  \\nIf you\u2019re \nmanaging portfolio performance, planning an exit, or advising clients through strategic decisions, \nQ4\u2019s data is not just interesting. It\u2019s actionable.  \\nHoulihan Capital\u2019s Q4 2025 Quarterly Industry\nReports are now available across nine sectors, highlighting the trends we\u2019re seeing in-market and \nwhat they mean for investors, operators, and advisors.\\n### **Q4 2025 Industry Highlights (9 \nReports)**  \\n#### **Business Services**  \\nBusiness services held up in Q4 2025, but performance \nstayed uneven as investors continued to reward tech-enabled, scalable service models while \ntraditional providers lagged.M&A slowed to 1,478 deals (a two-year low) as buyers stayed selective, \neven with financing conditions improving.*Access the report here.*\\n#### **Crypto Market + VC**  \n\\nEven with crypto down \\\\~24% QoQ in Q4 2025, VC interest held up\u2014crypto funding surged \\\\~77% QoQ \nto \\\\~$8.5B, signaling conviction in the category despite volatility. Across broader VC, dollars \nrose while deal count stayed tight, showing capital concentrating into fewer, larger, \nfundamentals-driven rounds.[Access the report \nhere.](https://www.houlihancapital.com/industry-intelligence-hub/crypto-venture-capital-market-intel\nligence/)  \\n**Access the Full Q4 2025 Reports**  \\nEach report includes sector-specific data, \nmarket activity, and the trends we believe matter most for strategic planning and transaction \nexecution.  \\nClick the button below to access the reports.\"\n            },\n            {\n                \"url\": \n\"https://www.jamescowperkreston.co.uk/news/q4-2025-quarterly-economic-survey-report/\",\n                \"public_url\": \n\"https://www.jamescowperkreston.co.uk/news/q4-2025-quarterly-economic-survey-report/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Q4 2025 Quarterly Economic Survey Report\",\n                \"snippet\": \"20 January 2026  \\n**by Darren O'Connor**  \\nPartner  \\nWe are proud to \nhave sponsored the[Q4 2025 Quarterly Economic Survey (QES) \nReport](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q\n4-2025-Report.pdf),theUK'slongest runningand largestbusiness sentiment survey,recently published by \nthe [Thames Valley Chamber of Commerce (TVCC)](http://www.thamesvalleychamber.co.uk/).This latest \nedition follows the release of the national results by the [British Chambers of Commerce \n(BCC)](http://www.britishchambers.org.uk/), providingtimelyand vital insights into the economic \nlandscape as businesses navigate weakening demand and escalating costs.  \\nThe Q4 2025 Quarterly \nEconomic Survey, conducted between 10 November and 8 December 2025, reflects responses from a broad \ncross-section of local businesses, capturing trends across key indicators including sales, \nemployment, cash flow, investment and price pressures.  \\nIt highlights a more challenging \nenvironment for regional businesses than in previous quarters. Although pockets of resilience \nremain, sustained cost pressures and lower demands have led to a noticeable easing in overall \nconfidence. This quarter\u2019s data also revealed that a large proportion of businesses anticipates \nfurther price increases, driven most strongly by rising labour costs rather than improved margins.  \n\\nKey findings include:\\nKey findings include:  \\n[Darren \nO\u2019Connor](https://www.jamescowperkreston.co.uk/darren-oconnor/), Partner at [James Cowper \nKreston](https://www.jamescowperkreston.co.uk/),commented:\u201cThe Quarterly Economic Survey \n(QES)remainsa vital barometer for the UK\u2019s business community. This Q4 2025 edition arrives at a \ntime of considerable challenge, as businesses navigate weakening demand, rising costs, and \npersistent uncertainty. Demand has softened, with many businesses reporting flat or declining orders\nand sales, compounded by a cautious consumer base. Risinglabour, fuel, utility, and finance costs \nare squeezing margins and forcing difficult investment decisions, while skills shortages continue to\nconstrain recruitment and growth. As we look ahead, with Rachel Reeve\u2019s budget behind us, we are all\nhoping for greater certainty to help long-term decision-making.\u201d\\n[Paul \nBritton](http://www.thamesvalleychamber.co.uk/staff-member/paul-britton/), CEO of [Thames Valley \nChamber of Commerce](http://www.thamesvalleychamber.co.uk/),said:\u201cThe latest QES results reflect a \nchallenging picture for Thames Valley firms amid weakening demand and rising costs. Concerns about \ntax rises were not fully eased by the November 26th Budget. Businessesanticipatefurther price \nincreases driven by risinglabourcosts, while recruitment difficulties and skills shortagesremaina \ndefining constraint. Pre- and post-Budget sentimentremainscautious, and confidence into 2026 is \nexpected to stay subdued unless demand strengthens, interest rates fall, and Government policies \nprovide opportunities rather than obligations for business.\u201d  \\n[Click \nhere](https://www.thamesvalleychamber.co.uk/wp-content/uploads/2026/01/Quarterly-Economic-Survey-Q4-\n2025-Report.pdf)to download the QES Q4 2025 report in full.\"\n            },\n            {\n                \"url\": \"https://www.cameco.com/invest/financial-information/annual-reports/2025\",\n                \"public_url\": \n\"https://www.cameco.com/invest/financial-information/annual-reports/2025\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Quarterly Report - 2025 Q4 | Cameco\",\n                \"snippet\": \"# Quarterly Report - 2025 Q4  \\n## Audio  \\n**2025 Q4 Presentation**  \n\\n**2025 Q4 - Q and A**  \\nOn February 13, 2026, **Cameco (TSX: CCO; NYSE: CCJ)** reported its \nconsolidated financial and operating results for the fourth quarter and year ended December 31, \n2025, in accordance with International Financial Reporting Standards (IFRS).\\n- In April, we \nreceived a cash dividend of US$87 million, net of withholdings, from JV Inkai.\\n- **Dividend:**In \nNovember, to reflect the improvement in our financial performance and the additional distribution \nreceived from Westinghouse, we advanced our dividend growth plan. We increased our annual dividend \nto $0.24 per common share in 2025, advancing our plan to increase the dividend to $0.24 per common \nshare by one year.[See Return in our annual MD&A for more \ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=30)\\n- **Uranium:**Fourth quarter earnings before taxes decreased by $15 million and adjusted \nEBITDA increased by $5 million, compared to 2024, mainly as a result of lower sales volume due to \ntiming of sales. Annual earnings before income taxes increased by $50 million and adjusted EBITDA \nincreased by $76 million compared to 2024.[See Financial results by segment \u2013 Uranium in our annual \nMD&A for more \ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=59)\\n- **Westinghouse:**Westinghouse reported net earnings increased by $17 million (our share) for\nthe fourth quarter, compared to the same quarter last year. Over the year, Westinghouse reported a \nnet earnings increase of $276 million in comparison to 2024. To better reflect the underlying \noperating performance, we use adjusted EBITDA as a performance measure for Westinghouse. In the \nfourth quarter of 2025, our share of Westinghouse\u2019s adjusted EBITDA increased by $49 million, \ncompared to the fourth quarter of 2024, while over the year, adjusted EBITDA increased by $297 \nmillion compared to 2024. In October 2025, Westinghouse made a second cash distribution of US$350 \nmillion (US$171.5 million our share) to its owners associated with the cash received in 2025 for its\nparticipation in the construction project for two nuclear reactors at the Dukovany power plant in \nthe Czech Republic, led by Korea Hydro & Nuclear Power.[See Financial results by segment - \nWestinghouse in our annual MD&A for more \ninformation.](https://www.cameco.com/sites/default/files/documents/CCO-2025-Q4-MDA-FS-Notes.pdf#page\n=59)\"\n            },\n            {\n                \"url\": \n\"https://investors.sirma.com/en/reports-filings/quarterly-reports/interim-consolidated-report-for-th\ne-period-ending-on-31-12-2025\",\n                \"public_url\": \n\"https://investors.sirma.com/en/reports-filings/quarterly-reports/interim-consolidated-report-for-th\ne-period-ending-on-31-12-2025\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Interim consolidated report for the period ending on 31.12.2025\",\n                \"snippet\": \"&lt;- Quarterly Reports  \\nQ4  \\n2025\\n# Interim consolidated report for\nthe period ending on 31.12.2025  \\n- Revenue 66 665 EUR '000 30.37 %\\n- EBITDA 4 938 EUR '000 66.86 \n%\\n- Net Profit 1 805 EUR '000 216.88 %\\n## Interim consolidated report for the period ending on \n31.12.2025  \\n19 Feb 2026\"\n            },\n            {\n                \"url\": \n\"https://www.prnewswire.com/news-releases/sap-quarterly-statement-q4-2025-302673209.html\",\n                \"public_url\": \n\"https://www.prnewswire.com/news-releases/sap-quarterly-statement-q4-2025-302673209.html\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"SAP Quarterly Statement Q4 2025\",\n                \"snippet\": \"Christian Klein, CEO: Q4 was a strong cloud quarter, with bookings \nresulting in 30% Total Cloud Backlog growth to a record 77 billion Euros. The significant Current \nCloud Backlog growth in Q4 has laid a strong foundation for accelerating Total ...\\n29, 2026 \n/PRNewswire/ -- SAP SE (NYSE: SAP) announced today its financial results for the fourth quarter and \nfiscal year ended December 31, 2025. Christian Klein, CEO: Q4 was a strong cloud quarter, with \nbookings resulting in 30% Total Cloud Backlog growth to a record 77 billion Euros. The significant \nCurrent Cloud Backlog growth in Q4 has laid a strong foundation for accelerating Total Revenue \ngrowth through 2027. SAP Business AI has become a main driver for growth as it was included in two \nthirds of our Q4 cloud order entry, combined with strong AI adoption across the ERP Suite.\\nIn \nJanuary 2024, SAP announced a company-wide restructuring program which concluded as planned in the \nfirst quarter 2025. Overall expenses associated with the program were approximately \u20ac3.2 billion. \nRestructuring payouts amounted to \u20ac2.5 billion for the full-year 2024 and \u20ac0.8 billion for the full \nyear 2025. Business Highlights In the fourth quarter, customers around the globe continued to choose\nthe \\\"RISE with SAP\\\" journey to drive their end-to-end business transformations.\\nSupplementary \nfinancial information pertaining to the fourth quarter and full-year 2025 results can be found at \nhttps://www.sap.com/investor. About SAP As a global leader in enterprise applications and business \nAI, SAP (NYSE: SAP) stands at the nexus of business and technology.\\nWhile SAP's 2026 financial \noutlook for the income statement parameters is at constant currencies (including an average exchange\nrate of 1.13 USD per EUR), actual currency reported figures are expected to be impacted by currency \nexchange rate fluctuations as the company progresses through the year, as reflected in the table \nbelow. Currency Impact Assuming December 31, 2025 Rates Apply for 2026\"\n            },\n            {\n                \"url\": \"https://www.nepc.com/quarterly-private-markets-report-q4-2025/\",\n                \"public_url\": \"https://www.nepc.com/quarterly-private-markets-report-q4-2025/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Quarterly Private Markets Report: Q4 2025\",\n                \"snippet\": \"The fourth quarter was one of the strongest quarters of the year, \nhelping push full-year US direct lending volumes to $380 billion. Full-year 2025 new-money issuance \nacross U.S. direct lending reached $248 billion.\\nDownload Quarterly Private Markets Report: Q4 \n2025\\nAn annual survey conducted by Deloitte indicates that investors and industry participants are \noptimistic about commercial real estate fundamentals, similar to what was reported in 202524; \nhowever, Preqin reports that 30% of surveyed investors plan to reduce their commitments to real \nestate in the next year, versus 27% planning to increase.25 \u00b7 The recovery in core real estate (as \nrepresented by the NFI-ODCE Index) returns flattened out in the second half of 2025, with the Index \nposting negative appreciation for the second straight quarter for the three months ended December \n31.\\nWhile these strategies have lagged core real estate in 2025, it should be noted that they also \ndid not dip as negatively in the prior years. Real estate managers saw continued momentum in \nfundraising activity in the third quarter, according to data from PitchBook. Non-core equity funds \n(including value-add and opportunistic strategies) reported a total of just over $72 billion in \ncapital raised for the year through September 30.\\nThe fourth quarter was one of the strongest \nquarters of the year, helping push full-year US direct lending volumes to $380 billion. Full-year \n2025 new-money issuance across U.S. direct lending reached $248 billion. Full-year 2025 sponsor U.S.\ndirect lending volume was down marginally by 2% year over year. Sector activity was led by \ntechnology, business services, and healthcare.\"\n            },\n            {\n                \"url\": \n\"https://wattclarity.com.au/articles/2026/01/aemo-releases-the-q4-2025-quarterly-energy-dynamics-rep\nort/\",\n                \"public_url\": \n\"https://wattclarity.com.au/articles/2026/01/aemo-releases-the-q4-2025-quarterly-energy-dynamics-rep\nort/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"AEMO releases the Q4 2025 Quarterly Energy Dynamics report - WattClarity\",\n                \"snippet\": \"The AEMO have today released their [Quarterly Energy Dynamics (QED) \nreport for Q4 \n2025](https://www.aemo.com.au/energy-systems/major-publications/quarterly-energy-dynamics-qed), \ncovering outcomes across the market for the quarter ending December 31st 2025.  \\nThe [accompanying \nmedia \nrelease](https://www.aemo.com.au/newsroom/media-release/renewables-supply-more-than-half-of-quarterl\ny-energy-supply) highlighted a drop in both quarter-on-quarter and year-on-year average prices, as \nwell as record volumes of generation for VRE and storage:  \\n> Wholesale electricity prices for the \nNational Electricity Market (NEM) nearly halved in the December 2025 quarter, driven by record \nrenewable generation supplying more than half of total energy needs for the first time.\\n>\\n> AEMO\u2019s\nlatest Quarterly Energy Dynamics report shows wholesale electricity prices averaged $50 per megawatt\nhour (MWh) across the NEM, a $39/MWh (-44%) reduction from Q4 2024 and a $37/MWh (-43%) decline from\nQ3 2025.\\n>\\n> The quarter saw strong growth in renewable and storage output, with wind generation \nup 29%, grid scale solar up 15%, and battery discharge nearly tripling to an average of 268 \nmegawatts (MW), supported by 3,796 MW of new battery capacity added since late 2024.\\n>\\n> At the \nsame time, coal-fired generation fell to an all-time quarterly low, down 4.6% year-on-year, while \ngas-fired generation dropped 27% to its lowest level since Q4 2000.\\n>\\n>\\n> AEMO Executive General \nManager Policy and Corporate Affairs, Violette Mouchaileh, said the quarter marked a significant \nmilestone for Australia\u2019s energy transition.\\n>\\n> \u201cThis is a landmark moment for the NEM. For the \nfirst time, renewables and storage supplied more than half of the system\u2019s energy needs for a full \nquarter,\u201d Ms Mouchaileh said.\\n>\\n> \u201cIt reflects years of sustained investment and demonstrates that\nmore wind, solar and battery capacity in the system reduces reliance on higher cost coal and gas \ngeneration, placing sustained downward pressure on wholesale electricity prices,\u201d she said.  \\nKerry\nGalloway from the AEMO will present an online webinar on the Q4 2025 QED, hosted in collaboration \nwith the University of Melbourne, on the 11th February 2026 at 2:00pm (Melbourne time). Details \nabout the webinar are \n[here](https://energy.unimelb.edu.au/events/aemo-quarterly-energy-dynamics-q4-2025).\\n# Media \nCoverage  \\nThe reports release drew broad attention across mainstream and energy-sector media, with\nheadlines largely centred on the fall in wholesale prices and the VRE milestone. Below is a list of \nthe related coverage we\u2019ve seen so far today:  \\n- Daniel Mercer from**the ABC**wrote \u201c\u201c[Australia \nhits power demand record as renewables pass 50pc \nmilestone](https://www.abc.net.au/news/2026-01-29/australia-hits-power-demand-record-as-renewables-p\nass-50pc/106280246)\\n- Giles Parkinson from **Renew Economy**wrote \u201c\u201c[Landmark moment: Prices plunge\nas renewables supply half of grid, batteries surge and coal hits new \nlow](https://reneweconomy.com.au/landmark-moment-prices-plunge-as-renewables-supply-half-of-grid-bat\nteries-surge-and-coal-hits-new-low/)\\n- Angela Macdonald-Smith from **The Australian Financial \nReview**wrote \u201c\u201c[Landmark moment: Record renewables drive down cost of \npower](https://www.afr.com/policy/energy-and-climate/landmark-moment-record-renewables-drive-down-co\nst-of-power-20260128-p5nxmn)\\n- Ev Foley from **PV Magazine**wrote \u201c\u201c[Rooftop solar hits all-time \noutput high of 4,407 MW in Q4 2025: \nreport](https://www.pv-magazine-australia.com/2026/01/29/rooftop-solar-hits-all-time-output-high-of-\n4407-mw-in-q4-2025-report/)\\n- Charis Palmer from **The Energy**wrote \u201c\u201c[Wholesale prices down as \nNEM and WEM break \nrecords](https://theenergy.co/article/wholesale-prices-down-as-nem-and-wem-break-records)\"\n            },\n            {\n                \"url\": \n\"https://www.cfib-fcei.ca/en/research-economic-analysis/main-street-quarterly\",\n                \"public_url\": \n\"https://www.cfib-fcei.ca/en/research-economic-analysis/main-street-quarterly\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"The Main Street Quarterly, 2025 Q4\",\n                \"snippet\": \"The Main Street Quarterly also contains CFIB\u2019s latest estimates \nof[private sector job \nvacancies](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-HW.pdf)and \nan[interactive \npage](https://www.cfib-fcei.ca/en/research-economic-analysis/private-sector-job-vacancies-in-canada)\n. The \u2018In Focus\u2019 section, which covers a specific topic each quarter, focuses currently on the [B2C \nversus B2B \nfirms](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-InFocus.pdf).This \nedition analyses \n[business](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf\n) [entry and exit \ntrends](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-Sectorprof.pdf) \nfor 2015 to 2025 by sector.  \\nNext release will be around the mid April2026. For the media release,\nclick \n[here](https://www.cfib-fcei.ca/en/media/canadian-economy-to-grow-in-q4-2025-and-in-q1-2026).\\n## \nRelated Documents  \\n### Full Report  \\n- [Main Street \nQuarterly](https://www.cfib-fcei.ca/hubfs/research/msq/MSQ-Q4-2025/CFIB_MSQ_Q4-2025_E-ALL.pdf)Q4 \n2025\\n- [Small businesses' wage increase \nplans](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q12023_In_Focus.pd\nf)Q1 2023\\n- [Investment plans in small \nfirms](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_MSQ_2022_Q4_In_Focus.pdf)Q4 2022\\n- [The \nfinancial state of small \nbusinesses](https://www.cfib-fcei.ca/hubfs/research/msq/CFIB_The_Main_Street_Quarterly_Q32022_In_Foc\nus.pdf)Q3 2022\"\n            },\n            {\n                \"url\": \"https://skai.io/press-releases/quarterly-trends-report-q4-2025/\",\n                \"public_url\": \"https://skai.io/press-releases/quarterly-trends-report-q4-2025/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Press Release | Q4 2025 Digital Marketing Quarterly Trends Report\",\n                \"snippet\": \"**SAN FRANCISCO, CA \u2013 January 27, 2026 \u2013** Retail media ad spend grew \n33% year-over-year in Q4 2025, marking the largest single-quarter increase in six years, as brands \naggressively expanded full-funnel strategies during the holiday season. Skai, the leading \nomnichannel advertising platform for commerce media, today released its [Q4 2025 Digital Marketing \nQuarterly Trends \nReport](https://skai.io/reports-and-whitepapers/q4-2025-quarterly-digital-trends-report/), revealing\nhow retail media\u2019s rapid expansion is reshaping performance dynamics across paid search and paid \nsocial, while AI-powered discovery accelerates changes in consumer shopping behavior.\\n## \n**Marketers shift AI usage from creative tasks to strategic planning**  \\nAs cross-channel \norchestration grows more complex, marketers are increasingly turning to AI for decision-making \nsupport. Nearly two-thirds of advertisers now use generative AI within retail media programs, but \nusage patterns reveal a clear evolution. Analysis from Skai\u2019s proprietary GenAI marketing agent \nfound that strategy and planning queries accounted for 35.5% of prompts in Q4, while creative and \nmessaging requests fell to just 3%. This indicates that marketers are moving AI beyond content \ngeneration toward the strategic decisions that matter most: budget allocation, channel \nprioritization, and cross-channel optimization.  \\n\u201cThis is one of the most revealing trends reports\nwe\u2019ve published because it shows how dramatically marketing behavior has evolved in just a year,\u201d \nsaid Michelle Urwin, Chief Marketing Officer at Skai. \u201cRetail media is scaling rapidly into the \nupper funnel, omnichannel execution is now the norm, and GenAI is emerging both as a new, agentic \nchannel shaping discovery and as a layer across existing channels like search and retail. At the \nsame time, GenAI is changing how marketers make decisions. These are early signals of changes that \nbegan to take hold in Q4 and will continue to shape how commerce media operates throughout \n2026.\u201d\\nTo access the full Q4 2025 report, visit \n[skai.io/quarterly-trends-hub.](https://skai.io/reports-and-whitepapers/q3-2025-quarterly-digital-tr\nends-report/)  \\n**Methodology**\\nAnalysis is based on 972 billion impressions, 8.7 billion clicks, \nand $9.2 billion of Skai platform activity across retail media, paid search, and [paid social \nadvertising](https://skai.io/glossary/paid-social-advertising/) in Q4 2025 (October 1 \u2013 December \n31). Data is aggregated and anonymized across Skai accounts, including many of the world\u2019s leading \nconsumer brands and agencies. Year-over-year comparisons reflect the same period in Q4 2024. Only \nadvertisers active on the Skai platform for the full duration of both periods were included to \nensure consistency.  \\n**About Skai**\\nSkai (formerly Kenshoo) is the leading omnichannel \nadvertising platform for commerce media, combining advanced digital marketing capabilities with \ncommerce insights and operations to drive growth for brands and agencies. Powered by unified data \nand proprietary GenAI, Skai delivers full-funnel media planning, optimization, and measurement, as \nwell as insights and automation that help brands improve digital shelf performance, retail \nexecution, and revenue recovery. This integrated approach maximizes sales, profitability, and market\nshare across media and commerce touchpoints.\"\n            },\n            {\n                \"url\": \n\"https://ir.ondas.com/press-releases/detail/296/ondas-inc-reports-record-fourth-quarter-and-full-yea\nr-2025\",\n                \"public_url\": \n\"https://ir.ondas.com/press-releases/detail/296/ondas-inc-reports-record-fourth-quarter-and-full-yea\nr-2025\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Ondas Inc. Reports Record Fourth Quarter and Full Year 2025 Financial \nResults: Expects Outsized Growth in 2026 Driven by Execution at OAS, Accelerated Strategic Growth \nProgram and Strong Global Demand for Autonomous Systems :: Ondas Inc. (ONDS)\",\n                \"snippet\": \"Q4 revenue of $30.1 million meeting the high end of our recently \npre-announced target range and represents a step-change increase from prior quarters \u00b7 Full-year \n2025 revenue of $50.7 million, meeting the high end of our recently pre-announced ...\\nQ4 revenue of\n$30.1 million meeting the high end of our recently pre-announced target range and represents a \nstep-change increase from prior quarters \u00b7 Full-year 2025 revenue of $50.7 million, meeting the high\nend of our recently pre-announced target range, representing approximately 605% year-over-year \ngrowth\\nThe current quarter loss included a non-cash charge of $82.2 million relating to warrants \nissued in connection with the October 2025 equity raise (\\\"2025 Warrants\\\") that have been \nclassified as a liability using a Black-Scholes valuation as of December 31, 2025. The valuation of \nthis liability is subject to material changes from period to period without having any impact on the\nbusiness of the company or the underlying economics of the warrant.\\nThe Company expects continued \nstrong momentum in 2026 and is raising its revenue target for 2026 to at least $375 million, which \nrepresents a nearly 7-fold increase from 2025 and is more than double its prior outlook last shared \nin January 2026. For the first quarter of 2026 Ondas is targeting revenue of $38 - $40 million, \nrepresenting year-over-year growth of 820%. Growth will be led by our OAS business unit and is \nsupported by $68.3 million in backlog and includes significant contributions from the recently \nannounced acquired businesses.\\n(Nasdaq:ONDS) (\\\"Ondas\\\" or the \\\"Company\\\"), a leading provider of \nautonomous aerial and ground robot intelligence through its Ondas Autonomous Systems (OAS) business \nunit and private wireless solutions through Ondas Networks, reported financial and operating results\nfor the fourth quarter and full year ended December 31, 2025.\"\n            },\n            {\n                \"url\": \"https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/\",\n                \"public_url\": \n\"https://www.businesswest.co.uk/reports/quarterly-economic-survey-q4-2025/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Business West | Quarterly Economic Survey Q4 2025\",\n                \"snippet\": \"# Quarterly Economic Survey Q4 2025  \\nBusiness West, a business \nleadership and support organisation, helps companies grow, innovate and export.  \\nEverything we do \ncontributes to making the South West the best place to live, learn and work. We run the Chambers of \nCommerce for Bristol, Bath, Gloucestershire and Wiltshire as an accredited member of the British \nChambers of Commerce. The quarterly economic survey is the longest running survey of its kind which \nis used by the Bank of England as one of the first economic indicators of each quarter.  \\nWe would \nlike to thank all respondents for their time in completing the survey, which provides Business West \nwith invaluable up to date insight into the trends and state of business health in our region.  \n\\nRESOURCES\\n## Download the report \\\"Quarterly Economic Survey Q4 2025\\\"\"\n            },\n            {\n                \"url\": \"https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025\",\n                \"public_url\": \"https://www.carterjonas.co.uk/insights/investment-quarterly-q4-2025\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Investment Quarterly | Q4 2025 | Carter Jonas\",\n                \"snippet\": \"# Investment Quarterly | Q4 2025  \\nOur research specialists, working \nwith our national and regional investment professionals, have released the latest Carter Jonas UK \nInvestment Quarterly report for Q4 2025.\\n## Tailored newsletters for you  \\nSign up to our \nnewsletter to receive further information and news tailored to you.  \\nUK commercial property \ninvestment volumes rebounded strongly in Q4 2025, following softer activity in the previous quarter.\nIndustrial investment rose sharply, while office and retail activity also recovered, signalling \nimproving confidence as pricing clarity continued to build. Alternatives remained a significant \nsource of capital deployment, reinforcing ongoing investor selectivity rather than a broad-based \nrebound.  \\nA total of \u00a317.5bn was traded in Q4 2025, representing a 78% increase quarter-on-quarter\nand a 13% rise year-on-year. Quarterly volumes were also around 32% above the five-year quarterly \naverage, reflecting a strong year-end uplift in deal completion. Reported volumes exclude \ntransactions where the real estate value cannot be robustly separated from operating business \nconsiderations, most notably Welltower\u2019s circa \u00a35.2bn off-market acquisition of a UK care home \nportfolio from Barchester. The rolling annual total edged up modestly to \u00a347.8bn, remaining broadly \nstable quarter-on-quarter but still around 10% below the five-year average of \u00a353.2bn, highlighting \nthat while momentum improved materially in Q4, the recovery in annual volumes remains uneven.\\n### \nRetail  \\nRetail investment totalled \u00a32.8bn in Q4 2025, up 87% on the previous quarter and 37% above\nthe five-year quarterly average. Several sizeable transactions involving prime retail assets, \nshopping centres, and supermarkets supported volumes during the quarter. Frasers Group acquired \nBraehead Shopping Centre in Glasgow for circa \u00a3220m, while Blue Owl Capital purchased 10 Asda \nsupermarket stores across the UK and one distribution Centre in Lutterworth from Asda in a \nsale-and-leaseback deal for \u00a3270m.\"\n            },\n            {\n                \"url\": \"https://www.investopedia.com/terms/q/quarter.asp\",\n                \"public_url\": \"https://www.investopedia.com/terms/q/quarter.asp\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Fiscal Quarter: What It Is, How It\u2019s Used, and More\",\n                \"snippet\": \"In this example, the phrase Q4 2025 means the fourth quarter of 2025. \nBecause this phrase includes both the quarter and the year, this phrase assumes that whatever is \nbeing analyzed has a fiscal year that is the same as a calendar year.\\nIn this example, the phrase \nQ4 2025 means the fourth quarter of 2025. Because this phrase includes both the quarter and the \nyear, this phrase assumes that whatever is being analyzed has a fiscal year that is the same as a \ncalendar year. A fiscal calendar is an arbitrary range of dates that defines a company\u2019s annual \nreporting cycle.\\nFor instance, if a company chooses to have its fiscal year starting in February \nrather than January, then its first quarter would consist of February, March, and April. Companies \nsometimes choose to do this if they want their fiscal year to end in their own peak season. \nAlternatively, since finishing the year often involves a lot of additional accounting work, some \ncompanies choose to end their fiscal year on a relatively calm month. There are two components to Q4\n2025.\\nA fiscal quarter is a three-month period on a company\u2019s financial calendar that acts as a \nbasis for reporting earnings and paying dividends.\\nAs its name suggests, there are four quarterly \nperiods in a year, meaning a publicly traded company would issue four quarterly reports per year. \nCompanies and investors alike use fiscal quarters to keep track of their financial results and \nbusiness developments over time. These quarters are often referred to as Q1, Q2, Q3, and Q4.\"\n            },\n            {\n                \"url\": \n\"https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/\",\n                \"public_url\": \n\"https://partnersrealestate.com/research/dallas-office-q4-2025-quarterly-market-report-2/\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Dallas Office | Q4 2025 | Quarterly Market Report\",\n                \"snippet\": \"# DFW Office Market Activity Slows Down in Q4 2025  \\n#### **EXECUTIVE \nSUMMARY**  \\nMomentum slowed between quarters in the Dallas-Fort Worth office market. Leasing \nactivity decreased 31.7% quarterly from 4.4 million sq. ft. to 3.0 million sq. ft. Total net \nabsorption saw a significant drop for the quarter, decreasing 80.0% from 1.4 million sq. ft. in Q3 \nto 285,197 sq. ft. in Q4 2025. Class A properties recorded positive absorption while Class B \nproperties posted negative absorption. Due to the slowdown in deliveries and Class A positive \nabsorption, the vacancy rate remained unchanged at 25.3%.  \\nConstruction deliveries for the quarter\ntotaled 189,382 sq. ft., down significantly from the previous quarter, and the construction pipeline\nincreased 14.2% over the quarter to 2.9 million sq. ft. Rental rates rose 2.5% over the quarter and \n4.8% over the year to $32.06 per sq. ft. Class A gross rental rates rose again to a record high of \n$36.20 per sq. ft. and are forecasted to continue to rise. Class B rental rates increased to $25.58 \nper sq. ft. from $25.22 per sq. ft. in Q3 2025.\\n**Leasing Activity Decreased Quarterly and \nAnnually**  \\nQuarterly leasing velocity, which is comprised of both new leases and renewals, stood \nat 3.0 million sq. ft. during Q4 2025, a 31.7% decrease over last quarter and down 29.2% from Q4 \n2024. Notable lease transactions in Q4 2025 include Fujitsu\u2019s 70,000 sq. ft. lease at Galatyn \nCommons C in Richardson, Unleashed Brands\u2019 51,000 sq. ft. lease in 600 ELC, and Newrez\u2019s 47,000 sq. \nft. lease at Cypress Waters in Coppell.  \\n**Net Absorption Positive, But Experiences a Sharp Drop \nOver the Quarter**  \\nNet absorption\u2014move-ins minus move-outs\u2014was positive 285,197 sq. ft. in Q4 \n2025, sharply down 80% quarter over quarter. Only Class A properties contributed to positive \nabsorption, with Class A recording 310,702 sq. ft. Class B posted -25,505 sq. ft. of negative net \nabsorption in Q4 2025. Some tenants that moved in during Q4 2025 included State Farm, which moved \ninto 426,000 sq. ft. at Four CityLine, and GEICO, which took 165,000 sq. ft. at Galatyn Commons B.  \n\\n**Investment Sales Trends**\\n**Investment Sales Trends**  \\nCoStar Capital Market Analytics \nreports the cumulative 12-month sales volume at $1.3 billion in the DFW office market. With 204 \ndeals completed, the average transaction price currently stands at $286 per sq. ft. with an average \ncap rate of 7.9%. Notable recent sale transactions in Q4 2025 include Crescent Real Estate LLC\u2019s \npurchase of 2100 McKinney from MetLife Investment Management for a reported price of $218 million or\n$604 per sq. ft. The 360,860 sq. ft. property is 81% leased. Also, Real Capital Solutions, Inc. \npurchased the 464,290 sq. ft. Walnut Glen Tower from Intercontinental Real Estate Corporation for \n$26.1 million or $56.21 per sq. ft. The property, located in the Central Expressway submarket, is \n76.8% leased.  \\n**Rental Rates Continue to Rise**  \\nThe average gross rental rate for the DFW \noffice market is $32.33 per sq. ft., up 0.8% quarterly from $32.06 per sq. ft., and up 4.6% \nannually. The Uptown/Turtle Creek submarket boasts the highest rental rates, with the overall \naverage gross rent currently sitting at $62.10 per sq. ft. The lowest rental rate in the Stemmons \nFreeway submarket is $21.46 per sq. ft.  \\n**For More Information, Contact:**  \\n**Steve \nTriolet**\\nSVP of Research and Market Forecasting\\ntel 214 223 \n4008\\n[\\\\[emailprotected\\\\]](https://partnersrealestate.com/cdn-cgi/l/email-protection)\"\n            },\n            {\n                \"url\": \"https://www.cbre.com/press-releases/cbre-q4-2025-earnings\",\n                \"public_url\": \"https://www.cbre.com/press-releases/cbre-q4-2025-earnings\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"CBRE Group, Inc. Reports Financial Results for Q4 and Full Year 2025 | \nCBRE\",\n                \"snippet\": \"Key Highlights: Q4 GAAP EPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP \nEPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% to $11.6 billion for Q4 and 13% to $40.6 billion\nfor 2025 \u00b7 Resilient Businesses(1) revenue up 12% for Q4 and 13% for ...\\n(NYSE: CBRE) today \nreported financial results for the fourth quarter ended December 31, 2025. Key Highlights: Q4 GAAP \nEPS of $1.39 and Core EPS of $2.73 \u00b7 2025 GAAP EPS of $3.85 and Core EPS of $6.38 \u00b7 Revenue up 12% \nto $11.6 billion for Q4 and 13% to $40.6 billion for 2025 \u00b7 Resilient Businesses(1) revenue up 12% \nfor Q4 and 13% for 2025 \u00b7\\nCBRE Group, Inc. delivers robust financial performance for Q4 and \nfull-year 2025, with double-digit growth in revenue and core EPS.\\nCBRE Group, Inc. (NYSE: CBRE) \ntoday reported financial results for the fourth quarter ended December 31, 2025.\\n\u201cWe had a strong \nend to 2025, with fourth-quarter revenue and core earnings-per-share rising by double digits and \nboth reaching their highest levels ever for CBRE,\u201d said Bob Sulentic, CBRE\u2019s chair and chief \nexecutive officer. \u201cOur strength was broad-based. We saw significant gains in sales and leasing in \nthe U.S. and much of the rest of the world and our resilient businesses continued to post \ndouble-digit revenue growth, a trend we see continuing.\u201d\"\n            },\n            {\n                \"url\": \"https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews\",\n                \"public_url\": \n\"https://dor.wa.gov/about/statistics-reports/quarterly-business-reviews\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Quarterly Business Reviews | Washington Department of Revenue\",\n                \"snippet\": \"For Quarter 4, the Annual taxpayers have until April 15 to file (rather \nthan January 31 by Quarter 4 reporters). We allow for operations review and statistical processing \nApr 15-May 31, with our goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \n\u00b7\\nFor Quarter 4, the Annual taxpayers have until April 15 to file (rather than January 31 by \nQuarter 4 reporters). We allow for operations review and statistical processing Apr 15-May 31, with \nour goal to post QT4 and Calendar year data in early June. 2025 \u00b7 2024 \u00b7 2023 \u00b7\\nTo explore the \nstatistical data available, use our Create a report tool to create local sales and use tax reports \nfor specific jurisdictions, gross business income tables, state retail sales tax tables and a \nvariety of other reports. The QBR publications contain standardized tables detailing gross business \nincome, taxable retail sales and accrued tax liability by major industry. Beginning with 2005, the \nQBR tables were converted from SIC to NAICS codes. This was an effort to move in line with national \nstandards. For more information on SIC and NAICS codes please visit our Frequently asked ques\\nA \ncompilation of statistics on gross income, taxable retail sales and accrued tax liability as \nreported by Washington state excise taxpayers.\\nFor Quarters 1, 2 and 3, we allow two months for \noperations review and one month for statistical processing. Our goal is to post early in the fourth \nmonth after the return due date. For example, Quarter 1 returns are due April 30, so our goal is to \npost data by early August.\"\n            },\n            {\n                \"url\": \n\"https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html\n\",\n                \"public_url\": \n\"https://www.greaterbirminghamchambers.com/event-calendar/q4-quarterly-business-report-jan-2026.html\n\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Q4: Quarterly Business Report | Greater Birmingham Chambers of Commerce\",\n                \"snippet\": \"## **Developing Workforce Skills in**Greater Birmingham  \\n##### \n**Sponsored by:**  \\nThe future of Greater Birmingham\u2019s economy depends on a skilled and adaptable \nworkforce. Ensuring effective structures are in place to support skills development is critical to \nretaining local talent and supporting business growth.  \\nRecent data from the Q3 Quarterly Business\nReport found that 60% of Greater Birmingham businesses faced recruitment difficulties last quarter, \nwith almost half attributing these challenges to a lack of suitably skilled applicants.  \\nWith this\nin mind, the Q4 Quarterly Business Report launch event will focus on \u2018Developing Workforce Skills in\nGreater Birmingham.\u2019 The event will bring together local policymakers and business leaders to \ndiscuss the current direction of skills policy and support in the region, and explore how \norganisations with diverse skills needs are addressing these challenges and investing in their \nworkforce.  \\nAlongside these discussions, delegates will receive a copy of the Q4 2025 Greater \nBirmingham Quarterly Business Report and gain insight into the latest survey results.  \\nJoin c.60 \nsenior delegates for this insightful event, sponsored by Birmingham City University.\\n#### **Attend \nfor**:  \\n- Headline economic findings from the latest quarterly business report\\n- Expert panel \ndiscussion on developing and investing in workforce skills\\n- Networking opportunities with c.60 \nsenior business leaders from across Greater Birmingham\\n#### **Speakers**  \\n**Agenda**  \\n09:00am: \nRegistration & Networking  \\n09:30am: Welcome & Introduction  \\n09:40am: Quarterly Business Report \nResults  \\n09:50am: Presentations  \\n11:00am: Event Close\"\n            },\n            {\n                \"url\": \n\"https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/\"\n,\n                \"public_url\": \n\"https://www.comreg.ie/comreg-issues-electronic-communications-sector-quarterly-report-for-q4-2025/\"\n,\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"ComReg issues Electronic Communications Sector Quarterly Report for Q4 \n2025 | Commission for Communications Regulation\",\n                \"snippet\": \"The Commission for Communications Regulation (ComReg) today released its\nQuarterly Key Data Report on the Electronic Communications market for the period (1 October to 31 \nDecember), Q4 2025.  \\nFibre-to-the-premises (FTTP) subscriber lines stand at 1,050,123 million in \nQ4 2025, representing 59% of total fixed broadband subscriber lines, up from 51% in Q4 2024. \nOverall, fixed broadband subscriber lines increased to 1.76 million, an increase of 4% compared to \nQ4 2024.  \\nComReg\u2019s [Open Data Map \nHub](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fdatamaps-comreg.hub.arcgis.co\nm%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b\n8d8a6b4fee706b37fa%7C0%7C0%7C639089128818231141%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYi\nOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=2SLm1ppCubzMh4B4\nTYxZhJkqiW5jcy2cJM8WGLUDTDI%3D&reserved=0) includes Q4 data on Coverage and Take-Up of Gigabit \nBroadband (FTTP and Cable) by County, Electoral Division and other geographical areas across \nIreland. The county with the highest level of FTTP coverage is Westmeath at 95%. Westmeath also has \nthe highest level of Gigabit coverage at 96%.\\nFTTP is the most purchased broadband technology and \nis available at 84% of all premises in Ireland. Gigabit broadband is available at 90% of all \npremises in Ireland. In terms of FTTP take up, 51% of all premises with FTTP available had an active\nFTTP service at the end of Q4 2025.  \\nOn a monthly basis an average residential fixed broadband \nsubscriber line used 563 GB of data, an increase of 11% since Q4 2024. Businesses have used 371 GB \nof data, an increase of 8% compared to Q4 2024.  \\nIn Q4 2025, approximately 71% of fixed broadband \nsubscriber lines had purchased broadband with speeds greater or equal to 500Mbps, up from 65% in Q4 \n2024, while 24% purchased broadband speeds greater than or equal to 1Gbps. Of the 1,050,123 FTTP \nsubscriber lines, 93% have broadband speeds greater than or equal to 500 Mbps.  \\nTotal mobile \nsubscriptions (including mobile broadband and machine-to-machine (M2M) increased to 10.8 million in \nQ4 2025 \u2013 driven by a rise in bill pay subscriptions which represent 78% of all mobile \nsubscriptions. 5G subscribers increased to 2.8 million in Q4 2025, an increase of 43% since Q4 2024.\n\\nOn a monthly basis an average mobile voice subscriber used 150 minutes, sent 32 texts (8% annual \ndecrease), and used 21GB of data (13% annual increase).\\nThe Quarterly Key Data Report for Q4 2025 \nis available on the [Quarterly Key Data Report \nsection](https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%\n2Felectronic-communications%2Fmarket-information%2Fquarterly-key-data-report%2F&data=05%7C02%7Ccloda\ngh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639dee4b8d8a6b4fee706b37fa%7C0%7C\n0%7C639089128818261909%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXa\nW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=laOcyAuAvmsgmn1c6TYErH3Tr9n50RSUi3KRARoaK\nWM%3D&reserved=0) of ComReg.ie. The attached infographic highlights key trends from the report.  \n\\nThe data portal which contains the full set of data and associated map visualisations and charts \nis available on \n[https://www.comreg.ie/industry/electronic-communications/data-portal/](https://eur02.safelinks.prot\nection.outlook.com/?url=https%3A%2F%2Fwww.comreg.ie%2Findustry%2Felectronic-communications%2Fdata-po\nrtal%2F&data=05%7C02%7Cclodagh.mcginley%40comreg.ie%7Cd49f0f6f99654461d68908de802d33c2%7C7e3063639de\ne4b8d8a6b4fee706b37fa%7C0%7C0%7C639089128818286257%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsI\nlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=QCoSWFaMBk6b5\nnoPlTzKz2MAcCRuoCwXmwzQuDEfcJI%3D&reserved=0)\"\n            },\n            {\n                \"url\": \"https://ir.quanterix.com/financial-information/quarterly-results\",\n                \"public_url\": \"https://ir.quanterix.com/financial-information/quarterly-results\",\n                \"mime_type\": \"text/html\",\n                \"filename\": null,\n                \"title\": \"Quarterly Results | Quanterix\",\n                \"snippet\": \"Quarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 \nCommittee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 \n2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation\nQ4 2025 Earnings Call \u00b7\\nQuarterly Results \u00b7 Corporate Governance \u00b7 Governance Highlights \u00b7 \nCommittee Composition \u00b7 Annual Reports \u00b7 Customer Portal \u00b7 Show all \u00b7 Q1 \u00b7 Quanterix Corporation Q1 \n2026 Earnings Call \u00b7 Quanterix Corporation Q1 2026 Earnings Call 750 KB \u00b7 Q4 \u00b7 Quanterix Corporation\nQ4 2025 Earnings Call \u00b7\\nQuanterix Corporation Releases Operating Results for Second Quarter 2022, \nAnnounces Business Re-Alignment Plan and Revises 2022 Guidance\\nQuanterix Releases Operating Results\nfor Fourth Quarter and Full Year 2022; Aligned with Expectations\"\n            }\n        ]\n    }\n}\n", "s_70cd2b65c2": "   1    \u2502 Q4 2025 Quarterly Business Report Summary                             \n        \u2502                                                                       \n        \u2502 Financial Performance                                                 \n        \u2502                                                                       \n        \u2502  \u2022 Revenue reached $4.2 billion, up 15% year-over-year                \n        \u2502  \u2022 Operating margin improved to 28% (up from 24% in Q3)               \n        \u2502  \u2022 Customer acquisition costs dropped 12% due to better marketing     \n        \u2502    efficiency                                                         \n        \u2502                                                                       \n        \u2502 Growth Highlights                                                     \n        \u2502                                                                       \n        \u2502  \u2022 Active users grew 22% to 45 million
