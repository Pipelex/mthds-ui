name: Release

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to support trusted publishing
        run: npm install -g npm@latest

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Check if version is already published
        id: check_published
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if npm view "@pipelex/mthds-ui@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION is already published to npm"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # The same gate `changelog-check.yml` runs on the release PR, repeated at
      # the last moment before the irreversible step. That gate only sees PRs
      # from a `release/v*` branch, so a version bump reaching `main` any other
      # way would otherwise publish with no entry - and npm never gives a
      # version number back. Gated on already_published so that a push which
      # does not move the version stays the deliberate no-op described above.
      - name: Assert the changelog has an entry for this version
        if: steps.check_published.outputs.already_published == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! grep -qE "^## \[v${VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' heading - refusing to publish $VERSION. Rename '## [Unreleased]' and push again."
            exit 1
          fi
          echo "Changelog entry found for v$VERSION."

      - name: Install dependencies
        if: steps.check_published.outputs.already_published == 'false'
        # --ignore-scripts skips the `prepare` hook (= npm run build), so we
        # build exactly once in the explicit Build step below. Without this,
        # the build runs three times per release: here via prepare, in the
        # Build step, and again in `npm publish`'s prepare hook.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        if: steps.check_published.outputs.already_published == 'false'
        run: npx playwright install chromium

      - name: Run quality checks (lint + format + typecheck)
        if: steps.check_published.outputs.already_published == 'false'
        run: make check

      - name: Run tests
        if: steps.check_published.outputs.already_published == 'false'
        run: make test

      - name: Build
        if: steps.check_published.outputs.already_published == 'false'
        run: npm run build

      - name: Verify standalone bundle is present
        if: steps.check_published.outputs.already_published == 'false'
        run: |
          test -f dist/standalone/graph-viewer.js
          test -f dist/standalone/graph-viewer.css

      - name: Publish to npm
        if: steps.check_published.outputs.already_published == 'false'
        # --ignore-scripts skips publish-time lifecycle hooks (notably
        # `prepare`, which would rebuild and clobber the artifacts the
        # smoke check just validated). Provenance/signing is handled inside
        # npm itself, not in user lifecycle scripts, so it's unaffected.
        run: npm publish --ignore-scripts --access public --provenance

      # Not gated on already_published: if a previous run published to npm but
      # failed before tagging, the rerun must still be able to backfill the
      # tag. The existence check is what keeps a no-bump push a no-op.
      - name: Create git tag if missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

  # Not gated on already_published either, for the same recovery reason: the
  # release must be creatable on a rerun even when npm already has the version.
  github-release:
    name: Create GitHub Release
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog notes for current version
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracting changelog for version v$VERSION"

          # Anchored, and dateless. A release entry is written
          # `## [vX.Y.Z] - <date>`, but the changelog format documents the
          # dateless `## [vX.Y.Z]` as well, and demanding the ` - ` suffix made
          # such an entry fall through to generic release notes without a word.
          START_LINE=$(grep -n "^## \[v$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)

          # Deliberately a warning here, where the publish job hard-fails: this
          # job also runs on the recovery path, backfilling a release for a
          # version npm already has. Failing it would leave that version
          # permanently without a GitHub release, which is the opposite of what
          # the gate is for. The heading is enforced before publishing instead.
          if [ -z "$START_LINE" ]; then
            echo "Warning: No changelog entry found for version v$VERSION"
            echo "CHANGELOG_NOTES=" >> $GITHUB_ENV
            exit 0
          fi

          NEXT_VERSION_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[v" | head -1 | cut -d: -f1)

          if [ -z "$NEXT_VERSION_LINE" ]; then
            CHANGELOG_CONTENT=$(tail -n +$START_LINE CHANGELOG.md)
          else
            # NEXT_VERSION_LINE counts from START_LINE + 1, so the next heading
            # sits at START_LINE + NEXT_VERSION_LINE and this section's last
            # line is the one before it — which is END_LINE. Subtracting one a
            # second time when printing dropped that line.
            END_LINE=$((START_LINE + NEXT_VERSION_LINE - 1))
            CHANGELOG_CONTENT=$(sed -n "$START_LINE,${END_LINE}p" CHANGELOG.md)
          fi

          # The entry reaches the release page exactly as it was written. This
          # step used to run it through `sed '/^$/d'` and a leading-whitespace
          # strip, which is fatal to Markdown: blank lines are what separate
          # paragraphs and close lists, and leading indentation is what keeps a
          # continuation paragraph inside its list item. Without them a
          # structured entry renders as one run-on block with its sub-headings
          # swallowed into the bullet above. Command substitution has already
          # dropped the trailing blank lines before the next heading.
          echo "CHANGELOG_NOTES<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CHANGELOG_NOTES" ]; then
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "$CHANGELOG_NOTES"
          else
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "Release v$VERSION"
          fi
